services:
  watchtower:
    container_name: watchtower
    image: nickfedor/watchtower:latest
    restart: unless-stopped
    security_opt:
      - "apparmor:unconfined"
    labels:
      # WATCHTOWER_LABEL_ENABLE=true means only labeled containers are scanned —
      # without this label Watchtower updates everything except itself.
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TZ: ${WATCHTOWER_TIMEZONE}
      WATCHTOWER_SCHEDULE: ${WATCHTOWER_SCHEDULE}
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_NO_STARTUP_MESSAGE: "true"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      WATCHTOWER_ROLLING_RESTART: "false"
      WATCHTOWER_TIMEOUT: 30s
      # Notifications — Shoutrrr smtp:// URL, assembled in env.j2 from vault vars.
      # Replaces the legacy WATCHTOWER_NOTIFICATION_EMAIL_* options, which upstream
      # deprecated and will remove in Watchtower v2.
      WATCHTOWER_NOTIFICATION_URL: ${NOTIFICATION_URL}
      WATCHTOWER_NOTIFICATIONS_DELAY: 2
    networks:
      - watchtower_network

networks:
  watchtower_network:
    driver: bridge
    name: watchtower_network
    ipam:
      driver: default
      config:
        - subnet: ${WATCHTOWER_NETWORK_SUBNET:-172.25.0.0/24}
