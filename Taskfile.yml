---
# https://taskfile.dev

version: '3'

vars:
  ANSIBLE_DIR: ./ansible

tasks:
  # === Infrastructure: Proxmox Host Configuration + Guest Provisioning ===
  infra:hosts:
    desc: Configure Proxmox host OS and provision VMs/LXCs on all machines
    dir: '{{.ANSIBLE_DIR}}'
    cmds:
      - ansible-playbook playbooks/proxmox-hosts.yml {{.CLI_ARGS}}

  infra:hosts:check:
    desc: Dry-run Proxmox host configuration and guest provisioning (no changes)
    dir: '{{.ANSIBLE_DIR}}'
    cmds:
      - ansible-playbook playbooks/proxmox-hosts.yml --check --diff {{.CLI_ARGS}}

  infra:guest:destroy:
    desc: 'Retire a workbench CT after removing it from host_vars (usage: task infra:guest:destroy -- --limit n5pro -e vmid=202 -e hostname=music-workbench)'
    dir: '{{.ANSIBLE_DIR}}'
    cmds:
      - ansible-playbook playbooks/destroy-guest.yml {{.CLI_ARGS}}

  # === Infrastructure: Guest Configuration (Ansible) ===
  infra:guests:
    desc: Configure Docker and base packages inside VMs/LXCs
    dir: '{{.ANSIBLE_DIR}}'
    cmds:
      - ansible-playbook playbooks/configure-guests.yml {{.CLI_ARGS}}

  # === Service Deployment (Ansible + Docker Compose) ===
  deploy:services:
    desc: Deploy all Docker Compose services
    dir: '{{.ANSIBLE_DIR}}'
    cmds:
      - ansible-playbook playbooks/deploy-services.yml {{.CLI_ARGS}}

  deploy:service:
    desc: 'Deploy a single service (usage: task deploy:service -- --tags postgresql)'
    dir: '{{.ANSIBLE_DIR}}'
    cmds:
      - ansible-playbook playbooks/deploy-services.yml {{.CLI_ARGS}}

  # === Fleet log shippers (native Vector on eq12 / n5pro / n5pro_docker, #134) ===
  deploy:logagents:
    desc: 'Deploy the native Vector log shippers (usage: task deploy:logagents -- --limit n5pro)'
    dir: '{{.ANSIBLE_DIR}}'
    cmds:
      - ansible-playbook playbooks/log-agents.yml {{.CLI_ARGS}}

  deploy:logagents:check:
    desc: Dry-run the native Vector log shippers (--check --diff, no changes)
    dir: '{{.ANSIBLE_DIR}}'
    cmds:
      - ansible-playbook playbooks/log-agents.yml --check --diff {{.CLI_ARGS}}

  # === Fleet metrics agents (native telegraf on eq12 / n5pro, #186) ===
  deploy:metricsagents:
    desc: 'Deploy the native telegraf metrics agents (usage: task deploy:metricsagents -- --limit n5pro)'
    dir: '{{.ANSIBLE_DIR}}'
    cmds:
      - ansible-playbook playbooks/metrics-agents.yml {{.CLI_ARGS}}

  deploy:metricsagents:check:
    desc: Dry-run the native telegraf metrics agents (--check --diff, no changes)
    dir: '{{.ANSIBLE_DIR}}'
    cmds:
      - ansible-playbook playbooks/metrics-agents.yml --check --diff {{.CLI_ARGS}}

  # === Full Deployment ===
  deploy:full:
    desc: Run the full deployment pipeline (hosts -> guests -> services)
    dir: '{{.ANSIBLE_DIR}}'
    cmds:
      - ansible-playbook playbooks/site.yml {{.CLI_ARGS}}

  # === System Upgrades ===
  upgrade:full:
    desc: Run full dist-upgrade on all guests (use -- --limit <host> to target specific hosts)
    dir: '{{.ANSIBLE_DIR}}'
    cmds:
      - ansible-playbook playbooks/configure-guests.yml -e apt_dist_upgrade=true {{.CLI_ARGS}}

  # === Ansible Utilities ===
  ansible:lint:
    desc: Lint all Ansible playbooks and roles
    dir: '{{.ANSIBLE_DIR}}'
    env:
      # ansible-lint is often a separate install (e.g. Homebrew) from the ansible-core
      # that runs deploys, and does not look in the user collections path by default.
      # Without this it reports galaxy modules as "unknown-module" false positives.
      ANSIBLE_COLLECTIONS_PATH: '{{.ANSIBLE_COLLECTIONS_PATH | default "~/.ansible/collections"}}'
    cmds:
      - ansible-lint

  ansible:syntax:
    desc: 'Syntax-check the full deployment playbook (needs .vault_password to exist, never decrypts it)'
    dir: '{{.ANSIBLE_DIR}}'
    cmds:
      - ansible-playbook playbooks/site.yml --syntax-check {{.CLI_ARGS}}

  compose:validate:
    desc: Validate every Docker Compose stack (client-side, no Docker daemon needed)
    cmds:
      - ./scripts/validate-compose.sh {{.CLI_ARGS}}

  ci:local:
    desc: 'Run the CI checks that need no extra tooling (lint + syntax + compose; gitleaks runs in CI)'
    cmds:
      - task: ansible:lint
      - task: ansible:syntax
      - task: compose:validate

  ansible:galaxy:
    desc: Install Ansible Galaxy collections
    dir: '{{.ANSIBLE_DIR}}'
    cmds:
      - ansible-galaxy install -r requirements.yml

  ansible:inventory:
    desc: Show Ansible inventory
    dir: '{{.ANSIBLE_DIR}}'
    cmds:
      - ansible-inventory --list {{.CLI_ARGS}}

  ansible:ping:
    desc: Ping all hosts
    dir: '{{.ANSIBLE_DIR}}'
    cmds:
      - ansible all -m ping {{.CLI_ARGS}}

  # === Docker Status ===
  docker:status:
    desc: Show status of all Docker containers across hosts
    cmds:
      # Both docker hosts — the task claimed "across hosts" while only ever
      # showing eq12's, so n5pro-docker's containers were invisible here (#94).
      # One host being down must not hide the other's output (that was the whole
      # point of the fix), but `ignore_error: true` per host also meant BOTH hosts
      # unreachable exited 0: two headers, two ssh errors on stderr, and a green
      # status. So count the failures and fail only when nothing succeeded — a
      # partial result is still a result, a total failure is not.
      - |
        set -u
        hosts="deb-docker.lan n5pro-docker.lan"
        total=0
        failed=0
        for h in $hosts; do
          total=$((total + 1))
          echo "=== $h ==="
          if ! ssh -o ConnectTimeout=10 root@"$h" 'docker ps -a --format "table {{`{{.Names}}`}}\t{{`{{.Status}}`}}\t{{`{{.Ports}}`}}"'; then
            echo "!!! $h: unreachable or docker not responding" >&2
            failed=$((failed + 1))
          fi
        done
        if [ "$failed" -eq "$total" ]; then
          echo "docker:status: all $total host(s) failed — reporting failure rather than a green no-op" >&2
          exit 1
        fi

  # === Vault ===
  vault:edit:
    desc: 'Edit an encrypted vault file (usage: task vault:edit -- inventory/host_vars/eq12/vault.yml)'
    dir: '{{.ANSIBLE_DIR}}'
    cmds:
      - ansible-vault edit {{.CLI_ARGS}}

  vault:encrypt:
    desc: Encrypt a file with ansible-vault
    dir: '{{.ANSIBLE_DIR}}'
    cmds:
      - ansible-vault encrypt {{.CLI_ARGS}}
