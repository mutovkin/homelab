[defaults]
inventory = inventory/hosts.yml
roles_path = roles
vault_password_file = ../.vault_password
retry_files_enabled = False
stdout_callback = ansible.builtin.default
result_format = yaml
callbacks_enabled = timer

[ssh_connection]
pipelining = True
# accept-new: pin host keys on first contact (TOFU), refuse CHANGED keys thereafter.
# After a guest rebuild, remove the stale key: ssh-keygen -R <host-or-ip>  (#94)
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new

[privilege_escalation]
become = True
become_method = sudo
become_user = root
