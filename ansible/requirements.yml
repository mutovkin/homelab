---
# Pinning policy (#137)
#
# Floors carry the features we depend on. An UPPER bound is added only when
# upstream has ANNOUNCED a breaking default change, so that the major bump
# becomes a deliberate, reviewed act rather than something a routine
# `ansible-galaxy collection install -r requirements.yml --upgrade` does to us
# on one operator machine and not the other. Same reasoning as #86's
# `update: false` pins: a collection has already changed a default under us once.
collections:
  # No announced breaking default change to bound against — floor only.
  - name: community.general
    version: ">=12.0.0"
  # No announced breaking default change to bound against — floor only.
  - name: community.docker
    version: ">=3.0.0"
  # Upper bound because 2.0.0 flips `validate_certs` from false to true
  # (plugins/doc_fragments/proxmox.py: "Currently defaults to V(false) and
  # changes default to V(true) with community.proxmox 2.0.0"; the runtime
  # deprecation lives in module_utils/proxmox.py::_connect). Our PVE nodes serve
  # the self-signed PVE cluster CA, so that flip would fail every proxmox task in
  # the repo at once. The call sites in roles/proxmox_guests set validate_certs
  # explicitly as well — belt AND braces.
  #
  # NOTE: `<2.0.0` does NOT by itself exclude the published 2.0.0-beta1 under
  # semver ordering. Prereleases are excluded because `ansible-galaxy` does not
  # select them without `--pre`, not because of this bound. Do not "fix" the
  # bound to `<2.0.0-0` on the assumption that it is doing that job.
  - name: community.proxmox
    version: ">=1.0.0,<2.0.0"
  # Floor raised from >=1.5.0 (#137). 2.2.0 dropped the deprecated
  # `ansible.module_utils._text` / `common._collections_compat` / `six` imports
  # from synchronize + patch (upstream issue 686) — those are removed in
  # ansible-core 2.24, and with deprecation_warnings restored (#94) they were the
  # only warnings a lint run emitted. 2.2.1 additionally fixes a LOCAL PRIVILEGE
  # ESCALATION in `authorized_key` (symlink-following when running as root,
  # upstream issue 759) — the `common` role deploys SSH keys with that module,
  # as root, on every host. That security fix is the strongest reason for the
  # floor; 2.2.2 is simply the newest published at the time of the bump.
  - name: ansible.posix
    version: ">=2.2.2"
