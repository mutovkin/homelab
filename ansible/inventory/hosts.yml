---
all:
  children:
    proxmox_hosts:
      hosts:
        eq12:
          ansible_host: 192.168.25.5
          ansible_user: root
        n5pro:
          ansible_host: 192.168.30.5
          ansible_user: root

    docker_hosts:
      hosts:
        eq12_docker:
          ansible_host: 192.168.25.15 # deb-docker (CT 101)
          ansible_user: root
        n5pro_docker:
          ansible_host: 192.168.30.15 # n5pro-docker (CT 201)
          ansible_user: root

    # Hosts that run a NATIVE Vector log shipper (roles/vector_agent, #134). Hosts
    # are re-listed here, not redefined: their addresses and connection vars stay
    # in the groups above, and Ansible merges group membership.
    #
    # eq12_docker is deliberately ABSENT. It runs Vector as a CONTAINER inside the
    # observability compose stack (roles/services/observability), so adding it here
    # would install a second, competing shipper on the same host — two readers of
    # the same /var/log/structured.log, every host record ingested twice.
    vector_agents:
      hosts:
        eq12:
        n5pro:
        n5pro_docker:
