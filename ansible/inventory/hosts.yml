---
all:
  children:
    proxmox_hosts:
      hosts:
        eq12:
          ansible_host: 192.168.25.5
          ansible_user: root
        n5pro:
          ansible_host: 192.168.30.5
          ansible_user: root

    docker_hosts:
      hosts:
        eq12_docker:
          ansible_host: 192.168.25.15 # deb-docker (CT 101)
          ansible_user: root
        n5pro_docker:
          ansible_host: 192.168.30.15 # n5pro-docker (CT 201)
          ansible_user: root

    # Hosts that run a NATIVE Vector log shipper (roles/vector_agent, #134). Hosts
    # are re-listed here, not redefined: their addresses and connection vars stay
    # in the groups above, and Ansible merges group membership.
    #
    # eq12_docker is deliberately ABSENT. It runs Vector as a CONTAINER inside the
    # observability compose stack (roles/services/observability), so adding it here
    # would install a second, competing shipper on the same host — two readers of
    # the same /var/log/structured.log, every host record ingested twice.
    vector_agents:
      hosts:
        eq12:
        n5pro:
        n5pro_docker:

    # The TrueNAS appliance (VM 200 on n5pro). It is NOT an SSH-managed host:
    # `ansible_connection: local` means every task in this group runs on the
    # CONTROL NODE and reaches the appliance over its JSON-RPC/WebSocket API
    # (#173). TrueNAS 26.0 removed the REST API, and `uri` cannot speak
    # WebSocket, so the roles here use a custom module rather than stock ones.
    #
    # Deliberately no SSH: the appliance holds all the bulk storage, and the
    # narrow API credential (one role, REPORTING_WRITE) is a far smaller grant
    # than shell access. `ansible_host` lives in host_vars and is consumed only
    # to build the API URL.
    nas:
      hosts:
        truenas:
          ansible_connection: local
          # Pin the module interpreter to the SAME python running ansible-playbook.
          # Without this, interpreter discovery picks the system python (measured:
          # /opt/homebrew/bin/python3.14 on the Mac), which does NOT have
          # truenas_api_client — the client is installed into the `uv tool`
          # ansible-core environment, per docs/onboarding.md. Written as
          # ansible_playbook_python rather than a literal path deliberately: the
          # repo is driven from a Mac AND an Arch box (Critical Rule 2), and a
          # hardcoded path would work on exactly one of them.
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
