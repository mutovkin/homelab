---
# Shared configuration for all hosts

# Timezone
timezone: America/Los_Angeles

# DNS
dns_servers:
  - 1.1.1.1
  - 8.8.8.8

# NTP
ntp_servers:
  - 0.pool.ntp.org
  - 1.pool.ntp.org

# Base packages live in roles/common/defaults/main.yml (`common_packages`).
# Setting it here REPLACES that list rather than extending it — doing so is what
# caused #77 — so prefer editing the role default. Packages the role itself
# needs are in roles/common/vars/main.yml and cannot be overridden from here.

# Docker network defaults
docker_network_base: "172.20.0.0" # All Docker networks use 172.x.x.x

# Watchtower schedule
watchtower_schedule: "0 30 4 * * *" # Daily at 4:30 AM
watchtower_timezone: "America/Los_Angeles"
