---
# Shared configuration for all hosts

# Timezone
timezone: America/Los_Angeles

# `common_packages` lives in roles/common/defaults/main.yml. Setting it here
# REPLACES the whole list (this is how #77 happened) — edit the role default
# instead. Role-required packages are in roles/common/vars/main.yml and cannot
# be overridden from inventory.

# Fresh-allocation restore gate (#127): ONE path, written by the proxmox_guests
# role (playbooks/proxmox-hosts.yml) and read by playbooks/deploy-services.yml.
# It lives here rather than in either role's defaults precisely because two plays
# on two different hosts have to agree on it — the writer runs on the Proxmox
# node via `pct exec`, the reader runs inside the guest.
#
# It sits on the container's ROOTFS, not on a data mount, and it lists every
# mount whose volume this build allocated fresh. That is the fix for the original
# shape: the writer marked every mount while the reader stat'd a single
# hard-coded /data path, so the first CT to declare a second mount
# (`mp1: local-zfs:500,mp=/media`) would have had its rebuild sail straight
# through the gate.
fresh_allocation_manifest: /var/lib/ansible-fresh-allocation

# Watchtower schedule
watchtower_schedule: "0 30 4 * * *" # Daily at 4:30 AM
watchtower_timezone: "America/Los_Angeles"

# VictoriaLogs endpoints, for the hosts that ship to it but do not run it (#134).
#
# Here rather than in roles/vector_agent/defaults precisely because they are a fact
# about ANOTHER host: the port is the `9428:9428` publish in
# ansible/roles/services/observability/files/compose.yaml, and the address is
# eq12_docker's own inventory entry, so a re-IP of that CT moves both endpoints
# with it and nothing has to be remembered in two places.
#
# /insert is the base the Vector `loki` sink appends /loki/api/v1/push to — the
# same value the container's vector.yaml uses, only by LAN address instead of the
# compose service name. Plain HTTP with basic auth, like every other internal hop
# in this homelab; TLS on the ingest path is a tracked follow-up, not an oversight.
victorialogs_ingest_endpoint: "http://{{ hostvars['eq12_docker'].ansible_host }}:9428/insert"
victorialogs_query_endpoint: "http://{{ hostvars['eq12_docker'].ansible_host }}:9428/select/logsql/query"
