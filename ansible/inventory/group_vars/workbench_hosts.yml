---
# Workbench CTs (#254, #258).
#
# Pin the interpreter. Ubuntu 26.04 is not in ansible-core's distro map, so
# `interpreter_python: auto` resolves a bare `python3` from PATH — and the
# linuxbrew role puts the brew prefix ahead of /usr/bin, where brew's python@3
# (a dependency of several formulae) then wins. Measured 2026-09-05: discovery
# moved from /usr/bin/python3 to /home/linuxbrew/.linuxbrew/bin/python3.14
# between two runs of the same play, an interpreter with no python3-apt
# bindings. A literal path is right here: every workbench is a Linux CT
# (CLAUDE.md's "never a literal path" is about ansible_connection: local plays
# on the two operator platforms).
ansible_python_interpreter: /usr/bin/python3
