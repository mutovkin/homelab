---
# Minisforum N5 Pro — host-specific variables
# CPU: AMD Ryzen AI 9 HX PRO 370 (12c/24t)
# RAM: 96GB DDR5-5600 ECC (32GB GPU UMA, ~62GB for Proxmox)
# NVMe: 1×4TB + 2×2TB WD Black SN850X | HDD: 5×26TB Seagate Exos
# GPU: Radeon 890M | NPU: Strix Halo | Net: 10GbE + 5GbE

# Proxmox
proxmox_node: n5pro

# Hardware
total_ram_gb: 96
gpu_ram_gb: 32 # Allocated in BIOS to iGPU (UMA)
system_ram_gb: 62 # Available to Proxmox (~62GB after UMA)

# ── GPU Sharing (LXC device passthrough) ─────────────────────────────────────
#
# Modern approach (Proxmox 9 / kernel 6.14+):
#   The inbox amdgpu kernel driver handles the GPU. The host only needs
#   pve-firmware + udev rules (managed by the proxmox_host role).
#   NO ROCm installation on the Proxmox host.
#
#   ROCm userspace is installed inside the LXC container by the docker_host
#   role during configure-guests.yml, from AMD's stable apt repo
#   (apt install amdrocm<release>-<gfx arch>; legacy amdgpu-install dropped in #240).
#
# How it works:
#   Host: amdgpu driver → /dev/dri + /dev/kfd exist
#   LXC:  bind-mount /dev/dri + /dev/kfd → ROCm userspace talks to devices
#   Docker: --device /dev/dri --device /dev/kfd (+ numeric render/video gids;
#           no HSA_OVERRIDE_GFX_VERSION — gfx1150 is native since ROCm 7.2)
#
# Hardware reference (for diagnostics, not used by Ansible):
#   GPU:   Radeon 890M — PCI c7:00.0 (1002:150e) — IOMMU group 23
#   Audio: HDMI/DP     — PCI c7:00.1 (1002:1640) — IOMMU group 24
#   UMA:   32 GB allocated in BIOS
#
# Reference: docs/n5pro.md § GPU Passthrough
# ─────────────────────────────────────────────────────────────────────────────
gpu_sharing:
  enabled: true

# ── NPU Passthrough ─────────────────────────────────────────────────────────
# AMD Strix Halo Neural Processing Unit — available for AI workloads.
# Not yet assigned to any VM/CT. Can be passed via hostpci (VM) or
# cgroup device allow (LXC) once a workload needs it.
npu_pci_address: "c8:00.1" # IOMMU group 30
npu_device_id: "1022:17f0"

# === NUT (Network UPS Tools) — server ===
# Goldenmate 1500VA UPS connected via USB
nut_role: "server"
# Only the eq12 client (connects from 192.168.25.5) may reach upsd over the LAN.
# CIDR form is required by the shared nft_scoped_fw allowlist assert (#114) —
# /32 is exactly what a bare address already meant to nft.
nut_allowed_clients:
  - "192.168.25.5/32"
nut_server:
  ups_name: "goldenmate"
  # Loopback for the local upsmon + the LAN IP the eq12 client connects to
  # (192.168.30.5). Not 0.0.0.0 — no need to expose upsd on every interface.
  listen_addresses:
    - "127.0.0.1"
    - "192.168.30.5"
  listen_port: 3493
  shutdowncmd: "/sbin/shutdown -h +0"
  powerdownflag: "/etc/killpower"
  ups:
    driver: "usbhid-ups"
    port: "auto"
    desc: "Goldenmate 1500VA"
    vendorid: "075d"
    productid: "0300"
    ignorelb: true
    override_battery_charge_low: "30"

# Cluster PCI resource mappings, consumed by the proxmox_guests role and
# referenced by the TrueNAS VM's hostpci entries below (mapping=<id>).
# Values are PINNED TO OBSERVED HARDWARE (pvesh get /cluster/mapping/pci,
# 2026-08-16), so the first reconcile after adding them is a no-op.
# If hardware is re-seated and addresses / IOMMU groups change, update them here
# and re-run `task infra:hosts -- --limit n5pro` — the role converges the
# mapping. Mappings are resolved at VM start, so updating one never touches the
# running VM.
proxmox_pci_mappings:
  - id: truenas_sata # JMicron JMB58x SATA controller — 5× 26TB HDDs
    device_id: "197b:0585"
    subsystem_id: "197b:0000"
    iommugroup: 17
    path: "0000:c1:00.0"
    description: "For pass-through to TrueNAS VM"
  - id: truenas_nvme0
    device_id: "15b7:5030"
    subsystem_id: "15b7:5030"
    iommugroup: 22
    path: "0000:c6:00.0"
    description: "WD SN850X 2TB NVMe for TrueNAS special vdev"
  - id: truenas_nvme1
    device_id: "15b7:5030"
    subsystem_id: "15b7:5030"
    iommugroup: 19
    path: "0000:c3:00.0"
    description: "WD SN850X 2TB NVMe for TrueNAS special vdev"

# Storage
zfs_pool: rpool # 4TB NVMe boot disk
data_mount: /data

# Force native PCIe port services so AER (PCIe Advanced Error Reporting) is
# logged — firmware does not grant it via ACPI _OSC, leaving us blind to the
# fault class most likely behind the 2026-06-04 hard freeze (#43, #49). This is
# a passthrough host (SATA + NVMe to TrueNAS), where AER visibility matters most.
kernel_cmdline_extra:
  - pcie_ports=native

# Network
proxmox_bridge: vmbr1 # 10GbE (Aquantia AQC113) — primary management

# Host-only bridge for NFS traffic (TrueNAS <-> Docker LXC)
# No physical NIC attached — traffic stays in RAM, never hits the network
hostonly_bridge: vmbr2
hostonly_host_ip: "10.99.99.1"
hostonly_host_netmask: "255.255.255.0"

# TrueNAS on vmbr2. Canonical copy for the HOST; host_vars/n5pro_docker carries
# the same value for the docker guest's compose volumes (two hosts, two files —
# Ansible host_vars do not cross hosts).
truenas_hostonly_ip: "10.99.99.2"

# NFS datasets this Proxmox host mounts for bind-mounting into unprivileged
# workbench CTs (#254; model in roles/proxmox_host/defaults). The TrueNAS share
# for the dataset ROOT is exported to this host's vmbr2 address (10.99.99.1) with
# Mapall to the library owner (uid/gid 3000), so every write from any CT lands
# with the library's own ownership. `lossless`/`compressed` are plain
# directories inside the dataset, not datasets — one mount covers both.
# The .mount unit is never enabled (TrueNAS is VM 200 on this host); the
# pre-start hookscript mounts it on demand.
proxmox_nfs_mounts:
  - name: music
    server: "{{ truenas_hostonly_ip }}"
    export: /mnt/vault/media/music
    path: /mnt/nfs/music
    options: "nfsvers=4,hard,_netdev,noatime,retry=0"

# === VM/LXC Definitions (managed by proxmox_guests role) ===
# Ported from infrastructure/machines/n5pro.ts

proxmox_vms:
  - vmid: 200
    name: truenas
    cores: 4
    memory: 24576
    ide:
      # DR flow (deliberate, #87): host_vars keep the installer ISO attached so
      # a re-created VM 200 (fresh empty scsi0) falls through boot order to the
      # installer — reinstall TrueNAS, then import the ZFS pools (every data
      # disk is PCI-passthrough and survives the VM). The LIVE VM reads
      # `ide2: none,media=cdrom` because the ISO was ejected post-install; the
      # reconcile tasks deliberately exclude ide2, so this mismatch is permanent
      # and correct.
      ide2: "local:iso/{{ truenas_iso_filename }},media=cdrom"
    scsi:
      scsi0: "local-zfs:64,format=raw"
    bios: ovmf
    machine: q35
    vga: virtio
    efidisk0:
      storage: local-zfs
      format: raw
      efitype: 4m
      pre_enrolled_keys: false
    hostpci:
      hostpci0: "mapping=truenas_sata,pcie=1" # JMicron SATA controller via Proxmox Resource Mapping
      hostpci1: "mapping=truenas_nvme0,pcie=1" # WD SN850X 2TB NVMe (c6:00.0) for mirrored special vdev
      hostpci2: "mapping=truenas_nvme1,pcie=1" # WD SN850X 2TB NVMe (c3:00.0) for mirrored special vdev
    net_bridge: vmbr1
    net:
      net0: "virtio,bridge=vmbr1"
      net1: "virtio,bridge=vmbr2"
    # order=1 so the NFS provider boots before its consumers; up=180 holds the
    # next guest (the docker LXC) until TrueNAS has finished its slow boot
    # (PCIe passthrough + ZFS import + NFS start). The lms-nfs-heal unit in the
    # LXC is the backstop if 180s is ever still too short — see issue #36.
    startup: "order=1,up=180"
    onboot: true
    started: true
    tags:
      - truenas
      - storage
    description: >-
      TrueNAS SCALE — NAS and storage management.
      JMicron SATA controller passed through for direct access to 5x 26TB HDDs.
      2x WD SN850X 2TB NVMe passed through for mirrored ZFS special vdev.
      net0: vmbr1 (10GbE LAN), net1: vmbr2 (host-only NFS).
      Boots first (order=1, up=180) so NFS is serving before its consumers.

proxmox_lxcs:
  - vmid: 201
    hostname: n5pro-docker
    os: ubuntu-24.04
    cores: 8
    memory: 24576 # 24GB — Immich + Frigate + NextCloud + overhead
    root_disk_size: 64 # was 24; bumped after rootfs hit 80% (logs/images). See #48
    storage: local-zfs
    unprivileged: false # required: host GID 993 (render) must pass through for /dev/kfd ROCm access
    mounts:
      # Allocation form — consumed at CREATE only (update:false, #86): a rebuild
      # allocates a fresh empty 200G /data; the live volume is
      # local-zfs:subvol-201-disk-1 (pct config 201, 2026-08-16). DR: restore
      # /data before deploying services. That ordering is now ENFORCED (#127),
      # not just documented: a run that creates this CT writes
      # /var/lib/ansible-fresh-allocation inside it (listing every mount it
      # allocated fresh — see `fresh_allocation_manifest` in group_vars/all), and
      # deploy-services.yml refuses to run for any docker host carrying it.
      # The arming survives an interrupted build (#148): the Proxmox host records
      # the intent to allocate BEFORE the container is created and clears it only
      # once the manifest is written, so a run killed in between is picked up by
      # the next one rather than leaving the gate silently unarmed.
      # Restore the volume, then `rm /var/lib/ansible-fresh-allocation` — that rm
      # is the explicit "yes, this data is what I want" acknowledgement, and it is
      # the only thing that clears the gate. (Each listed mount also gets a
      # `.fresh-allocation` breadcrumb at its root; that is evidence, not the
      # gate.) On a genuinely greenfield build, remove it without restoring.
      # NOTE: unlike CT 101's mp0 this volume carries no `backup=1` (live:
      # `mp0: local-zfs:subvol-201-disk-1,size=200G,mp=/data`, pct config 201,
      # 2026-08-18), so vzdump does not include it and there is nothing to
      # restore FROM. The gate will stop a rebuild here, and that is the correct
      # outcome until a backup for this volume exists.
      # NOTE: /etc/pve/lxc/201.conf carries a [pve:pending] mp0 that is a
      # semantically identical reorder of the live value — likely residue of the
      # pre-#86 blind update-PUT era (origin unconfirmed; that PUT did send
      # allocation form). It merges harmlessly at the CT's next operator-chosen
      # restart — do NOT restart the CT to "clean" it, and do not try to
      # reconcile it.
      # The `features: mount=nfs,nesting=1` that #86 queued alongside it is NO
      # LONGER pending: as of 2026-08-19 `pct config 201`, `pct config 201
      # --current` and `pct pending 201` all read `mount=nfs,nesting=1` (pending
      # prints a `cur` line only), so that feature set is in force, not queued.
      mp0: "local-zfs:200,mp=/data"
    netif:
      net0: "name=eth0,bridge=vmbr1,gw=192.168.23.1,hwaddr=BC:24:11:FC:95:51,ip=192.168.30.15/18,type=veth"
      net1: "name=eth1,bridge=vmbr2,hwaddr=BC:24:11:FC:95:52,ip=10.99.99.3/24,type=veth"
    nesting: true
    # Maps to the LXC `mount=nfs` feature (applies at the CT's next start).
    # NFS works today regardless, because this CT runs with
    # `lxc.apparmor.profile: unconfined` — the feature is belt-and-braces.
    # It was previously emitted as `nfs=1`, which is not a valid feature key,
    # so it failed schema validation and never persisted (#86).
    nfs_enabled: true
    # order=2 boots after TrueNAS (order=1). The wait for TrueNAS lives on the
    # TrueNAS guest's up= delay, not here (Proxmox up= delays the NEXT guest in
    # order, so a delay on this guest would do nothing useful). See issue #36.
    startup: "order=2"
    gpu_sharing: true # /dev/dri + /dev/kfd bind-mount for VAAPI and ROCm
    onboot: true
    started: true
    tags:
      - docker
    # `description` is CREATE-TIME ONLY (provisioning is pinned update:false,
    # #86) — nothing reconciles it, so editing it here changes the REBUILD
    # declaration and leaves the live CT's description alone. The live text keeps
    # the old service list until this container is next built from scratch; that
    # divergence is deliberate, same as VM 100's `tags` divergence in eq12
    # host_vars. Kept accurate anyway because the rebuild is exactly when nobody
    # has the spare attention to notice a stale one.
    description: >-
      Docker host — Lyrion (LMS), Portainer, Watchtower
      (Immich/Frigate/NextCloud/PostgreSQL planned).
      net0: vmbr1 (LAN), net1: vmbr2 (host-only NFS).
      Boots after TrueNAS (order=2).

  # --- Workbench CT (#254) ----------------------------------------------------
  # A short-lived, unprivileged general-purpose box: SSH in, run CLI tools, throw
  # it away. To make another one: copy this block (new vmid/hostname/IP), add the
  # host to `workbench_hosts` in inventory/hosts.yml with a host_vars file
  # carrying its `common_extra_packages`, run `task infra:hosts -- --limit n5pro`
  # then `task infra:guests -- --limit <name>`. To retire it: delete this block
  # and the inventory entry, then `task infra:guest:destroy -- --limit n5pro
  # -e vmid=<id> -e hostname=<name>` (the playbook refuses while the block is
  # still declared, so a later infra:hosts run cannot resurrect it).
  #
  # NFS access is by HOST bind mount: the Proxmox host mounts the dataset
  # (proxmox_nfs_mounts above) and `bind_mounts` hands subdirectories in. Unlike
  # `mounts`, `bind_mounts` is reconciled (pct set, root@pam-only so not via the
  # API token) and is NOT armed by the fresh-allocation restore gate — nothing
  # is allocated, and the marker would land inside the share. The hookscript is
  # the start gate: `pct start` refuses while /mnt/nfs/music is not a live NFS
  # mountpoint or a bind source is missing on the share.
  # Inside the CT the library shows as nobody:nogroup (uid 3000 is unmapped in
  # the unprivileged userns); reads and writes work because TrueNAS Mapall
  # answers the permission check server-side.
  - vmid: 202
    hostname: music-workbench
    os: ubuntu-26.04
    cores: 4
    memory: 4096
    root_disk_size: 16
    storage: local-zfs
    unprivileged: true
    # REQUIRED for this template, not a nicety: Ubuntu 26.04 ships systemd 259,
    # which in an unprivileged CT without nesting fails every early unit with
    # status=243/CREDENTIALS (networkd, journald, sysctl, tmpfiles…) — measured
    # 2026-09-02: the CT booted with eth0 DOWN and sshd unreachable while `pct`
    # reported it running. Proxmox warns "Systemd 259 detected. You may need to
    # enable nesting." at create and start. Nesting on an unprivileged CT is
    # not a privilege escalation (it is the userns-confined kind).
    nesting: true
    netif:
      # hwaddr pinned to the live MAC (pct config 202, 2026-09-02) so a rebuild
      # keeps its ARP/DHCP identity — a recreate without the pin gets a new MAC
      # and stale ARP entries on the LAN make the same IP time out for minutes.
      net0: "name=eth0,bridge=vmbr1,gw=192.168.23.1,hwaddr=BC:24:11:5B:D0:22,ip=192.168.30.16/18,type=veth"
    bind_mounts:
      mp0: "/mnt/nfs/music/lossless,mp=/music/lossless"
      mp1: "/mnt/nfs/music/compressed,mp=/music/compressed"
    hookscript: local:snippets/nfs-bind-prestart.sh
    onboot: false # short-lived: not started by the host's boot
    # `started: true` means every infra:hosts run asks for it running, which invokes
    # the NFS start gate: with TrueNAS unreachable the play waits up to NFS_BIND_WAIT
    # (180 s, or ~30 s per stat if the share was already mounted) and then FAILS on
    # this host — loudly, by design. Flip to `started: false` while the NAS is down
    # or on a from-scratch rebuild before the TrueNAS share exists.
    # No `startup:` order, deliberately — see templates/nfs.mount.j2.
    started: true
    tags:
      - workbench
    description: >-
      Workbench CT (#254) — music tag processing over SSH.
      /music/lossless and /music/compressed are host bind mounts of the
      TrueNAS music dataset (pre-start hookscript gates on the NFS mount).
      Throwaway: retire with task infra:guest:destroy.

# --- telegraf_agent (#186) ---------------------------------------------------
# No ACPI fan objects on this board at all (measured 2026-08-24) — there is no
# fan signal of any kind here, and nothing must pretend otherwise.
telegraf_agent_acpi_fan_state: false
# Entries are matched as LITERAL SUBSTRINGS of `telegraf --test`'s output, not
# as regexes — a `.` or `-` here is that character, nothing more.
telegraf_agent_expected_test_output:
  - "chip=k10temp-pci-00c3" # Tctl — ONE value, no per-core on Zen5
  - "chip=spd5118-i2c-0-50" # DDR5 DIMM temp, module 0
  - "chip=spd5118-i2c-0-51" # DDR5 DIMM temp, module 1
  - "chip=amdgpu-pci-c700" # iGPU edge temp + power (host-side view of CT-201 VAAPI load)
  - "chip=nvme-pci-c200"
  - "smart_device,"
  # RAPL (#194). Influx line protocol sorts tag keys, so `domain` precedes the
  # agent's `environment`/`host`/`location` — the substring is the line's head.
  # Verified against the script's real output on this host, 2026-08-25.
  - "rapl,domain=package-0"
# Fabricated zeros (CLAUDE.md): amdgpu vddgfx/vddnb read 0.000 V — unsupported,
# not measured. THE EXCLUSION: what the sensors tagdrop in telegraf.conf.j2 drops
# at the source.
telegraf_agent_sensors_tagdrop_features: [vddgfx, vddnb]
# THE PROOF, a separate list on purpose (#186 review round): what must then be
# absent from telegraf's own output, asserted every deploy. Literal substrings.
telegraf_agent_forbidden_test_output:
  - "feature=vddgfx"
  - "feature=vddnb"
  # The excluded RAPL domain must not reappear in telegraf's own output either
  # (see below for why it is excluded).
  - "rapl,domain=core"

# Sensor temperature SERIES this host must deliver, asserted for equality against
# VictoriaMetrics at the end of the deploy and reconciled against
# obs-sensors-metrics-absent-n5pro's threshold by a static guard in the
# observability role. NINE series across EIGHT chips, measured 2026-08-25:
#   acpitz-acpi-0            temp1
#   amdgpu-pci-c700          edge
#   k10temp-pci-00c3         tctl
#   nic1-pci-c400            mac_temperature, phy_temperature
#   nvme-pci-c200            composite
#   r8169_0_c500:00-mdio-0   temp1
#   spd5118-i2c-0-50         temp1          (DIMM)
#   spd5118-i2c-0-51         temp1          (DIMM)
#
# HOW LONG THIS HAS BEEN OBSERVED STABLE, stated honestly because it bounds what
# the number is worth: all nine had identical sample counts (1026) at the time of
# measurement, with no series ever dropping out — but that is ~17 HOURS of
# history, not weeks, since the native agents only landed in #186. Three of the
# nine are NIC-adjacent (nic1 mac/phy, r8169 temp1) and are the plausible
# flappers if a link drops or the driver reloads.
#
# The alert rule is email-only with a 10m lookback and for: 5m, so a brief
# dropout costs one email rather than a page. IF IT PROVES FLAPPY, the remedy is
# to narrow the rule's selector to exclude the NIC chips AND lower this number in
# the same change — never to lower this number alone, which would silently stop
# detecting a real loss of the chips that remain.
telegraf_agent_expected_sensor_series: 9

# --- RAPL package power (#194) -----------------------------------------------
# TWO powercap domains on this Zen 5 box — intel-rapl:0 = package-0,
# intel-rapl:0:0 = core. There is NO uncore here, unlike eq12; a panel or rule
# hard-wired to eq12's three-domain shape reads empty for this host.
# max_energy_range_uj = 65532610987 (65.5 kJ), which wraps roughly every 3 h at
# idle and ~20 min under load — the reason files/rapl_power.sh converts to watts
# at the source instead of exporting the raw counter.
#
# THE `core` DOMAIN IS EXCLUDED: it covers CPU0 ONLY, not the package's cores.
#
# THE TEST THAT ESTABLISHES THIS IS LOAD PLACEMENT, and it is the only kind that
# can. A busy-loop pinned to CPU0 makes `core` rise under BOTH hypotheses (real
# aggregate / CPU0-only), so it discriminates nothing — that confound produced
# two confident and OPPOSITE wrong answers during #194. Put the load on cores the
# domain would only see if it were an aggregate. Measured 2026-08-25, two runs,
# 6 s windows (run 2 in parentheses):
#
#   placement                    package W          core W
#   idle                         5.93  (5.83)       0.06  (0.05)
#   busy-loop on CPU0           21.96 (22.84)      15.83 (16.59)
#   busy-loop on CPU20          11.21 (11.88)       0.16  (0.13)
#   busy-loop on CPU2+14+20     33.93 (33.78)       0.12  (0.24)
#   idle again                   6.32  (6.16)       0.09  (0.11)
#
# `core` stays FLAT at ~0.12 W while package climbs 28 W under a three-core load
# containing no CPU0. It tracks only when CPU0 itself is loaded. On this Zen 5
# board intel-rapl:0:0 is one physical core of twelve (24 logical CPUs).
#
# Contrast eq12, where the SAME sysfs path is a genuine aggregate (it tracks
# package to within 0.08 W on every placement) — so a domain's coverage is a
# property of the BOARD and must be measured per host, never inferred from the
# name `core`.
#
# It is dropped rather than relabelled `domain=cpu0`: one physical core of twelve answers
# no question anyone asks, and a per-core series sitting under the same metric
# name as `package-0` invites a sum that is always wrong. This is not a
# fabricated zero — it is a real reading of the wrong thing, which is worse,
# because it looks measured.
#
# Asserted absent both in telegraf's own output (above) and in the delivered
# domain set (below).
telegraf_agent_rapl_exclude_domains: [core]
telegraf_agent_rapl_expected_domains: [package-0]
