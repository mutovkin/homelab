---
# N5 Pro Docker LXC (CT 201 / n5pro-docker) — host-specific variables

# Data mount point inside the LXC
data_mount: /data

# GPU sharing — ROCm userspace installed by docker_host role.
# `rocm_usecases` was removed in #240: it was an `amdgpu-install --usecase`
# argument, and the stable-repo channel selects by GPU architecture instead
# (rocm_gfx_arch in the role defaults). Inventory REPLACES role defaults for
# dicts, so this must stay the complete authoritative value.
gpu_sharing:
  enabled: true

# NFS client — install nfs-common for Docker NFS volume driver
nfs_enabled: true

# Docker runs inside a privileged LXC container — AppArmor profile loading
# fails because the container lacks policy admin privileges. This flag stops
# and masks AppArmor inside the container so Docker doesn't attempt to use it.
docker_lxc: true

# Collect local container logs as well as host logs with the native Vector shipper
# (roles/vector_agent, #134). TRUE only here: this is the one host in the
# vector_agents group that runs Docker, and the role's default is false because a
# docker_logs source on a host with no /var/run/docker.sock makes Vector log a
# connection error on a loop while still shipping host records — permanently noisy,
# permanently green.
#
# Turning this on puts the `vector` user in the `docker` group, which is
# root-equivalent access on this host. It is the same posture the vector CONTAINER
# has on eq12_docker (socket bind-mount) and the same telegraf already holds there:
# a new holder of an existing grant, not a new kind of grant.
vector_agent_docker_logs: true

# Services to deploy on this Docker host
# Each entry corresponds to an Ansible role in roles/services/
services:
  - lms
  - portainer
  - watchtower
# services:
#   - postgresql
#   - immich
#   - frigate
#   - nextcloud

# Docker network subnets — n5pro allocation plan (#84).
# Fleet-wide 172.16.0.0/12 map (keep every row disjoint):
#   172.16–172.17   unassigned
#   172.18–172.19   FLEET-WIDE auto-allocation pool, both hosts (#126) —
#                   docker_default_address_pools in group_vars/docker_hosts.yml.
#                   docker0 draws from it too, and unlike a user-defined network it
#                   is RE-ALLOCATED on daemon restart: eq12's default bridge moved
#                   172.20.1.0/24 -> 172.18.0.0/24 the moment the pool changed. That
#                   is harmless here (no container uses the default bridge) but it
#                   means the pool's first /24 is effectively spoken for.
#   172.20–172.25   eq12 range (pins in host_vars/eq12_docker; .21 is the
#                   postgresql role hardcode — the same literal value on whichever
#                   host runs it, which is fine: separate NAT'd bridges)
#   172.26–172.31   n5pro pins (below); 172.30 unassigned — next free n5pro pin
# lms has NO entry: lyrion runs network_mode: host and no committed compose ever
# defined a network for it. The live lms_network (172.36.0.0/24 — public space)
# was created outside Ansible during early bring-up; the lms role retires it.
docker_networks:
  portainer: "172.26.0.0/24" # renumbered from live 172.23.0.0/24 — the deliberate recreate #106 deferred to #84
  watchtower: "172.27.0.0/24" # renumbered from 172.35.0.0/24 (public address space)
  frigate: "172.28.0.0/24" # latent (#91) — was 172.32.0.0/24 (public address space)
  nextcloud: "172.29.0.0/24" # latent (#91) — was 172.33.0.0/24 (public address space)
  immich: "172.31.0.0/24" # latent (#91) — unchanged, already valid RFC1918

# No docker_default_address_pools override here any more: #126 moved 172.18.0.0/15
# to group_vars/docker_hosts.yml, so it is the fleet default and this host inherits
# the identical value (the daemon.json rendered here is byte-for-byte unchanged).

# Host-only NFS (vmbr2) — dedicated path for container NFS volumes
truenas_hostonly_ip: "10.99.99.2"  # TrueNAS IP on vmbr2 (manual config in TrueNAS)
truenas_music_share: "/mnt/vault/media/music/lossless"

# Lyrion Music Server
lms_web_port: "9001"
lms_advertise_addr: "192.168.30.15"  # Docker host LAN IP — visible to Squeezebox players

# Scoped fail-open nftables allowlist for the portainer role's UI port (#80).
# Per-host since #140: this used to live in the role's defaults, so this host
# inherited eq12_docker's NPM grant (192.168.25.20/32) without anyone choosing
# it. Pre-check on 2026-08-19 established NPM (CT 104) has exactly ONE upstream
# on this host — lms.moutovkin.com -> n5pro-docker.lan:9001 — and no proxy host,
# stream host, dead host or redirection for :9000; ss/conntrack showed no live
# 9000 sessions and the Portainer instance here has never been initialised. The
# inherited 192.168.25.20/32 grant was therefore removed.
#
# No vaultwarden_firewall here: vaultwarden is not in this host's `services`,
# so declaring one would be dead config. The role default is `{}`, which fails
# the nft_scoped_fw assert if the role is ever added here without an allowlist.
portainer_firewall:
  ports:
    9000:
      - 192.168.48.0/24 # operator workstation subnet — the only source that needs this UI
