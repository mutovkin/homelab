---
# N5 Pro Docker LXC (CT 201 / n5pro-docker) — host-specific variables

# Data mount point inside the LXC
data_mount: /data

# GPU sharing — ROCm userspace installed by docker_host role
gpu_sharing:
  enabled: true
  rocm_usecases:
    - rocm
    - hip
    - mllib

# NFS client — install nfs-common for Docker NFS volume driver
nfs_enabled: true

# Docker runs inside a privileged LXC container — AppArmor profile loading
# fails because the container lacks policy admin privileges. This flag stops
# and masks AppArmor inside the container so Docker doesn't attempt to use it.
docker_lxc: true

# Services to deploy on this Docker host
# Each entry corresponds to an Ansible role in roles/services/
services:
  - lms
  - portainer
  - watchtower
# services:
#   - postgresql
#   - immich
#   - frigate
#   - nextcloud

# Docker network subnets — n5pro allocation plan (#84).
# Fleet-wide 172.16.0.0/12 map (keep every row disjoint):
#   172.18–172.19   n5pro auto-allocation pool (docker_default_address_pools below)
#   172.20–172.25   eq12 pins (host_vars/eq12_docker) — do not reuse on n5pro
#   172.21          postgres_network (role-hardcoded subnet; same literal value on
#                   whichever host runs it — separate NAT'd bridges, no conflict)
#   172.26–172.31   n5pro pins (below); 172.30 RESERVED for a future service (#91)
# lms has NO entry: lyrion runs network_mode: host. Its orphaned pre-#85
# lms_network (172.36.0.0/24 — public space) is removed by the lms role.
docker_networks:
  portainer: "172.26.0.0/24" # renumbered from live 172.23.0.0/24 — the deliberate recreate #106 deferred to #84
  watchtower: "172.27.0.0/24" # renumbered from 172.35.0.0/24 (public address space)
  frigate: "172.28.0.0/24" # latent (#91) — was 172.32.0.0/24 (public address space)
  nextcloud: "172.29.0.0/24" # latent (#91) — was 172.33.0.0/24 (public address space)
  immich: "172.31.0.0/24" # latent (#91) — unchanged, already valid RFC1918

# Auto-allocation pool override (#84): the group default (172.20.0.0/14 in
# group_vars/docker_hosts.yml) overlaps eq12's pins and n5pro's old portainer
# subnet — ordering-dependent "Pool overlaps" failures on fresh bootstrap.
# 172.18.0.0/15 is disjoint from every pinned subnet on both hosts. Moving the
# fleet default (and deleting this override) is #126 — it needs an eq12 daemon
# restart. docker0 draws from this pool too (it held 172.20.0.0/24 pre-#84).
docker_default_address_pools:
  - base: "172.18.0.0/15"
    size: 24

# NFS mount from TrueNAS (for Frigate recordings, media storage)
truenas_nfs_server: "192.168.30.200"  # TrueNAS IP — update once assigned
truenas_media_share: "/mnt/pool/media"
truenas_frigate_share: "/mnt/pool/frigate"

# Host-only NFS (vmbr2) — dedicated path for container NFS volumes
truenas_hostonly_ip: "10.99.99.2"  # TrueNAS IP on vmbr2 (manual config in TrueNAS)
truenas_music_share: "/mnt/vault/media/music/lossless"

# Lyrion Music Server
lms_web_port: "9001"
lms_advertise_addr: "192.168.30.15"  # Docker host LAN IP — visible to Squeezebox players
