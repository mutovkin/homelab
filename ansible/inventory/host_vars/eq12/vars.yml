---
# Beelink EQ12 (AZW) — host-specific variables
# CPU: Intel N100 (4c/4t, Alder Lake-N)
# RAM: 16GB (single DIMM)
# NVMe: 1× 2TB TEAMGROUP TM8FP4002T
# Net: 2× Intel I225-V 2.5GbE (enp2s0 → vmbr0)

# === NUT (Network UPS Tools) — client ===
# Monitors N5 Pro's NUT server and shuts down on battery low
nut_role: "client"
nut_client:
  monitor_ups_name: "goldenmate"
  monitor_host: "192.168.30.5"
  shutdowncmd: "/sbin/shutdown -h +0"
  powerdownflag: "/etc/killpower"

# Proxmox
proxmox_node: pve

# Hardware
total_ram_gb: 16

# Storage
zfs_pool: rpool
data_mount: /data

# Network
proxmox_bridge: vmbr0

# === VM/LXC Definitions (managed by proxmox_guests role) ===
# Ported from infrastructure/machines/eq12.ts

proxmox_vms:
  - vmid: 100
    name: ha
    cores: 2
    memory: 4096
    # Everything below is pinned to the LIVE VM (qm config 100, 2026-08-16) so a
    # from-scratch rebuild matches the running guest (#87). All of it is
    # create-time-only (provisioning is update:false, #86), so the live VM is
    # untouched by adding it here.
    balloon: 2048
    cpu: host
    # Quoted deliberately: the module param is type=str, and the YAML bool trap
    # (`agent: yes`) would send the string "True" instead of "1".
    agent: "1" # qemu-guest-agent runs inside HAOS
    scsihw: virtio-scsi-pci # live VM predates the role's virtio-scsi-single default
    scsi:
      scsi0: "local-zfs:32,discard=on,ssd=1,format=raw"
    # Pinned to live: HAOS boots UEFI, so recreating this VM with seabios would
    # not boot. The vars said seabios purely because nothing ever compared them
    # against the running guest (#86). No pre-enrolled secure-boot keys.
    bios: ovmf
    efidisk0:
      storage: local-zfs
      format: raw
      efitype: 4m
      pre_enrolled_keys: false
    # NO `machine:` — the live VM has no machine line at all (i440fx default).
    # The `machine: q35` that used to sit here never matched reality, and a q35
    # rebuild is an untested boot config for this HAOS install.
    usb:
      usb0: "host=1a86:55d4" # USB serial radio stick (CH9102)
      usb1: "host=10c4:ea60" # USB serial radio stick (CP2102)
    localtime: true
    tablet: false
    # Pins the MAC so a rebuilt VM keeps its DHCP reservation and IP. Declaring
    # `net` also enrolls VM 100 in the MAC-preserving NIC-reconcile task, where
    # desired == live makes it a no-op (simulated against the captured live
    # config before landing this). WARNING: because that task DOES reconcile,
    # editing this string later hot-rewrites the running HA VM's NIC.
    net:
      net0: "virtio=02:AB:9F:1F:CD:8C,bridge=vmbr0"
    # Not modelled (benign / non-reproducible): smbios1 uuid, vmgenid, meta,
    # snapshot parent, tteck description text. Boot order is deliberately left
    # to PVE: live carries an explicit `boot: order=scsi0`, while a rebuild gets
    # a device-derived order (VM 200, created by this role with no boot param,
    # came out as `order=scsi0;ide2;net0`) — scsi0 still first, with a net
    # fallback. The `tags` divergence is also deliberate: live carries only
    # proxmox-helper-scripts; home-assistant is added here on purpose.
    onboot: true
    started: true
    tags:
      - proxmox-helper-scripts
      - home-assistant
    description: "Home Assistant OS — QEMU VM"

proxmox_lxcs:
  - vmid: 101
    hostname: deb-docker
    ostemplate: "local:vztmpl/debian-12-standard_12.7-1_amd64.tar.zst"
    cores: 2
    memory: 4096
    root_disk_size: 24
    storage: local-zfs
    mounts:
      # Allocation form (like CT 201): `mounts` is consumed at CREATE only
      # (provisioning is pinned update:false, #86), so this line's only job is
      # to tell a from-scratch rebuild what to allocate — naming a subvol here
      # fails creation on a rebuilt host because the volume does not exist yet
      # (#87). Live volume: local-zfs:subvol-101-disk-1, 110G, backup=1
      # (pct config 101, 2026-08-16).
      # DR: a rebuild allocates a FRESH EMPTY /data — restore it from the vzdump
      # backup (backup=1 includes mp0) before deploying services. That ordering
      # is now ENFORCED (#127), not just documented: a run that creates this CT
      # writes /var/lib/ansible-fresh-allocation inside it (listing every mount it
      # allocated fresh — see `fresh_allocation_manifest` in group_vars/all), and
      # deploy-services.yml refuses to run for any docker host carrying it.
      # The arming survives an interrupted build (#148): the Proxmox host records
      # the intent to allocate BEFORE the container is created and clears it only
      # once the manifest is written, so a run killed in between is picked up by
      # the next one rather than leaving the gate silently unarmed.
      # Restore the volume, then `rm /var/lib/ansible-fresh-allocation` — that rm
      # is the explicit "yes, this data is what I want" acknowledgement, and it is
      # the only thing that clears the gate. (Each listed mount also gets a
      # `.fresh-allocation` breadcrumb at its root; that is evidence, not the
      # gate.) On a genuinely greenfield build, remove it without restoring.
      mp0: "local-zfs:110,mp=/data,backup=1"
    netif:
      net0: "name=eth0,bridge=vmbr0,gw=192.168.23.1,hwaddr=AE:E1:F1:EE:F5:9A,ip=192.168.25.15/18,type=veth"
    nesting: true
    onboot: true
    started: true
    tags:
      - docker
    description: "Primary Docker host — runs all container services (observability, postgresql, vaultwarden, etc.)"

  - vmid: 102
    hostname: ubuntu-docker
    ostemplate: "local:vztmpl/ubuntu-22.04-standard_22.04-1_amd64.tar.zst"
    cores: 1
    memory: 1024
    root_disk_size: 8
    storage: local-zfs
    netif:
      net0: "name=eth0,bridge=vmbr0,hwaddr=BC:24:11:C9:0F:0C,ip=dhcp,type=veth"
    nesting: true
    onboot: false
    started: false
    tags:
      - docker
    description: "Secondary Docker host (Ubuntu 22.04) — currently unused"

  - vmid: 104
    hostname: nginxproxymanager
    ostemplate: "local:vztmpl/debian-12-standard_12.7-1_amd64.tar.zst"
    cores: 2
    memory: 1024
    root_disk_size: 4
    storage: local-zfs
    netif:
      net0: "name=eth0,bridge=vmbr0,gw=192.168.23.1,hwaddr=5E:E1:3E:81:01:5F,ip=192.168.25.20/18,type=veth"
    nesting: false
    onboot: true
    started: true
    tags:
      - nginx-proxy-manager
    description: "Nginx Proxy Manager — reverse proxy and SSL management"

# --- telegraf_agent (#186) ---------------------------------------------------
# eq12 is the one host with ACPI fan objects (five, binary cur_state 0/1 —
# measured 2026-08-24; NOT tachometers, there is no RPM on this board).
telegraf_agent_acpi_fan_state: true
# Substrings that MUST appear in `telegraf --test` output on this host — the
# input's OWN output, per CLAUDE.md's ping lesson. chip names measured 2026-08-24.
# Matched as LITERAL SUBSTRINGS, not as regexes: a `.` or `-` here is that
# character, nothing more.
telegraf_agent_expected_test_output:
  - "chip=coretemp-isa-0000" # 5 CPU temps (Package + Core 0..3)
  - "chip=acpitz-acpi-0"
  - "chip=nvme-pci-0300" # root NVMe Composite
  - "smart_device," # inputs.smart is actually producing
  - "acpi_fan_state," # the exec fan-state script is actually producing
  # RAPL (#194). Influx line protocol sorts tag keys, so `domain` precedes the
  # agent's `environment`/`host`/`location` — the substring is the line's head.
  # Verified against the script's real output on this host, 2026-08-25.
  - "rapl,domain=package-0"
  - "rapl,domain=core"
  - "rapl,domain=uncore"
telegraf_agent_forbidden_test_output: []
# RAPL package power (#194). THREE domains on this N100, enumerated from the
# `name` files and not the node indices: intel-rapl:0 = package-0,
# intel-rapl:0:0 = core, intel-rapl:0:1 = uncore.
# max_energy_range_uj = 262143328850 on all three.
#
# `core` HERE IS A GENUINE ALL-CORE AGGREGATE, and it is exported for that
# reason — established by the same load-placement test that DISQUALIFIED n5pro's
# identically-named domain (see that host's vars for the confound this avoids:
# loading CPU0 alone cannot tell an aggregate from a CPU0-only counter).
# Measured 2026-08-25, 6 s windows:
#
#   placement                package W     core W
#   idle                      1.70          1.62
#   busy-loop on CPU0        11.47         11.39
#   busy-loop on CPU3        12.13         12.05
#   busy-loop on CPU1+2+3    19.55         19.46
#   idle again                1.86          1.78
#
# core tracks package to within ~0.08 W at EVERY placement, including cores that
# a CPU0-only counter could not see. That is the positive control for the n5pro
# negative: same sysfs path, same domain name, different board, opposite answer.
#
# uncore is the iGPU. Its counter DOES advance — measured 2026-08-25, 122 uJ over
# 10 s and 488 uJ over 60 s (~10 uW), and a 24 h max of 0.000243 W in
# VictoriaMetrics — so it is live rather than frozen or unsupported. At the
# script's ~1 s sample window that is well under the counter's quantum, so most
# samples read exactly 0.000000: a real reading of a headless idle iGPU.
# NOT ESTABLISHED: whether it TRACKS a real render load. That needs the same
# load-placement discipline applied to /dev/dri (a VAAPI/render job on this box),
# which was not run — no GPU workload tool is installed and installing one is a
# host change. Do not upgrade this to "tracks iGPU power" without that test.
telegraf_agent_rapl_expected_domains: [package-0, core, uncore]
