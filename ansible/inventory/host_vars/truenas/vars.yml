---
# TrueNAS SCALE 26.0 (VM 200 on n5pro) — metrics export (#173).
#
# This host is reached over its JSON-RPC/WebSocket API from the CONTROL NODE,
# never over SSH: `ansible_connection: local` in hosts.yml means every task in
# the `nas` group runs locally and talks to 192.168.30.20 over the network. No
# SSH trust path into the appliance is opened, and `ansible_host` below is
# consumed only to build the API URL.
ansible_host: 192.168.30.20

truenas_api_url: "wss://{{ ansible_host }}/api/current"

# The appliance serves its own self-signed certificate. Same posture as the PVE
# nodes (community.proxmox `validate_certs: false` at every call site in
# roles/proxmox_guests) — and unlike those, this session carries an API key that
# is useless without the WebSocket already being established to the pinned LAN
# address inside the scoped allowlist.
truenas_validate_certs: false

# Roles granted to the `ansible-ctrl` privilege on the appliance, mirrored here
# so "what may Ansible do to the NAS" is reviewable in git rather than living
# only in the TrueNAS UI. ONE LINE PER REASON — this is a manifest, not a
# convenience list, and the temptation to collapse it into FULL_ADMIN is the
# thing it exists to resist.
#
# Verified live 2026-08-23: with REPORTING_WRITE alone, pool.query, user.query,
# privilege.query and system.reboot are ALL denied. Least privilege here is a
# measured fact, not a configuration intention.
truenas_granted_roles:
  # Required by reporting.exporters.create/update. Includes REPORTING_READ
  # (measured: reporting.exporters.query succeeds with WRITE alone), which is
  # also what makes disk.temperatures readable at no extra grant.
  - REPORTING_WRITE
  # #174's poller. pool.query is the ONLY source of pool health, capacity and
  # scrub state — TrueNAS 26.0's netdata exports no pool chart at all.
  - POOL_READ
  # #174's poller. disk.query supplies devname/serial/model and, critically,
  # ROTATION RATE — the only honest way to tell a real spinning disk from the
  # QEMU virtual boot disk, which reports type="HDD" with no SMART.
  - DISK_READ
  # #183 (re-scoped). alert.list is the ONLY lawful drive-health surface left
  # on 26.0: every SMART attribute/test method was removed from the middleware
  # in 25.10 (measured 2026-08-23: smart.test.results and disk.smart_attributes
  # both return "Method does not exist"; core.get_methods shows zero SMART
  # methods). The poller exports the middleware's own SMART alert conclusions
  # from alert.list — NOT raw attribute counters, which 26.0 cannot supply.
  - ALERT_LIST_READ
# Still NOT granted, and each absence is deliberate — verified 2026-08-23 that
# privilege.query, user.query and system.reboot are all denied to this account.

# === Graphite reporting exporter ===
#
# TrueNAS pushes netdata metrics to telegraf's socket_listener on eq12_docker.
# GRAPHITE is not a preference — it is the only exporter type the appliance
# supports (measured: reporting.exporters.exporter_schemas -> ['GRAPHITE'], and
# exporter_type is a schema `const`).
truenas_exporter_name: victoriametrics

# eq12_docker (CT 101) — the observability stack's telegraf. Pinned by IP rather
# than name: this value is also what the nftables allowlist on the receiving end
# is scoped to, and a name that resolves differently would silently be dropped
# there with no application-level error.
truenas_exporter_destination_ip: 192.168.25.15
truenas_exporter_destination_port: 2003

# Path shape is prefix.namespace.chart.dimension. Both are pinned rather than
# left to the appliance so the metric names do not change if the NAS is ever
# renamed — the dashboards and alert rules are keyed off these.
truenas_exporter_prefix: truenas
# The namespace segment becomes the `host` LABEL on every series (the graphite
# templates map it there). It is the appliance's identity in the TSDB, so it is
# spelled the way you would name the machine — not "nas". Without this, TrueNAS
# metrics inherit telegraf's own hostname and appear to originate from the
# collector, making them indistinguishable from eq12_docker's own series.
truenas_exporter_namespace: truenas

# 60s, NOT the schema default of 1. One sample per second per dimension into a
# 5-year-retention TSDB on an N100 would be an incident, not a tuning nit. This
# also matches telegraf's own agent interval, so nothing is resampled.
truenas_exporter_update_every: 60

# THE CARDINALITY GATE, and the cheaper of the two — it drops charts at the
# appliance, before anything crosses the LAN. The second gate is the namepass
# allowlist on telegraf's socket_listener.
#
# The schema default is "*" — the entire netdata firehose. The role REFUSES to
# converge that value; see the assert in tasks/main.yml.
#
# This pattern is deliberately wider than the final target: it is the CAPTURE
# value. The exporter's matching_charts matches raw netdata chart IDs, which are
# a lower-level namespace than the 40 middleware graph names enumerated via
# reporting.netdata_graphs, and the real IDs on 26.0 are only knowable by
# looking at the stream. Narrow this once the capture has been read — the
# telegraf allowlist is what bounds storage in the meantime.
# MEASURED chart IDs, read off the live stream on 2026-08-23 — this is no
# longer the capture pattern. Nine families, and each one is here because it
# actually appeared, not because a doc said it might.
#
# Deliberately ABSENT, both confirmed by their absence from the capture:
#   nfsd.*      TrueNAS 26.0 exports no NFS chart at all. ens19 throughput
#               (the host-only NFS bridge) is the proxy; see #175.
#   pool health TRUENAS_pool_usage carries used/total/available but no state
#               or scrub. Those come from pool.query in #174.
# PATTERNS ARE PREFIXES WITHOUT A TRAILING DOT, and that is load-bearing.
# `truenas_pool_usage.*` matched NOTHING: netdata requires the dot to be present
# in the chart ID, and that chart's ID has no sub-part (its graphite path is
# truenas.truenas.truenas_pool_usage.used — four segments, not five). Measured:
# with the dotted form, pool usage, net and system all silently stopped arriving
# while the dot-suffixed families kept working. A pattern that matches nothing
# fails SILENTLY — no error, no log, just a family missing from the TSDB — which
# is why the deploy stayed green through it.
# WHAT THIS PATTERN CAN AND CANNOT GET YOU — three controlled experiments,
# 2026-08-23, all with the same outcome:
#
#   1. `system.* net.* truenas_pool_usage.* ...`  (dotted, per-family)
#   2. `system* net* truenas*`                    (dotless prefixes)
#   3. this pattern, restored verbatim from the run that first captured them
#
# Under ALL THREE, only the truenas_* families plus truenas_disk_temp arrive.
# net, system and truenas_pool_usage do not. They appeared in the very first
# capture and have not reproduced since, across several netdata reloads — which
# matches TrueNAS having dropped most stock netdata collectors from 25.04
# onward. So their absence is the APPLIANCE's doing, not this pattern's, and
# widening it further will not bring them back.
#
# Consequence, and it is why #174 grew: pool capacity/health, system load and
# uptime, and network throughput must come from the JSON-RPC API, not this
# stream. Do not add panels or alert rules that depend on them arriving here.
#
# Kept deliberately wide rather than trimmed to the five families that do
# arrive: the cost is measured at 128 series (budget 250-400), and a pattern
# that already covers a family costs nothing if the appliance starts exporting
# it again after an upgrade. Trimming would convert a future restoration into a
# silent gap.
#
# EVERY pattern failure here is SILENT — no error, no log, just a family missing
# from the TSDB while the deploy stays green. The only way to know what a pattern
# yields is to query VictoriaMetrics per family after changing it.
truenas_exporter_matching_charts: >-
  system.* cpu.* disk.* disk_temp* net.* nvme* zfs* truenas*

# Schema defaults, declared explicitly so `attributes` is sent WHOLE on update
# (its schema forbids additional properties and marks four fields required, so a
# partial patch would drop them). Declaring every field also makes the module's
# diff total rather than partial.
truenas_exporter_buffer_on_failures: 10
truenas_exporter_send_names_instead_of_ids: true
