---
# music-workbench (CT 202 on n5pro, #254) — a workbench CT. The guest itself is
# declared in host_vars/n5pro/vars.yml (proxmox_lxcs); this file only says what
# to install inside it. A new workbench copies this file and swaps the lists.
#
# ADDITIONS to common_packages, never a replacement (see roles/common/defaults).
# Encoders and analysers come from Homebrew (below), not apt: the music-cleanup
# tool records the versions it encoded with and wants upstream-current ones
# (#258 — the 26.04 archive lagged ffmpeg by a major release).
common_extra_packages:
  - beets            # tagger/organiser with MusicBrainz lookup
  - python3-mutagen  # mid3v2 / mutagen-inspect
  - rsync
  - tmux

# roles/linuxbrew (#258). Formula names, not apt names: mediainfo is
# `media-info`, fpcalc ships in `chromaprint`.
linuxbrew_packages:
  - uv          # the music-cleanup tool is a uv project run as `uv run mcl`
  - flac
  - ffmpeg
  - sox
  - shntool
  - cuetools
  - media-info
  - chromaprint # fpcalc, AcoustID fingerprints
# One entry per binary the ledger records, asserted to resolve to the brew
# prefix from a non-login session (roles/linuxbrew). Keep in step with the
# list above — the role refuses packages without a verify list.
linuxbrew_verify_commands:
  - uv --version
  - flac --version
  - ffmpeg -version
  - sox --version
  - shntool -v
  - cuebreakpoints --version # prints 1.4.0 for formula 1.4.1 — upstream's string, not a wrong pin
  - mediainfo --Version      # line 1 is "MediaInfo Command line, "; the version is on line 2
  - fpcalc -version
# The apt packages the list above replaces — purged, so one ffmpeg on the box.
linuxbrew_replaces_apt_packages:
  - ffmpeg
  - flac
  - mediainfo
  - libchromaprint-tools
  # Not a brew replacement: the first #254 apply (2026-09-02) installed picard
  # before this list dropped it, and `common` never removes anything. Listed so
  # the purge is declared, not a side effect of libchromaprint-tools going.
  - picard

# Directories the workbench needs on the bound NFS share (#258). Siblings of
# lossless/compressed inside the ONE exported dataset — plain directories, not
# datasets, so a move between any two of them stays a rename (#256). Created
# from the CT: Mapall on the TrueNAS export stamps them 3000:3000 like their
# siblings, which read 777 (stat, 2026-09-05).
workbench_share_dirs:
  - path: /music/originals # archival single-file rips; LMS never reads it
    mode: "0777"

# Environment files for tools on the workbench (#260), written by the workbench
# play as root:root 0600 and meant to be SOURCED (`set -a; . <path>`), so every
# value is written single-quoted — the User-Agent below has spaces and
# parentheses, and a quoted value also survives a `$` (CLAUDE.md dotenv trap).
# Secrets come from vault.yml beside this file; the play asserts each value
# non-empty BY NAME and never diffs the content. Nothing reads these yet: the
# music-cleanup tool's identification phase will.
workbench_env_files:
  - path: /etc/mcl/env
    vars:
      ACOUSTID_API_KEY: "{{ vault_acoustid_api_key }}" # AcoustID application key (rate-limit identity)
      MCL_USER_AGENT: "mcl/0.1 (smoutovkin@eggsunlimited.com)" # MusicBrainz requires a contact in the UA
      # mcl-snap (#262): TrueNAS API URL and a key scoped to SNAPSHOT_* roles,
      # created by the operator in the TrueNAS UI (user/group/privilege
      # `mcl-snap`, key `mcl-snap-ct202`). The API-only NAS posture: no SSH.
      TRUENAS_API_URL: "wss://192.168.30.20/api/current"
      TRUENAS_MCL_SNAP_API_KEY: "{{ vault_truenas_mcl_snap_api_key }}"
      # Hook command strings the music-cleanup tool splits with shell rules and
      # appends ONE argument to (the snapshot id). They name the #262 wrappers;
      # changing a wrapper's CLI means changing these in the same PR.
      MCL_SNAPSHOT_CMD: "mcl-snap create"
      MCL_SNAPSHOT_LIST_CMD: "mcl-snap list"
      MCL_SNAPSHOT_RELEASE_CMD: "mcl-snap destroy"
      MCL_LMS_STOP_CMD: "mcl-lms stop"
      MCL_LMS_START_CMD: "mcl-lms start"
      MCL_LMS_STATUS_CMD: "mcl-lms status"
      MCL_LMS_CLI: "192.168.30.15:9090" # LMS CLI, network_mode: host on CT 201; rescan goes here directly
      MCL_ORIGINALS_ROOT: "/music/originals" # archival rips (workbench_share_dirs below); same dataset as lossless/compressed
      # Identification / LLM adjudication (#269). All four from vault.yml (the
      # operator provisioned URL and model there as well). The tool POSTs
      # {MCL_LLM_BASE_URL}/chat/completions, so any trailing slash is stripped.
      DISCOGS_TOKEN: "{{ vault_discogs_token }}"
      MCL_LLM_BASE_URL: "{{ vault_mcl_llm_openapi_url | regex_replace('/+$', '') }}"
      MCL_LLM_API_KEY: "{{ vault_mcl_llm_api_key }}"
      MCL_LLM_MODEL: "{{ vault_mcl_llm_model }}"
