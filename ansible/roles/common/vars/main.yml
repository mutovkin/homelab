---
# Packages the common role's own tasks depend on.
#
# These live in vars/ rather than defaults/ deliberately: role vars outrank
# inventory group_vars and host_vars, so no inventory file can drop them. That
# is the whole point — #77 was caused by group_vars/all silently overriding the
# role's defaults-level package list, leaving unattended-upgrades uninstalled
# while the role kept deploying its config. Operator extras belong in
# `common_packages` (defaults/main.yml), which stays overridable.
common_role_required_packages:
  # Required by ansible.posix.synchronize, used by all 11 service roles.
  - rsync
  # Provides /usr/bin/unattended-upgrade, the binary apt-daily-upgrade.timer runs.
  - unattended-upgrades
  # Renders the change summaries unattended-upgrades puts in its mail reports.
  # Currently inert: this role sets no Unattended-Upgrade::Mail, so nothing is
  # sent. Kept here so enabling mail is a one-line config change, not a
  # rediscovery that the package was missing.
  - apt-listchanges
  # Only a hard requirement for community.docker's `definition:` mode, which
  # this repo does not use (all 11 docker_compose_v2 calls pass `project_src:`).
  # Kept as insurance so switching to inline definitions cannot break a deploy.
  - python3-yaml
