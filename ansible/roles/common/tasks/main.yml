---
- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade all packages (dist-upgrade)
  ansible.builtin.apt:
    upgrade: dist
  when: apt_dist_upgrade | bool

- name: Install common packages
  ansible.builtin.apt:
    name: "{{ (common_role_required_packages + common_packages) | unique }}"
    state: present

# --- Role dependency guard ---
# These packages are load-bearing for this role and for every service deploy,
# and their absence used to be invisible: #77 shipped the unattended-upgrades
# config to all four hosts, with apt-daily-upgrade.timer enabled and active,
# while /usr/bin/unattended-upgrade did not exist — silent, fleet-wide, green.
#
# Inventory can no longer override the list away (see vars/main.yml), so this
# guard is belt-and-braces: it still catches a renamed package, a distro where
# the name differs, an apt that reported success without installing, and any
# future refactor that reintroduces an override path.

- name: Gather installed package facts
  ansible.builtin.package_facts:
    manager: apt
  check_mode: false

- name: Determine which role-required packages are missing
  ansible.builtin.set_fact:
    common_missing_required: "{{ common_role_required_packages | difference(ansible_facts.packages.keys() | list) }}"

- name: Assert role-required packages are installed
  ansible.builtin.assert:
    that:
      # Non-empty guard: `-e common_role_required_packages=[]` outranks even
      # role vars, and would make the emptiness check below vacuously true.
      - common_role_required_packages | length > 0
      - common_missing_required | length == 0
    fail_msg: >-
      Missing role-required package(s): {{ common_missing_required | join(', ') }}.
      The unattended-upgrades config and every synchronize-based service deploy
      are inert without them (#77).
  # Skipped under --check because the install above is a no-op there: a host that
  # legitimately does not have them yet should see them reported as pending, not
  # abort the dry-run. The check-mode task below reports instead of failing.
  when: not ansible_check_mode

- name: Report missing role-required packages (check mode)
  ansible.builtin.debug:
    msg: >-
      CHECK MODE — missing role-required package(s):
      {{ common_missing_required | join(', ') }}. A live run installs them; on an
      already-converged host a non-empty list here means #77 has regressed.
  when:
    - ansible_check_mode
    - common_missing_required | length > 0

# --- SSH authorized keys + hardening lockout guard ---
# Keys MUST land before hardening: the drop-in below disables password auth, so
# a run that writes it without any deployed key locks everyone out of a fresh
# host (#87). with_fileglob silently iterates zero times on an empty glob — a
# fresh clone with no keys committed, or a renamed key directory — so emptiness
# is asserted explicitly rather than inferred from a green play. The whole chain
# shares the ssh_hardening tag so `--tags ssh_hardening` cannot write the
# drop-in without having deployed keys first.

# Counting files is not the same as counting keys: authorized_key strips blank
# and #-comment lines before parsing, so an empty or comment-only .pub (a
# truncated copy, a `touch`ed placeholder) deploys ZERO keys and still reports
# ok — sailing straight through the file-count assert below. A genuinely
# malformed key fails loudly inside authorized_key itself; this catches only
# the silent case. Matched per line, not against the whole file, so a key file
# carrying a leading comment line still passes.
- name: Assert each SSH public key file contains a real key
  ansible.builtin.assert:
    that:
      - lookup('file', item) | regex_search('(?m)^(ssh-(ed25519|rsa|dss)|ecdsa-sha2-|sk-)') is not none
    fail_msg: >-
      {{ item }} does not contain a valid SSH public key. Empty or comment-only
      files deploy ZERO keys while authorized_key reports ok, which would let
      the hardening drop-in below lock this host out (#87).
  with_fileglob:
    - "{{ playbook_dir }}/../files/ssh_keys/*.pub"
  tags:
    - ssh_hardening

- name: Configure SSH authorized keys from key files
  ansible.posix.authorized_key:
    user: root
    key: "{{ lookup('file', item) }}"
    state: present
  register: common_ssh_keys_deployed
  with_fileglob:
    - "{{ playbook_dir }}/../files/ssh_keys/*.pub"
  tags:
    - ssh_hardening

# On an already-hardened host a failing assert does not UN-harden anything: the
# copy below simply never runs, the existing drop-in and the previously deployed
# keys both persist. The guard exists to prevent the FIRST write on a keyless
# host, which is the only path that actually locks anyone out.
# authorized_key supports check mode, so `results` is populated and this assert
# behaves identically under --check.
- name: Assert SSH keys were found and deployed before hardening
  ansible.builtin.assert:
    that:
      - common_ssh_pubkey_files | length > 0
      - common_ssh_keys_deployed.results | default([]) | length > 0
      # Unreachable today — a failed loop item aborts the key task itself and
      # the play never gets here; this clause only goes live if ignore_errors
      # is ever added to that task.
      - common_ssh_keys_deployed.results | selectattr('failed', 'defined')
        | selectattr('failed') | list | length == 0
    fail_msg: >-
      Refusing to write SSH hardening: no public keys were deployed.
      {{ common_ssh_pubkey_files | length }} key file(s) matched
      ansible/files/ssh_keys/*.pub. Hardening with zero keys would disable
      password auth and lock this host out (#87). Add at least one
      <user>@<host>.pub key file and re-run.
  vars:
    common_ssh_pubkey_files: >-
      {{ lookup('ansible.builtin.fileglob',
                playbook_dir + '/../files/ssh_keys/*.pub', wantlist=True) }}
  tags:
    - ssh_hardening

# --- SSH hardening: key-only authentication ---
# Public keys are provisioned above and the assert proves at least one landed,
# so disable password auth (stops the credential-stuffing seen against
# deb-docker) and allow root only via key.
# Drop-in is picked up via `Include /etc/ssh/sshd_config.d/*.conf`. The handler
# validates with `sshd -t` before reloading, so an invalid config can never be
# loaded (running sshd keeps its current config on a failed validate).
- name: Harden SSH — disable password auth, key-only root (drop-in)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    content: |
      # Managed by Ansible (common role). Key-only authentication.
      PasswordAuthentication no
      PermitRootLogin prohibit-password
      KbdInteractiveAuthentication no
    mode: "0644"
  notify: reload-sshd
  tags:
    - ssh_hardening

# --- Automatic security updates ---
# Three things must all hold, and each has failed silently before: the binary
# must exist, the config must match a real origin, and the timer must run.

- name: Stat the unattended-upgrade binary
  ansible.builtin.stat:
    path: /usr/bin/unattended-upgrade
  register: unattended_upgrade_bin
  check_mode: false

- name: Assert the unattended-upgrade binary is present
  ansible.builtin.assert:
    that: unattended_upgrade_bin.stat.exists
    fail_msg: >-
      /usr/bin/unattended-upgrade is missing — this is the binary
      apt-daily-upgrade.timer actually executes, and the config below is inert
      without it. Package state alone is not proof: a half-configured (iU/iF)
      package still registers as installed.
  when: not ansible_check_mode

- name: Enable unattended-upgrades periodic settings
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Download-Upgradeable-Packages "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
    mode: "0644"

# Origins-Pattern is matched against the archive's own Release metadata, so the
# codenames below are not cosmetic. Verified live against /var/lib/apt/lists:
#
#   eq12, n5pro   (trixie)   Origin=Debian Label=Debian-Security Codename=trixie-security
#   eq12_docker   (bookworm) Origin=Debian Label=Debian-Security Codename=bookworm-security
#   n5pro_docker  (noble)    Origin=Ubuntu Label=Ubuntu          Codename=noble
#
# Debian's security archive has published Codename=<release>-security since
# bullseye, so a bare ${distro_codename} matches nothing there — which is why
# the -security form is listed first. The bare form is kept for pre-bullseye
# releases, and Debian's own shipped config carries both spellings for the same
# reason. Ubuntu keeps the bare codename and labels its security pocket "Ubuntu",
# which is what the noble host matches on.
- name: Configure unattended-upgrades policy (security + stable updates, no auto-reboot)
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    content: |
      // Managed by Ansible — security + stable automatic upgrades
      Unattended-Upgrade::Origins-Pattern {
          "origin=Debian,codename=${distro_codename}-security,label=Debian-Security";
          "origin=Debian,codename=${distro_codename},label=Debian-Security";
          "origin=Ubuntu,codename=${distro_codename},label=Ubuntu";
          "origin=Ubuntu,codename=${distro_codename}-security,label=Ubuntu";
      };
      Unattended-Upgrade::Package-Blacklist {};
      Unattended-Upgrade::AutoFixInterruptedDpkg "true";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      Unattended-Upgrade::Remove-New-Unused-Dependencies "true";
      Unattended-Upgrade::Automatic-Reboot "false";
    mode: "0644"

# The config above is only ever acted on by this timer; #77 had it enabled and
# active while the binary was absent, so the role now owns both halves rather
# than trusting the distro preset.
- name: Ensure the apt daily timers are enabled and running
  ansible.builtin.systemd_service:
    name: "{{ apt_timer }}"
    enabled: true
    state: started
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer
  loop_control:
    loop_var: apt_timer

# Deliberate maintenance-window mass upgrade only (#97). Unconditional until
# #97, this applied ALL pending upgrades on every run of the role — a pending
# docker-ce upgrade would restart dockerd and bounce every container as a side
# effect of an unrelated deploy. Security patching is unattended-upgrades'
# job (#77, above); run this by choice: -e apt_apply_pending_upgrades=true
- name: Apply pending package upgrades (deliberate maintenance only)
  ansible.builtin.apt:
    upgrade: safe
    update_cache: true
  when: apt_apply_pending_upgrades | bool
