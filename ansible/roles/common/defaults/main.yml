---
# defaults for common role
timezone: UTC
apt_dist_upgrade: false

# Operator extras — safe to override or extend from inventory. Note that
# overriding this REPLACES the list; the role's own dependencies are held
# separately in vars/main.yml so they survive any override.
common_packages:
  - curl
  - wget
  - htop
  - vim
  - jq
  - unzip
  - gnupg
  - ca-certificates
