---
# defaults for common role
timezone: UTC
apt_dist_upgrade: false

# Operator extras. Overriding this from inventory REPLACES the whole list —
# Ansible does not merge — so add packages here rather than in group_vars. The
# role's own dependencies are held separately in vars/main.yml, out of reach of
# any inventory override.
common_packages:
  - curl
  - wget
  - htop
  - vim
  - jq
  - unzip
  - gnupg
  - ca-certificates
