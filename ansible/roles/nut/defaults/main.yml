---
# defaults for nut role
# Set nut_role: "server" or "client" in host_vars to enable

nut_role: ""

nut_mode: "{% if nut_role == 'server' %}netserver{% elif nut_role == 'client' %}netclient{% else %}none{% endif %}"

# Server defaults (override in host_vars when nut_role == 'server')
nut_server:
  # Bind upsd to specific addresses, not 0.0.0.0. Default to loopback only;
  # add the host's LAN IP in host_vars so remote clients can connect. Keep
  # 127.0.0.1 so the server's own upsmon (MONITOR ...@localhost) still works.
  listen_addresses:
    - "127.0.0.1"
  listen_port: 3493
  ups_name: "ups"
  shutdowncmd: "/sbin/shutdown -h +0"
  powerdownflag: "/etc/killpower"
  ups:
    driver: "usbhid-ups"
    port: "auto"
    desc: "UPS"
    vendorid: ""
    productid: ""
    ignorelb: false
    override_battery_charge_low: ""

# Firewall: restrict the upsd port to specific client source CIDRs (defense in
# depth on top of binding to specific addresses). Empty list = no firewall rule
# managed (the role skips it). Loopback is always allowed implicitly. Set in
# host_vars, e.g. nut_allowed_clients: ["192.168.25.5/32"] — entries must be
# IPv4 CIDRs of prefix /1../32 (asserted by the shared nft_scoped_fw role).
#
# DELIBERATELY A FLAT LIST, and the one nft_scoped_fw consumer that is not
# `<svc>_firewall.ports` (#150). The other four declare a port -> sources map
# because they govern several ports; NUT governs exactly one, and that port is
# already declared as nut_server.listen_port, which is what upsd actually binds.
# Writing it a second time as a `ports:` key would create a second source of
# truth that can silently drift from the port the daemon is listening on — the
# role composes the map at the include_role boundary instead
# (tasks/server.yml). Converged shape rejected for that reason, not overlooked.
nut_allowed_clients: []

# Client defaults (override in host_vars when nut_role == 'client')
nut_client:
  monitor_ups_name: "ups"
  monitor_host: ""
  shutdowncmd: "/sbin/shutdown -h +0"
  powerdownflag: "/etc/killpower"

# Usernames for upsd.users (passwords come from vault)
nut_users:
  master:
    username: "upsmon_master"
  slave:
    username: "upsmon_slave"
