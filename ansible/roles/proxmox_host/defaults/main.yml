---
# defaults for proxmox_host role
proxmox_enterprise_repo: false
proxmox_zfs_scrub_schedule: monthly
gpu_sharing:
  enabled: false
# Extra kernel cmdline parameters appended to /etc/kernel/cmdline (UEFI+ZFS via
# proxmox-boot-tool). Per-host opt-in (e.g. n5pro sets pcie_ports=native to force
# native PCIe AER on a passthrough host). Empty = leave the cmdline untouched.
kernel_cmdline_extra: []

# Super-I/O / hwmon kernel modules to bind at boot, per-host opt-in. Each entry:
#   name:    module name (e.g. it87)
#   options: modprobe options string, or "" for none
#   expect:  hwmon chip name that MUST appear in `sensors` once bound — the guard.
#            Without it, a module that loads but binds NOTHING reports success.
# Empty = touch no modules. See docs/eq12.md for why eq12 needs force_id.
proxmox_host_hwmon_modules: []

# NFS datasets this Proxmox HOST mounts so they can be bind-mounted into
# unprivileged CTs (#254). Each entry:
#   name:    short label (unit Description only)
#   server:  NFS server address
#   export:  exported path on the server
#   path:    mountpoint on this host — MUST sit under /mnt/nfs/, the prefix the
#            pre-start hookscript gates on
#   options: mount options. `retry=0` so a down server fails one attempt fast and
#            the hookscript's own 5-second loop does the retrying; `hard` because
#            the consumers WRITE (a soft mount silently corrupts on timeout).
# The rendered .mount units are deliberately NEVER enabled: on n5pro the NFS
# server is VM 200 on this same host, so nothing is there to mount at boot. The
# hookscript deployed alongside (files/nfs-bind-prestart.sh) starts them on
# demand, right before a bind-mounting CT starts, and refuses the start if the
# mount is not live — the fail-safe direction, since a bind mount taken from an
# empty directory stays empty for the CT's whole life.
# Empty = touch nothing (eq12).
proxmox_nfs_mounts: []
