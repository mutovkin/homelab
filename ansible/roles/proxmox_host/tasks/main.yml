---
- name: Disable Proxmox enterprise repository
  ansible.builtin.apt_repository:
    repo: "deb https://enterprise.proxmox.com/debian/pve {{ ansible_facts['distribution_release'] }} pve-enterprise"
    state: absent
    filename: pve-enterprise
  when: not proxmox_enterprise_repo

- name: Enable Proxmox no-subscription repository
  ansible.builtin.apt_repository:
    repo: "deb http://download.proxmox.com/debian/pve {{ ansible_facts['distribution_release'] }} pve-no-subscription"
    state: present
    filename: pve-no-subscription
  when: not proxmox_enterprise_repo

# --- Subscription nag removal ---

- name: Deploy Proxmox nag removal script
  ansible.builtin.copy:
    src: remove-proxmox-nag.sh
    dest: /usr/local/bin/remove-proxmox-nag.sh
    mode: "0755"
  when: not proxmox_enterprise_repo
  notify: remove-proxmox-nag

- name: Deploy apt hook to re-apply nag removal after package updates
  ansible.builtin.copy:
    content: |
      DPkg::Post-Invoke {
          "if [ -x /usr/local/bin/remove-proxmox-nag.sh ]; then /usr/local/bin/remove-proxmox-nag.sh; fi";
      };
    dest: /etc/apt/apt.conf.d/80-remove-proxmox-nag
    mode: "0644"
  when: not proxmox_enterprise_repo

# --- AppArmor: stop the dhclient AF_UNIX denial flood (PVE 9 / apparmor 4.1) ---
# dhclient's syslog/NSS unix dgram socket is denied ("failed protocol match"),
# flooding the console on any host whose interface uses DHCP (n5pro vmbr0).
# Inert on static-IP hosts (eq12), which run no dhclient. Fix detail below.
- name: Check for the shipped dhclient AppArmor profile
  ansible.builtin.stat:
    path: /etc/apparmor.d/usr.sbin.dhclient
  register: dhclient_apparmor_profile
  check_mode: false

# Two-part fix (PVE 9 ships AppArmor 4.1, upstream apparmor#561):
#   1. The 4.1 default ABI enforces fine-grained AF_UNIX mediation that the
#      dhclient profile predates, so af_unix sockets are denied regardless of
#      any rule. Pin the profile to the 3.0 ABI (coarse network-class AF_UNIX
#      mediation) via an `abi` declaration in the profile PREAMBLE — it has no
#      effect inside the profile block / a local include, only at file top, so
#      we insert at BOF (independent of any anchor line) and assert placement.
#   2. Under the 3.0 ABI, grant the unix dgram socket via a `network unix`
#      rule (the profile's existing idiom) in the local override.
# Both are gated on the base profile existing; a host without it skips cleanly.
# NOTE: task 1 edits a dpkg-owned file — an apparmor-profiles upgrade can revert
# it (the local override survives); re-running this role restores the pin.
# Runbook: docs/solutions/integration-issues/proxmox-dhclient-apparmor-af-unix-denial.md
- name: Pin dhclient AppArmor profile to the 3.0 ABI (preamble)
  ansible.builtin.lineinfile:
    path: /etc/apparmor.d/usr.sbin.dhclient
    insertbefore: BOF
    line: "abi <abi/3.0>,"
  when: dhclient_apparmor_profile.stat.exists
  notify: reload-apparmor-dhclient

- name: Allow dhclient unix dgram socket (AppArmor local override)
  ansible.builtin.copy:
    content: |
      # Managed by Ansible (proxmox_host role).
      # Grant the unix dgram socket dhclient uses for syslog/NSS. Effective only
      # with the `abi <abi/3.0>,` preamble pin (see the lineinfile task above);
      # without it AppArmor 4.1 denies af_unix regardless. apparmor#561. Runbook:
      # docs/solutions/integration-issues/proxmox-dhclient-apparmor-af-unix-denial.md
      network unix dgram,
    dest: /etc/apparmor.d/local/usr.sbin.dhclient
    mode: "0644"
  when: dhclient_apparmor_profile.stat.exists
  notify: reload-apparmor-dhclient

# Guard against a silently-ineffective fix: the abi pin only works in the
# preamble, so confirm it landed before the profile block.
- name: Read back the dhclient profile to verify the abi pin placement
  ansible.builtin.slurp:
    src: /etc/apparmor.d/usr.sbin.dhclient
  register: dhclient_profile_content
  when: dhclient_apparmor_profile.stat.exists
  check_mode: false

- name: Assert the abi pin precedes the profile block (else the fix is inert)
  ansible.builtin.assert:
    that:
      - "profile_text.find('abi <abi/3.0>,') != -1"
      - "profile_text.find('abi <abi/3.0>,') < profile_text.find('/{,usr/}sbin/dhclient ')"
    fail_msg: >-
      'abi <abi/3.0>,' is missing or not in the preamble of
      /etc/apparmor.d/usr.sbin.dhclient — the AppArmor af_unix fix would be inert.
    success_msg: "abi pin correctly placed in the dhclient profile preamble."
  vars:
    profile_text: "{{ dhclient_profile_content.content | b64decode }}"
  when: dhclient_apparmor_profile.stat.exists

# --- Kernel cmdline (UEFI + ZFS root via proxmox-boot-tool) ---
# Append per-host extra params (kernel_cmdline_extra) to /etc/kernel/cmdline and
# refresh the boot entries. Idempotent: only rewrites when a param is missing.
# Takes effect on the next reboot. No-op where kernel_cmdline_extra is empty.
- name: Read current kernel cmdline
  ansible.builtin.slurp:
    src: /etc/kernel/cmdline
  register: proxmox_kernel_cmdline
  when: kernel_cmdline_extra | length > 0
  check_mode: false
  tags:
    - kernel_cmdline

- name: Ensure extra kernel cmdline parameters are present
  ansible.builtin.copy:
    dest: /etc/kernel/cmdline
    content: "{{ ((proxmox_kernel_cmdline.content | b64decode | trim).split() + kernel_cmdline_extra) | unique | join(' ') }}\n"
    mode: "0644"
  when:
    - kernel_cmdline_extra | length > 0
    - kernel_cmdline_extra | difference((proxmox_kernel_cmdline.content | b64decode).split()) | length > 0
  notify: refresh-boot
  tags:
    - kernel_cmdline

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install Proxmox utilities
  ansible.builtin.apt:
    name:
      - lm-sensors
      - ethtool
      - iotop
    state: present

# --- ZFS ---

- name: Configure ZFS scrub schedule
  ansible.builtin.cron:
    name: "ZFS scrub {{ zfs_pool | default('rpool') }}"
    job: "/sbin/zpool scrub {{ zfs_pool | default('rpool') }}"
    special_time: "{{ proxmox_zfs_scrub_schedule }}"
    user: root
    state: present
  when: zfs_pool is defined

# --- GPU sharing (LXC device passthrough) ---
# Modern approach: kernel 6.17+ has inbox amdgpu driver.
# Host only needs firmware blobs + udev rules. ROCm userspace is installed
# inside the LXC by the docker_host role (configure-guests.yml).

- name: Ensure Proxmox firmware is installed (contains AMD GPU firmware)
  ansible.builtin.apt:
    name: pve-firmware
    state: present
  when: gpu_sharing.enabled | default(false)

- name: Deploy GPU udev rules
  ansible.builtin.copy:
    content: |
      # Managed by Ansible — GPU device permissions for LXC passthrough
      SUBSYSTEM=="drm", KERNEL=="renderD*", GROUP="render", MODE="0660"
      KERNEL=="kfd", GROUP="render", MODE="0660"
    dest: /etc/udev/rules.d/70-amdgpu.rules
    mode: "0644"
  when: gpu_sharing.enabled | default(false)
  notify: reload-udev

- name: Ensure root is in render and video groups
  ansible.builtin.user:
    name: root
    groups:
      - render
      - video
    append: true
  when: gpu_sharing.enabled | default(false)

# --- Host-only bridge for NFS traffic ---

- name: Get host-only bridge configuration
  ansible.builtin.command: "pvesh get /nodes/{{ proxmox_node }}/network/{{ hostonly_bridge }} --output-format json"
  register: hostonly_bridge_json
  failed_when: false
  changed_when: false
  # Read-only probe: must run under --check too, or the facts below are derived
  # from an empty stdout and every downstream task reports phantom drift (#125).
  check_mode: false
  when: hostonly_bridge is defined

- name: Set fact for bridge existence and current IP
  vars:
    # pvesh may report the address under 'address' or 'cidr' (e.g. "10.99.99.1/24")
    # depending on the PVE version. Normalize by taking whichever is present and
    # stripping any CIDR suffix so it compares cleanly against the plain
    # hostonly_host_ip (e.g. "10.99.99.1"). Without this the comparison never
    # matches and the network is reconfigured on every run.
    # `default('{}', true)` also substitutes when stdout is an empty string —
    # the probe above runs with failed_when: false, so a missing bridge (rc != 0)
    # leaves stdout '' rather than undefined, which would otherwise make
    # from_json fail. (It no longer guards --check: the probe is check_mode:
    # false since #125 and always runs.)
    _bridge_cfg: "{{ hostonly_bridge_json.stdout | default('{}', true) | from_json }}"
    _bridge_addr: "{{ _bridge_cfg.address | default(_bridge_cfg.cidr | default('')) }}"
  ansible.builtin.set_fact:
    hostonly_bridge_exists: "{{ hostonly_bridge_json.rc == 0 }}"
    hostonly_bridge_current_ip: "{{ _bridge_addr | regex_replace('/.*$', '') }}"
  when: hostonly_bridge is defined

# Says out loud what the apply tasks below would do, so a --check run reports a
# verdict instead of leaving the reader to infer it from skipped tasks (#125).
- name: Report host-only bridge drift verdict
  ansible.builtin.debug:
    msg: >-
      {{ hostonly_bridge }}:
      {{ 'MISSING — a live run would create it and reload networking'
         if not hostonly_bridge_exists
         else ('IP drift ' ~ hostonly_bridge_current_ip ~ ' -> ' ~ hostonly_host_ip ~
               ' — a live run would reassign and reload networking'
               if hostonly_bridge_current_ip != hostonly_host_ip
               else 'present and converged (' ~ hostonly_bridge_current_ip ~ ')') }}
  when: hostonly_bridge is defined

- name: Backup /etc/network/interfaces before making changes
  ansible.builtin.copy:
    src: /etc/network/interfaces
    dest: "/etc/network/interfaces.ansible_bak_{{ ansible_date_time.iso8601_basic_short }}"
    remote_src: true
    mode: "0644"
  when:
    - hostonly_bridge is defined
    - not hostonly_bridge_exists or hostonly_bridge_current_ip != hostonly_host_ip

- name: Create host-only bridge
  ansible.builtin.command: >-
    pvesh create /nodes/{{ proxmox_node }}/network
    -type bridge
    -iface {{ hostonly_bridge }}
    -autostart 1
  changed_when: true
  when:
    - hostonly_bridge is defined
    - not hostonly_bridge_exists

- name: Assign host IP on host-only bridge
  ansible.builtin.command: >-
    pvesh set /nodes/{{ proxmox_node }}/network/{{ hostonly_bridge }}
    -type bridge
    -address {{ hostonly_host_ip }}
    -netmask {{ hostonly_host_netmask }}
  register: hostonly_bridge_ip
  changed_when: true
  when:
    - hostonly_bridge is defined
    - hostonly_bridge_current_ip != hostonly_host_ip

# Applying (reloading) the staged network config. vmbr2 has no physical NIC,
# so reloading it cannot drop the management connection — run synchronously so
# a failed apply surfaces instead of being lost to fire-and-forget.
- name: Apply network configuration
  ansible.builtin.command: "pvesh set /nodes/{{ proxmox_node }}/network"
  register: hostonly_bridge_apply
  changed_when: true
  when:
    - hostonly_bridge is defined
    - not hostonly_bridge_exists or (hostonly_bridge_ip.changed | default(false))

# --- Super-I/O hwmon modules (#fan) ------------------------------------------
# Some boards expose fan tachometers only through a Super-I/O chip the stock
# driver does not list. Binding it needs force_id, which is a per-host hardware
# fact, so the whole block is opt-in via host_vars and no-ops elsewhere.
- name: Configure Super-I/O hwmon module options
  ansible.builtin.copy:
    dest: "/etc/modprobe.d/{{ item.name }}.conf"
    content: |
      # Managed by Ansible (proxmox_host). Manual edits will be overwritten.
      options {{ item.name }} {{ item.options }}
    owner: root
    group: root
    mode: "0644"
  loop: "{{ proxmox_host_hwmon_modules }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.options | length > 0
  tags: [hwmon]

- name: Ensure Super-I/O hwmon modules load at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/proxmox-host-hwmon.conf
    content: |
      # Managed by Ansible (proxmox_host). Manual edits will be overwritten.
      {% for m in proxmox_host_hwmon_modules %}
      {{ m.name }}
      {% endfor %}
    owner: root
    group: root
    mode: "0644"
  when: proxmox_host_hwmon_modules | length > 0
  tags: [hwmon]

# Plain command rather than community.general.modprobe: that module does not
# resolve under this repo's ansible-lint collection path, and the load needs no
# module-level cleverness — `lsmod` gates it and the assert below proves the
# outcome, which is a stronger check than the module's own idempotency anyway.
- name: Check which Super-I/O hwmon modules are already loaded
  ansible.builtin.command: "cat /proc/modules"
  register: proxmox_host_loaded_modules
  changed_when: false
  check_mode: false # read-only; without this the gate below is blind in --check
  when: proxmox_host_hwmon_modules | length > 0
  tags: [hwmon]

- name: Load Super-I/O hwmon modules now
  ansible.builtin.command: "modprobe {{ item.name }}"
  loop: "{{ proxmox_host_hwmon_modules }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - proxmox_host_hwmon_modules | length > 0
    - "'\n' ~ item.name ~ ' ' not in '\n' ~ proxmox_host_loaded_modules.stdout"
  changed_when: true
  tags: [hwmon]

# The guard. `modprobe it87` succeeds even when force_id is wrong and the module
# binds nothing at all — the chip simply never appears in hwmon. Asserting on the
# CHIP NAME in sensors' own output is the only check that can distinguish "bound"
# from "loaded but inert", and it is what makes the fan panel's data trustworthy.
# Deliberately NOT failed_when:false — that would ASSIGN failed:False and turn
# the assert below into `assert: true` (CLAUDE.md: a guard you have not seen fail).
- name: Read hwmon chips visible to lm-sensors
  ansible.builtin.command: sensors -A
  register: proxmox_host_sensors_out
  changed_when: false
  check_mode: false # read-only. A `command` is SKIPPED under --check, leaving
  # the register empty, and `chip in <undefined>` is falsy rather than an error
  # — so without this line the assert below fails on ABSENT DATA in every
  # dry-run and reports it as an unbound chip. Measured 2026-08-25.
  when: proxmox_host_hwmon_modules | length > 0
  tags: [hwmon]

- name: Assert each Super-I/O module actually bound its chip
  ansible.builtin.assert:
    that: item.expect in proxmox_host_sensors_out.stdout
    fail_msg: >-
      Module {{ item.name }} loaded but chip '{{ item.expect }}' is absent from
      `sensors -A`. The module is inert: check the force_id against the chip the
      board really has (dmesg | grep {{ item.name }}), and do NOT trust any fan
      or temperature panel that reads from it.
    success_msg: "{{ item.name }} bound {{ item.expect }}"
  loop: "{{ proxmox_host_hwmon_modules }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - proxmox_host_hwmon_modules | length > 0
    # In --check the load above is skipped, so a not-yet-loaded module would
    # assert against a chip that check mode was never going to produce. Assert
    # in check mode ONLY where the module is already loaded and the reading is
    # therefore real; a live run always asserts.
    - not ansible_check_mode or ('\n' ~ item.name ~ ' ') in ('\n' ~ proxmox_host_loaded_modules.stdout)
  tags: [hwmon]

# --- Host-mounted NFS for unprivileged-CT bind mounts (#254) ------------------
- name: Mount NFS datasets for bind-mounting into CTs
  ansible.builtin.include_tasks: nfs-mounts.yml
  when: proxmox_nfs_mounts | length > 0
  tags: [nfs_mounts]
