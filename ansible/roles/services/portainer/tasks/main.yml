---
# --- Firewall: restrict the Portainer UI port to approved sources (#80) ---
# Fail-open nftables table (see docs/solutions/conventions/scoped-nftables-on-live-host.md);
# hooks prerouting, not input: the IPv4 path to a docker-published port is DNAT'd
# and forwarded (invisible to input), and prerouting before DNAT also covers the
# docker-proxy [::] input path.
- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure nftables include dir exists
  ansible.builtin.file:
    path: /etc/nftables.d
    state: directory
    mode: "0755"

- name: Deploy Portainer firewall ruleset
  ansible.builtin.template:
    src: portainer-firewall.nft.j2
    dest: /etc/nftables.d/portainer-firewall.nft
    mode: "0644"
    validate: "/usr/sbin/nft -c -f %s"
  notify: reload-portainer-firewall

- name: Deploy Portainer firewall systemd unit
  ansible.builtin.template:
    src: portainer-firewall.service.j2
    dest: /etc/systemd/system/portainer-firewall.service
    mode: "0644"
  notify: reload-portainer-firewall

- name: Enable and start Portainer firewall
  ansible.builtin.systemd:
    name: portainer-firewall.service
    enabled: true
    state: started
    daemon_reload: true
  # In --check the unit file isn't actually written, so enable/start can't
  # find it. Skip this one task in check mode; a real run writes it first.
  when: not ansible_check_mode

- name: Flush handlers so firewall changes are live before the compose deploy
  ansible.builtin.meta: flush_handlers

# A RemainAfterExit oneshot stays "active" even if the table was externally
# flushed, so state: started can never heal it. Detect drift and notify.
- name: Check Portainer firewall table is live
  ansible.builtin.command: /usr/sbin/nft list table inet portainer_fw
  register: portainer_fw_check
  changed_when: portainer_fw_check.rc != 0
  failed_when: false
  notify: reload-portainer-firewall
  when: not ansible_check_mode

- name: Heal a missing firewall table immediately
  ansible.builtin.meta: flush_handlers

- name: Assert Portainer firewall table is live
  ansible.builtin.command: /usr/sbin/nft list table inet portainer_fw
  changed_when: false
  when: not ansible_check_mode

- name: Deploy Portainer via the shared service pipeline
  ansible.builtin.include_role:
    name: services/_deploy
  vars:
    svc: portainer
    svc_data_dirs:
      - "{{ data_mount }}/portainer"
