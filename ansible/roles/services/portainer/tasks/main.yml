---
# --- Firewall: restrict the Portainer UI port to approved sources (#80) ---
# Shared fail-open nftables table (roles/nft_scoped_fw, #114 — see
# docs/solutions/conventions/scoped-nftables-on-live-host.md); hooks prerouting,
# not input: the IPv4 path to a docker-published port is DNAT'd and forwarded
# (invisible to input), and prerouting before DNAT also covers the docker-proxy
# [::] input path. Included BEFORE the compose deploy below so the rules are live
# before the port is (re)published — the shared role reloads inline, so no
# flush_handlers dance is needed.
- name: Restrict the Portainer UI port to approved sources
  ansible.builtin.include_role:
    name: nft_scoped_fw
  vars:
    nft_fw_name: portainer
    nft_fw_description: Portainer UI firewall (Ansible-managed nftables table inet portainer_fw)
    nft_fw_ports: "{{ portainer_firewall.ports }}"

- name: Deploy Portainer via the shared service pipeline
  ansible.builtin.include_role:
    name: services/_deploy
  vars:
    svc: portainer
    svc_data_dirs:
      - "{{ data_mount }}/portainer"
