services:
  frigate:
    container_name: frigate
    image: ghcr.io/blakeblackshear/frigate:stable
    restart: unless-stopped
    security_opt:
      - "apparmor:unconfined"
      - "no-new-privileges:true"
    labels:
      # Stateful and schema-migrating: the recordings/events SQLite DB migrates forward
      # on start, and releases regularly change config.yml schema (a rejected config
      # leaves the NVR down). "enable" keeps it in scan scope so new versions are
      # reported; "monitor-only" stops Watchtower applying them. Update deliberately
      # via `task deploy:service -- --tags frigate` (#83).
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.monitor-only=true"
    ports:
      - "5000:5000"   # Web UI
      - "8554:8554"   # RTSP feeds
      - "8555:8555"   # WebRTC
      - "8555:8555/udp"
    environment:
      FRIGATE_RTSP_PASSWORD: ${FRIGATE_RTSP_PASSWORD}
      TZ: ${TIMEZONE:-America/Los_Angeles}
    volumes:
      # config.yml here is Ansible-owned (roles/services/frigate/templates/config.yml.j2)
      # and rewritten on every deploy — do not edit it on the host or via Frigate's
      # config editor (#91).
      - ${FRIGATE_CONFIG_DIR}:/config
      # Local disk on the docker host — FRIGATE_RECORDINGS_DIR resolves to
      # <data_mount>/frigate/recordings in templates/env.j2. NOT an NFS mount: the
      # old comment here claimed TrueNAS and never matched the template (#91).
      # Moving recordings to TrueNAS would be a change to env.j2 plus a real mount.
      - ${FRIGATE_RECORDINGS_DIR}:/media/frigate
      - type: tmpfs    # Reduce SSD writes for cache
        target: /tmp/cache
        tmpfs:
          size: 1073741824  # 1GB
    devices:
      - /dev/dri:/dev/dri  # VAAPI hardware decoding (AMD 890M)
    shm_size: "256mb"
    networks:
      - frigate_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  frigate_network:
    name: frigate_network
    ipam:
      config:
        - subnet: ${FRIGATE_NETWORK_SUBNET:-172.28.0.0/24}
