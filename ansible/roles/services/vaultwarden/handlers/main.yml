---
- name: Reload Vaultwarden firewall
  ansible.builtin.systemd:
    name: vaultwarden-firewall.service
    state: restarted
    daemon_reload: true
  # In --check the unit file may not have been written yet, so a restart can't find it.
  when: not ansible_check_mode
  listen: reload-vaultwarden-firewall
