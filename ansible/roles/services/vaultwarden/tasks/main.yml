---
# --- Firewall: restrict the Vaultwarden HTTP port to approved sources (#81) ---
# Shared fail-open nftables table (roles/nft_scoped_fw, #114 — see
# docs/solutions/conventions/scoped-nftables-on-live-host.md); hooks prerouting,
# not input: the IPv4 path to a docker-published port is DNAT'd and forwarded
# (invisible to input), and prerouting before DNAT also covers the docker-proxy
# [::] input path. Included BEFORE the compose deploy below so the rules are live
# before the port is (re)published — the shared role reloads inline, so no
# flush_handlers dance is needed.
- name: Restrict the Vaultwarden HTTP port to approved sources
  ansible.builtin.include_role:
    name: nft_scoped_fw
  vars:
    nft_fw_name: vaultwarden
    nft_fw_description: Vaultwarden HTTP firewall (Ansible-managed nftables table inet vaultwarden_fw)
    nft_fw_ports: "{{ vaultwarden_fw_ports }}"

# --- Admin token shape --------------------------------------------------------
# Vaultwarden accepts a non-PHC ADMIN_TOKEN as a LITERAL plaintext token — it does not
# reject it, warn, or fail a healthcheck. So a mangled, truncated, or hand-edited hash
# does not break the deploy; it silently restores exactly the plaintext-credential
# exposure #81 removed, with every run green. Check the shape before we get anywhere
# near the vault data. Pure variable check, so it runs in check mode too.
- name: Assert the Vaultwarden admin token is an Argon2id PHC hash
  ansible.builtin.assert:
    that:
      - vault_vaultwarden_admin_token_hash is match('^\$argon2id\$')
      # \Z, not $: Python's $ also matches immediately BEFORE a trailing newline, so a
      # hash var carrying one (a stray editor newline in the vault) would pass here.
      # \Z anchors at the true end of string, so that value fails loudly right now
      # instead of reaching vaultwarden and aborting its startup with a PHC parse error.
      - vault_vaultwarden_admin_token_hash is match('^[A-Za-z0-9+/$,=.]+\Z')
    fail_msg: >-
      vault_vaultwarden_admin_token_hash is not an Argon2id PHC string, so Vaultwarden
      would treat it as a PLAINTEXT admin token and undo #81. Regenerate it with
      `docker run --rm -it vaultwarden/server:latest /vaultwarden hash` and store the
      $argon2id$... value itself (not the ADMIN_TOKEN='...' wrapper the helper prints).
    quiet: true

# --- Pre-upgrade backup -------------------------------------------------------
# The stack deploys with pull: always, so any deploy can upgrade the vault. Take a
# consistent snapshot first — but only when the vault data would actually be handed to
# a different image, otherwise a routine no-op deploy would stop a healthy container
# for nothing.

- name: Inspect the running Vaultwarden container
  community.docker.docker_container_info:
    name: vaultwarden
  register: vaultwarden_container
  check_mode: false

# The vault data can exist without the container (manual docker rm, watchtower-recreate
# incidents) — in that state the next deploy would start a NEW image on the OLD SQLite
# data with no backup. Gate the backup on the DATA, not the container (#107).
#
# Two tasks rather than one, because `find` collapses "directory absent" and
# "directory present but unreadable" into the same matched=0 answer. The stat
# distinguishes them, so the assert below can treat the second case as an error
# instead of as "no data".
- name: Stat the Vaultwarden data directory
  ansible.builtin.stat:
    path: "{{ data_mount }}/vaultwarden"
  register: vaultwarden_data_dir
  check_mode: false

# hidden: true because find skips dotfiles by default — without it this asks
# "non-empty ignoring dotfiles", and a vault directory is not safe to treat as empty
# just because everything in it happens to be hidden.
- name: Check whether Vaultwarden data exists
  ansible.builtin.find:
    paths: "{{ data_mount }}/vaultwarden"
    file_type: any
    hidden: true
    recurse: false
  register: vaultwarden_data_files
  check_mode: false
  when: vaultwarden_data_dir.stat.exists | default(false)

- name: Determine whether Vaultwarden data is present
  ansible.builtin.set_fact:
    vaultwarden_data_present: >-
      {{ (vaultwarden_data_dir.stat.exists | default(false))
         and (vaultwarden_data_files.matched | default(0) | int) > 0 }}

- name: Assert the Vaultwarden data probe is trustworthy
  ansible.builtin.assert:
    that:
      # An existing directory that find could not read (permissions, a dataset that
      # has not been mounted yet) reports matched=0 — byte-identical to "no data",
      # and "no data" means no backup. Refuse to guess.
      - >-
        not (vaultwarden_data_dir.stat.exists | default(false))
        or (vaultwarden_data_files.skipped_paths | default({}) | length) == 0
      # A live container whose data we cannot see is near-proof the probe is wrong
      # (bad data_mount, volume not mounted) — or that the vault was wiped underneath
      # a running container. Both are reasons to stop, not to deploy unbacked.
      - not (vaultwarden_container.exists and not vaultwarden_data_present)
    fail_msg: >-
      Cannot trust the Vaultwarden data probe at {{ data_mount }}/vaultwarden: the
      directory is unreadable, or a running container has no visible data. Proceeding
      would risk handing the vault to a new image with no backup (#107). Check the
      mount and the directory's permissions, then re-run.
    quiet: true

- name: Read the Vaultwarden image reference from the compose file
  ansible.builtin.set_fact:
    vaultwarden_image: >-
      {{ (lookup('file', role_path ~ '/files/compose.yaml')
          | from_yaml).services.vaultwarden.image }}

# Deliberately the compose file's image, not the running container's: if the tag is
# ever changed (e.g. pinned to a version), comparing the running tag against itself
# would report no change while the deploy upgraded the vault unbacked.
- name: Pull the Vaultwarden image to compare against the running container
  community.docker.docker_image_pull:
    name: "{{ vaultwarden_image }}"
    pull: always
  register: vaultwarden_pulled
  check_mode: false  # a real pull, so --check can honestly report an upgrade
  when: vaultwarden_container.exists or vaultwarden_data_present

# Upgrade-pending means "existing vault data is about to be handed to a different
# image". Container-absent + data-present counts: compose will start a freshly pulled
# image on that data, which is exactly the unbacked upgrade #107 is about.
- name: Determine whether this deploy would upgrade Vaultwarden
  ansible.builtin.set_fact:
    vaultwarden_upgrade_pending: >-
      {{ vaultwarden_data_present
         and (not vaultwarden_container.exists
              or vaultwarden_pulled.image.Id | default('') != vaultwarden_container.container.Image) }}

# Checked before anything is stopped: a retention of 0 would slice [0:] and delete
# every archive, including the one just taken, right before the upgrade is applied.
- name: Assert Vaultwarden backup retention keeps at least one archive
  ansible.builtin.assert:
    that:
      - vaultwarden_backup_retention | int >= 1
    fail_msg: "vaultwarden_backup_retention must be >= 1, got {{ vaultwarden_backup_retention }}"
    quiet: true

# Fires whenever vault data exists and the image behind it is about to change —
# including a container-absent start, where there is nothing to stop but plenty to
# lose (#107). A no-op deploy on an up-to-date container still stops nothing.
- name: Back up Vaultwarden before the upgrade is applied
  when: vaultwarden_upgrade_pending
  block:
    - name: Stop Vaultwarden so its SQLite database is backed up consistently
      community.docker.docker_container:
        name: vaultwarden
        state: stopped
      when: vaultwarden_container.exists

    - name: Create Vaultwarden backup directory
      ansible.builtin.file:
        path: "{{ data_mount }}/backups"
        state: directory
        mode: "0700"

    - name: Archive Vaultwarden data before upgrading
      community.general.archive:
        path: "{{ data_mount }}/vaultwarden"
        dest: "{{ data_mount }}/backups/vaultwarden-{{ ansible_date_time.iso8601_basic_short }}.tgz"
        format: gz
        mode: "0600"
      register: vaultwarden_archive

    - name: Find existing Vaultwarden backups
      ansible.builtin.find:
        paths: "{{ data_mount }}/backups"
        patterns: "vaultwarden-*.tgz"
      register: vaultwarden_backups

    - name: Prune Vaultwarden backups beyond the retention limit
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: >-
        {{ (vaultwarden_backups.files | default([]) | sort(attribute='mtime', reverse=true))
           [vaultwarden_backup_retention | default(7) | int :] }}
      loop_control:
        label: "{{ item.path }}"

  rescue:
    # A write that died mid-stream (disk full, killed process) leaves a truncated
    # .tgz that the retention prune cannot distinguish from a good backup — and it
    # would then age out a real one. Delete it, but ONLY when archiving is what
    # failed: if the prune failed instead, that archive completed and is the only
    # copy of the pre-upgrade vault. The dest expression matches the archive task
    # exactly; ansible_date_time is a gathered fact, constant for the whole play.
    - name: Remove a partially written Vaultwarden archive
      ansible.builtin.file:
        path: "{{ data_mount }}/backups/vaultwarden-{{ ansible_date_time.iso8601_basic_short }}.tgz"
        state: absent
      when:
        - vaultwarden_archive is defined
        - vaultwarden_archive is failed

    # Never leave the vault down because a backup failed. Restart it on the image
    # it was already running, then abort so the upgrade is not applied unbacked.
    # Only when there was a container to begin with: state:started against a
    # nonexistent container with no image spec is an error, not a restart.
    - name: Restart Vaultwarden on its existing image after a failed backup
      community.docker.docker_container:
        name: vaultwarden
        state: started
      when: vaultwarden_container.exists

    # Carries the real failure forward: a curated message that drops the underlying
    # error is how a backup failure becomes an unexplained one.
    - name: Fail because the pre-upgrade backup did not complete
      ansible.builtin.fail:
        msg: >-
          Pre-upgrade backup of {{ data_mount }}/vaultwarden failed at task
          '{{ ansible_failed_task.name }}':
          {{ ansible_failed_result.msg | default('see the error above') }}.
          {{ 'Vaultwarden was restarted on its existing image.'
             if vaultwarden_container.exists
             else 'No container existed, so nothing was restarted.' }}
          The upgrade was NOT applied. Resolve the backup failure (disk space,
          permissions) and re-run to upgrade.

- name: Deploy Vaultwarden via the shared service pipeline
  ansible.builtin.include_role:
    name: services/_deploy
  vars:
    svc: vaultwarden
    svc_data_dirs:
      - "{{ data_mount }}/vaultwarden"
