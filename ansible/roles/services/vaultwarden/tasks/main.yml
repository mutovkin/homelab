---
# --- Firewall: restrict the Vaultwarden HTTP port to approved sources (#81) ---
# Fail-open nftables table (see docs/solutions/conventions/scoped-nftables-on-live-host.md);
# hooks prerouting, not input: the IPv4 path to a docker-published port is DNAT'd
# and forwarded (invisible to input), and prerouting before DNAT also covers the
# docker-proxy [::] input path.
- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure nftables include dir exists
  ansible.builtin.file:
    path: /etc/nftables.d
    state: directory
    mode: "0755"

- name: Deploy Vaultwarden firewall ruleset
  ansible.builtin.template:
    src: vaultwarden-firewall.nft.j2
    dest: /etc/nftables.d/vaultwarden-firewall.nft
    mode: "0644"
    validate: "/usr/sbin/nft -c -f %s"
  notify: reload-vaultwarden-firewall

- name: Deploy Vaultwarden firewall systemd unit
  ansible.builtin.template:
    src: vaultwarden-firewall.service.j2
    dest: /etc/systemd/system/vaultwarden-firewall.service
    mode: "0644"
  notify: reload-vaultwarden-firewall

- name: Enable and start Vaultwarden firewall
  ansible.builtin.systemd:
    name: vaultwarden-firewall.service
    enabled: true
    state: started
    daemon_reload: true
  # In --check the unit file isn't actually written, so enable/start can't
  # find it. Skip this one task in check mode; a real run writes it first.
  when: not ansible_check_mode

- name: Flush handlers so firewall changes are live before the compose deploy
  ansible.builtin.meta: flush_handlers

# A RemainAfterExit oneshot stays "active" even if the table was externally
# flushed, so state: started can never heal it. Detect drift and notify.
- name: Check Vaultwarden firewall table is live
  ansible.builtin.command: /usr/sbin/nft list table inet vaultwarden_fw
  register: vaultwarden_fw_check
  changed_when: vaultwarden_fw_check.rc != 0
  failed_when: false
  notify: reload-vaultwarden-firewall
  when: not ansible_check_mode

- name: Heal a missing firewall table immediately
  ansible.builtin.meta: flush_handlers

- name: Assert Vaultwarden firewall table is live
  ansible.builtin.command: /usr/sbin/nft list table inet vaultwarden_fw
  changed_when: false
  when: not ansible_check_mode

# --- Pre-upgrade backup -------------------------------------------------------
# The stack deploys with pull: always, so any deploy can upgrade the vault. Take a
# consistent snapshot first — but only when the image actually changed, otherwise a
# routine no-op deploy would stop a healthy container for nothing.

- name: Inspect the running Vaultwarden container
  community.docker.docker_container_info:
    name: vaultwarden
  register: vaultwarden_container
  check_mode: false

- name: Read the Vaultwarden image reference from the compose file
  ansible.builtin.set_fact:
    vaultwarden_image: >-
      {{ (lookup('file', role_path ~ '/files/compose.yaml')
          | from_yaml).services.vaultwarden.image }}

# Deliberately the compose file's image, not the running container's: if the tag is
# ever changed (e.g. pinned to a version), comparing the running tag against itself
# would report no change while the deploy upgraded the vault unbacked.
- name: Pull the Vaultwarden image to compare against the running container
  community.docker.docker_image_pull:
    name: "{{ vaultwarden_image }}"
    pull: always
  register: vaultwarden_pulled
  check_mode: false  # a real pull, so --check can honestly report an upgrade
  when: vaultwarden_container.exists

- name: Determine whether this deploy would upgrade Vaultwarden
  ansible.builtin.set_fact:
    vaultwarden_upgrade_pending: >-
      {{ vaultwarden_container.exists
         and vaultwarden_pulled.image.Id | default('') != vaultwarden_container.container.Image }}

# Checked before anything is stopped: a retention of 0 would slice [0:] and delete
# every archive, including the one just taken, right before the upgrade is applied.
- name: Assert Vaultwarden backup retention keeps at least one archive
  ansible.builtin.assert:
    that:
      - vaultwarden_backup_retention | int >= 1
    fail_msg: "vaultwarden_backup_retention must be >= 1, got {{ vaultwarden_backup_retention }}"
    quiet: true

- name: Back up Vaultwarden before the upgrade is applied
  when: vaultwarden_upgrade_pending
  block:
    - name: Stop Vaultwarden so its SQLite database is backed up consistently
      community.docker.docker_container:
        name: vaultwarden
        state: stopped

    - name: Create Vaultwarden backup directory
      ansible.builtin.file:
        path: "{{ data_mount }}/backups"
        state: directory
        mode: "0700"

    - name: Archive Vaultwarden data before upgrading
      community.general.archive:
        path: "{{ data_mount }}/vaultwarden"
        dest: "{{ data_mount }}/backups/vaultwarden-{{ ansible_date_time.iso8601_basic_short }}.tgz"
        format: gz
        mode: "0600"

    - name: Find existing Vaultwarden backups
      ansible.builtin.find:
        paths: "{{ data_mount }}/backups"
        patterns: "vaultwarden-*.tgz"
      register: vaultwarden_backups

    - name: Prune Vaultwarden backups beyond the retention limit
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: >-
        {{ (vaultwarden_backups.files | default([]) | sort(attribute='mtime', reverse=true))
           [vaultwarden_backup_retention | default(7) | int :] }}
      loop_control:
        label: "{{ item.path }}"

  rescue:
    # Never leave the vault down because a backup failed. Restart it on the image
    # it was already running, then abort so the upgrade is not applied unbacked.
    - name: Restart Vaultwarden on its existing image after a failed backup
      community.docker.docker_container:
        name: vaultwarden
        state: started

    - name: Fail because the pre-upgrade backup did not complete
      ansible.builtin.fail:
        msg: >-
          Pre-upgrade backup of {{ data_mount }}/vaultwarden failed. Vaultwarden was
          restarted on its existing image and the upgrade was NOT applied. Resolve the
          backup failure (disk space, permissions) and re-run to upgrade.

- name: Deploy Vaultwarden via the shared service pipeline
  ansible.builtin.include_role:
    name: services/_deploy
  vars:
    svc: vaultwarden
    svc_data_dirs:
      - "{{ data_mount }}/vaultwarden"
