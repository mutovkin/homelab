---
# Shared deploy pipeline for every services/* role (#85). The calling role
# provides `svc` (its own directory name) and ships its payload from
# roles/services/<svc>/files/ (compose.yaml + any configs) and its .env from
# roles/services/<svc>/templates/env.j2. Per-service extras (config copies,
# backups, systemd units, external networks) live in the calling role, before
# or after this include.

- name: Create deploy directory for {{ svc }}
  ansible.builtin.file:
    path: "{{ svc_deploy_dir }}"
    state: directory
    mode: "0755"

# delete: true — the deploy dir is fully Ansible-owned: a file removed from the
# role's files/ is removed from the host (this is what retires portainer.sh,
# sample.ini and the old <svc>.yml compose filenames). Excluded files (.env and
# README.md) are protected from deletion by rsync's exclude rules.
#
# verify_host/use_ssh_args: synchronize defaults verify_host=false, which injects
# -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null and ignores our
# ansible.cfg ssh_args entirely — so the rsync channel accepted any host key even
# after #94 pinned the main connection (TOFU). These two options put rsync on the
# same footing. The play's normal ssh connection has already run by this point, so
# the key is pinned in known_hosts before rsync ever dials (#94).
- name: Synchronize deploy payload for {{ svc }}
  become: false
  ansible.posix.synchronize:
    src: "{{ role_path | dirname }}/{{ svc }}/files/"
    dest: "{{ svc_deploy_dir }}/"
    delete: true
    verify_host: true
    use_ssh_args: true
    rsync_opts: "{{ ['--exclude=.env', '--exclude=README.md'] + svc_rsync_extra }}"

- name: Template .env for {{ svc }}
  ansible.builtin.template:
    src: "{{ role_path | dirname }}/{{ svc }}/templates/env.j2"
    dest: "{{ svc_deploy_dir }}/.env"
    mode: "0600"
  # Every service's .env embeds vault secrets: --diff prints BOTH sides in
  # plaintext (#88 — a live SMTP password leaked into a transcript this way).
  # diff:false suppresses content but keeps changed:true and, unlike no_log,
  # keeps failure output ("'vault_x' is undefined") readable — that loud
  # failure is itself a control (#88 part 2).
  diff: false

- name: Create data directories for {{ svc }}
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop: "{{ svc_data_dirs }}"

# In check mode the payload may not exist on the host yet (first --check of a
# renamed compose file runs before the rsync has really shipped it); compose
# cannot preview against a missing file, so skip rather than fail the documented
# dry-run-before-apply workflow. Real runs always have the file (task above).
- name: Stat deployed compose file for {{ svc }}
  ansible.builtin.stat:
    path: "{{ svc_deploy_dir }}/compose.yaml"
  check_mode: false
  register: svc_compose_stat

- name: Deploy compose stack for {{ svc }}
  community.docker.docker_compose_v2:
    project_src: "{{ svc_deploy_dir }}"
    # roles/services/lms/templates/lms-nfs-heal.sh.j2 hardcodes this same filename
    # so its self-heal path brings up the same config — change both together.
    files:
      - compose.yaml
    state: present
    pull: always
    recreate: "{{ svc_recreate }}"
  when: not ansible_check_mode or svc_compose_stat.stat.exists
