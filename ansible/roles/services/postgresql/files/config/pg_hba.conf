# PostgreSQL Client Authentication Configuration File
# Deployed by Ansible (roles/services/postgresql) — edit in the repo, not live.
# LAN reachability of tcp/5432 is additionally restricted by the postgres_fw
# nftables allowlist on the host (#79) — keep the LAN entries here in parity
# with postgres_firewall.allowed_sources in host_vars.
# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Unix socket: peer requires OS user == DB role, so a root `docker exec` shell
# no longer gets a passwordless superuser session (#79). Admin/backup sessions:
#   docker exec -u postgres postgres psql ...
#   docker exec -u postgres postgres pg_dumpall ...
# First-boot initdb is unaffected: the image entrypoint runs its socket psql as
# the postgres OS user (uid 999), which peer-maps to the postgres role.
local   all             all                                     peer

# IPv4 local connections:
host    all             all             127.0.0.1/32            scram-sha-256

# IPv6 local connections:
host    all             all             ::1/128                 scram-sha-256

# Docker networks: 172.16.0.0/12 covers this host's (eq12) compose subnets —
# the 172.2x ranges, incl. postgres_network 172.21.0.0/24 (joplin, pgadmin).
host    all             all             172.16.0.0/12           scram-sha-256

# LAN clients: only the nftables-allowlisted sources (#79). The previous
# 0.0.0.0/0 catch-all accepted auth attempts from any LAN source; live
# pg_stat_activity shows the only real TCP client is joplin over the bridge.
# A future off-host consumer (e.g. an n5pro service) arrives SNAT'd as its
# docker host's LAN IP — add that /32 here AND to postgres_firewall.allowed_sources.
host    all             all             192.168.25.20/32        scram-sha-256
host    all             all             192.168.48.0/24         scram-sha-256

# Replication connections
host    replication     all             127.0.0.1/32            scram-sha-256
host    replication     all             ::1/128                 scram-sha-256
host    replication     all             172.16.0.0/12           scram-sha-256
