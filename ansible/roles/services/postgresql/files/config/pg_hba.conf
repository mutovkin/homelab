# PostgreSQL Client Authentication Configuration File
# Deployed by Ansible (roles/services/postgresql) — edit in the repo, not live.
# TYPE  DATABASE        USER            ADDRESS                 METHOD

# "local" is for Unix domain socket connections only
local   all             all                                     trust

# IPv4 local connections:
host    all             all             127.0.0.1/32            scram-sha-256

# IPv6 local connections:
host    all             all             ::1/128                 scram-sha-256

# Docker networks: 172.16.0.0/12 covers this host's (eq12) compose subnets — the
# 172.2x ranges, incl. postgres_network 172.21.0.0/24. n5pro's frigate/nextcloud
# subnets (172.32/.33) sit OUTSIDE the /12 and rely on the catch-all below.
host    all             all             172.16.0.0/12           scram-sha-256

# IPv4-only catch-all. The image default it replaces
# ("host all all all scram-sha-256") matched both address families, but the
# container network is IPv4-only so nothing regresses. The image default's
# "local replication all trust" is deliberately not carried over: nothing uses
# local replication (backups are pg_dumpall over a normal connection).
# Tightening LAN exposure is a separate issue.
host    all             all             0.0.0.0/0               scram-sha-256

# Replication connections
host    replication     all             127.0.0.1/32            scram-sha-256
host    replication     all             ::1/128                 scram-sha-256
host    replication     all             172.16.0.0/12           scram-sha-256
