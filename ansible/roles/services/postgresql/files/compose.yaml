services:
  postgres:
    image: postgres:18
    container_name: postgres
    restart: unless-stopped
    security_opt:
      - "apparmor:unconfined"
      - "no-new-privileges:true"
    labels:
      # The tag is pinned to major 18, so Watchtower could only ever deliver an 18.x
      # minor — not a major migration. It is monitor-only anyway because this is the
      # primary database for every other stack: even a minor bump should land with a
      # fresh dump and an operator watching, not at 04:30 unattended. "enable" keeps it
      # in scan scope so the minor is reported; "monitor-only" stops Watchtower applying
      # it. Update via `task deploy:service -- --tags postgresql`, after a
      # pg_dumpall (#83).
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.monitor-only=true"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=en_US.UTF8 --lc-ctype=en_US.UTF8"
      TZ: ${TIMEZONE:-UTC}
    volumes:
      - /data/postgresql/data:/var/lib/postgresql
      - /data/postgresql/config/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - /data/postgresql/init-scripts:/docker-entrypoint-initdb.d:ro
      - /data/postgresql/config/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro  # Network access control
    ports:
      # Published on the host; LAN access is restricted to the postgres_fw
      # nftables allowlist (#79). Do NOT bind to 127.0.0.1 — NPM lives in a
      # separate LXC and needs LAN reach.
      - "5432:5432"
    networks:
      - postgres_network
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      # Must run as the postgres OS user: pg_hba uses `local ... peer`, so a
      # probe as root logs a FATAL peer-authentication line every interval
      # (pg_isready still exits 0 — PQping ignores the auth outcome — so the
      # only symptom is ~2900 FATALs/day in the server log). gosu ships in the
      # official postgres image.
      test: ["CMD-SHELL", "gosu postgres pg_isready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: pgadmin4
    restart: unless-stopped
    security_opt:
      - "apparmor:unconfined"
      - "no-new-privileges:true"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      TZ: ${TIMEZONE:-UTC}
    volumes:
      - /data/postgresql/pgadmin:/var/lib/pgadmin
      - /data/postgresql/config/pgadmin/servers.json:/pgadmin4/servers.json:ro  # Pre-configured servers
      #- /data/postgresql/config/pgadmin/pgpass:/tmp/pgpassfile:ro                # Password file
    ports:
      # Published on the host; LAN access is restricted to the postgres_fw
      # nftables allowlist (#79). Plaintext HTTP — TLS fronting deferred.
      - "10080:80"
    networks:
      - postgres_network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/misc/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # postgres_network is a shared EXTERNAL network, pre-created by the postgresql
  # Ansible role (community.docker.docker_network, subnet 172.21.0.0/24). It is
  # decoupled from this compose project's lifecycle so that when watchtower
  # recreates postgres/pgadmin, they reattach to the still-present network
  # (the recreate-detach bug, #45). joplin/immich/nextcloud also attach as
  # external. For standalone use, create it first:
  #   docker network create --subnet 172.21.0.0/24 postgres_network
  postgres_network:
    external: true
    name: postgres_network