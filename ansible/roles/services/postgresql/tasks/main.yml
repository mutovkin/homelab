---
# --- Firewall: restrict the published ports (5432/10080) to approved sources ---
# Unlike the nut convention's input hook, docker-published ports must be
# filtered in PREROUTING before Docker's dstnat — see the header comment in
# templates/postgres-firewall.nft.j2 (#79). Same fail-open shape otherwise.
# postgres_firewall (host_addr/ports/allowed_sources) comes from host_vars;
# deliberately NO defaults — a host that deploys this role without defining it
# must fail loudly, not silently deploy unprotected.
- name: Assert postgres firewall allowlist is defined and scoped
  ansible.builtin.assert:
    that:
      - postgres_firewall.allowed_sources | length > 0
      # Structural, not a spelling blocklist: a list of forbidden strings would
      # wave through 192.168.0.0/0, 0/0 and 0.0.0.00/0. Every entry must be an
      # IPv4 CIDR with a /1../32 prefix, which rejects /0, malformed and
      # non-IPv4 entries. An out-of-range octet is caught downstream by the
      # nft -c -f validate on the ruleset template.
      - >-
        postgres_firewall.allowed_sources
        | reject('match', '^\d{1,3}(\.\d{1,3}){3}/([1-9]|[12]\d|3[0-2])$')
        | list | length == 0
      # A drifted host_addr silently no-ops the entire filter: every packet
      # would exit early at the ruleset's `ip daddr != host_addr accept`.
      - postgres_firewall.host_addr in ansible_all_ipv4_addresses
    fail_msg: >-
      postgres_firewall must be scoped: allowed_sources non-empty with every
      entry an IPv4 CIDR of prefix /1../32 (a wildcard or empty list would
      re-open the exposure #79 closes), and host_addr must be one of this
      host's real IPv4 addresses — a drifted value makes the filter inert.
    success_msg: "postgres firewall allowlist is scoped."

- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    state: present

- name: Ensure nftables include dir exists
  ansible.builtin.file:
    path: /etc/nftables.d
    state: directory
    mode: "0755"

- name: Deploy postgres firewall ruleset
  ansible.builtin.template:
    src: postgres-firewall.nft.j2
    dest: /etc/nftables.d/postgres-firewall.nft
    mode: "0644"
    validate: "/usr/sbin/nft -c -f %s"
  register: postgres_fw_ruleset

- name: Deploy postgres firewall systemd unit
  ansible.builtin.template:
    src: postgres-firewall.service.j2
    dest: /etc/systemd/system/postgres-firewall.service
    mode: "0644"
  register: postgres_fw_unit

- name: Enable and start postgres firewall
  ansible.builtin.systemd:
    name: postgres-firewall.service
    enabled: true
    state: started
    daemon_reload: true
  # In --check the unit file isn't actually written, so enable/start can't
  # find it. Skip this one task in check mode; a real run writes it first.
  when: not ansible_check_mode

# `state: started` above is a no-op once the unit is active, and RemainAfterExit
# keeps it "active" even after something else wiped the table — /etc/nftables.conf
# opens with `flush ruleset`, so any restart of the enabled nftables.service (an
# unattended-upgrades package upgrade, say) silently deletes inet postgres_fw.
# The unit's PartOf=nftables.service re-applies it in that case; this probe is
# the belt-and-braces check that a converged play means a LOADED table.
# check_mode: false — a read-only probe is safe and its result drives the
# decisions below, which would otherwise be undefined in --check.
- name: Probe whether the postgres firewall table is loaded
  ansible.builtin.command: nft list table inet postgres_fw
  register: postgres_fw_probe
  failed_when: false
  changed_when: false
  check_mode: false

# Reloads on a template change AND self-heals an externally flushed table.
# Deliberately NO default() filters: a renamed register must fail loudly
# rather than silently skip the reload (the do-nothing failure mode of #78).
- name: Reload postgres firewall
  ansible.builtin.systemd:
    name: postgres-firewall.service
    state: restarted
    daemon_reload: true
  when:
    - not ansible_check_mode
    - postgres_fw_ruleset is changed or postgres_fw_unit is changed
      or 'drop' not in postgres_fw_probe.stdout

# A green play must mean a loaded firewall. Asserting on the drop verdict
# rather than mere table existence catches a half-loaded/truncated table.
- name: Verify postgres firewall table is loaded
  ansible.builtin.command: nft list table inet postgres_fw
  register: postgres_fw_loaded
  changed_when: false
  failed_when: "'drop' not in postgres_fw_loaded.stdout"
  when: not ansible_check_mode

# Pre-create the shared network as EXTERNAL so it persists independent of this
# compose project — when watchtower recreates postgres/pgadmin they reattach to
# the still-present network instead of coming up detached (#45). Idempotent: a
# matching existing network is left as-is.
- name: Ensure shared postgres_network exists (external)
  community.docker.docker_network:
    name: postgres_network
    driver: bridge
    ipam_config:
      - subnet: 172.21.0.0/24
        gateway: 172.21.0.1
    state: present

- name: Create PostgreSQL directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ data_mount }}/postgresql/data"
    - "{{ data_mount }}/postgresql/config"
    - "{{ data_mount }}/postgresql/config/pgadmin"
    - "{{ data_mount }}/postgresql/init-scripts"

# pgadmin runs as uid 5050 and writes to /var/lib/pgadmin (bind-mounted here).
# On a fresh host Docker would auto-create the path root:root and pgadmin
# crash-loops (#78); the live dir was hand-fixed to 5050 — this task owns it.
- name: Create pgadmin data directory (uid 5050)
  ansible.builtin.file:
    path: "{{ data_mount }}/postgresql/pgadmin"
    state: directory
    owner: "5050"
    group: "5050"
    mode: "0755"

# Captured BEFORE the deploy — the restart below must only bounce a container
# that already existed. On a fresh host `compose up` creates postgres FROM the
# configs deployed above, and restarting it seconds later would race the
# entrypoint's initdb (PG_VERSION lands early; interrupting leaves a cluster
# that skips /docker-entrypoint-initdb.d forever — no joplin DB).
- name: Check whether the postgres container pre-exists
  community.docker.docker_container_info:
    name: postgres
  register: postgres_container_info

# The compose file bind-mounts these from {{ data_mount }}/postgresql/..., not
# the deploy dir — without these tasks a repo edit never reaches the container
# (the Vector gotcha; #73, #78). postgresql.conf pins hba_file to the mounted
# pg_hba.conf, so both files are really read by the server; changes are paired
# with the explicit restart below (compose ignores bind-mount content changes).
- name: Deploy PostgreSQL server configs
  ansible.builtin.copy:
    src: "config/{{ item }}"
    dest: "{{ data_mount }}/postgresql/config/{{ item }}"
    mode: "0644"
  loop:
    - postgresql.conf
    - pg_hba.conf
  register: postgres_configs

# servers.json is imported by the image only on first pgAdmin launch (a fresh
# /var/lib/pgadmin) or with PGADMIN_REPLACE_SERVERS_ON_STARTUP=True (we do not
# set it) — verified against the image entrypoint — so no restart pairs with
# this task: on an initialized install a bounce would be inert. Deploying it
# still matters for fresh hosts, where it is what pre-configures the server.
- name: Deploy pgadmin servers.json
  ansible.builtin.copy:
    src: config/pgadmin/servers.json
    dest: "{{ data_mount }}/postgresql/config/pgadmin/servers.json"
    mode: "0644"

# Rendered from vault (real credential): owner 999 (the entrypoint reads init
# scripts after dropping to the postgres uid) and 0600 so the password is not
# world-readable on the host. diff: false — a --diff would print the rendered
# password (same leak class as the watchtower Gmail incident). No restart pairs
# with this task: init scripts run only on a fresh initdb (empty data dir) and
# a change here never affects a live cluster.
- name: Deploy database init script (renders vault credentials)
  ansible.builtin.template:
    src: 01-init-databases.sql.j2
    dest: "{{ data_mount }}/postgresql/init-scripts/01-init-databases.sql"
    owner: "999"
    group: "999"
    mode: "0600"
  diff: false

# Single source of truth for the restart decision, shared by the check-mode
# preview, the restart itself and the readiness gate. Deliberately NO default()
# filters: if a register above is renamed this must fail loudly rather than
# silently skip the restart — the do-nothing failure mode that #78 is about.
# The names must match container_name in files/compose.yaml.
- name: Determine containers to restart for changed config
  ansible.builtin.set_fact:
    postgres_restart_targets: >-
      {{ ['postgres'] if (postgres_configs.results | selectattr('changed') | list | length > 0
          and postgres_container_info.exists) else [] }}

# --check must surface the outage the restart NOTE below warns about; the
# restart task itself is necessarily skipped in check mode.
- name: Preview config-change restart (check mode)
  ansible.builtin.debug:
    msg: "Config change WILL RESTART on real apply: {{ postgres_restart_targets }} (client-visible outage for DB clients)"
  when:
    - ansible_check_mode
    - postgres_restart_targets | length > 0

# config/ is excluded from the deploy payload: the configs are deployed to the
# container mount paths above, so a copy in the deploy dir would be unused —
# exactly the decorative-copy drift this issue removes (stale pre-#78 copies at
# the deploy-dir root are deleted by the sync's delete: true). Note the exclude
# cuts both ways: a config/ created out-of-band inside the deploy dir would be
# shielded from delete: true — none exists today, do not create one.
- name: Deploy PostgreSQL via the shared service pipeline
  ansible.builtin.include_role:
    name: services/_deploy
  vars:
    svc: postgresql
    svc_rsync_extra:
      - "--exclude=config/"

# Compose does not track bind-mounted file contents, and hba_file is read only
# at server start — so restart the affected container explicitly when its config
# changed. Only ever bounces a container that pre-existed this run (see the
# probe above); a first deploy deliberately restarts nothing.
# NOTE: restarting postgres is a client-visible outage (joplin) — deploys that
# change postgresql.conf/pg_hba.conf need the operator's OK.
- name: Restart PostgreSQL services whose config changed
  community.docker.docker_container:
    name: "{{ item }}"
    state: started
    restart: true
  loop: "{{ postgres_restart_targets }}"
  # Skipped in check mode: on a never-deployed host the containers do not exist
  # yet, and docker_container would fail rather than preview anything.
  when: not ansible_check_mode

# With hba_file now really read, a bad config would crash-loop postgres while
# the play still reported green — prove the server came back before declaring
# success. Runs as the postgres OS user: pg_isready's PQping ignores the auth
# outcome (so it exits 0 either way), but under `local ... peer` a probe as
# root logs a FATAL peer-authentication line every time (#79).
- name: Wait for postgres to accept connections after restart
  community.docker.docker_container_exec:
    container: postgres
    user: postgres
    command: pg_isready
  register: postgres_ready
  until: postgres_ready.rc == 0
  retries: 12
  delay: 5
  changed_when: false
  when:
    - not ansible_check_mode
    - "'postgres' in postgres_restart_targets"
