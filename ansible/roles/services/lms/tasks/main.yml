---
# Naming (#93): repo-side this service is `lms` everywhere (role, tag, files).
# The HOST paths deliberately keep the legacy `lyrion` name: the deploy-dir
# basename is the compose project name, so renaming {{ data_mount }}/deploy/lyrion
# would recreate the container under a new project, and {{ data_mount }}/lyrion
# holds live state. A host-path migration would be a deliberate, separate change.
- name: Create LMS config directory
  ansible.builtin.file:
    path: "{{ data_mount }}/lyrion/config"
    state: directory
    mode: "0755"

# The LMS image runs /config/custom-init.sh on every container start (its
# sanctioned extension hook). ffmpeg is needed for transcoding but isn't in the
# base image. Guard the install so a normal restart is a fast no-op instead of an
# apt-get update + install every boot (slow, network-dependent, and noisy).
- name: Install ffmpeg via custom-init.sh (idempotent — skips if already present)
  ansible.builtin.copy:
    content: |
      #!/bin/bash
      # Managed by Ansible — installs ffmpeg once; no-op on subsequent starts.
      if ! command -v ffmpeg >/dev/null 2>&1; then
        apt-get update -qq
        apt-get install --no-install-recommends -qy ffmpeg
      fi
    dest: "{{ data_mount }}/lyrion/config/custom-init.sh"
    mode: "0755"
  register: lms_custom_init

# Captured BEFORE the deploy, for the restart pairing below. custom-init.sh is
# bind-mounted, so compose does not track its content — an edit is inert until
# the container restarts (the bind-mount gotcha, #95). Two things must be true
# before we bounce it: the container already existed (never restart a container
# this run created — it would race the very init script we just deployed), and
# the deploy did not itself recreate it (a recreate already ran the new script).
- name: Check whether the LMS container pre-exists
  community.docker.docker_container_info:
    name: lms
  register: lms_container_before
  check_mode: false

# Self-heal: if the LXC boots before TrueNAS NFS is serving (boot-order race,
# #36), the NFS-backed /music volume fails to mount and the stack stays down.
# This oneshot waits for NFS then re-ups the stack, independent of boot order.
- name: Install lms NFS self-heal script
  ansible.builtin.template:
    src: lms-nfs-heal.sh.j2
    dest: /usr/local/bin/lms-nfs-heal.sh
    mode: "0755"

- name: Install lms NFS self-heal systemd unit
  ansible.builtin.template:
    src: lms-nfs-heal.service.j2
    dest: /etc/systemd/system/lms-nfs-heal.service
    mode: "0644"
  register: lms_heal_unit

- name: Enable lms NFS self-heal unit (runs at every boot)
  ansible.builtin.systemd_service:
    name: lms-nfs-heal.service
    enabled: true
    daemon_reload: "{{ lms_heal_unit.changed }}"

# lms uses network_mode: host (UDP broadcast discovery) and defines no compose
# network — it never has: the first committed lyrion compose (5b1cb48) already
# set network_mode: host, and `git log --all -S lms_network -- '*compose*'` is
# empty. The live lms_network (172.36.0.0/24 — public Internet space, zero
# endpoints) was therefore created OUTSIDE Ansible during early bring-up;
# nothing in this repo ever defined it, so neither compose nor Ansible would
# ever remove it. Hence this explicit retirement (#84). No-op once gone.
#
# Deliberately no force: true — docker_network hard-fails if the network ever
# has active endpoints, and that is the point: an unexpected attachment means
# something we do not model is using it, and it must be looked at, not evicted.
# If lms ever gains a REAL bridge network named lms_network, DELETE this task
# first — otherwise it removes the network on every deploy and bounces the stack.
- name: Remove orphaned lms_network (#84 — public-space subnet, no attached containers)
  community.docker.docker_network:
    name: lms_network
    state: absent

- name: Deploy LMS via the shared service pipeline
  ansible.builtin.include_role:
    name: services/_deploy
  vars:
    svc: lms
    svc_deploy_dir: "{{ data_mount }}/deploy/lyrion"

# Container identity after the deploy. A new Id means compose created or
# recreated the container in THIS run, so it already started with the current
# custom-init.sh and an extra restart would be pure churn (and, on a first
# deploy, a race against the script's own apt-get install).
- name: Re-read the LMS container after the deploy
  community.docker.docker_container_info:
    name: lms
  register: lms_container_after
  check_mode: false

# Single source of truth for the restart decision, shared by the check-mode
# preview and the restart itself. Deliberately NO default() filters on the
# registers: a rename must fail loudly rather than silently skip the restart
# (the do-nothing failure mode of #78).
- name: Determine whether LMS must be restarted for a changed custom-init.sh
  ansible.builtin.set_fact:
    lms_restart_needed: >-
      {{ lms_custom_init is changed
         and lms_container_before.exists
         and lms_container_after.exists
         and lms_container_before.container.Id == lms_container_after.container.Id }}

# --check must surface the bounce a real apply would perform. The restart task
# itself is necessarily skipped in check mode (the copy is not really written,
# so the container could not pick it up anyway).
- name: Preview the custom-init.sh restart (check mode)
  ansible.builtin.debug:
    msg: >-
      custom-init.sh changed: a real apply WILL restart the lms container
      (brief player-visible outage) so the new script runs.
  when:
    - ansible_check_mode
    - lms_restart_needed | bool

- name: Restart LMS so the edited custom-init.sh actually runs
  community.docker.docker_container:
    name: lms
    state: started
    restart: true
  when:
    - not ansible_check_mode
    - lms_restart_needed | bool

# A green play must mean a serving LMS: custom-init.sh runs as the container
# starts, and a broken script (bad apt source, failed install) can leave the web
# UI down while docker still reports the container "started" — the module returns
# on issuance, not on service. localhost is correct here: the task runs on the
# docker host and lms uses network_mode: host. Default mirrors templates/env.j2.
- name: Wait for the LMS web UI after the restart
  ansible.builtin.uri:
    url: "http://localhost:{{ lms_web_port | default('9001') }}/"
    status_code: 200
  register: lms_ui_ready
  until: lms_ui_ready is succeeded
  retries: 12
  delay: 5
  changed_when: false
  when:
    - not ansible_check_mode
    - lms_restart_needed | bool
