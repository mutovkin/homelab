---
- name: Ensure SearXNG config and cache directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ data_mount }}/searxng/config"
    - "{{ data_mount }}/searxng/data"
    # Persistent favicon cache — left root-owned (the worker's uid) and outside
    # the entrypoint-managed paths so it isn't chowned to 977. See favicons.toml.
    - "{{ data_mount }}/searxng/favicons"

# Deploy the minimal settings.yml to the container's mount path (/data/searxng/
# config), not the unused deploy dir. braveapi renders only if its vault key is
# set (see settings.yml.j2) so the key never lands in the repo.
- name: Deploy SearXNG settings.yml to the container mount path
  ansible.builtin.template:
    src: settings.yml.j2
    dest: "{{ data_mount }}/searxng/config/settings.yml"
    mode: "0644"
  # Renders vault_searxng_brave_api_key: --diff would print it in plaintext, on
  # both sides on a rotation (#88). This task bypasses _deploy (it writes to the
  # container mount path, not the deploy dir), so it needs its own diff:false.
  # Not no_log — that would censor failure output too; see _deploy/tasks/main.yml.
  diff: false
  register: searxng_settings_tpl

# Required once search.favicon_resolver is set, else favicons 404 with
# "missing favicon config". Uses the default /tmp cache (writable by the root
# worker) — see the file header and #65. Static file (no secrets) -> copy.
- name: Deploy SearXNG favicons.toml to the container mount path
  ansible.builtin.copy:
    src: config/favicons.toml
    dest: "{{ data_mount }}/searxng/config/favicons.toml"
    mode: "0644"
  register: searxng_favicons

# config/ is excluded from the deploy payload: settings.yml/favicons.toml are
# deployed to the container mount path above; a copy in the deploy dir would be
# unused. Recreate reloads the bind-mounted config when it changed (compose
# won't restart on a mounted-file content change by itself).
- name: Deploy SearXNG via the shared service pipeline
  ansible.builtin.include_role:
    name: services/_deploy
  vars:
    svc: searxng
    svc_rsync_extra:
      - "--exclude=config/"
    svc_recreate: "{{ 'always' if (searxng_settings_tpl.changed or searxng_favicons.changed) else 'auto' }}"
