services:
  watchtower:
    container_name: watchtower
    # Pinned deliberately (#83): the update orchestrator holds docker.sock read-write
    # and is a third-party fork of an archived upstream, so it must not execute a new
    # `latest` unattended. Bump by editing this tag in git, where it is reviewable.
    # Digest at pin time: sha256:d76a95a54ab636968f77cb1780fb597b3e28511b535a86e3af212a290ef4d743
    image: nickfedor/watchtower:1.21.0
    restart: unless-stopped
    security_opt:
      - "apparmor:unconfined"
      - "no-new-privileges:true"
    labels:
      # WATCHTOWER_LABEL_ENABLE=true means only containers carrying this label are
      # scanned at all. Without it here, Watchtower kept the other labeled
      # containers current but could never update itself.
      - "com.centurylinklabs.watchtower.enable=true"
      # Socket-holding ⇒ monitor-only: it stays counted in `scanned=N` and never
      # self-updates. This guards the one residual unattended path the tag pin leaves
      # open — a re-pushed `1.21.0`. Note it does NOT give us release notifications:
      # Watchtower only checks the reference it runs, so with the tag pinned a new
      # 1.21.1 is never seen. That is what the scheduled release-watch workflow
      # (.github/workflows/watchtower-release-watch.yml) exists to catch — see README
      # "Update Posture" (#83, #121).
      - "com.centurylinklabs.watchtower.monitor-only=true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TZ: ${WATCHTOWER_TIMEZONE}
      WATCHTOWER_SCHEDULE: ${WATCHTOWER_SCHEDULE}
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_NO_STARTUP_MESSAGE: "true"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      WATCHTOWER_ROLLING_RESTART: "false"
      WATCHTOWER_TIMEOUT: 30s
      # Notifications — Shoutrrr smtp:// URL, assembled in env.j2 from vault vars.
      # Replaces the legacy WATCHTOWER_NOTIFICATION_EMAIL_* options, which upstream
      # deprecated and will remove in Watchtower v2.
      WATCHTOWER_NOTIFICATION_URL: ${NOTIFICATION_URL}
      WATCHTOWER_NOTIFICATIONS_DELAY: 2
    networks:
      - watchtower_network

networks:
  watchtower_network:
    driver: bridge
    name: watchtower_network
    ipam:
      driver: default
      config:
        - subnet: ${WATCHTOWER_NETWORK_SUBNET:-172.25.0.0/24}
