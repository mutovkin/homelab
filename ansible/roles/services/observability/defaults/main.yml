---
# Grafana's HOST-side published port, as written in files/compose.yaml
# (`3000:3000`). Used only by the post-restart readiness gate, which probes
# /api/health on the published port. Change both together.
grafana_web_port: 3000

# VictoriaLogs' HOST-side published port, as written in files/compose.yaml
# ("9428:9428"). Used only by the post-deploy ingest assertion, which queries the
# destination for recent host records rather than trusting container state
# (vector-057's own Prevention rule). Change both together.
victorialogs_web_port: 9428

# How long a restarted vector/telegraf must stay up before the play accepts it.
# Neither exposes an HTTP surface to probe, so "still running after N seconds" is
# the gate. Vector exits about a second after a malformed vector.yaml, so this
# only has to be comfortably longer than that (and than docker's first restart
# backoff) — not long enough to prove steady-state health, which is watchtower's
# and the ingest-health alert's job.
observability_settle_seconds: 15

# #152's Telegram second channel, gated. false = email-only delivery, the same
# CHANNEL COVERAGE #139 shipped — not the same routing tree: the flag-false render
# still contains #152's heartbeat and severity routes, which #139 never had. That
# is what a host without the vault keys must get; true
# REQUIRES vault_grafana_telegram_bot_token + vault_grafana_telegram_chat_id in
# host_vars/<host>/vault.yml — asserted BY NAME at the top of the play, so a
# missing key fails loudly instead of provisioning a Telegram contact point that
# can never send (the same silent failure #152 exists to remove).
#
# The flag is not a "maybe later": #152's whole argument is that single-channel
# email delivery is unmonitored and cannot page about its own failure. A host
# running this stack with the flag false has the delivery-failure alert routed
# back through the channel it is reporting on. eq12_docker sets it true in
# host_vars.
observability_alert_telegram: false
