---
- name: Stat Docker socket
  ansible.builtin.stat:
    path: /var/run/docker.sock
  register: docker_socket_stat

- name: Create observability data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ data_mount }}/victoriametrics"
    - "{{ data_mount }}/victorialogs"
    - "{{ data_mount }}/vector"
    - "{{ data_mount }}/vector/data"
    - "{{ data_mount }}/telegraf"
    - "{{ data_mount }}/grafana/data"
    - "{{ data_mount }}/grafana/config"
    - "{{ data_mount }}/grafana/dashboards"
    - "{{ data_mount }}/grafana/provisioning"

# The compose file bind-mounts these paths directly (not from the deploy dir), so
# without these tasks a config edited in the repo never reaches the container and
# the only way to apply it is an ad-hoc scp — which Critical Rule 1 forbids.
- name: Deploy observability service configs
  ansible.builtin.copy:
    src: "data/{{ item.src }}"
    dest: "{{ data_mount }}/{{ item.src }}"
    mode: "0644"
  loop:
    - { src: vector/vector.yaml, service: vector }
    - { src: telegraf/telegraf.conf, service: telegraf }
    - { src: grafana/config/grafana.ini, service: grafana }
  loop_control:
    label: "{{ item.src }}"
  register: observability_configs

# delete: true so a file removed from the repo is removed from the host — otherwise
# Grafana keeps provisioning a datasource that no longer exists in version control.
# --checksum because rsync's default mtime comparison reports every file as changed
# on a fresh clone, which would restart Grafana spuriously on the other operator machine.
# times: false because rsync would otherwise "touch" mtimes on content-identical files
# (a fresh clone/worktree gives every file a new mtime), flipping changed and restarting
# Grafana for nothing.
- name: Deploy Grafana provisioning
  become: false
  ansible.posix.synchronize:
    src: "{{ role_path }}/files/data/grafana/provisioning/"
    dest: "{{ data_mount }}/grafana/provisioning/"
    delete: true
    times: false
    rsync_opts:
      - "--checksum"
  register: grafana_provisioning

# Separate from provisioning because Grafana hot-reloads provisioned dashboards —
# a dashboard change needs no restart. Without this the first dashboard JSON ever
# committed would silently never reach the container.
- name: Deploy Grafana dashboards
  become: false
  ansible.posix.synchronize:
    src: "{{ role_path }}/files/data/grafana/dashboards/"
    dest: "{{ data_mount }}/grafana/dashboards/"
    delete: true
    times: false
    rsync_opts:
      - "--checksum"

- name: Deploy observability via the shared service pipeline
  ansible.builtin.include_role:
    name: services/_deploy
  vars:
    svc: observability

# Compose does not track the contents of bind-mounted files, so a config change on
# its own never restarts the container. Restart the affected services explicitly,
# after the stack exists so this also works on a first deploy.
- name: Restart observability services whose config changed
  community.docker.docker_container:
    name: "{{ item }}"
    state: started
    restart: true
  loop: >-
    {{ ((observability_configs.results | default([]) | selectattr('changed') | map(attribute='item.service') | list)
        + (['grafana'] if grafana_provisioning.changed | default(false) else [])) | unique }}
  # Skipped in check mode: on a host that has never been deployed the containers do
  # not exist yet, and docker_container would fail rather than preview anything.
  when: not ansible_check_mode
