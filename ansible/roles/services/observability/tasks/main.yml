---
# #88: no credential in this stack may be blank. VictoriaMetrics/VictoriaLogs
# treat an EMPTY --httpAuth value as "auth disabled", and Grafana starts
# auth-weak on a blank admin user/password — either used to deploy green with a
# published port left open. This assert now fails first, ahead of env.j2's
# hard-fail and compose's `:?` guard, and before anything touches state. It runs
# under --check, so a dry run with a missing or renamed vault var reports the var
# BY NAME instead of a Jinja trace.
#
# The loop item is the variable NAME, never its value: quiet:true trims success
# output, and on failure the assertion is reported as a literal expression while
# fail_msg names the variable — so no value prints either way.
#
# Condition, filter by filter — each one earns its place (matrix-tested):
#   default('', true)  a defined-but-null `vault_x:` (the natural way to blank a
#                      value) is None, and `None | length` crashes with a raw
#                      Jinja error instead of our message.
#   | string           a non-string value (an unquoted integer) crashes `trim`
#                      the same way.
#   | trim             a whitespace-only value used to PASS.
# Falsy scalars (0, false) are rejected as blank too — nonsense as a credential,
# and failing loud is the safe direction. No opt-out var: auth is mandatory.
- name: Assert observability credentials are set and non-empty
  ansible.builtin.assert:
    that:
      - lookup('vars', item, default='') | default('', true) | string | trim | length > 0
    fail_msg: >-
      {{ item }} is empty or undefined — the observability stack must never deploy
      with blank credentials: VM/VL would run with HTTP auth silently disabled on
      0.0.0.0:8428/9428, and Grafana would start auth-weak on :3000. Set it with
      `task vault:edit -- inventory/host_vars/<host>/vault.yml`.
    quiet: true
  loop:
    - vault_vm_auth_username
    - vault_vm_auth_password
    - vault_vl_auth_username
    - vault_vl_auth_password
    - vault_grafana_user
    - vault_grafana_password
    # Grafana alerting's SMTP relay (#139) — the SAME vault vars watchtower uses,
    # deliberately shared (see the comment block in templates/env.j2). Listed here
    # so a rename or a blanking fails at the top of the play, BY NAME, instead of
    # leaving Grafana with alert rules it can never deliver: a contact point that
    # cannot send is the same silent failure as no contact point at all.
    - vault_watchtower_email_server
    - vault_watchtower_email_port
    - vault_watchtower_email_user
    - vault_watchtower_email_password
    - vault_watchtower_email_from
    - vault_watchtower_email_to

# #152: the Telegram channel's credentials, asserted only when the channel is
# enabled — same filter chain, same quiet:true, same "fail BY NAME before
# anything touches state" contract as the block above. Gated rather than
# unconditional because the flag exists so the rest of the stack deploys on a
# host whose vault has no Telegram keys; but with the flag ON, a missing key must
# be a loud named failure and never a silently email-only Grafana. That is the
# same defect class as a contact point that cannot send.
- name: Assert Telegram alerting credentials are set and non-empty
  ansible.builtin.assert:
    that:
      - lookup('vars', item, default='') | default('', true) | string | trim | length > 0
    fail_msg: >-
      {{ item }} is empty or undefined but observability_alert_telegram is true —
      Grafana would provision a Telegram contact point that can never send, which
      is the same silent failure #152 exists to remove. Set it with
      `task vault:edit -- inventory/host_vars/eq12_docker/vault.yml`, or set
      observability_alert_telegram: false to deploy email-only.
    quiet: true
  loop:
    - vault_grafana_telegram_bot_token
    - vault_grafana_telegram_chat_id
  when: observability_alert_telegram | bool

# The scrape half of #133. Same shape as the Telegram assert above and for the
# same reason: a scrape job configured with an empty Bearer credential does not
# fail loudly — it 401s on every poll and reports the target permanently down,
# which is indistinguishable from Home Assistant actually being down. That is the
# exact ambiguity the scrape exists to remove, so it must never be deployed blind.
- name: Assert the Home Assistant scrape inputs are set and non-empty
  ansible.builtin.assert:
    that:
      - vault_ha_long_lived_token | default('', true) | string | trim | length > 0
      - observability_ha_scrape_target | default('', true) | string | trim | length > 0
    fail_msg: >-
      observability_ha_scrape is true but its inputs are incomplete.
      vault_ha_long_lived_token is minted in Home Assistant (profile -> Security ->
      Long-lived access tokens) and set with
      `task vault:edit -- inventory/host_vars/eq12_docker/vault.yml`;
      observability_ha_scrape_target is the host:port in host_vars. Set
      observability_ha_scrape: false to deploy without the liveness scrape.
    quiet: true
  when: observability_ha_scrape | default(false) | bool

# #178: the telegraf absence rules are scoped to ONE host name each, written into
# the rule file as `system_uptime{host="<name>"}` (that file's own comment argues
# why pinning beats the host-agnostic form, and states the cost). The cost is that
# a pinned rule cannot follow the fleet: move this role to another host, rename a
# host, or stand up a NEW telegraf agent, and the rules keep watching the names
# they were written with — a renamed host goes permanently NoData -> Alerting on
# a name nothing exports, while the new host's telegraf agent stream has no
# absence owner at all. Silence, not a page, and every deploy stays green. That
# is exactly the class of defect #178 exists to end.
#
# #186 widened the coupling from one name to a SET. The two physical Proxmox
# hosts now run NATIVE systemd telegraf agents (roles/telegraf_agent, inventory
# group `telegraf_agents`); eq12_docker is deliberately not in that group because
# its agent is the CONTAINER this stack itself deploys. So the expected set is
# DERIVED rather than hardcoded: group `telegraf_agents` PLUS this stack's own
# host, and every member must have a pinned rule in telegraf-health.yaml. Adding
# a host to that group therefore FAILS this deploy until its rule exists.
#
# THIS ASSERT IS WHAT A FUTURE OPERATOR TRIPS INSTEAD OF DISCOVERING THAT
# SILENCE — it forces the rule edit into the same change that adds a host to
# `telegraf_agents`, or that moves or renames this stack's host. Static
# (control-machine lookup + inventory only), so it runs under --check and fails
# before anything touches state.
#
# The values are parsed OUT OF the deployed rule file, like the datasource-uid
# check further down, so the guard cannot drift from what is actually provisioned.
#
# WHAT IT DOES NOT PROVE, stated so nobody reads more into a green run than is
# there: that those rules WORK. It matches selector STRINGS, so a rule that is
# `isPaused: true`, or whose noDataState is not Alerting, or whose `for:` was
# widened to hours, satisfies it exactly as a working rule does. Coverage of the
# host SET is this guard's whole claim.
#
# That those rules are actually SERVED and EVALUATED is proven separately, at the
# end of this file, by "Verify Grafana serves and evaluates exactly the
# provisioned alert rules" (#212) — a served-uid set equality against these same
# files, and a per-rule health/lastEvaluation check.
#
# READ THE HISTORY BEFORE TRUSTING THAT SENTENCE AGAIN, because it was a lie for
# the whole life of this comment. It used to end "...is proven separately, by this
# deploy's Grafana rule-count and rule-evaluation checks further down" while this
# role never called Grafana's alerting API at all. #189/#202 replaced the claim
# with a statement of the gap rather than leaving it standing — a comment pointing
# at a guard that does not exist is the same defect class as a guard that cannot
# fail, and worse in one respect: it stops the next reader from noticing. #212
# then BUILT the checks. The SET half has been seen to fail against live Grafana,
# on genuine drift nobody planted: three rules a sibling branch had applied to the
# shared host and that this repo does not declare (the mechanism behind that is now
# tracked as #220). Read the first sentence of this paragraph with that scope in
# mind — "evaluated" currently means "every rule reported a recent lastEvaluation
# and no datasource/exec error", which is NOT the same as "no rule's selector is
# dead"; the NoData case is documented at the checks themselves. If those tasks are
# ever removed, this paragraph goes with them.
#
# findall, NOT search, and the count is asserted FIRST — that ordering is the
# whole point. regex_search validates only the FIRST match, so if someone later
# quoted an expr verbatim in a comment ABOVE the real one, the guard would read
# the COMMENT and pass while the live selector said something else: a guard
# shadowed by prose. Asserting the count closes that, and it fails loud in both
# directions — too FEW matches (a host has no rule, the file was restructured, or
# a rule was widened to a regex matcher like host=~"a|b", which this literal
# anchor cannot read) and too MANY (a duplicate anchor, which is what a verbatim
# comment quote produces). Changing the shape of these selectors is a deliberate
# design change that must teach THIS guard the new shape in the same commit.
- name: Verify the telegraf alert rule's pinned host selector
  vars:
    _telegraf_rule_hosts: >-
      {{ lookup('file', role_path ~ '/files/data/grafana/provisioning/alerting/telegraf-health.yaml')
         | regex_findall('system_uptime\{host="([^"]+)"') }}
    # This stack's own host runs the CONTAINER agent and is deliberately NOT in
    # `telegraf_agents` (that group is the native-agent hosts); adding it here is
    # what makes the two delivery paths one expected set.
    # `unique` before `sort`: a host mistakenly placed in BOTH roles would
    # otherwise appear twice and fail the count assert below with a confusing
    # off-by-one instead of the real problem.
    _telegraf_expected_hosts: "{{ ([inventory_hostname] + groups['telegraf_agents']) | unique | sort }}"
  block:
    - name: Assert the telegraf alert rules expose one pinned host selector each
      ansible.builtin.assert:
        that:
          - _telegraf_rule_hosts | length == _telegraf_expected_hosts | length
        fail_msg: >-
          Expected {{ _telegraf_expected_hosts | length }} `system_uptime{host="..."`
          selectors in
          files/data/grafana/provisioning/alerting/telegraf-health.yaml — one per
          expected agent host {{ _telegraf_expected_hosts }} — but found
          {{ _telegraf_rule_hosts | length }}: {{ _telegraf_rule_hosts }}.
          TOO FEW means a host has no absence rule, or this guard can no longer
          read the file — it was restructured, or a rule was widened to a regex
          matcher (host=~"a|b"), which this literal anchor cannot parse. TOO MANY
          means an anchor is no longer unique, usually because a comment now
          quotes an expr verbatim; that is dangerous rather than merely untidy,
          because a first-match check would read the comment and pass while the
          live selector said something else. Either way the fix belongs in the
          same change: add the missing rule, make the anchors unique again, or
          teach this assert the new shape. Do not delete the guard to get past it.
        quiet: true

    - name: Assert the telegraf alert rules cover exactly the expected agent hosts
      ansible.builtin.assert:
        that:
          - _telegraf_rule_hosts | sort == _telegraf_expected_hosts
        fail_msg: >-
          The telegraf absence rules in
          files/data/grafana/provisioning/alerting/telegraf-health.yaml are scoped
          to {{ _telegraf_rule_hosts | sort }}, but the expected set is
          {{ _telegraf_expected_hosts }} — every host in inventory group
          `telegraf_agents` (the NATIVE systemd agents, roles/telegraf_agent) plus
          this stack's own host inventory_hostname={{ inventory_hostname }} (the
          CONTAINER agent this role deploys). Those rules are the only absence
          owners for telegraf's AGENT metric stream (system_uptime), and unlike
          obs-vector-metrics-absent they are NOT host-agnostic — they never pick
          up a new or renamed host on their own. Left as-is, the unmatched host's
          telegraf can die, or start stamping a container id / the literal
          ${TELEGRAF_HOSTNAME} as its host label, and nothing pages: every other
          telegraf-fed rule aggregates the host dimension away. You get silence,
          not an alert. ADDING A HOST TO `telegraf_agents` MEANS ADDING ITS RULE
          IN THE SAME CHANGE — this assert is what a future operator trips
          instead of silently getting no coverage. Fix by adding or editing the
          `expr` (with a matching uid and title) in that file, to
          {{ inventory_hostname }} if this is a rename of this stack's host.
          Widening an expr to a regex selector instead also means widening this
          assert in the same change; the count check above fails first and says
          so. Do not delete the guard to get past it.
        quiet: true

# #194: the RAPL absence rules carry a DOMAIN COUNT threshold (`lt 3` for eq12,
# `lt 1` for n5pro) that duplicates `telegraf_agent_rapl_expected_domains` in
# host_vars, and nothing at runtime reconciled the two — the #188 matched-pair
# defect, forty lines below the guard written for #188. Both drift directions
# are silent:
#   * host_vars SHRINKS (a domain added to telegraf_agent_rapl_exclude_domains):
#     the role's deploy assert still passes (it compares DELIVERED against
#     host_vars, and never reads this file), while `lt 3` now fires forever — a
#     rule that cries wolf until someone pauses it.
#   * host_vars GROWS (a kernel/board change adds `psys`): the role's assert
#     passes again, and `lt 3` can no longer see one domain go missing. Partial
#     loss stops being detectable, which is the entire reason the threshold is a
#     COUNT and not a presence check.
#
# The expected host set keys on `telegraf_agent_rapl_expected_domains` being
# declared rather than on telegraf_agent_rapl_power, because a role DEFAULT is
# not visible in hostvars for another host — only what host_vars actually sets
# is. That is sound rather than a workaround: the telegraf_agent role refuses to
# run on a RAPL-enabled host that declares no domains, so a host reaching this
# guard with the variable undefined is one where RAPL is off (nothing to own) or
# one whose own play has already failed.
#
# inventory_hostname is deliberately NOT added to the expected set here, unlike
# the system_uptime guard above: this stack's host runs the CONTAINER agent,
# which has no /sys/class/powercap of its own and exports no RAPL.
- name: Verify the RAPL absence rules match each host's declared domain set
  vars:
    _rapl_rules: >-
      {{ (lookup('file', role_path ~ '/files/data/grafana/provisioning/alerting/telegraf-health.yaml')
          | from_yaml).groups | map(attribute='rules') | flatten
         | selectattr('uid', 'match', '^obs-rapl-power-absent-') | list }}
    _rapl_rule_hosts: >-
      {{ _rapl_rules | map(attribute='uid')
         | map('regex_replace', '^obs-rapl-power-absent-', '') | sort }}
    _rapl_expected_hosts: >-
      {{ groups['telegraf_agents'] | map('extract', hostvars)
         | selectattr('telegraf_agent_rapl_expected_domains', 'defined')
         | map(attribute='inventory_hostname') | sort }}
  block:
    - name: Assert every RAPL-collecting host has an absence rule of its own
      ansible.builtin.assert:
        that:
          - _rapl_rule_hosts == _rapl_expected_hosts
        fail_msg: >-
          The RAPL absence rules in
          files/data/grafana/provisioning/alerting/telegraf-health.yaml are scoped
          to {{ _rapl_rule_hosts }}, but the hosts declaring
          telegraf_agent_rapl_expected_domains are {{ _rapl_expected_hosts }}.
          A MISSING rule means that host's exec collector can die while telegraf
          itself stays healthy and NOTHING pages — the exec input is a separate
          delivery path from the agent, and two delivery paths need two liveness
          owners (#174). An EXTRA rule means a rule pinned to a host that no
          longer collects RAPL, which will sit in noData and page forever. Adding
          a host to `telegraf_agents` with RAPL enabled means adding its rule in
          the same change. Do not delete the guard to get past it.
        quiet: true

    - name: Assert each RAPL rule's threshold equals that host's declared domain count
      vars:
        _host: "{{ item.uid | regex_replace('^obs-rapl-power-absent-', '') }}"
        _threshold: >-
          {{ (item.data | selectattr('refId', 'equalto', 'C') | first)
             .model.conditions[0].evaluator.params[0] }}
        _evaluator: >-
          {{ (item.data | selectattr('refId', 'equalto', 'C') | first)
             .model.conditions[0].evaluator.type }}
      ansible.builtin.assert:
        that:
          - _threshold | int == hostvars[_host].telegraf_agent_rapl_expected_domains | length
          # The COUNT alone is not the rule: `lt` is what makes a low count mean
          # "domains went missing". An lt->gt edit would invert the rule into one
          # that fires whenever collection is HEALTHY and never when it breaks,
          # while the count still matched and this guard still passed.
          - _evaluator == 'lt'
        fail_msg: >-
          Alert rule {{ item.uid }} fires {{ _evaluator }} {{ _threshold }} domains, but
          {{ _host }} declares
          {{ hostvars[_host].telegraf_agent_rapl_expected_domains | length }}
          ({{ hostvars[_host].telegraf_agent_rapl_expected_domains }}) in its
          host_vars, with comparison `{{ _evaluator }}` (must be `lt`). These are
          two copies of one fact and they have drifted. If
          the domain set changed, the threshold moves WITH it in the same change:
          a threshold above the real count fires forever, one below it stops
          detecting partial loss — the failure the count shape exists to catch.
          Do not "fix" this by lowering the threshold to silence an alert; find
          out which domain stopped arriving.
        quiet: true
      loop: "{{ _rapl_rules }}"
      loop_control:
        label: "{{ item.uid }}"

# #206: THE FROZEN-COUNTER RULES ARE A MATCHED PAIR WITH THE ABSENCE RULES ABOVE,
# and nothing else pins the two together.
#
# A frozen RAPL counter — readable, still delivered every 60s, never advancing —
# reads as a confident `power_watts=0.000000`, so the absence rules above cannot
# see it: the domain count is still right. The `obs-rapl-power-frozen-*` rules
# are the detector for that, and they are per-host and pinned exactly like their
# siblings, so they drift exactly like their siblings would: add a third
# RAPL-collecting host and it gets an absence owner (the assert above says so)
# while its frozen detector is silently missing. Same fault class as #188/#194 —
# two per-host rule families that must be added in one change.
#
# THE SHAPE IS CHECKED, NOT JUST THE HOST SET. Every clause below is a way this
# rule can be made permanently inert while still reading as a rule — but the list
# is deliberately NOT exhaustive, and saying so is part of the guard: it pins what
# a plausible edit would break (selector, aggregation, polarity, threshold, no-data
# handling, pause state, and the inventory that decides whether the series exists
# at all), not every field Grafana accepts. relativeTimeRange and execErrState are
# unpinned here, exactly as they are on the sibling rules; pin them fleet-wide in
# one change if that ever bites, rather than for this pair alone.
#   * a missing `domain="package-0"` pin widens it to every domain, and eq12's
#     `uncore` is legitimately 0.000000 for 18.6% of its samples with 6h maxima
#     of 0.000121-0.000305 W — BELOW the threshold (measured 2026-08-29), so the
#     widened rule does not merely risk a false alarm, it fires permanently on a
#     healthy iGPU;
#   * a wrong host pin evaluates a HEALTHY PEER, which is #160 one family over;
#   * `lt` is the polarity: gt fires whenever the machine is drawing power, i.e.
#     always, which is the inverted-rule hole found in the RAPL reconciler during
#     #194;
#   * a threshold of 0 can never fire — the max of a non-negative gauge is never
#     negative — so a well-meaning "make it exactly zero" edit turns the whole
#     detector into `assert: true` wearing an alert rule. A threshold ABOVE 0.01
#     fails too: package power idles at 1.49 W (eq12) and 5.38 W (n5pro), so an
#     epsilon anywhere near those fires forever;
#   * noDataState must stay OK. Absence is the sibling rule's job, at the same
#     severity and with the same runbook; Alerting here would double-report one
#     fault every time a host reboots (#151).
# Static (control-machine lookups only), so it runs under --check before anything
# deploys.
- name: Verify the RAPL frozen-counter rules match the RAPL absence rules
  vars:
    _rapl_all_rules: >-
      {{ (lookup('file', role_path ~ '/files/data/grafana/provisioning/alerting/telegraf-health.yaml')
          | from_yaml).groups | map(attribute='rules') | flatten | list }}
    _rapl_frozen_rules: >-
      {{ _rapl_all_rules | selectattr('uid', 'match', '^obs-rapl-power-frozen-') | list }}
    _rapl_frozen_hosts: >-
      {{ _rapl_frozen_rules | map(attribute='uid')
         | map('regex_replace', '^obs-rapl-power-frozen-', '') | sort | list }}
    # Re-derived from the file rather than reusing the block above: those vars are
    # scoped to that block, and a second copy of the host list here would be one
    # more pair of facts able to drift.
    _rapl_absent_hosts: >-
      {{ _rapl_all_rules | map(attribute='uid')
         | select('match', '^obs-rapl-power-absent-')
         | map('regex_replace', '^obs-rapl-power-absent-', '') | sort | list }}
  block:
    - name: Assert every RAPL absence owner also has a frozen-counter detector
      ansible.builtin.assert:
        that:
          - _rapl_frozen_hosts == _rapl_absent_hosts
          # Non-empty, or the equality above is satisfiable by two empty lists —
          # a guard that cannot fail. The absence-rule assert further up already
          # ties this list to inventory, so pinning it to that list is enough.
          - _rapl_frozen_hosts | length > 0
        fail_msg: >-
          The RAPL frozen-counter rules in
          files/data/grafana/provisioning/alerting/telegraf-health.yaml cover
          {{ _rapl_frozen_hosts }}, but the RAPL absence rules cover
          {{ _rapl_absent_hosts }} — and those two sets are one fact (#206).
          A host with an absence owner and no frozen detector is covered for a
          domain DISAPPEARING and blind to the same domain reading a confident,
          faithful 0.000000 W forever, which is the fault the frozen rule exists
          for and the one the count shape provably cannot see. An EXTRA frozen
          rule is pinned to a host that no longer collects RAPL. Add or remove
          the pair together; the assert above ties the absence set to inventory,
          and this one ties the frozen set to the absence set.
        quiet: true

    - name: Assert each frozen-counter rule is scoped and pointed the way it claims
      vars:
        _fz_host: "{{ item.uid | regex_replace('^obs-rapl-power-frozen-', '') }}"
        _fz_expr: >-
          {{ (item.data | selectattr('refId', 'equalto', 'A') | first).model.expr }}
        _fz_threshold: >-
          {{ (item.data | selectattr('refId', 'equalto', 'C') | first)
             .model.conditions[0].evaluator.params[0] }}
        _fz_evaluator: >-
          {{ (item.data | selectattr('refId', 'equalto', 'C') | first)
             .model.conditions[0].evaluator.type }}
      ansible.builtin.assert:
        that:
          - '''host="'' ~ _fz_host ~ ''"'' in _fz_expr'
          - '''domain="package-0"'' in _fz_expr'
          - _fz_evaluator == 'lt'
          - _fz_threshold | float > 0
          - _fz_threshold | float <= 0.01
          - item.noDataState == 'OK'
          # THE QUERIED SERIES MUST BE ABLE TO EXIST. Every clause above
          # reads the rule; this one reads INVENTORY, and it closes the one
          # failure that leaves the rule syntactically perfect and permanently
          # unfireable: package-0 moved into telegraf_agent_rapl_exclude_domains,
          # so the host never ships the series, the query is always empty, and
          # noDataState: OK turns that into a silent Normal forever. The sibling
          # threshold reconciler two tasks up reaches into hostvars the same way.
          - "'package-0' in hostvars[_fz_host].telegraf_agent_rapl_expected_domains"
          # max_over_time is the aggregation the whole rule rests on: a
          # min_over_time edit passes every other clause here and converts the
          # detector into fire-on-any-single-zero — the rule comment argues the
          # choice at length, and an argument in a comment is not a check.
          - "'max_over_time(' in _fz_expr"
          # A paused rule is not a rule. This is not hypothetical housekeeping:
          # the drill recipe in this role's README recommends staging drill rules
          # `isPaused: true`, which makes a pasted-and-forgotten pause an idiom
          # rather than an accident — and a paused rule reads identically to a
          # live one everywhere except this field.
          - item.isPaused == false
        fail_msg: >-
          Alert rule {{ item.uid }} does not have the shape a frozen-counter
          detector needs (#206). Its query is `{{ _fz_expr }}` and it fires
          `{{ _fz_evaluator }} {{ _fz_threshold }}` with noDataState
          `{{ item.noDataState }}`. It must select host="{{ _fz_host }}" (its own
          host — another name evaluates a healthy peer and reports on it, #160)
          AND domain="package-0" (the ONLY domain whose zero is impossible: eq12
          `uncore` reads exactly 0.000000 for 18.6% of its samples and its 6h
          maxima measured 0.000121-0.000305 W — BELOW this threshold — so a
          widened selector does not merely risk a false alarm, it fires
          PERMANENTLY on a healthy iGPU. For those domains ask the raw counter
          instead, via changes(rapl_energy_uj{...}[30m])). It must compare `lt`
          (`gt` fires whenever the machine draws power) against a threshold that
          is ABOVE zero and no higher than 0.01 W: `lt 0` can never fire, because
          the max of a non-negative gauge is never negative, and anything near
          the measured idle floor (1.492526 W on eq12, 5.382494 W on n5pro) fires
          forever. The aggregation must be `max_over_time(` — `min_over_time`
          passes every other check here and turns the rule into
          fire-on-any-single-zero. And `package-0` must be in
          {{ _fz_host }}'s telegraf_agent_rapl_expected_domains
          ({{ hostvars[_fz_host].telegraf_agent_rapl_expected_domains
             | default('<undeclared>') }}): excluding it at the source leaves this
          rule querying a series the host never ships, which is permanent NoData,
          which noDataState: OK renders as a permanent, silent Normal — a detector
          that cannot fire, reported green by every deploy. And noDataState must be OK — obs-rapl-power-absent-{{ _fz_host }}
          already owns absence at the same severity, so Alerting here
          double-reports one fault (#151). And isPaused must be false: a paused
          rule is indistinguishable from a live one in every other field, and
          this role's README recommends staging DRILL rules paused, so a pause
          left behind by a copy is a realistic way to ship a detector that never
          evaluates.
        quiet: true
      loop: "{{ _rapl_frozen_rules }}"
      loop_control:
        label: "{{ item.uid }}"

# #202: the SMART / sensors / fan absence rules, reconciled against inventory the
# same way the RAPL pair above is, and for the same measured reason — a threshold
# in a rule file and a count in host_vars are TWO COPIES OF ONE FACT, and both
# drift directions are silent:
#   * host_vars SHRINKS (a chip stops being collected on purpose): the role's own
#     deploy assert still passes — it compares DELIVERED against host_vars and
#     never reads this file — while the rule's threshold now fires forever.
#   * host_vars GROWS: the role's assert passes again, and the stale lower
#     threshold can no longer see one series go missing. Partial loss stops being
#     detectable, which is the entire reason these thresholds are COUNTS.
#
# The expected host sets key on the COUNT VARIABLE BEING DECLARED in host_vars
# rather than on a feature flag, exactly as the RAPL guard does and for the same
# reason: a role DEFAULT is not visible in hostvars for another host, only what
# host_vars actually sets. That is sound rather than a workaround — the
# telegraf_agent role refuses to run with the count left at its 0 default, so a
# host reaching this guard undeclared is one where the feature is off (nothing to
# own) or one whose own play has already failed.
#
# inventory_hostname is deliberately NOT in any expected set here: this stack's
# host runs the CONTAINER agent, which has no lm-sensors, no SMART devices of its
# own and no ACPI fan objects.
#
# Static (control-machine lookup + inventory only), so it runs under --check and
# fails before anything touches state.
- name: Verify the per-family absence rules match each host's declared counts
  vars:
    _fam_all_rules: >-
      {{ (lookup('file', role_path ~ '/files/data/grafana/provisioning/alerting/telegraf-health.yaml')
          | from_yaml).groups | map(attribute='rules') | flatten | list }}
    # uid prefix -> the host_vars fact that is the single source of truth for
    # that rule's threshold. Adding a counted family means adding a row here in
    # the same change, or its threshold goes unreconciled.
    _fam_count_specs:
      - prefix: obs-sensors-metrics-absent-
        var: telegraf_agent_expected_sensor_series
      - prefix: obs-fan-state-absent-
        var: telegraf_agent_acpi_fan_expected_count
    # DERIVED from _fam_count_specs, never a second copy of those prefixes.
    # Written longhand, this regex listed the two uid prefixes a SECOND time, and
    # a drift between the two copies would have been silent in the worst way: the
    # threshold loop at the end of this block would match nothing, iterate zero
    # times, and report ok for every rule it never checked — while the coverage
    # assert (which reads the specs) kept passing. An empty loop is `assert: true`
    # wearing a loop. Deriving the pattern makes that particular drift
    # unrepresentable; the per-spec size check in the coverage assert below is
    # what catches the general case.
    _fam_counted_rules: >-
      {{ _fam_all_rules
         | selectattr('uid', 'match',
                      '^(' ~ (_fam_count_specs | map(attribute='prefix') | join('|')) ~ ')')
         | list }}
    _smart_rule_hosts: >-
      {{ _fam_all_rules | map(attribute='uid')
         | select('match', '^obs-smart-metrics-absent-')
         | map('regex_replace', '^obs-smart-metrics-absent-', '') | sort | list }}
  block:
    - name: Assert every host declaring a per-family count has an absence rule of its own
      vars:
        _fam_rule_hosts: >-
          {{ _fam_all_rules | map(attribute='uid')
             | select('match', '^' ~ item.prefix)
             | map('regex_replace', '^' ~ item.prefix, '') | sort | list }}
        _fam_expected_hosts: >-
          {{ groups['telegraf_agents'] | map('extract', hostvars)
             | selectattr(item.var, 'defined')
             | map(attribute='inventory_hostname') | sort | list }}
      ansible.builtin.assert:
        that:
          - _fam_rule_hosts == _fam_expected_hosts
          # The same claim, made against the list the THRESHOLD loop actually
          # iterates. Without this, a restructured rule file or a renamed uid
          # scheme could leave that list empty and the threshold/polarity
          # reconciliation would retire itself silently — every deploy green, no
          # rule checked. Cheap to state here because _fam_expected_hosts is
          # already computed.
          - _fam_counted_rules | selectattr('uid', 'match', '^' ~ item.prefix)
            | list | length == _fam_expected_hosts | length
        fail_msg: >-
          The `{{ item.prefix }}*` absence rules in
          files/data/grafana/provisioning/alerting/telegraf-health.yaml are scoped
          to {{ _fam_rule_hosts }}, but the hosts declaring `{{ item.var }}` are
          {{ _fam_expected_hosts }}. A MISSING rule means that host's input can
          die while telegraf itself stays healthy and NOTHING notices — a separate
          producer from the agent stream, and two producers need two liveness
          owners (#174). An EXTRA rule means one pinned to a host that no longer
          collects the family, which will sit in NoData and fire forever. Adding
          the declaration and adding the rule are one change. Do not delete the
          guard to get past it.
        quiet: true
      loop: "{{ _fam_count_specs }}"
      loop_control:
        label: "{{ item.prefix }}"

    # SMART has no declared count — both hosts have exactly one device and there
    # is no host_vars list of disks to reconcile against, so its rules are
    # presence (`lt 1`) rather than a count. Coverage still has to be total,
    # so it keys on group membership: every native agent runs [[inputs.smart]].
    - name: Assert every native telegraf agent has a SMART absence rule
      ansible.builtin.assert:
        that:
          - _smart_rule_hosts == groups['telegraf_agents'] | sort | list
        fail_msg: >-
          The SMART absence rules in
          files/data/grafana/provisioning/alerting/telegraf-health.yaml are scoped
          to {{ _smart_rule_hosts }}, but inventory group `telegraf_agents` is
          {{ groups['telegraf_agents'] | sort | list }} and every member runs
          [[inputs.smart]] against its root NVMe. SMART is the family that depends
          on elevated privilege, and it fails QUIETLY — measured 2026-08-25, an
          unprivileged telegraf still emits smart_device_exit_status=2 and drops
          the other thirteen fields — so an uncovered host loses its disk wear,
          media-error and temperature data behind a perfectly green agent rule.
          Adding a host to `telegraf_agents` means adding its rule here in the
          same change.
        quiet: true

    - name: Assert each counted family rule's threshold equals that host's declared count
      vars:
        _fam_host: >-
          {{ item.uid | regex_replace('^(obs-sensors-metrics-absent-|obs-fan-state-absent-)', '') }}
        _fam_var: >-
          {{ 'telegraf_agent_expected_sensor_series'
             if item.uid.startswith('obs-sensors-metrics-absent-')
             else 'telegraf_agent_acpi_fan_expected_count' }}
        _fam_threshold: >-
          {{ (item.data | selectattr('refId', 'equalto', 'C') | first)
             .model.conditions[0].evaluator.params[0] }}
        _fam_evaluator: >-
          {{ (item.data | selectattr('refId', 'equalto', 'C') | first)
             .model.conditions[0].evaluator.type }}
      ansible.builtin.assert:
        that:
          - _fam_threshold | int == hostvars[_fam_host][_fam_var] | int
          # The COUNT alone is not the rule. `lt` is what makes a low count mean
          # "series went missing"; an lt->gt edit would invert this into a rule
          # that fires whenever collection is HEALTHY and never when it breaks,
          # while the count still matched and a shape-only guard still passed.
          # That exact hole was found in the RAPL reconciler during #194, which
          # is why it is checked here from the start rather than added later.
          - _fam_evaluator == 'lt'
        fail_msg: >-
          Alert rule {{ item.uid }} fires {{ _fam_evaluator }}
          {{ _fam_threshold }}, but {{ _fam_host }} declares
          `{{ _fam_var }}: {{ hostvars[_fam_host][_fam_var] }}` in its host_vars,
          with comparison `{{ _fam_evaluator }}` (must be `lt`). These are two
          copies of one board fact and they have drifted. If the hardware or the
          collected set changed, the threshold moves WITH the declaration in the
          same change: a threshold above the real count fires forever, one below
          it stops detecting partial loss — the failure the count shape exists to
          catch. Do not "fix" this by lowering the threshold to silence an alert;
          find out which series stopped arriving.
        quiet: true
      loop: "{{ _fam_counted_rules }}"
      loop_control:
        label: "{{ item.uid }}"

# #189: the ping absence rule's threshold is the NUMBER OF PING TARGETS, and that
# number lives in telegraf.conf's `urls` list. Two copies of one fact, and the
# drift is silent in the direction that matters: add a third ping target and the
# rule still fires only below 2, so that target can stop reporting forever and
# nothing sees it — the exact partial-loss blindness the count shape exists to
# prevent. Drop to one target and the rule fires permanently instead.
#
# The parse is SCOPED to the [[inputs.ping]] section rather than run over the
# whole file, and that scoping is load-bearing rather than tidy:
# [[inputs.http_response]] in the same file has its own `urls` list of FOUR
# entries, so an unscoped count would read 6 and this guard would be measuring
# something else while still looking like it worked. Verified both ways
# 2026-08-25 — the ping block parses to 2 and the http_response block to 4.
#
# `^\s*"` at line start matches only array ELEMENT lines: a commented-out target
# (`# "${ROUTER_IP}"`, in the file today) starts with `#` and is correctly not
# counted, and `interface = ""` does not start with a quote.
# Static, so it runs under --check before anything touches state.
- name: Verify the ping absence rule's threshold matches the configured ping targets
  vars:
    _ping_conf_block: >-
      {{ (lookup('file', role_path ~ '/files/data/telegraf/telegraf.conf')
          | regex_search('(?s)\[\[inputs\.ping\]\](.*?)(?=\n\[\[)', '\1')
          or ['']) | first }}
    _ping_targets: >-
      {{ _ping_conf_block | regex_findall('(?m)^\s*"[^"]+"') }}
    _ping_rules: >-
      {{ (lookup('file', role_path ~ '/files/data/grafana/provisioning/alerting/telegraf-health.yaml')
          | from_yaml).groups | map(attribute='rules') | flatten
         | selectattr('uid', 'equalto', 'obs-ping-metrics-absent') | list }}
  block:
    # The parse anchors are checked BEFORE the comparison. A block that failed to
    # match yields an empty string and a target count of 0, which would then be
    # compared against a threshold on a rule that may not exist — two wrongs
    # reading green. Same assert-the-count-first ordering the pinned-host guard
    # above uses, and for the same reason.
    - name: Assert the ping absence rule and the ping target list are both readable
      ansible.builtin.assert:
        that:
          - _ping_rules | length == 1
          - _ping_targets | length > 0
        fail_msg: >-
          This guard could not read what it compares: found
          {{ _ping_rules | length }} rule(s) with uid obs-ping-metrics-absent
          (expected exactly 1) and {{ _ping_targets | length }} ping target(s)
          parsed out of the [[inputs.ping]] section of
          files/data/telegraf/telegraf.conf (expected at least 1). Either the
          alert file was restructured, the rule was renamed, or the telegraf
          config no longer has an [[inputs.ping]] section followed by another
          [[inputs.*]] section — the parse is anchored on that. Teach this guard
          the new shape in the same change; do not delete it to get past this.
        quiet: true

    - name: Assert the ping absence rule's threshold equals the ping target count
      vars:
        _ping_threshold: >-
          {{ (_ping_rules[0].data | selectattr('refId', 'equalto', 'C') | first)
             .model.conditions[0].evaluator.params[0] }}
        _ping_evaluator: >-
          {{ (_ping_rules[0].data | selectattr('refId', 'equalto', 'C') | first)
             .model.conditions[0].evaluator.type }}
      ansible.builtin.assert:
        that:
          - _ping_threshold | int == _ping_targets | length
          # The COUNT alone is not the rule: `lt` is what makes a low count mean
          # "a target stopped reporting". An lt->gt edit would invert this into a
          # rule that fires whenever collection is HEALTHY and never when it
          # breaks, while the count still matched and this guard still passed —
          # the #194 finding, applied here rather than rediscovered.
          - _ping_evaluator == 'lt'
        fail_msg: >-
          Alert rule obs-ping-metrics-absent fires {{ _ping_evaluator }}
          {{ _ping_threshold }} targets, but [[inputs.ping]] in
          files/data/telegraf/telegraf.conf configures
          {{ _ping_targets | length }} ({{ _ping_targets }}), with comparison
          `{{ _ping_evaluator }}` (must be `lt`). These are two copies of one fact
          and they have drifted. Adding or removing a ping target means moving
          this threshold in the SAME change: a threshold below the real count
          makes a dead target undetectable, one above it fires forever. Do not
          "fix" this by lowering the threshold to silence an alert — find out
          which target stopped reporting.
        quiet: true

# #189/#202: THE SEVERITY GRADING OF THE FAMILY-ABSENCE RULES IS A DERIVED CLAIM,
# AND THIS IS WHAT KEEPS IT TRUE.
#
# Every per-input absence rule in telegraf-health.yaml is `severity: warning`,
# which routes email-only. That is not a default — it was derived from a fact
# measured across the whole alerting folder on 2026-08-25: NO RULE READS ANY OF
# THESE FAMILIES. They feed dashboards. Nothing safety-relevant goes blind while
# one of them fires, and the case that IS worth a page — the agent or the host
# gone — is already owned at severity critical by the obs-telegraf-metrics-absent
# rules. Same reasoning #193 used to demote truenas-metrics-absent.
#
# THE MOMENT A RULE READS ONE OF THESE FAMILIES, THAT GRADING IS FALSE, and the
# family's absence owner is silently under-graded: a rule would be alerting on
# data whose disappearance produces nothing louder than an email. That is #174's
# measured trap one level over — there, a thermal rule was paired with a liveness
# rule watching the wrong delivery path, the pairing broke, and the thermal rule
# went mute behind a green liveness rule. Nothing noticed, because nothing was
# checking the RELATIONSHIP.
#
# Both halves fail loudly, and both are needed:
#   A. every warning-severity rule in telegraf-health.yaml must declare a family
#      below — so adding a family rule without registering it FAILS, rather than
#      quietly opting that family out of half B;
#   B. no rule ANYWHERE in the alerting folder, other than those owners, may read
#      a declared family — so adding a consumer FAILS until the grading is redone.
#
# IT PARSES YAML, NEVER GREPS THE TEXT, and that is deliberate: this very task
# names `smart_device_` and `rapl_power_watts` in its own prose, and the rule
# files carry the family names throughout their comments. A text search would
# match the commentary and report consumers that do not exist — the
# guard-shadowed-by-prose trap the pinned-host assert above documents, inverted.
# Only `data[].model.expr` is read.
#
# Static (control-machine lookups only), so it runs under --check.
- name: Verify the dashboards-only families still have no alert consumers
  vars:
    _obs_alerting_dir_grading: "{{ role_path }}/files/data/grafana/provisioning/alerting"
    # Metric-name FRAGMENTS of the families whose absence is owned at WARNING.
    # A fragment, not a full name, so it matches every member of the family —
    # `smart_device_` matches smart_device_temp_c as well as the health_ok the
    # owner rule watches, which is the point: a consumer of ANY member re-grades
    # the whole family.
    #
    # THE TRAILING UNDERSCORES ARE LOAD-BEARING, and `docker_` is one character
    # away from breaking every deploy. Measured both ways 2026-08-25 rather than
    # argued: broadening `docker_` to `docker` makes this guard report TWO false
    # consumers and fail the observability deploy permanently —
    #   obs-telegraf-metrics-absent   expr contains host="eq12_docker", a HOST
    #                                 NAME; the rule is severity CRITICAL and
    #                                 reads no docker metric at all
    #   obs-docker-log-ingest-stalled a LogsQL rule, `_time:10m source:docker |
    #                                 count()` — a log source, not a metric
    # With the underscore, neither matches: there is no `_` after `docker` in
    # either. Same reasoning for `ping_`. Do not "tidy" these into bare words —
    # the fragment has to be narrow enough that only a real METRIC NAME matches
    # it, and a host name is the near-miss this fleet actually contains.
    _dashboards_only_families:
      - docker_
      - ping_
      - smart_device_
      - sensors_temp
      - acpi_fan_state
      - rapl_power_watts
      # #206. Registered in the same change that created the family, which is what
      # half A's fail_msg asks for — and it is not redundant with the line above
      # it: the deferred all-domain freshness rule reads rapl_energy_uj and NOT
      # rapl_power_watts, so without this fragment that future rule would be a
      # consumer of a warning-graded family that this guard could not see.
      - rapl_energy_uj
    _telegraf_health_rules: >-
      {{ (lookup('file', _obs_alerting_dir_grading ~ '/telegraf-health.yaml')
          | from_yaml).groups | map(attribute='rules') | flatten | list }}
    # DERIVED, not a hand-kept list, so the guard cannot drift from the rules
    # themselves — but derived on TWO properties, and the second one is not
    # decoration. Severity alone was the first version and it had a hole big
    # enough to drive the whole guard through: a genuine CONSUMER added to this
    # file as `severity: warning` — say an `obs-sensors-temp-high` thermal rule —
    # would be classified as an OWNER, sail through half A (its expr does contain
    # `sensors_temp`), and be REJECTED from half B's loop, which is the only
    # check that exists to catch it. The family would gain a real alert consumer
    # and this guard would report green. Requiring `-absent` in the uid as well
    # means a non-absence warning rule falls into half B where it belongs. Half
    # A's fail_msg has always said in prose that such a rule "does not belong in
    # telegraf-health.yaml"; this is what makes that more than a wish.
    #
    # `-frozen` JOINS `-absent` HERE (#206), and the distinction it has to hold
    # up is CONSUMER vs HEALTH OWNER. obs-rapl-power-frozen-* reads
    # rapl_power_watts, so half B would flag it as a consumer and fail the
    # deploy — but the grading claim half B protects is "nothing goes blind
    # ABOVE warning when this family disappears", and a frozen-counter rule
    # cannot violate it: it is a second health owner of the same family, at the
    # same severity, whose entire blind spot (the family gone) is the sibling
    # absence rule's FIRING condition — which is exactly why it carries
    # noDataState: OK. It never reads the value as data about the machine; it
    # reads it as a statement about the pipeline, the same job as `-absent` in
    # the value domain rather than the presence domain.
    #
    # The narrowness that made this list `-absent` in the first place survives:
    # the hypothetical this guard was written to catch — an `obs-sensors-temp-high`
    # thermal rule at severity warning — still falls into half B, because a rule
    # that consumes a family for a decision about the HARDWARE has no business
    # calling itself `-absent` or `-frozen`. Adding a third suffix here means
    # making that same argument for it, in writing, or the grading quietly stops
    # being enforced for whatever it admits.
    _family_owner_rules: >-
      {{ _telegraf_health_rules
         | selectattr('labels.severity', 'defined')
         | selectattr('labels.severity', 'equalto', 'warning')
         | selectattr('uid', 'search', '-(absent|frozen)') | list }}
    _family_owner_uids: >-
      {{ _family_owner_rules | map(attribute='uid') | sort | list }}
    # obs-docker-metrics-unlabelled reads `docker_.+` and is severity CRITICAL,
    # so half B would flag it. Allowlisted with the reason rather than by
    # widening the family list: it is not a CONSUMER of docker metrics. Its
    # selector is `host=""`, i.e. it matches only the broken state in which the
    # label has been stripped, and the value is never read as docker data. It
    # detects mislabelling; it does not depend on the family arriving at all.
    _family_consumer_allowlist:
      - obs-docker-metrics-unlabelled
  block:
    # #201: notification-templates.yaml is the ONE declared NON-RULE document in
    # this directory — a provisioned Grafana notification template (the [DRILL]
    # marker), not a rule file. It is named here, and at three more glob sites in
    # this file, EXPLICITLY rather than swallowed by a `default([])`: each guard
    # gets taught about it deliberately, which is what the per-file assert below
    # demands in its own fail_msg. Consequence, and it is the desired one: a
    # SECOND non-rule file in this folder fails every one of those guards until
    # someone teaches all four, one edit at a time. Do not replace these literals
    # with a shared list — that would turn four deliberate decisions into one.
    - name: Read every provisioned alert rule for the grading check
      ansible.builtin.set_fact:
        _obs_all_rules: >-
          {{ _obs_all_rules | default([])
             + ((lookup('file', item) | from_yaml).groups | default([])
                | map(attribute='rules') | flatten | list) }}
      loop: >-
        {{ query('fileglob', _obs_alerting_dir_grading ~ '/*.yaml') | sort
           | reject('search', '/notification-templates[.]yaml$') | list }}
      loop_control:
        label: "{{ item | basename }}"

    # PER FILE, not just in aggregate. `.groups | default([])` above turns a file
    # that lost its `groups` key — a restructure, a stray indent — into a silent
    # zero-rule contribution, and the aggregate witness below cannot see it: 33
    # is still comfortably greater than telegraf-health.yaml's 13 with an entire
    # file missing. Every file in this directory is a rule document today, so
    # "yields at least one rule" is the right claim; a future non-rule file here
    # means teaching this assert about it, deliberately.
    #
    # #201 is that future, and this is what "deliberately" looks like:
    # notification-templates.yaml is EXCLUDED BY NAME from the loop below, not
    # admitted by relaxing the assert. The claim the guard makes is unchanged —
    # every file it looks at is a rule document and must yield rules — so a
    # rule file that loses its `groups:` key still fails here, and any OTHER
    # non-rule file added to this folder fails here too, which is the point.
    # Measured before the exclusion landed: this assert failed the deploy on
    # notification-templates.yaml, naming the file. A guard seen to fail.
    - name: Assert every alerting file actually contributed rules
      vars:
        _file_rules: >-
          {{ ((lookup('file', item) | from_yaml).groups | default([]))
             | map(attribute='rules') | flatten | list }}
      ansible.builtin.assert:
        that:
          - _file_rules | length > 0
        fail_msg: >-
          {{ item | basename }} contributed ZERO rules to the grading check. Every
          file in files/data/grafana/provisioning/alerting/ is a rule document, so
          this means the file lost its top-level `groups:` key (a restructure or a
          stray indent) and `| default([])` silently swallowed it. The aggregate
          size check below cannot see this — the other files still add up to more
          than one file's worth — so the consumer sweep would simply stop covering
          that file's rules while every deploy stayed green. Fix the file, or, if
          a genuine non-rule file now lives here, teach this assert about it —
          as #201 did for notification-templates.yaml, by naming it in the
          reject() below rather than by weakening the assertion.
        quiet: true
      loop: >-
        {{ query('fileglob', _obs_alerting_dir_grading ~ '/*.yaml') | sort
           | reject('search', '/notification-templates[.]yaml$') | list }}
      loop_control:
        label: "{{ item | basename }}"

    # The witness set must be non-empty and BIGGER than this one file, or half B
    # is checking almost nothing while reporting success. A fileglob that matched
    # nothing would otherwise turn the consumer assert into `assert: true` — a
    # guard that cannot fail, which is the thing this whole change is about.
    - name: Assert the grading check actually read the whole alerting folder
      ansible.builtin.assert:
        that:
          - _obs_all_rules | default([]) | length > _telegraf_health_rules | length
          - _family_owner_uids | length > 0
        fail_msg: >-
          This guard read {{ _obs_all_rules | default([]) | length }} rules across
          {{ _obs_alerting_dir_grading }} and found
          {{ _family_owner_uids | length }} warning-severity family owners in
          telegraf-health.yaml, which cannot be right — the folder holds several
          rule files and telegraf-health.yaml alone has
          {{ _telegraf_health_rules | length }} rules. A fileglob that matches
          nothing turns the consumer check below into `assert: true`. Fix the path
          or the parse; do not delete this.
        quiet: true

    - name: Assert every warning-severity absence rule declares a dashboards-only family
      vars:
        _owner_exprs: >-
          {{ item.data | default([]) | map(attribute='model') | map('default', {}, true)
             | map(attribute='expr', default='') | join(' ') }}
      ansible.builtin.assert:
        that:
          - _dashboards_only_families | select('in', _owner_exprs) | list | length > 0
        fail_msg: >-
          Alert rule {{ item.uid }} is severity=warning in telegraf-health.yaml,
          but none of the declared dashboards-only families
          {{ _dashboards_only_families }} appears in its expression
          ({{ _owner_exprs }}). Every warning-severity rule in that file is a
          per-input ABSENCE OWNER, and its warning grading rests on the family it
          watches having no alert consumers. A family that is not declared here is
          not checked for consumers at all — so the grading would be an unverified
          assumption rather than an enforced one. Add the family's metric-name
          fragment to _dashboards_only_families in this task, in the same change
          that adds the rule. If this rule is warning for some OTHER reason, it
          does not belong in telegraf-health.yaml.
        quiet: true
      loop: "{{ _family_owner_rules }}"
      loop_control:
        label: "{{ item.uid }}"

    - name: Assert no other rule consumes a family whose absence is only a warning
      vars:
        _other_exprs: >-
          {{ item.data | default([]) | map(attribute='model') | map('default', {}, true)
             | map(attribute='expr', default='') | join(' ') }}
        _consumed: >-
          {{ _dashboards_only_families | select('in', _other_exprs) | list }}
      ansible.builtin.assert:
        that:
          - _consumed | length == 0
        fail_msg: >-
          Alert rule {{ item.uid }} reads the metric family/families
          {{ _consumed }}, whose absence owner in telegraf-health.yaml is only
          `severity: warning` (email-only). That grading was DERIVED from those
          families having no alert consumers — a dashboards-only outage does not
          deserve a page, which is the #193 posture. It is now false: something
          ALERTS on this family, so its disappearance blinds a rule while
          producing nothing louder than an email. This is #174's trap — a rule and
          its liveness owner drifting out of pairing, with the liveness side
          staying green.
          THE RE-GRADE IS TWO EDITS, NOT ONE, and doing only the first leaves this
          same guard failing on the owner itself: promoting the owner to
          `severity: critical` takes it OUT of the derived owner set above, so it
          drops into THIS loop and matches its own family fragment. So: promote
          the owner's severity AND remove that family's fragment from
          _dashboards_only_families in the same change — the fragment list is the
          "dashboards-only" declaration, and a family that has gained an alert
          consumer is by definition no longer dashboards-only.
          Alternatively, if this rule genuinely does not depend on the family
          ARRIVING, allowlist it in _family_consumer_allowlist with the reason
          written beside it — as obs-docker-metrics-unlabelled is.
        quiet: true
      loop: >-
        {{ _obs_all_rules | default([])
           | rejectattr('uid', 'in', _family_owner_uids)
           | rejectattr('uid', 'in', _family_consumer_allowlist) | list }}
      loop_control:
        label: "{{ item.uid }}"

# #188: the notification policy's `group_by` and the rules' `by (...)` clauses
# are a MATCHED PAIR, and nothing at runtime reconciles them. Grouping on a
# label that no alert instance carries is a NO-OP, and a SILENT one: Grafana
# accepts any label name in group_by, provisioning succeeds, every deploy stays
# green, and the only symptom is a notification that merges instances it should
# have split — a `[FIRING:2]` whose subject names neither. That is exactly what
# #176's `disk` key became the moment #174 repointed the thermal rules at the
# API poller, whose per-drive label is `devname`; it sat inert until #188.
#
# The two asserts below make each half of the pair fail loudly:
#   A — every label a TrueNAS rule aggregates on is IN group_by (a missing key
#       merges instances that exist precisely to be told apart);
#   B — every group_by key is aggregated on by at least one rule (an inert key
#       claims protection nothing provides).
#
# Pure control-machine lookups, so they run under --check and fail before
# anything touches state — and they read the SAME files the deploy ships, so
# the guard cannot drift from what is provisioned.
#
# The witness sets are parsed with from_yaml and walked down to the rules' own
# `expr` fields — NOTHING else in those files is read. Prose therefore cannot
# feed the guard: neither a `by (disk)` in a comment (this repo's history has
# one) nor an expr quoted in an annotation can re-legitimize a dead key. Both
# forms are live here — telegraf-health.yaml's description scalar contains
# `count by (host) (system_uptime)` as operator guidance, and under the earlier
# regex-over-raw-text parse it was silently voting `host` into the witness set.
# Same guard-shadowed-by-prose trap the telegraf selector assert above closes,
# one layer deeper.
#
# The POLICY side cannot work that way — a .j2 is not YAML until it renders —
# so it stays a regex slice, and assert A pays for that with two parse-anchor
# preconditions: the `group_by:`/`group_wait:` anchors must each occur exactly
# once, or the slice silently reads the wrong span.
- name: Verify the alert grouping labels and the notification policy's group_by agree
  vars:
    _obs_alerting_dir: "{{ role_path }}/files/data/grafana/provisioning/alerting"
    _obs_policy_template: "{{ lookup('file', role_path ~ '/templates/grafana-notification-policies.yaml.j2') }}"
    # The root group_by list only: the template's routes and prose mention label
    # names too, and a whole-file findall would read them as keys. Comments are
    # still stripped here because this half is a raw-text slice.
    _obs_policy_group_by: >-
      {{ (_obs_policy_template.split('group_by:')[1].split('group_wait:')[0])
         | regex_replace('(?m)^\s*#.*$', '')
         | regex_findall('-\s*(\w+)') }}
    # The glob is unpacked as VARARGS on purpose: `query('file', <list>)` does
    # not flatten its terms (ansible-core 2.19+ hands the file lookup the list
    # itself and it dies with "'_AnsibleLazyTemplateList' object has no
    # attribute 'split'"; reproduced on 2.21). `*` gives the lookup one term
    # per path.
    #
    # notification-templates.yaml is rejected BY NAME (#201): it is the one
    # declared non-rule document here (a provisioned notification template — the
    # [DRILL] marker), it has no `groups:` key, and this chain's
    # `map(attribute='groups')` carries NO default on purpose — a rule file that
    # lost its `groups:` key must raise here rather than quietly shrink the
    # witness set, because a shrunken set makes assert B (no inert group_by key)
    # fail and assert A pass on almost nothing. Excluding the file by name keeps
    # that strictness intact for every file that IS a rule document; adding
    # `default=[]` instead would have bought the same green run at the cost of
    # the guard.
    _obs_all_by_labels: >-
      {{ ((query('file', *(query('fileglob', _obs_alerting_dir ~ '/*.yaml')
                           | reject('search', '/notification-templates[.]yaml$') | list))
           | map('from_yaml') | map(attribute='groups') | flatten
           | map(attribute='rules') | flatten
           | map(attribute='data') | flatten
           | map(attribute='model')
           | selectattr('expr', 'defined')
           | map(attribute='expr')
           | map('regex_findall', 'by \(([^)]+)\)')
           | flatten | join(',')).split(','))
         | map('trim') | reject('equalto', '') | unique | list }}
  block:
    # FLEET-WIDE since #198. It was TrueNAS-scoped when #188 added it, because
    # generalizing it then would have been a real routing change rather than a
    # lint fix: the other rule files aggregate on `host`, `check_type`,
    # `error_type` and `intentional`, and none were in group_by. #198 made that
    # routing change — all four are now group_by keys, with the reasoning per
    # key in the policy template — so the assert can finally read every rule
    # file, and a TrueNAS rule added in a NEW sibling file is covered too.
    #
    # This direction (A) and the inert-key check (B) are now both total: A says
    # every label the rules aggregate on is grouped on, B says every key grouped
    # on is aggregated on by some rule. Together they pin the two sides to each
    # other, in both directions, across all seven files.
    - name: Assert every label ANY alert rule aggregates on is in the policy's group_by
      ansible.builtin.assert:
        that:
          - _obs_policy_template | regex_findall('group_by:') | length == 1
          - _obs_policy_template | regex_findall('group_wait:') | length == 1
          - _obs_policy_group_by | length >= 2
          # Fleet-wide floor (#198). The union across all seven rule files was
          # TEN labels when this was written; >= 2 was the TrueNAS-scoped floor
          # and would no longer detect a collapsed parse here.
          - _obs_all_by_labels | length >= 6
          - _obs_all_by_labels | difference(_obs_policy_group_by) | length == 0
        fail_msg: >-
          The provisioned alert rules aggregate on
          {{ _obs_all_by_labels }} but the notification policy's group_by is
          {{ _obs_policy_group_by }} — missing:
          {{ _obs_all_by_labels | difference(_obs_policy_group_by) }}
          (#188 for TrueNAS, #198 fleet-wide).
          A label absent from group_by is not grouped on, so every instance of
          such a rule merges into ONE notification whose subject names none of
          them: two drives crossing 47C together, or two degraded pools, arrive
          as a single [FIRING:2]. Fix by adding the missing key(s) to
          templates/grafana-notification-policies.yaml.j2 — the POLICY is the
          side that drifts. Do NOT instead rewrite the rule exprs to aggregate
          on whatever the policy happens to say: `by (disk)` would empty every
          $labels.devname interpolation in the summaries, which then render as
          EMPTY strings — "TrueNAS disk  is at 48C", the drive name simply gone.
          A short list on either side means this guard can no longer PARSE its
          inputs (group_by carries 12 keys; the seven rule files aggregate on 10
          distinct labels) — an empty parse would make the comparison trivially
          true, i.e. a silent-green guard. Teach it the new shape; do not delete
          it.
          A duplicated `group_by:` or `group_wait:` anchor fails the same way
          and for the same reason: the policy list is sliced out of the raw
          template between those two literals (a .j2 cannot be parsed as YAML),
          so a second occurrence — a comment written with the colon, or a
          per-route override — silently mis-slices the span and the guard reads
          a list nobody deploys.
        quiet: true

    - name: Assert no notification-policy group_by key is inert
      vars:
        # grafana_folder and alertname are supplied by Grafana on every alert,
        # never by a rule expr, so they can never appear in a `by (...)`.
        _obs_inert_group_by_keys: >-
          {{ _obs_policy_group_by
             | difference(['grafana_folder', 'alertname'])
             | difference(_obs_all_by_labels) }}
      ansible.builtin.assert:
        that:
          - _obs_all_by_labels | length > 0
          - _obs_inert_group_by_keys | length == 0
        fail_msg: >-
          The notification policy's group_by carries
          {{ _obs_inert_group_by_keys }}, which NO provisioned alert rule
          aggregates on — no alert instance can carry the label, so the key
          groups nothing (#188). This is the `disk` defect: an inert key reads
          like per-instance protection and provides none. Either delete the
          key from templates/grafana-notification-policies.yaml.j2, or correct
          it to the label the rules actually emit (`disk` -> `devname`). A
          label that appears only in a COMMENT, a summary or a description does
          not count: this guard reads the rules' `expr` fields and nothing else,
          on purpose.
          An empty label set means this guard could not read
          files/data/grafana/provisioning/alerting/*.yaml at all; fix the
          parser rather than the symptom.
        quiet: true

# #181: a deep link is a PAIR, and half of one is boot-fatal for the whole
# Grafana process. Measured 2026-08-24 on this fleet: a single
# `__dashboardUid__` with no `__panelId__` beside it made Grafana's file
# provisioner reject the document, and provisioning is a startup-blocking
# module — ten "Starting Grafana" lines, zero "HTTP Server Listen", all 22
# provisioned rules withdrawn, the alerting stack gone until the annotation was
# paired. See
# docs/solutions/integration-issues/grafana-alert-panelid-pairing-breaks-all-provisioned-rules.md
#
# NOTHING ELSE IN THIS REPO CAN SEE IT. The alerting YAML and the dashboard JSON
# are role files/ content, rsynced verbatim; the document stays valid YAML,
# ansible-lint and --syntax-check pass, and `--check` skips the Grafana restart
# entirely (`when: not ansible_check_mode` further down), so the dry run of the
# change that kills Grafana is green. Before this guard the live apply was the
# first real test. These asserts are pure control-machine lookups over the SAME
# files the deploy ships, so they run under --check and fail before anything
# touches state.
#
# FIVE FAULTS. A, B and C are the ones the format itself creates; D and E are
# ways THIS GUARD was measured going green over a real defect (adversarial
# fixtures, 2026-08-29 — every one of them is a regression test now, and the
# reason the read surface below is deliberately wider than "the files we happen
# to ship today"):
#   A. PAIRING — `__dashboardUid__` XOR `__panelId__` is the boot-fatal shape.
#   B. EXISTENCE — a link to a dashboard uid or a panel id that is not in the
#      deployed JSON. Grafana accepts it happily: the notification still carries
#      a "View panel" button, and the button opens nothing or the wrong graph.
#      There is no error at any layer, which is why it needs a static check.
#   C. PINNING — a referenced dashboard in which ANY panel lacks an explicit
#      `id`, or in which two panels share one. Grafana assigns ids at load to
#      panels that have none, so a dashboard that is not fully and UNIQUELY
#      pinned makes every id in it an accident of document order; the link
#      validates today and silently drifts the next time a panel is inserted,
#      reordered, or re-exported from the UI. Only REFERENCED dashboards are
#      checked — the six home-assistant dashboards have no pinned ids and no
#      alert rules pointing at them, and pinning them is its own change, not a
#      side effect of this one.
#   D. A ROW ID IS NOT A LINKABLE PANEL. Rows carry ids and consume them, but
#      `?viewPanel=<row id>` renders nothing, so a link at a row is as dead as a
#      link at a non-existent id and just as silent. Live dashboards keep their
#      rows at round numbers — 1/10/20/30/40/50/60 on the host dashboards,
#      1/4/9/12/15 on the NAS one — so every real link here is one dropped digit
#      away from landing on one. Rows are therefore excluded from the LINKABLE
#      set while still counting toward the pinning check, because they do
#      consume ids. A collapsed row's CHILD panels stay linkable.
#   E. AN UNREAD FILE IS AN UNGUARDED FILE. Grafana's provisioner loads .yaml,
#      .yml AND .json out of this directory, and the rsync ships whatever is in
#      it. A guard that globbed `*.yaml` alone reported green over an `evil.yml`
#      carrying exactly the 2026-08-24 half-pair. So the read is by extension
#      set, not by habit, and a second assert insists the directory holds
#      NOTHING ELSE — a stray backup or editor artefact in a directory that is
#      rsynced verbatim into Grafana's provisioning path is a decision to make
#      deliberately, not to discover later.
#
# NOT in the read surface, deliberately: alerting/contact-points.yaml and
# alerting/notification-policies.yaml are TEMPLATED straight to the host
# (see the two template tasks below) and excluded from the rsync, so they exist
# only under {{ data_mount }} and never in this repo directory. They carry no
# alert rules and no deep links; the group_by reconciler above reads the policy
# template on its own terms.
#
# It reads YAML and JSON structurally and looks at `annotations` and `panels`
# and nothing else, so prose cannot feed it — the rule files name both
# annotation tokens throughout their comments (this task does too), and a
# grep-shaped version of this guard would report links that do not exist.
#
# Every dunder key is read with ['...'] and never as an attribute: `foo.__x__`
# is an attribute lookup first in Jinja, and dunder attributes are exactly what
# a sandboxed template environment refuses.
- name: Verify every alert deep link is a paired, pinned reference
  vars:
    _obs_alerting_dir_links: "{{ role_path }}/files/data/grafana/provisioning/alerting"
    _obs_dashboard_dir: "{{ role_path }}/files/data/grafana/dashboards"
    # `filetree`, NOT `fileglob`, in both directions and for two separate
    # reasons. Reading: fileglob is neither recursive nor multi-extension here,
    # and Grafana's provisioner is both — it walks the tree and loads
    # .yaml/.yml/.json alike. Dashboards: fileglob globs only the BASENAME and
    # treats the dirname as a search path, so `<dir>/*/*.json` resolves nothing
    # and warns "Unable to find '<dir>/*' in expected paths" — measured on the
    # first dry run of #181, where it read ZERO dashboards.
    _obs_alerting_files: >-
      {{ query('filetree', _obs_alerting_dir_links)
         | selectattr('state', 'equalto', 'file')
         | map(attribute='src') | select('search', '\.(ya?ml|json)$') | sort }}
    # Everything else sitting in the same rsynced directory. `.gitkeep` is the
    # one sanctioned resident (it holds the otherwise-empty dir in git and
    # Grafana ignores it); anything else has to be justified in this list.
    _obs_alerting_unread: >-
      {{ query('filetree', _obs_alerting_dir_links)
         | selectattr('state', 'equalto', 'file')
         | map(attribute='src') | reject('search', '\.(ya?ml|json)$')
         | reject('search', '/\.gitkeep$') | list }}
    _obs_dashboard_files: >-
      {{ query('filetree', _obs_dashboard_dir)
         | selectattr('state', 'equalto', 'file')
         | map(attribute='src') | select('search', '\.json$') | sort }}
    # Number of rules carrying a __dashboardUid__, counted over annotation KEYS
    # rather than by attribute lookup. This is the witness that the guard has
    # real input: the tree ships deep links today, so zero means broken parse.
    _obs_link_annotation_count: >-
      {{ _obs_link_rules | default([])
         | map(attribute='annotations', default={}) | map('default', {}, true) | map('list') | flatten
         | select('equalto', '__dashboardUid__') | list | length }}
  block:
    - name: Assert the alerting directory holds nothing the deep-link guard skips
      ansible.builtin.assert:
        that:
          - _obs_alerting_unread | length == 0
        fail_msg: >-
          files/data/grafana/provisioning/alerting/ contains
          {{ _obs_alerting_unread | map('basename') | list }}, which this guard
          does not read. That directory is rsynced VERBATIM into Grafana's
          provisioning path, and Grafana's provisioner loads .yaml, .yml and
          .json out of it — so a file the guard skips is a file that can carry an
          unpaired __dashboardUid__ into a live Grafana and crash-loop it with
          every check here still green. That is not hypothetical: it is how this
          guard was measured passing over an `evil.yml` half-pair on 2026-08-29.
          Either give it a provisioning extension so it is read and checked, or
          take it out of a directory that ships verbatim to the host. If it is a
          new kind of inert file that genuinely belongs here, add it to the
          reject list in this task's vars WITH the reason — do not widen the
          pattern to make the failure go away.
        quiet: true

    - name: Read every deployed dashboard's uid and pinned panel ids
      vars:
        _dash: "{{ lookup('file', item) | from_json }}"
        # One level of nesting: a COLLAPSED row carries its children in its own
        # `panels` list, and those children are linkable panels with ids of their
        # own. Every dashboard in the tree is flat today (measured 2026-08-29:
        # 0 nested panels across all nine), so this arm is protection against the
        # first collapsed row rather than something currently exercised.
        _dash_panels: >-
          {{ (_dash.panels | default([]))
             + ((_dash.panels | default([])) | map(attribute='panels', default=[]) | flatten | list) }}
        # Every id in the document, rows included — rows consume ids, so this is
        # the list the FULL-PINNING check has to be made against.
        _dash_ids_all: >-
          {{ _dash_panels | selectattr('id', 'defined') | map(attribute='id') | map('string') | list }}
        # The row ids, computed separately rather than with a rejectattr on
        # `type`: a panel with no `type` key at all must survive this step, and
        # rejectattr on a missing attribute is exactly where that would break.
        _dash_row_ids: >-
          {{ _dash_panels | selectattr('type', 'defined')
             | selectattr('type', 'equalto', 'row')
             | selectattr('id', 'defined') | map(attribute='id') | map('string') | list }}
      ansible.builtin.set_fact:
        _obs_dashboard_panels: >-
          {{ (_obs_dashboard_panels | default({})) | combine({
               (_dash.uid | default('')): {
                 'file': item | basename,
                 'panels': _dash_panels | length,
                 'pinned': _dash_ids_all | unique | length,
                 'ids': _dash_ids_all | difference(_dash_row_ids),
                 'rows': _dash_row_ids,
               } }) }}
      loop: "{{ _obs_dashboard_files }}"
      loop_control:
        label: "{{ item | basename }}"

    # notification-templates.yaml (#201) is the one NON-RULE document in this
    # directory and it is READ HERE ON PURPOSE — the only one of the five
    # alerting-dir consumers that does not exclude it. The other four assert
    # rule-shaped properties, so a document with no `groups:` has to be named
    # out of them. This guard asserts the opposite kind of property: that
    # nothing Grafana LOADS out of this directory can carry an unpaired
    # __dashboardUid__ into a boot-fatal provisioning error. Grafana loads that
    # file, so excluding it would re-open exactly the hole the `evil.yml`
    # measurement above closed. `.groups | default([])` gives it a zero-rule
    # contribution, which is inert here (the witness assert below counts rules
    # in AGGREGATE, never per file).
    - name: Read every provisioned alert rule for the deep-link check
      ansible.builtin.set_fact:
        _obs_link_rules: >-
          {{ _obs_link_rules | default([])
             + ((lookup('file', item) | from_yaml).groups | default([])
                | map(attribute='rules') | flatten | list) }}
      loop: "{{ _obs_alerting_files }}"
      loop_control:
        label: "{{ item | basename }}"

    - name: Assert the deep-link check actually read the rules and the dashboards
      ansible.builtin.assert:
        that:
          - _obs_link_rules | default([]) | length > 0
          - _obs_dashboard_panels | default({}) | length > 0
          - "'' not in (_obs_dashboard_panels | default({}))"
          - _obs_dashboard_files | length == (_obs_dashboard_panels | default({}) | length)
          - _obs_link_annotation_count | int > 0
        fail_msg: >-
          This guard read {{ _obs_link_rules | default([]) | length }} alert rules
          from {{ _obs_alerting_files | length }} files and
          {{ _obs_dashboard_files | length }} dashboard files yielding
          {{ _obs_dashboard_panels | default({}) | length }} uids
          ({{ (_obs_dashboard_panels | default({})) | dict2items
              | map(attribute='key') | sort | join(', ') }}), and found
          {{ _obs_link_annotation_count }} rules carrying a __dashboardUid__.
          FEWER UIDS THAN FILES means two dashboards share a uid: they collapse
          into one entry in this guard's accumulator, last file wins, and every
          link into that uid is then judged against the WRONG file's panels —
          measured going green over exactly that on 2026-08-29. Grafana has the
          same problem at import, so the fix is the dashboard's, not the guard's.
          An empty-string uid means a dashboard JSON has no `uid` key at all:
          Grafana would assign one at import and no alert link could ever address
          it. A ZERO anywhere else means the parse or the directory walk is
          broken, not that the links were removed — the tree ships deep links
          today (telegraf-health.yaml and truenas-health.yaml) — and a guard
          whose input is empty is `assert: true`, the exact shape this repo keeps
          being bitten by. Fix the parse, the filetree walks, or the dashboard,
          and do not delete this.
        quiet: true

    - name: Assert every alert deep link carries BOTH reserved annotations
      vars:
        _ann: "{{ item.annotations | default({}, true) }}"
      ansible.builtin.assert:
        that:
          - ('__dashboardUid__' in _ann) == ('__panelId__' in _ann)
        fail_msg: >-
          Alert rule {{ item.uid }} carries
          {{ '__dashboardUid__' if '__dashboardUid__' in _ann else '__panelId__' }}
          without the other half. Grafana validates the two as a MANDATORY PAIR
          ("both annotations __dashboardUid__ and __panelId__ must be specified")
          and rejects the whole provisioning document — and the rejection is not
          scoped to this rule: provisioning is a startup-blocking module, so
          Grafana crash-loops and EVERY provisioned alert rule in the org
          disappears (measured 2026-08-24, ten "Starting Grafana" lines and zero
          "HTTP Server Listen"). A dashboard-only deep link is not representable;
          if no single panel fits, pick the one the rule's own description names
          first and write the reason beside it — or drop the link entirely.
          Never ship half a pair.
        quiet: true
      loop: "{{ _obs_link_rules | default([]) }}"
      loop_control:
        label: "{{ item.uid }}"

    - name: Assert every alert deep link points at a pinned, linkable panel
      vars:
        _ann: "{{ item.annotations | default({}, true) }}"
        _uid: "{{ _ann['__dashboardUid__'] | default('') }}"
        _pid: "{{ _ann['__panelId__'] | default('') }}"
        _dash: "{{ (_obs_dashboard_panels | default({}))[_uid] | default({}) }}"
      ansible.builtin.assert:
        that:
          - _ann['__panelId__'] is string
          - _uid in (_obs_dashboard_panels | default({}))
          - _pid in (_dash.ids | default([]))
          - (_dash.pinned | default(0)) == (_dash.panels | default(0))
        fail_msg: >-
          Alert rule {{ item.uid }} deep-links to dashboard uid "{{ _uid }}" panel
          "{{ _pid }}", and that reference does not hold up against
          files/data/grafana/dashboards/. Known dashboards:
          {{ (_obs_dashboard_panels | default({})) | dict2items
             | map(attribute='key') | sort | join(', ') }}.
          "{{ _uid }}" is {{ _dash.file | default('NOT DEPLOYED BY THIS ROLE') }}
          with {{ _dash.panels | default(0) }} panels,
          {{ _dash.pinned | default(0) }} distinct pinned ids, linkable ids
          [{{ _dash.ids | default([]) | join(', ') }}] and ROW ids
          [{{ _dash.rows | default([]) | join(', ') }}].
          Grafana does not object to any of this — the notification still shows a
          "View panel" button, and it opens nothing or the wrong graph, with no
          error at any layer. Five ways to fail this, in order of likelihood: the
          panel id is not a STRING (write it quoted, `__panelId__: "11"`); the id
          names a ROW, which carries an id but renders nothing under
          ?viewPanel= — the rows are listed above and sit at round numbers, one
          dropped digit from any real link; the uid is wrong, or its dashboard is
          not shipped by this role; the id is not in that dashboard at all; or
          the dashboard is not FULLY and UNIQUELY pinned — Grafana assigns ids at
          load to panels that lack them, and two panels sharing an id is the same
          drift wearing a disguise, so `pinned` must equal `panels`. Pin the ids
          in the dashboard JSON in the SAME change as the annotation (#187,
          #214), never afterwards.
        quiet: true
      # Only the rules that carry a link. The pairing assert above owns the
      # half-a-pair case, so anything reaching here has both keys.
      when: "'__dashboardUid__' in (item.annotations | default({}, true))"
      loop: "{{ _obs_link_rules | default([]) }}"
      loop_control:
        label: "{{ item.uid }}"

# #201: THE CONTACT POINTS AND THE NOTIFICATION TEMPLATE ARE A MATCHED PAIR.
#
# Every email receiver's `subject:` and every telegram receiver's `message:`
# resolves a Go template by NAME out of
# files/data/grafana/provisioning/alerting/notification-templates.yaml. Grafana
# resolves that name at NOTIFY time, not at provisioning time — so a renamed
# define, a deleted file, or a typo does not fail the deploy, does not fail
# Grafana's start, and does not show up in any health endpoint. It fails the
# first time an alert actually needs to be sent. That is the #174 pairing trap
# again: two halves that only meet on the path nobody exercises until it
# matters, which here is the path that carries the page.
#
# So the pairing is checked statically, from the same files the deploy ships.
# Both directions of the drill-marker chain are covered: what the contact
# points ask for, and what the template file itself asks for internally
# (homelab.subject -> homelab.drill_marker + Grafana's default.title).
#
# THE REGEX REQUIRES THE FULL CALL FORM `template "<name>" . }}`, not just
# `template "<name>"`, and that is not tidiness: both files discuss template
# names in their own prose, and a looser pattern would let a comment vote a
# name into the reference set — the guard-shadowed-by-prose trap this file
# closes twice already. Prose never writes the trailing ` . }}`.
#
# Pure control-machine lookups, so it runs under --check.
- name: Verify every notification template the contact points reference is defined
  vars:
    _obs_cp_src: "{{ lookup('file', role_path ~ '/templates/grafana-contact-points.yaml.j2') }}"
    _obs_nt_src: >-
      {{ lookup('file', role_path ~ '/files/data/grafana/provisioning/alerting/notification-templates.yaml') }}
    _obs_nt_defines: >-
      {{ _obs_nt_src | regex_findall('define "([A-Za-z0-9_.]+)"') | unique | sort }}
    _obs_cp_template_refs: >-
      {{ _obs_cp_src | regex_findall('template "([A-Za-z0-9_.]+)" [.] }}') | unique | sort }}
    _obs_nt_internal_refs: >-
      {{ _obs_nt_src | regex_findall('template "([A-Za-z0-9_.]+)" [.] }}') | unique | sort }}
    # Shipped by Grafana itself, not by this repo. Verified present on the live
    # Grafana 13.2.0 by rendering both through the template-test endpoint —
    # which is the only way to check them, since nothing in this repo defines
    # them. A Grafana major bump means re-running those fixtures.
    _obs_grafana_builtin_templates:
      - default.title
      - default.message
    # `union`, not `+`: the vars above render as templated STRINGS and a bare
    # `+` against a real list raises "can only concatenate str (not
    # _AnsibleLazyTemplateList) to str" (caught by ansible-lint's
    # jinja[invalid], not by a dry run).
    _obs_nt_resolvable: "{{ _obs_nt_defines | union(_obs_grafana_builtin_templates) }}"
  ansible.builtin.assert:
    that:
      # Parse sanity first: an empty set on either side would make the two
      # difference checks below trivially true — a guard that cannot fail.
      - _obs_nt_defines | length >= 3
      - _obs_cp_template_refs | length >= 2
      - _obs_cp_template_refs | difference(_obs_nt_defines) | length == 0
      - _obs_nt_internal_refs | difference(_obs_nt_resolvable) | length == 0
    fail_msg: >-
      The Grafana contact points reference notification templates that are not
      defined. Referenced by templates/grafana-contact-points.yaml.j2:
      {{ _obs_cp_template_refs }}; defined by
      files/data/grafana/provisioning/alerting/notification-templates.yaml:
      {{ _obs_nt_defines }}; DANGLING:
      {{ _obs_cp_template_refs | difference(_obs_nt_defines) | join(', ') | default('none', true) }}.
      Dangling INSIDE the template file itself (neither defined there nor a
      Grafana builtin {{ _obs_grafana_builtin_templates }}):
      {{ _obs_nt_internal_refs | difference(_obs_nt_resolvable) | join(', ') | default('none', true) }}.
      Grafana resolves these names when it SENDS, so a dangling reference is an
      alert that fires and is never delivered — invisible to every deploy gate,
      every /api/health check and every dry run. Fix the name on whichever side
      is wrong; do not delete the reference to make this pass, because the
      reference is what puts the [DRILL] marker on synthetic alerts (#201).
      A short list on either side means this guard could no longer PARSE its
      inputs (it reads the full call form `template "<name>" . }}` on purpose,
      so prose cannot feed it) — teach it the new shape rather than deleting it.
    quiet: true

# --- Firewall: scope the observability ports to their approved clients (#122, #134, #161) ---
# Governed ports and why each is on the list:
#
#  * :8428 (VictoriaMetrics HTTP API) — added by #161. It is authenticated
#    (--httpAuth) but it is also the stack's PRIMARY WRITE endpoint, and until now
#    it was the only observability write surface with no allowlist at all: the
#    protection was inverted relative to the risk, with the two narrower endpoints
#    scoped and the broad one open to the whole flat 192.168.0.0/18. Its client
#    set is built from CONFIGURATION, each entry verified — see host_vars.
#  * :9428 (VictoriaLogs) — a fleet ingest endpoint since #134.
#
# NOT governed: :3000 (Grafana). It is an authenticated read surface whose client
# set has not been established the way these two have; narrowing it needs its own
# NPM-table check and its own from-a-blocked-source verification. Do not extend
# these lists to it by analogy.
#
# :8089 is GONE, not merely ungoverned — #133 retired --influxListenAddr entirely
# (it could not serve HA's HTTP-speaking integration at all), and its #122
# allowlist went with it. nft_fw_protocols stays [tcp, udp] even though both
# remaining ports are TCP-only listeners: the udp rules are now inert defence in
# depth rather than a functional requirement, and dropping udp coverage would
# silently unprotect any future udp bind on a governed port.
#
# Implemented by the shared nft_scoped_fw role (#114) rather than a fork of it — the
# fail-open table, prerouting hook, drift probe and self-heal all live there. See
# docs/solutions/conventions/scoped-nftables-on-live-host.md.
#
# observability_firewall (lan_iface/ports) comes from host_vars; deliberately NO role
# defaults — a host that deploys this role without defining it must fail loudly, not
# silently publish an open write port.
- name: Restrict the observability ports to their approved clients
  ansible.builtin.include_role:
    name: nft_scoped_fw
  vars:
    nft_fw_name: observability
    nft_fw_description: Observability ingest firewall (Ansible-managed nftables table inet observability_fw)
    nft_fw_ports: "{{ observability_firewall.ports }}"
    nft_fw_protocols: [tcp, udp]
    # Default for the prerouting hook anyway; stated because the choice matters —
    # at -150 daddr is still pre-DNAT, so container egress to some external :8089
    # is non-local and exits before the drop.
    nft_fw_scope_guard: fib
    nft_fw_lan_iface: "{{ observability_firewall.lan_iface }}"
    # Opt in to drop counters on THIS table only (#134). Scoped to this consumer
    # so the other four scoped firewalls keep byte-identical .nft files and do not
    # reload for a diagnostic this batch wanted. See the variable's comment in
    # roles/nft_scoped_fw/defaults/main.yml for why a counter is not evidence.
    nft_fw_count_drops: true

- name: Stat Docker socket
  ansible.builtin.stat:
    path: /var/run/docker.sock
  register: docker_socket_stat

- name: Create observability data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ data_mount }}/victoriametrics"
    # Config, deliberately NOT inside victoriametrics/ — that is --storageDataPath.
    - "{{ data_mount }}/victoriametrics-config"
    - "{{ data_mount }}/victorialogs"
    - "{{ data_mount }}/vector"
    - "{{ data_mount }}/vector/data"
    - "{{ data_mount }}/telegraf"
    - "{{ data_mount }}/grafana/data"
    - "{{ data_mount }}/grafana/config"
    - "{{ data_mount }}/grafana/dashboards"
    - "{{ data_mount }}/grafana/provisioning"

# --- Structured host-log stream for Vector (#143) -----------------------------
# Lifted to the shared roles/rsyslog_structured in #134: eq12/n5pro/n5pro_docker
# need the byte-identical stream for their native Vector agents, and the drop-in
# and the Vector config that reads it must travel together. The block that used to
# be inlined here moved VERBATIM — copy the drop-in, copy the logrotate policy,
# `rsyslogd -N1`, restart-if-changed, ensure-running-ungated, then the end-to-end
# `logger` freshness probe and its assert. See roles/rsyslog_structured/README.md.
#
# Ordered before the config copy below on purpose: the file must exist and be
# written before Vector restarts onto a config that reads only that file.
- name: Deploy the RFC5424 structured host-log stream Vector tails
  ansible.builtin.include_role:
    name: rsyslog_structured

# The compose file bind-mounts these paths directly (not from the deploy dir), so
# without these tasks a config edited in the repo never reaches the container and
# the only way to apply it is an ad-hoc scp — which Critical Rule 1 forbids.
- name: Deploy observability service configs
  ansible.builtin.copy:
    src: "data/{{ item.src }}"
    dest: "{{ data_mount }}/{{ item.src }}"
    mode: "0644"
  loop:
    - { src: vector/vector.yaml, service: vector }
    - { src: telegraf/telegraf.conf, service: telegraf }
    - { src: grafana/config/grafana.ini, service: grafana }
  loop_control:
    label: "{{ item.src }}"
  register: observability_configs

# SECRET-BEARING (#88): this renders vault_ha_long_lived_token, so `diff: false` —
# the task still reports changed, its content never renders into the log or a
# --diff run. 0600 for the same reason; VictoriaMetrics runs as root inside the
# container (verified, not assumed) so it can still read it through the bind mount.
#
# Templated unconditionally even when the scrape is disabled: compose.yaml names
# this path in --promscrape.config on every deploy, and VictoriaMetrics refuses to
# start when that path is missing. The template renders a job-less file instead.
- name: Template the VictoriaMetrics scrape config
  ansible.builtin.template:
    src: scrape.yml.j2
    dest: "{{ data_mount }}/victoriametrics-config/scrape.yml"
    mode: "0600"
  diff: false
  register: victoriametrics_scrape_config

# delete: true so a file removed from the repo is removed from the host — otherwise
# Grafana keeps provisioning a datasource that no longer exists in version control.
# --checksum because rsync's default mtime comparison reports every file as changed
# on a fresh clone, which would restart Grafana spuriously on the other operator machine.
# times: false because rsync would otherwise "touch" mtimes on content-identical files
# (a fresh clone/worktree gives every file a new mtime), flipping changed and restarting
# Grafana for nothing.
- name: Deploy Grafana provisioning
  become: false
  ansible.posix.synchronize:
    src: "{{ role_path }}/files/data/grafana/provisioning/"
    dest: "{{ data_mount }}/grafana/provisioning/"
    delete: true
    times: false
    # Pin the rsync channel's host key too — see _deploy's synchronize (#94).
    verify_host: true
    use_ssh_args: true
    rsync_opts:
      - "--checksum"
      # alerting/contact-points.yaml is TEMPLATED (its address is a vault value),
      # so it exists on the host but not in files/. Without this exclude, delete:true
      # removes it every run and the template below writes it back every run —
      # Grafana would restart on every single deploy, forever. Same precedent as
      # _deploy's `--exclude=.env` (#139).
      - "--exclude=alerting/contact-points.yaml"
      # alerting/notification-policies.yaml is TEMPLATED too since #152 (the
      # routing tree branches on observability_alert_telegram). Identical
      # mechanism, identical consequence if this line is dropped: delete:true
      # would remove it every run, the template would write it back every run,
      # and Grafana would restart on every deploy forever.
      - "--exclude=alerting/notification-policies.yaml"
  register: grafana_provisioning

# AFTER the synchronize, never before: delete:true runs first, and although the
# exclude above protects this file, ordering it here keeps the protection from
# being load-bearing twice over.
#
# WHY A TEMPLATE and not a file under files/data/: the notification address is a
# vault value. Grafana interpolates ${ENV} in *datasource* provisioning (which is
# how datasources.yaml gets its credentials) but that is not documented for
# alerting provisioning, so this removes the assumption rather than testing it in
# production.
#
# mode 0640, not 0644: this is the one provisioning file carrying a personal
# address. The grafana process runs 472:0 (measured on eq12_docker:
# `docker exec grafana id` → uid=472(grafana) gid=0(root)), so a root:root 0640
# file is group-readable to it. If that ever stops being true, Grafana treats an
# unreadable provisioning file as a FATAL startup error and the health gate below
# fails the play loudly rather than leaving alerting quietly unrouted.
- name: Template the Grafana alerting contact point
  ansible.builtin.template:
    src: grafana-contact-points.yaml.j2
    dest: "{{ data_mount }}/grafana/provisioning/alerting/contact-points.yaml"
    mode: "0640"
  # Carries a notification address; --diff would print it into the transcript.
  # diff:false, never no_log — no_log would also censor an undefined-variable
  # failure, and that loud failure is itself a control (#88).
  diff: false
  register: grafana_contact_point

# Templated for the same reason contact-points is, and excluded from the rsync
# above for the same reason: the routing tree now branches on
# observability_alert_telegram (#152) and a static file cannot.
#
# mode 0644, not the 0640 the contact point carries, and that difference is the
# point: the rendered output holds receiver NAMES and label matchers only, no
# address and no token. For the same reason this task needs no diff:false — there
# is nothing here a --diff would leak. The secrets stay in contact-points.yaml,
# which keeps its 0640 and its diff:false.
- name: Template the Grafana notification policies
  ansible.builtin.template:
    src: grafana-notification-policies.yaml.j2
    dest: "{{ data_mount }}/grafana/provisioning/alerting/notification-policies.yaml"
    mode: "0644"
  register: grafana_notification_policies

# Separate from provisioning because Grafana hot-reloads provisioned dashboards —
# a dashboard change needs no restart. Without this the first dashboard JSON ever
# committed would silently never reach the container.
- name: Deploy Grafana dashboards
  become: false
  ansible.posix.synchronize:
    src: "{{ role_path }}/files/data/grafana/dashboards/"
    dest: "{{ data_mount }}/grafana/dashboards/"
    delete: true
    times: false
    # Pin the rsync channel's host key too — see _deploy's synchronize (#94).
    verify_host: true
    use_ssh_args: true
    rsync_opts:
      - "--checksum"

- name: Deploy observability via the shared service pipeline
  ansible.builtin.include_role:
    name: services/_deploy
  vars:
    svc: observability
    # NO svc_rsync_extra any more, and that is a consequence of the #134 lift rather
    # than a relaxation. Until then this role's files/ held two HOST config files
    # (/etc/rsyslog.d, /etc/logrotate.d) that are not part of the compose payload, so
    # _deploy's `delete: true` synchronize had to be told to leave them out of
    # {{ data_mount }}/deploy/observability/ — where they mean nothing and would only
    # invite someone to "fix" the wrong copy (#143). Both files now live in
    # roles/rsyslog_structured/files/, so there is nothing in this role's files/ for
    # those excludes to match and keeping them would name paths that no longer exist.
    # Verified a no-op on the live host before removal: the excludes worked from the
    # day they were added, so neither file was ever present in the deploy dir
    # (`ls /data/deploy/observability/` → compose.yaml, data/, .env), and dropping
    # them therefore deletes nothing.

# Single source of truth for the restart decision, shared by the check-mode
# preview, the restart itself and the readiness gates (postgresql/lms/frigate
# precedent). Deliberately NO default() on grafana_provisioning.changed: if that
# register is renamed this must fail loudly rather than silently decide Grafana
# needs no restart — provisioning would then never load and the play would still
# report converged, the do-nothing failure mode #78 is about. (The `default([])`
# on observability_configs.results guards a different thing: a legitimately
# skipped copy loop, not a typo'd name.) grafana_contact_point.changed is in the
# same no-default() club and for the same reason: the contact point arrives by a
# different mechanism (template, excluded from the rsync) but Grafana still only
# reads it at startup, so a change to it that does not restart Grafana leaves
# alerting routed at the OLD address with the play reporting converged (#139).
# grafana_notification_policies.changed joins that club on identical grounds
# (#152): same template-plus-exclude mechanism, same startup-only read, and a
# routing change that does not restart Grafana leaves critical alerts going to
# the OLD receiver set while the play reports converged.
- name: Determine observability containers to restart for changed config
  vars:
    _targets: >-
      {{ ((observability_configs.results | default([]) | selectattr('changed') | map(attribute='item.service') | list)
          + (['grafana'] if grafana_provisioning.changed or grafana_contact_point.changed
             or grafana_notification_policies.changed else [])
          + (['victoriametrics'] if victoriametrics_scrape_config.changed else [])) | unique }}
  ansible.builtin.set_fact:
    observability_restart_targets: "{{ _targets }}"
    # grafana has its own HTTP gate below; these two are gated on staying alive.
    observability_settle_targets: "{{ _targets | reject('equalto', 'grafana') | list }}"

# --check must surface the restart; the restart task itself is necessarily
# skipped in check mode.
- name: Preview config-change restart (check mode)
  ansible.builtin.debug:
    msg: >-
      Config change WILL RESTART on real apply: {{ observability_restart_targets }}
      (brief gap in metrics/logs ingestion and, for grafana, in the UI).
  when:
    - ansible_check_mode
    - observability_restart_targets | length > 0

# Compose does not track the contents of bind-mounted files, so a config change on
# its own never restarts the container. Restart the affected services explicitly,
# after the stack exists so this also works on a first deploy.
- name: Restart observability services whose config changed
  community.docker.docker_container:
    name: "{{ item }}"
    state: started
    restart: true
  loop: "{{ observability_restart_targets }}"
  # Skipped in check mode: on a host that has never been deployed the containers do
  # not exist yet, and docker_container would fail rather than preview anything.
  when: not ansible_check_mode

# docker_container returns on ISSUANCE, not on service — the same wording the
# postgresql, lms and frigate roles use for their own gates in this branch, and
# the reason all three added one. It matters most here: Grafana's file provisioner
# treats a rejected provisioning document as a FATAL STARTUP ERROR, so a mistyped
# alert rule in files/data/grafana/provisioning/alerting/ restarts Grafana into a
# crash loop — the file that exists to make silent pipeline death visible would be
# installed by a mechanism that silently kills the reporter. /api/health is
# unauthenticated and returns 200 only once Grafana has finished provisioning.
- name: Wait for Grafana to serve its health endpoint after the restart
  ansible.builtin.uri:
    url: "http://localhost:{{ grafana_web_port }}/api/health"
    status_code: 200
  register: grafana_health
  until: grafana_health is succeeded
  retries: 12
  delay: 5
  changed_when: false
  when:
    - not ansible_check_mode
    - "'grafana' in observability_restart_targets"

# vector and telegraf expose no HTTP surface to probe, so the gate is "still up
# after a settle period". The wait is the load-bearing part: vector exits ~1s
# after a malformed vector.yaml, so an inspect issued immediately after the
# restart lands inside the crash window about as often as not, and `Running: true`
# there means nothing. 15s is comfortably past that window and past docker's
# first restart backoff, so a crash-looping container is caught between attempts
# or in `restarting`.
- name: Let restarted services run long enough to crash on a bad config
  ansible.builtin.wait_for:
    timeout: "{{ observability_settle_seconds }}"
  when:
    - not ansible_check_mode
    - observability_settle_targets | length > 0

- name: Re-inspect the restarted containers
  community.docker.docker_container_info:
    name: "{{ item }}"
  register: observability_settled
  loop: "{{ observability_settle_targets }}"
  when: not ansible_check_mode

- name: Assert restarted services are still running
  ansible.builtin.assert:
    that:
      - item.exists
      - item.container.State.Running | default(false)
    fail_msg: >-
      {{ item.item }} is not running {{ observability_settle_seconds }}s after its
      config-change restart — the new config was deployed but the container did not
      stay up. Check `docker logs {{ item.item }}`; a malformed
      {{ item.item }} config makes it exit within about a second of start.
    quiet: true
  loop: "{{ observability_settled.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when: not ansible_check_mode

# THE CHECK THIS ROLE WAS MISSING. Everything above proves processes are up:
# containers running after a settle period, Grafana answering /api/health. That is
# exactly the evidence that was green for the ~30 days the log pipeline was dead
# (docs/solutions/integration-issues/vector-057-silent-log-pipeline-failure.md),
# whose own Prevention section says: assert the data ARRIVED, not that the process
# is running — query the destination for recent records, never container state.
#
# #143 added three new in-process ways to ship nothing while staying up: the
# parse_syslog failure branch, the "*" label expansion, and VRL abort paths (an
# aborted remap drops the event silently — drop_on_abort defaults true and nothing
# is rerouted). None of them stops the container; all of them are invisible except
# in stderr, which nobody reads on a green run.
#
# Deliberately NOT gated on "vector was restarted this run". A converged run that
# reports green over a dead pipeline is the precise failure this whole issue family
# is about, so this runs on EVERY real run. If Vector is down, this is supposed to
# fail.
# THE FILTER IS SCOPED TO THIS HOST, AND #134 IS WHY.
#
# Until #134 eq12_docker was the ONLY producer of `source:host` records, so the
# bare `_time:10m source:host | count()` this used to run was implicitly per-host
# and the distinction never mattered. #134 puts native Vector agents on eq12,
# n5pro and n5pro_docker, all writing `source:host` into this same VictoriaLogs.
# Left bare, this assert would be satisfied by THREE OTHER HOSTS' records while
# the container it exists to check was dead or 401-ing — a green
# `--tags observability` deploy over exactly the failure it was written for, with
# the comment above it still claiming it asserts the data arrived. That is the
# regression this change repairs, not a new feature.
#
# Two filters, because one is not enough. `hostname:` alone would pass on records
# this container shipped BEFORE it broke, anywhere in the 10-minute window; the
# per-run marker makes it a freshness proof, the same shape as the rsyslog
# freshness probe and roles/vector_agent's ingest proof. Both filters are needed:
# the marker proves recency, the hostname proves provenance.
- name: Generate a unique marker for the VictoriaLogs ingest proof
  ansible.builtin.set_fact:
    observability_ingest_probe: "observability-ingest-probe-{{ ansible_date_time.iso8601_micro | regex_replace('[^0-9]', '') }}"
  when: not ansible_check_mode

# changed_when: false — one line into the log stream IS the probe, not a state
# change. local0.notice so Debian also routes it to /var/log/syslog, where a human
# debugging this can see it.
- name: Emit the VictoriaLogs ingest probe marker
  ansible.builtin.command: logger -p local0.notice "{{ observability_ingest_probe }}"
  changed_when: false
  when: not ansible_check_mode

- name: Query VictoriaLogs for this host's own log records
  ansible.builtin.uri:
    url: "http://localhost:{{ victorialogs_web_port }}/select/logsql/query"
    method: POST
    body_format: form-urlencoded
    body:
      query: '_time:10m hostname:{{ inventory_hostname }} source:host "{{ observability_ingest_probe }}" | stats count() as rows'
    url_username: "{{ vault_vl_auth_username }}"
    url_password: "{{ vault_vl_auth_password }}"
    force_basic_auth: true
    return_content: true
  register: observability_host_ingest
  # /select/logsql/query returns JSONL. `stats count()` yields a single line, but
  # sum the findall rather than assuming one — a shape change must read as "no
  # rows" and retry, not raise a Jinja error inside `until`.
  until: >-
    observability_host_ingest.status | default(0) == 200
    and (observability_host_ingest.content | default('') | regex_findall('"rows":"([0-9]+)"') | map('int') | list | sum) > 0
  # 12 retries, not the 6 this used to carry. The old query was satisfied by ANY
  # host record in a 10-minute window, so on a healthy pipeline it returned on the
  # first attempt and the retry budget was nearly decorative. This one waits for a
  # marker written seconds ago to traverse logger -> rsyslog -> structured.log ->
  # Vector's file source -> a 5s sink batch -> VictoriaLogs, which is a real round
  # trip. Matching roles/vector_agent's budget (2 minutes) keeps a slow but healthy
  # pipeline from failing a deploy.
  retries: 12
  delay: 10
  changed_when: false
  # failed_when:false so the RETRY EXHAUSTION lands on the assert below, which can
  # say what to check. Deliberately no no_log anywhere on this pair: censoring it
  # would blind the one diagnostic this exists to print (#88).
  failed_when: false
  when: not ansible_check_mode

- name: Assert this host's own log records actually reached VictoriaLogs
  ansible.builtin.assert:
    that:
      - observability_host_ingest.status | default(0) == 200
      - (observability_host_ingest.content | default('') | regex_findall('"rows":"([0-9]+)"') | map('int') | list | sum) > 0
    fail_msg: >-
      A marker written on {{ inventory_hostname }} a minute ago did not come back
      out of VictoriaLogs labelled hostname={{ inventory_hostname }}, so this
      host's pipeline is deployed and running but not delivering. Every container
      may still be Up — that is the failure mode, not evidence against it. Note
      this query is scoped to THIS host (#134 added three more `source:host`
      producers to the same store), so other hosts still shipping does not make
      this a false alarm. Check, in order: `docker logs --tail 100 vector` on this
      host for remap aborts or sink errors; that /var/log/structured.log is still
      GROWING (not merely present); and `systemctl status rsyslog`. If the disk
      buffer is wedged, the runbook is
      docs/solutions/integration-issues/vector-wedged-disk-buffer-reset.md.
      HTTP status was {{ observability_host_ingest.status | default('none') }}.
    quiet: true
  when: not ansible_check_mode

# THE SAME CLASS OF CHECK, FOR THE OTHER HALF OF THE STACK.
#
# Grafana's /api/health returning 200 proves the PROCESS is up and that
# provisioning parsed. It does NOT prove a provisioned datasource can actually
# reach its backend — and a datasource that 401s makes every alert rule querying
# it fail, INCLUDING the rules that exist to report failures. The alerting stack
# goes blind and says nothing, because the thing that would report the outage is
# the thing that is out.
#
# Measured, not theorised: rotating vault_vm_auth_password left Grafana querying
# VictoriaMetrics with the OLD secret while the container env, the .env file and
# an in-container `curl -u "$VM_AUTH_USERNAME:$VM_AUTH_PASSWORD"` ALL showed the
# NEW one — every process-level check passed and every VM-backed rule 401'd for
# ~15 minutes, paging continuously. The cause was `version:` pinned in
# datasources.yaml: Grafana only re-applies a provisioned datasource when that
# number INCREASES, so secureJsonData was never rewritten. A credential rotation
# is therefore invisible to every check except this one.
#
# The uids are read FROM the provisioning file rather than listed here, so a
# datasource added to version control cannot be silently left unchecked.
#
# Host header, not a redirect follow: GF_SERVER_DOMAIN/ROOT_URL make Grafana 301
# any request whose Host does not match, and a followed redirect would leave the
# host and test NPM's public path instead of this container.
- name: Check every provisioned Grafana datasource can actually reach its backend
  vars:
    _declared: >-
      {{ (lookup('file', role_path ~ '/files/data/grafana/provisioning/datasources/datasources.yaml')
          | from_yaml).datasources }}
  ansible.builtin.uri:
    url: "http://127.0.0.1:3000/api/datasources/uid/{{ item.uid }}/health"
    user: "{{ vault_grafana_user }}"
    password: "{{ vault_grafana_password }}"
    force_basic_auth: true
    headers:
      Host: "{{ vault_grafana_domain }}"
    return_content: true
  register: grafana_datasource_health
  # The datasource plugins finish loading slightly after /api/health goes 200.
  until: grafana_datasource_health.json.status | default('') == 'OK'
  retries: 6
  delay: 5
  # ignore_errors, NOT failed_when: false — the assert below must be able to read
  # `failed`, and `failed_when: false` ASSIGNS failed=False, which would make the
  # assert vacuously true. See the "a guard you have not seen fail is not a
  # guard" gotcha in CLAUDE.md.
  ignore_errors: true
  loop: "{{ _declared }}"
  loop_control:
    label: "{{ item.name }} ({{ item.uid }})"
  when: not ansible_check_mode

- name: Assert every provisioned Grafana datasource is healthy
  ansible.builtin.assert:
    that:
      - item is not failed
      - item.json.status | default('') == 'OK'
    fail_msg: >-
      Grafana datasource {{ item.item.name }} ({{ item.item.uid }}) is NOT
      healthy: {{ item.json.message | default(item.msg | default('no response')) }}.
      Grafana is running and provisioning parsed, so nothing else in this play
      will notice — but every alert rule querying this datasource is now failing,
      which means the alerting stack cannot report its own outage. If this
      followed a credential rotation, the cause is almost certainly the `version:`
      field in
      files/data/grafana/provisioning/datasources/datasources.yaml: Grafana
      re-applies a provisioned datasource only when that number INCREASES, so the
      new secret was never written. Bump it and redeploy.
    quiet: true
  loop: "{{ grafana_datasource_health.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: not ansible_check_mode

# ============ #212: PROOF THAT GRAFANA SERVES AND EVALUATES THESE RULES ============
#
# Everything above this point proves Grafana is a healthy PROCESS with reachable
# datasources. Neither fact says anything about the alert RULES, and the gap has a
# specific, expensive shape: a rule whose `expr` names a metric that does not exist
# provisions perfectly, passes every static guard in this role, and then sits in
# NoData forever — which, with `noDataState: Alerting` (correct for every absence
# owner here), is a PERMANENT FALSE PAGE that no deploy could see. The mirror-image
# failure is a rule that exists in Grafana but NOT in this repo (created in the UI,
# or by an API client with X-Disable-Provenance): it survives every restart, and
# version control looks complete while the fleet alerts on something nobody can
# review.
#
# THAT SECOND FAILURE ALSO HAPPENS WITHOUT ANYONE TOUCHING THE UI, and it is the
# thing this guard found on its own first live run. Grafana's file provisioner
# reconciles the rules a file DECLARES; it does not remove the ones the file
# stopped declaring. Measured: the rsync above (delete:true) shipped a rule file
# with three rules removed, Grafana restarted cleanly, and all three were still
# served afterwards. So deleting or renaming a rule in this repo leaves an orphan
# that keeps evaluating and keeps paging while git says it is gone. The
# version-controlled way to retire a rule is a `deleteRules:` block in the rule
# file; this check is what makes forgetting it impossible.
#
# These two checks close both directions. They are the checks the comment at the
# top of this file used to CLAIM existed while they did not (#212).
#
# WHAT THE SECOND HALF DOES AND DOES NOT CATCH. Read this before trusting it, and
# before extending it: it is an EVALUATION FRESHNESS guard, not a rule-correctness
# guard. It proves every unpaused rule is still being RUN — it catches a stalled
# scheduler, a wedged group, a rule that silently stopped evaluating. IT DOES NOT
# CATCH A TYPO'D SELECTOR, which is the failure #212 was filed about. That limit is
# measured, not suspected, and the measurement is worth keeping:
#
#   A scratch rule was provisioned whose expr named a metric that does not exist.
#   The query really returned nothing — checked three ways straight at
#   VictoriaMetrics (`sum(increase(selftest_212_no_such_metric[15m]))`, the bare
#   metric, and the `increase()` form) — resultLen=0 for all three. The rule
#   nonetheless reported health=ok, state=inactive, totals={normal: 1} and a fresh
#   lastEvaluation, and THIS DEPLOY PASSED IT.
#
# The mechanism: `noDataState` maps the NoData result to a state BEFORE `health` is
# derived, so `health` describes the MAPPED state, not the raw evaluation.
#
# BOTH cohorts were then measured directly, the Alerting one under a scoped Grafana
# silence so it could not page (matcher selftest_212="true", verified state=active
# BEFORE the rule existed; instance labels are inherited by NoData-born instances,
# so the matcher really covered it):
#
#   noDataState  rule.health  rule.state  alerts[].state     delivered?
#   OK           ok           inactive    Normal (NoData)    no
#   Alerting     ok           pending     Pending (NoData)   no (v2/alerts: 0)
#
# `health` is `ok` for BOTH. This is not an inference from "no rule here uses
# noDataState: NoData" — it is what the API returned for each mapping in turn. The
# `health == 'ok'` clause below therefore cannot see absence-of-data for ANY rule in
# this repo, in either cohort.
#
# The honest signal does exist at this endpoint and is mapping-INDEPENDENT: the
# per-instance `alerts[].state` carries a `(NoData)` suffix in both rows above.
# Detection is deliberately NOT built on it here — that is a design change with its
# own edge cases (paused rules, rules legitimately without instances) and it is
# specced in its own issue rather than bolted onto a freshness guard.
#
# Two more facts from that run, both worth keeping. `for: 1h` IS honoured on a
# NoData->Alerting transition — the instance stopped at Pending — so `for` is real
# belt, though the silence was the control and the belt was not what we relied on.
# And UNMEASURED, stated as suspicion and not as fact: `execErrState` plausibly
# hides `health: error` by the same mapping. Nobody has tested it. Do not write it
# down as known until someone does.
#
# The health clause STAYS regardless — it costs one comparison and it fires if
# Grafana ever does report a non-ok health — but the load-bearing signal here is
# `lastEvaluation` recency. Detecting a dead selector needs a different mechanism
# and is tracked separately.
#
# WHY NOT `state`, in any case. `state` is firing/pending/inactive and is not a
# fault signal here: obs-alert-delivery-heartbeat is INTENTIONALLY always firing
# (it is the end-to-end proof that the notification path works), the noDataState
# split above is deliberate per-rule design, and `inactive` is also what a rule that
# has NEVER RUN reports — so `state` cannot tell "evaluated, healthy" from "never
# evaluated".
#
# WHY the expectation is DERIVED, never a number written here. A hardcoded 33 is a
# matched pair that drifts the moment a rule is added — the exact defect class #194
# and #202 added reconcilers for. Both halves read the SAME files the rsync above
# ships, so a new rule file automatically extends the guard: the same principle as
# the datasource check reading its uids out of the provisioning file.
#
# WHY the served half compares SETS, not counts. Count-33 is satisfied when one
# provisioned rule is missing AND one stray exists, and a count that fails cannot
# name the culprit. The symmetric difference is printed by uid, in both directions.
#
# WHY the evaluation half asks "is every EXPECTED uid in the set of rules that
# PASSED" rather than "no rule is unhealthy". `<extracted list> | rejectattr(...)
# | length == 0` over an ACCIDENTALLY EMPTY extraction — an API shape change, a
# parse that silently yielded nothing — is literally `assert: true`. Building a set
# of uids that each PASSED a per-rule predicate, and requiring the repo's expected
# set to be contained in it, makes every one of those failures shrink the passing
# set and fire the guard; no vacuous pass is representable, because `expected`
# comes from the files and `passing` comes from the extraction.
#
# It is a SUBSET test and not a count for a reason that took a control to see:
# counts are satisfied by WRONG-RULE SUBSTITUTION. One stray healthy rule paired
# with one broken expected rule leaves `33 == 33` true, and the guard passes over
# precisely the defect it exists to catch. Measured on the same fixture that
# justifies the shape: expected [r1,r2,r3] vs passing [r1,r2,stray] gives equal
# counts and a difference of [r3]. The `length > 0` clause is the other half — an
# empty expected set (every rule paused) would make any subset test vacuously
# true. Same reason the timestamp predicate is a `match` against an RFC3339 regex
# BEFORE `to_datetime`: an unparseable timestamp drops the rule out of the passing
# set instead of raising or being waved through.
#
# WHY the Host header, and no redirect follow. GF_SERVER_DOMAIN/ROOT_URL make
# Grafana 301 any request whose Host does not match, and a followed redirect leaves
# this container and tests NPM's public path instead — the same idiom, and the same
# reason, as the datasource-health check above.
#
# WHY the eval retry budget is minutes, not seconds. The provisioning API answers
# as soon as /api/health does, but EVALUATION does not: after a restart, a rule in
# a 5m-interval group may not evaluate for a full interval. ~7 minutes covers a
# cold scheduler at the widest group interval this repo ships. `until` exits on the
# first success, so a converged run costs one request.
#
# Both halves run on EVERY real run, not only when Grafana restarted this run: a
# converged run reporting green over rules that quietly stopped evaluating is the
# failure family this entire role exists to catch. They are `when: not
# ansible_check_mode` because their input is a live Grafana that only exists after
# a real apply — so, per CLAUDE.md, their first execution is their first test and
# each half is verified against a LIVE defect rather than a dry run. The set half
# needed no fixture at all: it failed on its first real run against three rules a
# sibling branch had applied and this repo does not declare (see #220). The
# evaluation half has NOT yet been seen to fail, and the attempt is worth recording
# because it falsified the assumption this guard was built on. A scratch rule whose
# expr named a metric that does not exist (`noDataState: OK` so the fixture could
# not page) was provisioned, loaded and evaluated — and this deploy passed it.
# Measured on the live rule: health=ok, state=inactive, totals={normal: 1}, a
# recent lastEvaluation, while the same query against VictoriaMetrics returned
# resultLen=0. `noDataState` maps the NoData result to a state BEFORE `health` is
# derived, so the fault never reaches the field asserted on here. See the WHY
# `health` note above for what that does and does not leave covered. Until the
# predicate is corrected and a fixture is actually WATCHED to fail it, treat this
# half as unwitnessed: a guard nobody has seen fail is not a guard.
- name: Verify Grafana serves and evaluates exactly the provisioned alert rules
  vars:
    _obs_rule_dir: "{{ role_path }}/files/data/grafana/provisioning/alerting"
    # Varargs, not a list: `query('file', <list>)` does not flatten its terms on
    # ansible-core 2.19+. Same idiom, same reason, as the group_by check above.
    # `default=[]` on BOTH hops, and it is not defensive padding: the set check's
    # own fail_msg tells operators to retire a rule with a `deleteRules:` block,
    # which is a TOP-LEVEL key. A file that carries only tombstones has no
    # `groups:` at all, and a bare `map(attribute='groups')` raises on the missing
    # attribute — so following this role's own advice would fail every deploy with
    # a raw Jinja error. Same precedent as `map(attribute='expr', default='')` in
    # the grading check above.
    #
    # notification-templates.yaml is ALSO rejected by name (#201). The
    # `default=[]` above would already absorb it silently — which is precisely
    # why the exclusion is written out: the SERVED set this compares against
    # contains rules only, so a non-rule document must be visibly absent from
    # the expected side rather than invisibly contributing nothing. This guard
    # is #201's served-side twin — a drill rule left in Grafana after its branch
    # died shows up here as a uid NOT IN THE REPO and fails the next deploy from
    # master (retire it with `deleteRules:`, per the fail_msg below).
    _obs_repo_groups: >-
      {{ query('file', *(query('fileglob', _obs_rule_dir ~ '/*.yaml')
                         | reject('search', '/notification-templates[.]yaml$') | list))
         | map('from_yaml') | map(attribute='groups', default=[]) | flatten | list }}
    _obs_repo_rules: >-
      {{ _obs_repo_groups | map(attribute='rules', default=[]) | flatten | list }}
    _obs_repo_rule_uids: "{{ _obs_repo_rules | map(attribute='uid') | sort | list }}"
    # A PAUSED rule is still SERVED but is not expected to evaluate, so the two
    # halves need different expectations. `rejectattr('isPaused', 'equalto', true)`
    # keeps rules with no isPaused key (Grafana's default is false), which is the
    # right reading of an omitted field.
    _obs_expected_active_uids: >-
      {{ _obs_repo_rules | rejectattr('isPaused', 'equalto', true)
         | map(attribute='uid') | sort | list }}
    _obs_group_intervals: >-
      {{ _obs_repo_groups | selectattr('interval', 'defined')
         | map(attribute='interval') | list }}
    _obs_bad_intervals: >-
      {{ _obs_group_intervals | reject('match', '^[0-9]+[smh]$') | list }}
    # A uid duplicated across two files satisfies BOTH difference checks below
    # (difference is set-based), so half A would not notice until its retry budget
    # expired, and its message would then read `none` in both direction buckets —
    # a misdiagnosis by construction. Caught here instead, statically, by name.
    _obs_duplicate_rule_uids: >-
      {{ dict((_obs_repo_rules | groupby('uid') | map(attribute='grouper') | list)
              | zip(_obs_repo_rules | groupby('uid') | map(attribute='list')
                    | map('length') | list))
         | dict2items | selectattr('value', 'gt', 1) | map(attribute='key') | sort | list }}
    # The recency threshold is 2x the WIDEST group interval in the repo, so it
    # tracks the files instead of being a second number to keep in sync. Each unit
    # is handled explicitly and `+ [0]` keeps `max` from raising on an empty
    # branch; a unit this does not understand is caught by the assert below rather
    # than silently dropping out of the max (which would TIGHTEN the threshold and
    # make the guard flap).
    _obs_rule_max_interval_s: >-
      {{ [ ((_obs_group_intervals | select('match', '^[0-9]+s$')
             | map('regex_replace', 's$', '') | map('int') | list) + [0]) | max,
           (((_obs_group_intervals | select('match', '^[0-9]+m$')
              | map('regex_replace', 'm$', '') | map('int') | list) + [0]) | max) * 60,
           (((_obs_group_intervals | select('match', '^[0-9]+h$')
              | map('regex_replace', 'h$', '') | map('int') | list) + [0]) | max) * 3600 ] | max }}
    # Rendered fresh on every retry (it is a lazily-templated var), so the window
    # slides with the retries instead of being pinned to the first attempt. `date
    # +%s` rather than `ansible_date_time` because facts are gathered at the start
    # of the play and this runs at the end — minutes of drift into a 10-minute
    # threshold. POSIX `date`, so it is identical on both operator platforms.
    _obs_eval_cutoff: >-
      {{ '%Y-%m-%dT%H:%M:%S+00:00'
         | strftime((lookup('pipe', 'date +%s') | int)
                    - (2 * (_obs_rule_max_interval_s | int)), utc=true) }}
    # Grafana emits Go RFC3339 in the SERVER's offset (measured:
    # 2026-08-29T15:11:10-07:00), and RFC3339Nano may append a fractional part.
    # Both sides of the comparison are offset-AWARE, so the arithmetic is on
    # absolute instants and the server's timezone never enters it.
    _obs_rfc3339_re: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}([.][0-9]+)?([Zz]|[+-][0-9]{2}:[0-9]{2})$'
    _obs_served_uids: >-
      {{ grafana_served_rules.json | default([]) | map(attribute='uid') | sort | list }}
    _obs_eval_rules: >-
      {{ grafana_rule_eval.json.data.groups | default([])
         | map(attribute='rules') | flatten | list }}
    _obs_eval_no_health: >-
      {{ _obs_eval_rules | rejectattr('health', 'defined') | map(attribute='uid') | list }}
    _obs_eval_health_ok: >-
      {{ _obs_eval_rules | selectattr('health', 'defined')
         | selectattr('health', 'equalto', 'ok') | list }}
    _obs_eval_unhealthy: >-
      {{ dict((_obs_eval_rules | selectattr('health', 'defined')
               | rejectattr('health', 'equalto', 'ok') | map(attribute='uid') | list)
              | zip(_obs_eval_rules | selectattr('health', 'defined')
                    | rejectattr('health', 'equalto', 'ok') | map(attribute='health') | list)) }}
    _obs_eval_bad_timestamp: >-
      {{ (_obs_eval_health_ok | rejectattr('lastEvaluation', 'defined')
          | map(attribute='uid') | list)
         + (_obs_eval_health_ok | selectattr('lastEvaluation', 'defined')
            | rejectattr('lastEvaluation', 'match', _obs_rfc3339_re)
            | map(attribute='uid') | list) }}
    _obs_eval_shape_ok: >-
      {{ _obs_eval_health_ok | selectattr('lastEvaluation', 'defined')
         | selectattr('lastEvaluation', 'match', _obs_rfc3339_re) | list }}
    # uid -> parsed lastEvaluation, so the stale ones can be NAMED rather than
    # merely counted. A duplicate uid collapses here and lowers the passing count,
    # which fires the guard — the safe direction.
    _obs_eval_seen_at: >-
      {{ dict((_obs_eval_shape_ok | map(attribute='uid') | list)
              | zip(_obs_eval_shape_ok | map(attribute='lastEvaluation')
                    | map('regex_replace', '[.][0-9]+', '')
                    | map('to_datetime', '%Y-%m-%dT%H:%M:%S%z') | list)) }}
    _obs_eval_passing_uids: >-
      {{ _obs_eval_seen_at | dict2items
         | selectattr('value', 'gt', _obs_eval_cutoff | to_datetime('%Y-%m-%dT%H:%M:%S%z'))
         | map(attribute='key') | sort | list }}
    _obs_eval_stale_uids: >-
      {{ _obs_eval_seen_at | dict2items
         | rejectattr('value', 'gt', _obs_eval_cutoff | to_datetime('%Y-%m-%dT%H:%M:%S%z'))
         | map(attribute='key') | sort | list }}
  block:
    # Static (control-machine lookup only), so it runs under --check and fails
    # before anything touches state. Two preconditions for the derivation above:
    # every group must declare an interval, and every interval must be in a unit
    # the threshold arithmetic understands. Without this, a `1h30m` or a missing
    # `interval:` would quietly shrink the recency threshold and the eval check
    # would start flapping for reasons nobody could see from its message.
    - name: Assert every provisioned rule group declares a parseable interval
      ansible.builtin.assert:
        that:
          - _obs_repo_groups | length > 0
          - _obs_group_intervals | length == _obs_repo_groups | length
          - _obs_bad_intervals | length == 0
          - _obs_rule_max_interval_s | int > 0
          - _obs_duplicate_rule_uids | length == 0
        fail_msg: >-
          The alert-rule checks could not derive a trustworthy expectation from
          files/data/grafana/provisioning/alerting/*.yaml.
          DUPLICATE uids across the rule files:
          {{ _obs_duplicate_rule_uids | join(', ') | default('none', true) }} — a
          uid declared twice is caught HERE, statically, because the served-set
          check below is set-based and a duplicate satisfies both of its direction
          checks; it would fail 60s later on retry exhaustion with `none` in both
          buckets, which is a misdiagnosis by construction.
          The recency threshold is derived from the group intervals. Read
          {{ _obs_repo_groups | length }} group(s),
          {{ _obs_group_intervals | length }} of which declare an `interval:`;
          {{ _obs_bad_intervals | length }} are in a unit this guard does not
          understand ({{ _obs_bad_intervals | join(', ') | default('none', true) }}) —
          only plain `<N>s`, `<N>m` and `<N>h` are handled. Either fix the
          interval, or teach this derivation the new unit; do NOT delete the
          assert, because an unparsed interval silently TIGHTENS the threshold
          rather than loosening it, and the eval check below would start failing
          deploys for a reason its own message could not explain.
        quiet: true

    # ---- Half A: does Grafana serve exactly the rules this repo ships? ----------
    # Ordered FIRST: the provisioning API answers as soon as /api/health does, and
    # a set mismatch is the more precise diagnosis — the eval half's count would
    # also move, but it could not say which rule.
    - name: Fetch the alert rules Grafana is serving
      ansible.builtin.uri:
        url: "http://127.0.0.1:3000/api/v1/provisioning/alert-rules"
        user: "{{ vault_grafana_user }}"
        password: "{{ vault_grafana_password }}"
        force_basic_auth: true
        headers:
          Host: "{{ vault_grafana_domain }}"
      register: grafana_served_rules
      until: >-
        grafana_served_rules.status | default(0) == 200
        and _obs_served_uids == _obs_repo_rule_uids
      retries: 12
      delay: 5
      changed_when: false
      # ignore_errors, NOT failed_when: false — the assert below must be able to
      # read `failed`, and `failed_when: false` ASSIGNS failed=False, which makes
      # the assert vacuously true. See "a guard you have not seen fail is not a
      # guard" in CLAUDE.md. No no_log anywhere on this pair either: it would
      # censor the one diagnostic these tasks exist to print (#88).
      ignore_errors: true
      when: not ansible_check_mode

    - name: Assert Grafana serves exactly the alert rules in version control
      ansible.builtin.assert:
        that:
          - grafana_served_rules is not failed
          - grafana_served_rules.status | default(0) == 200
          - _obs_repo_rule_uids | difference(_obs_served_uids) | length == 0
          - _obs_served_uids | difference(_obs_repo_rule_uids) | length == 0
        fail_msg: >-
          Grafana is NOT serving the alert rules in version control.
          Provisioned in files/data/grafana/provisioning/alerting/:
          {{ _obs_repo_rule_uids | length }}; served by Grafana:
          {{ _obs_served_uids | length }}.
          MISSING FROM GRAFANA (in the repo, not served):
          {{ _obs_repo_rule_uids | difference(_obs_served_uids) | join(', ') | default('none', true) }}.
          NOT IN THE REPO (served by Grafana, not in version control):
          {{ _obs_served_uids | difference(_obs_repo_rule_uids) | join(', ') | default('none', true) }}.
          A missing uid usually means the rsync above did not ship the file; check
          `docker logs grafana` for provisioning errors.
          A uid that is NOT IN THE REPO has two causes, and the second one is the
          non-obvious half of this check. (1) A rule created outside version
          control — in the UI, or via the API with X-Disable-Provenance — which no
          review, no dashboard and no future deploy of this role will ever see.
          (2) A rule this repo USED TO ship and no longer does. MEASURED on the
          first live run of this guard (#212): deleting a rule from these files
          does NOT delete it from Grafana. The rsync above runs with delete:true
          and Grafana was restarted, and three rules dropped from the files were
          still served afterwards — the file provisioner reconciles the rules a
          file DECLARES, never the ones it stopped declaring. So a rename or a
          removal leaves an orphan that keeps evaluating, keeps paging, and is
          invisible in git.
          Fix (2) with a `deleteRules:` block in a rule file
          (`deleteRules: [{orgId: 1, uid: <uid>}]`). For a FILE-PROVISIONED rule
          that is not the tidier option, it is the ONLY one: the provisioning API
          refuses the delete with HTTP 409 `cannot delete with provided provenance
          '', needs 'classic-file-provisioning'` — and `X-Disable-Provenance: true`
          does not help, it is what sets the provenance to '' and CAUSES the
          mismatch (measured). `DELETE /api/v1/provisioning/alert-rules/<uid>`
          works only on an API-CREATED stray, which is cause (1). Note also that
          `deleteRules:` is a TOP-LEVEL key, so a tombstone-only file has no
          `groups:` and trips the per-file "contributed rules" assert further up —
          put the block in a file that also ships rules. If the rule is wanted,
          write it into this role's alerting folder instead.
          HTTP status was {{ grafana_served_rules.status | default('none') }}.
        quiet: true
      when: not ansible_check_mode

    # ---- Half B: is every one of them actually EVALUATING? ----------------------
    - name: Fetch the evaluation freshness of every alert rule Grafana serves
      ansible.builtin.uri:
        url: "http://127.0.0.1:3000/api/prometheus/grafana/api/v1/rules"
        user: "{{ vault_grafana_user }}"
        password: "{{ vault_grafana_password }}"
        force_basic_auth: true
        headers:
          Host: "{{ vault_grafana_domain }}"
      register: grafana_rule_eval
      # SUBSET, not count equality, and the difference is not pedantic: counts are
      # satisfied by WRONG-RULE SUBSTITUTION. One stray healthy rule plus one
      # broken expected rule keeps `33 == 33` true and the guard passes over
      # exactly the defect it exists to catch. Demonstrated before shipping:
      # expected [r1,r2,r3] against passing [r1,r2,stray] scores equal counts and
      # a difference of [r3]. Half A usually catches the stray first, but these two
      # fetches are separate requests and the eval guard has to stand on its own.
      # Still fails CLOSED — an empty or broken extraction makes the difference the
      # ENTIRE expected set — and the `> 0` clause closes the all-paused case,
      # where an empty expected set would make the subset vacuously satisfied.
      until: >-
        grafana_rule_eval.status | default(0) == 200
        and _obs_expected_active_uids | length > 0
        and _obs_expected_active_uids | difference(_obs_eval_passing_uids) | length == 0
      # ~7 minutes, and MEASURED to be load-bearing rather than defensive. On the
      # apply that retired #212's own scratch fixture, this task retried 27 times
      # (~4.5 min) before passing: after the provisioning restart above, rules in
      # the 5m-interval groups genuinely had not evaluated yet. That run is also
      # the live demonstration that this comparison can be FALSE and then become
      # TRUE — 27 consecutive false evaluations followed by a real pass — which is
      # the freshness predicate discriminating in production, not just in a
      # control. Shrink this budget and a cold scheduler fails the deploy.
      retries: 40
      delay: 10
      changed_when: false
      ignore_errors: true
      when: not ansible_check_mode

    - name: Assert every unpaused alert rule is still being evaluated
      ansible.builtin.assert:
        that:
          - grafana_rule_eval is not failed
          - grafana_rule_eval.status | default(0) == 200
          - _obs_expected_active_uids | length > 0
          - _obs_expected_active_uids | difference(_obs_eval_passing_uids) | length == 0
        fail_msg: >-
          Grafana is serving the alert rules but they are not all EVALUATING.
          {{ _obs_eval_passing_uids | length }} of
          {{ _obs_expected_active_uids | length }} expected (unpaused) rules
          reported health=ok with a lastEvaluation newer than
          {{ _obs_eval_cutoff }} (2x the widest group interval,
          {{ _obs_rule_max_interval_s }}s).
          NOT PROVEN EVALUATING:
          {{ _obs_expected_active_uids | difference(_obs_eval_passing_uids) | join(', ') | default('none', true) }}.
          Those are the rules to fix; the buckets below say WHY each one failed.
          UNHEALTHY: {{ _obs_eval_unhealthy | default({}, true) }}.
          NO health FIELD: {{ _obs_eval_no_health | join(', ') | default('none', true) }}.
          UNPARSEABLE lastEvaluation:
          {{ _obs_eval_bad_timestamp | join(', ') | default('none', true) }}.
          STALE (healthy but not evaluated inside the window):
          {{ _obs_eval_stale_uids | join(', ') | default('none', true) }}.
          READ THE BUCKETS ABOVE, NOT A GUESS ABOUT NoData. `health: nodata`
          would mean a query returned nothing, but measured on Grafana 13.2.0 no
          rule this repo ships can ever report it: `noDataState` maps the NoData
          result to a state BEFORE `health` is derived, and every rule here is
          `Alerting` or `OK`, never `NoData`. So this guard does NOT catch a
          typo'd or renamed selector, and a green run is not evidence that every
          `expr` still matches something — that gap is tracked in #232.
          `health: error` is a datasource or query error — check the datasource
          asserts above first. STALE with everything else healthy means the
          scheduler is not running the group at all: the rules are served, but
          nothing is evaluating them. Note that `state` is NOT read here on
          purpose: obs-alert-delivery-heartbeat fires by design, and `inactive` is
          also what a rule that never ran reports.
          HTTP status was {{ grafana_rule_eval.status | default('none') }}.
        quiet: true
      when: not ansible_check_mode

# --- Opt-in recovery path: wipe a wedged Vector disk buffer (#108) --------------
# `never` keeps these tasks out of every ordinary run; they execute ONLY when the
# operator asks for them by tag. Included (not inlined) so the tag lives on one
# statement and the whole file inherits it.
#   ansible-playbook playbooks/deploy-services.yml \
#     --limit eq12_docker --tags vector_buffer_reset
# Runbook (symptoms, when this is the right answer, what it costs):
# docs/solutions/integration-issues/vector-wedged-disk-buffer-reset.md
#
# The `when` is NOT redundant with `never`. deploy-services.yml includes each role
# with `apply: tags: "{{ service }}"`, so every task in this role also carries the
# tag `observability` — and `never` only suppresses a task while none of ITS tags is
# explicitly requested. `--tags observability`, the documented way to deploy this one
# service, therefore requests a tag this task has, and the destructive reset would
# run on an ordinary single-service deploy. Verified, not theorised: a check-mode run
# with `--tags observability` executed "Stop Vector" before this guard was added.
# ansible_run_tags is exactly what the operator typed, so this distinguishes "asked
# for the reset" from "asked for the service".
# `apply:` is required, not decoration: on a DYNAMIC include, bare `tags:` tag only
# the include statement — the included tasks do not inherit them, so they would carry
# only the playbook's `observability` tag and `--tags vector_buffer_reset` would
# include the file and then filter every task inside it out (an opt-in path that
# silently does nothing). Also verified by running it.
- name: Reset the Vector disk buffer (opt-in, destructive)
  ansible.builtin.include_tasks:
    file: vector-buffer-reset.yml
    apply:
      tags: [vector_buffer_reset]
  when: "'vector_buffer_reset' in ansible_run_tags"
  tags: [never, vector_buffer_reset]
