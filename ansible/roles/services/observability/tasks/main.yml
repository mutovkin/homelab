---
# #88: no credential in this stack may be blank. VictoriaMetrics/VictoriaLogs
# treat an EMPTY --httpAuth value as "auth disabled", and Grafana starts
# auth-weak on a blank admin user/password — either used to deploy green with a
# published port left open. This assert now fails first, ahead of env.j2's
# hard-fail and compose's `:?` guard, and before anything touches state. It runs
# under --check, so a dry run with a missing or renamed vault var reports the var
# BY NAME instead of a Jinja trace.
#
# The loop item is the variable NAME, never its value: quiet:true trims success
# output, and on failure the assertion is reported as a literal expression while
# fail_msg names the variable — so no value prints either way.
#
# Condition, filter by filter — each one earns its place (matrix-tested):
#   default('', true)  a defined-but-null `vault_x:` (the natural way to blank a
#                      value) is None, and `None | length` crashes with a raw
#                      Jinja error instead of our message.
#   | string           a non-string value (an unquoted integer) crashes `trim`
#                      the same way.
#   | trim             a whitespace-only value used to PASS.
# Falsy scalars (0, false) are rejected as blank too — nonsense as a credential,
# and failing loud is the safe direction. No opt-out var: auth is mandatory.
- name: Assert observability credentials are set and non-empty
  ansible.builtin.assert:
    that:
      - lookup('vars', item, default='') | default('', true) | string | trim | length > 0
    fail_msg: >-
      {{ item }} is empty or undefined — the observability stack must never deploy
      with blank credentials: VM/VL would run with HTTP auth silently disabled on
      0.0.0.0:8428/9428, and Grafana would start auth-weak on :3000. Set it with
      `task vault:edit -- inventory/host_vars/<host>/vault.yml`.
    quiet: true
  loop:
    - vault_vm_auth_username
    - vault_vm_auth_password
    - vault_vl_auth_username
    - vault_vl_auth_password
    - vault_grafana_user
    - vault_grafana_password

# --- Firewall: scope the unauthenticated InfluxDB ingest port to its writer (#122) ---
# --influxListenAddr=:8089 is a write endpoint with NO authentication of its own
# (--httpAuth.* guards :8428 only), published on tcp AND udp, on 0.0.0.0/[::]. Its
# only intended client is the Home Assistant VM. Hence nft_fw_protocols: [tcp, udp] —
# governing only TCP would leave the UDP half of the same unauthenticated write port
# wide open. The read ports (:8428 VM, :9428 VL, :3000 Grafana) are deliberately not
# governed: NPM and operator workstations must keep reaching them.
#
# Implemented by the shared nft_scoped_fw role (#114) rather than a fork of it — the
# fail-open table, prerouting hook, drift probe and self-heal all live there. See
# docs/solutions/conventions/scoped-nftables-on-live-host.md.
#
# observability_firewall (lan_iface/ports) comes from host_vars; deliberately NO role
# defaults — a host that deploys this role without defining it must fail loudly, not
# silently publish an open write port.
- name: Restrict the unauthenticated InfluxDB ingest port to its writer
  ansible.builtin.include_role:
    name: nft_scoped_fw
  vars:
    nft_fw_name: observability
    nft_fw_description: Observability ingest firewall (Ansible-managed nftables table inet observability_fw)
    nft_fw_ports: "{{ observability_firewall.ports }}"
    nft_fw_protocols: [tcp, udp]
    # Default for the prerouting hook anyway; stated because the choice matters —
    # at -150 daddr is still pre-DNAT, so container egress to some external :8089
    # is non-local and exits before the drop.
    nft_fw_scope_guard: fib
    nft_fw_lan_iface: "{{ observability_firewall.lan_iface }}"

- name: Stat Docker socket
  ansible.builtin.stat:
    path: /var/run/docker.sock
  register: docker_socket_stat

- name: Create observability data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ data_mount }}/victoriametrics"
    - "{{ data_mount }}/victorialogs"
    - "{{ data_mount }}/vector"
    - "{{ data_mount }}/vector/data"
    - "{{ data_mount }}/telegraf"
    - "{{ data_mount }}/grafana/data"
    - "{{ data_mount }}/grafana/config"
    - "{{ data_mount }}/grafana/dashboards"
    - "{{ data_mount }}/grafana/provisioning"

# --- Structured host-log stream for Vector (#143) -----------------------------
# Debian's RSYSLOG_FileFormat carries no <PRI>, so severity and facility are
# unrecoverable from /var/log/syslog and /var/log/auth.log — Vector had to store
# every host record as `level: info`. These tasks make rsyslog emit the same
# messages a SECOND time in RFC5424 to /var/log/structured.log, which is what
# vector.yaml's `host_syslog` source now tails INSTEAD of syslog+auth.log.
# Full reasoning: files/rsyslog-vector-structured.conf.
#
# Ordered before the config copy below on purpose: the file must exist and be
# written before Vector restarts onto a config that reads only that file.
- name: Deploy rsyslog structured-stream config for Vector
  ansible.builtin.copy:
    src: rsyslog-vector-structured.conf
    dest: /etc/rsyslog.d/40-vector-structured.conf
    mode: "0644"
  register: vector_rsyslog_conf

- name: Deploy logrotate policy for the structured stream
  ansible.builtin.copy:
    src: logrotate-structured
    dest: /etc/logrotate.d/vector-structured
    mode: "0644"

# The one genuine outage risk in this change: a drop-in rsyslog rejects takes
# rsyslog down on restart, and with it ALL host logging — syslog, auth.log and the
# new stream at once. `rsyslogd -N1` parses the whole config (master + every
# /etc/rsyslog.d drop-in) without touching the running daemon and exits non-zero on
# a parse error, so a bad file fails the play here instead of on the restart below.
# Skipped in check mode, where the copy above has not happened and there would be
# nothing new to validate.
- name: Validate the rsyslog configuration before restarting
  ansible.builtin.command: rsyslogd -N1
  changed_when: false
  when: not ansible_check_mode

- name: Restart rsyslog to pick up the structured stream
  ansible.builtin.systemd_service:
    name: rsyslog
    state: restarted
  when:
    - vector_rsyslog_conf.changed
    - not ansible_check_mode

# LOAD-BEARING GUARD, not a nicety. vector.yaml no longer tails syslog/auth.log, so
# a drop-in that loads cleanly but routes nothing leaves Vector with an empty input
# and the host silently stops shipping logs entirely — the exact green-but-dead
# shape this whole issue family is about. rsyslog writes its own start message on
# restart, so the file is non-empty within a second; the wait is slack.
- name: Wait for the structured stream to appear
  ansible.builtin.wait_for:
    path: /var/log/structured.log
    timeout: 15
  when: not ansible_check_mode

- name: Stat the structured stream
  ansible.builtin.stat:
    path: /var/log/structured.log
  register: vector_structured_log
  when: not ansible_check_mode

- name: Assert the structured stream is being written
  ansible.builtin.assert:
    that:
      - vector_structured_log.stat.exists
      - vector_structured_log.stat.size > 0
    fail_msg: >-
      /var/log/structured.log is missing or empty. rsyslog loaded
      /etc/rsyslog.d/40-vector-structured.conf but is not routing to it, so Vector
      — which now tails ONLY this file for host logs — would ship nothing.
      Check `systemctl status rsyslog` and `journalctl -u rsyslog` on this host.
    quiet: true
  when: not ansible_check_mode

# The compose file bind-mounts these paths directly (not from the deploy dir), so
# without these tasks a config edited in the repo never reaches the container and
# the only way to apply it is an ad-hoc scp — which Critical Rule 1 forbids.
- name: Deploy observability service configs
  ansible.builtin.copy:
    src: "data/{{ item.src }}"
    dest: "{{ data_mount }}/{{ item.src }}"
    mode: "0644"
  loop:
    - { src: vector/vector.yaml, service: vector }
    - { src: telegraf/telegraf.conf, service: telegraf }
    - { src: grafana/config/grafana.ini, service: grafana }
  loop_control:
    label: "{{ item.src }}"
  register: observability_configs

# delete: true so a file removed from the repo is removed from the host — otherwise
# Grafana keeps provisioning a datasource that no longer exists in version control.
# --checksum because rsync's default mtime comparison reports every file as changed
# on a fresh clone, which would restart Grafana spuriously on the other operator machine.
# times: false because rsync would otherwise "touch" mtimes on content-identical files
# (a fresh clone/worktree gives every file a new mtime), flipping changed and restarting
# Grafana for nothing.
- name: Deploy Grafana provisioning
  become: false
  ansible.posix.synchronize:
    src: "{{ role_path }}/files/data/grafana/provisioning/"
    dest: "{{ data_mount }}/grafana/provisioning/"
    delete: true
    times: false
    # Pin the rsync channel's host key too — see _deploy's synchronize (#94).
    verify_host: true
    use_ssh_args: true
    rsync_opts:
      - "--checksum"
  register: grafana_provisioning

# Separate from provisioning because Grafana hot-reloads provisioned dashboards —
# a dashboard change needs no restart. Without this the first dashboard JSON ever
# committed would silently never reach the container.
- name: Deploy Grafana dashboards
  become: false
  ansible.posix.synchronize:
    src: "{{ role_path }}/files/data/grafana/dashboards/"
    dest: "{{ data_mount }}/grafana/dashboards/"
    delete: true
    times: false
    # Pin the rsync channel's host key too — see _deploy's synchronize (#94).
    verify_host: true
    use_ssh_args: true
    rsync_opts:
      - "--checksum"

- name: Deploy observability via the shared service pipeline
  ansible.builtin.include_role:
    name: services/_deploy
  vars:
    svc: observability
    # These two live in files/ so the `copy` tasks above can find them, but they
    # are HOST config (/etc/rsyslog.d, /etc/logrotate.d) — not part of the compose
    # payload. Without the excludes _deploy's `delete: true` synchronize would also
    # drop them into {{ data_mount }}/deploy/observability/, where they mean
    # nothing and only invite someone to "fix" the wrong copy (#143).
    svc_rsync_extra:
      - "--exclude=rsyslog-vector-structured.conf"
      - "--exclude=logrotate-structured"

# Single source of truth for the restart decision, shared by the check-mode
# preview, the restart itself and the readiness gates (postgresql/lms/frigate
# precedent). Deliberately NO default() on grafana_provisioning.changed: if that
# register is renamed this must fail loudly rather than silently decide Grafana
# needs no restart — provisioning would then never load and the play would still
# report converged, the do-nothing failure mode #78 is about. (The `default([])`
# on observability_configs.results guards a different thing: a legitimately
# skipped copy loop, not a typo'd name.)
- name: Determine observability containers to restart for changed config
  vars:
    _targets: >-
      {{ ((observability_configs.results | default([]) | selectattr('changed') | map(attribute='item.service') | list)
          + (['grafana'] if grafana_provisioning.changed else [])) | unique }}
  ansible.builtin.set_fact:
    observability_restart_targets: "{{ _targets }}"
    # grafana has its own HTTP gate below; these two are gated on staying alive.
    observability_settle_targets: "{{ _targets | reject('equalto', 'grafana') | list }}"

# --check must surface the restart; the restart task itself is necessarily
# skipped in check mode.
- name: Preview config-change restart (check mode)
  ansible.builtin.debug:
    msg: >-
      Config change WILL RESTART on real apply: {{ observability_restart_targets }}
      (brief gap in metrics/logs ingestion and, for grafana, in the UI).
  when:
    - ansible_check_mode
    - observability_restart_targets | length > 0

# Compose does not track the contents of bind-mounted files, so a config change on
# its own never restarts the container. Restart the affected services explicitly,
# after the stack exists so this also works on a first deploy.
- name: Restart observability services whose config changed
  community.docker.docker_container:
    name: "{{ item }}"
    state: started
    restart: true
  loop: "{{ observability_restart_targets }}"
  # Skipped in check mode: on a host that has never been deployed the containers do
  # not exist yet, and docker_container would fail rather than preview anything.
  when: not ansible_check_mode

# docker_container returns on ISSUANCE, not on service — the same wording the
# postgresql, lms and frigate roles use for their own gates in this branch, and
# the reason all three added one. It matters most here: Grafana's file provisioner
# treats a rejected provisioning document as a FATAL STARTUP ERROR, so a mistyped
# alert rule in files/data/grafana/provisioning/alerting/ restarts Grafana into a
# crash loop — the file that exists to make silent pipeline death visible would be
# installed by a mechanism that silently kills the reporter. /api/health is
# unauthenticated and returns 200 only once Grafana has finished provisioning.
- name: Wait for Grafana to serve its health endpoint after the restart
  ansible.builtin.uri:
    url: "http://localhost:{{ grafana_web_port }}/api/health"
    status_code: 200
  register: grafana_health
  until: grafana_health is succeeded
  retries: 12
  delay: 5
  changed_when: false
  when:
    - not ansible_check_mode
    - "'grafana' in observability_restart_targets"

# vector and telegraf expose no HTTP surface to probe, so the gate is "still up
# after a settle period". The wait is the load-bearing part: vector exits ~1s
# after a malformed vector.yaml, so an inspect issued immediately after the
# restart lands inside the crash window about as often as not, and `Running: true`
# there means nothing. 15s is comfortably past that window and past docker's
# first restart backoff, so a crash-looping container is caught between attempts
# or in `restarting`.
- name: Let restarted vector/telegraf run long enough to crash on a bad config
  ansible.builtin.wait_for:
    timeout: "{{ observability_settle_seconds }}"
  when:
    - not ansible_check_mode
    - observability_settle_targets | length > 0

- name: Re-inspect the restarted vector/telegraf containers
  community.docker.docker_container_info:
    name: "{{ item }}"
  register: observability_settled
  loop: "{{ observability_settle_targets }}"
  when: not ansible_check_mode

- name: Assert restarted vector/telegraf are still running
  ansible.builtin.assert:
    that:
      - item.exists
      - item.container.State.Running | default(false)
    fail_msg: >-
      {{ item.item }} is not running {{ observability_settle_seconds }}s after its
      config-change restart — the new config was deployed but the container did not
      stay up. Check `docker logs {{ item.item }}`; a malformed
      {{ item.item }} config makes it exit within about a second of start.
    quiet: true
  loop: "{{ observability_settled.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when: not ansible_check_mode

# --- Opt-in recovery path: wipe a wedged Vector disk buffer (#108) --------------
# `never` keeps these tasks out of every ordinary run; they execute ONLY when the
# operator asks for them by tag. Included (not inlined) so the tag lives on one
# statement and the whole file inherits it.
#   ansible-playbook playbooks/deploy-services.yml \
#     --limit eq12_docker --tags vector_buffer_reset
# Runbook (symptoms, when this is the right answer, what it costs):
# docs/solutions/integration-issues/vector-wedged-disk-buffer-reset.md
#
# The `when` is NOT redundant with `never`. deploy-services.yml includes each role
# with `apply: tags: "{{ service }}"`, so every task in this role also carries the
# tag `observability` — and `never` only suppresses a task while none of ITS tags is
# explicitly requested. `--tags observability`, the documented way to deploy this one
# service, therefore requests a tag this task has, and the destructive reset would
# run on an ordinary single-service deploy. Verified, not theorised: a check-mode run
# with `--tags observability` executed "Stop Vector" before this guard was added.
# ansible_run_tags is exactly what the operator typed, so this distinguishes "asked
# for the reset" from "asked for the service".
# `apply:` is required, not decoration: on a DYNAMIC include, bare `tags:` tag only
# the include statement — the included tasks do not inherit them, so they would carry
# only the playbook's `observability` tag and `--tags vector_buffer_reset` would
# include the file and then filter every task inside it out (an opt-in path that
# silently does nothing). Also verified by running it.
- name: Reset the Vector disk buffer (opt-in, destructive)
  ansible.builtin.include_tasks:
    file: vector-buffer-reset.yml
    apply:
      tags: [vector_buffer_reset]
  when: "'vector_buffer_reset' in ansible_run_tags"
  tags: [never, vector_buffer_reset]
