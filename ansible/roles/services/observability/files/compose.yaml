services:
  # VictoriaMetrics - Time-series database for metrics
  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: victoriametrics
    restart: unless-stopped
    security_opt:
      - "apparmor:unconfined"
      # No setuid/setgid/fscaps escalation from anything inside this container (#95).
      - "no-new-privileges:true"
    ports:
      - "8428:8428" # HTTP API and Web UI (vmui)
      - "8089:8089" # InfluxDB HTTP API (for Home Assistant)
      - "8089:8089/udp" # InfluxDB UDP API
    volumes:
      - /data/victoriametrics:/victoria-metrics-data
    command:
      - "--storageDataPath=/victoria-metrics-data" # Path to store time-series data
      - "--httpListenAddr=:8428" # HTTP API and Web UI (vmui) port
      - "--influxListenAddr=:8089" # Enable InfluxDB protocol for Home Assistant
      - "--retentionPeriod=5y" # Keep metrics for 5 years (Home Assistant historical data)
      - "--dedup.minScrapeInterval=15s" # Deduplicate metrics within 15s window (smooths HA transients)
      - "--maxLabelsPerTimeseries=50" # Maximum labels per metric (prevents cardinality explosion)
      - "--search.maxQueryDuration=30s" # Query timeout (prevents long-running queries)
      - "--search.maxConcurrentRequests=12" # Max parallel queries (prevents overload)
      - "--memory.allowedPercent=40" # Use 40% of available RAM (leaves room for OS page cache)
      - "--httpAuth.username=${VM_AUTH_USERNAME:?required - VM must never run unauthenticated, see #88}"
      - "--httpAuth.password=${VM_AUTH_PASSWORD:?required - VM must never run unauthenticated, see #88}"
    environment:
      TZ: ${TIMEZONE:-UTC}
    deploy:
      resources:
        limits:
          memory: ${VM_MEMORY_LIMIT:-2G} # Prevent OOM crashes
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:8428/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - observability
    labels:
      # Stateful TSDB with an on-disk format that migrates forward one way: an
      # unattended upgrade would rewrite 5y of metrics with no fresh backup. "enable"
      # keeps it in scan scope so new versions are reported; "monitor-only" stops
      # Watchtower applying them. Update via `task deploy:service -- --tags
      # observability` (#83).
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.monitor-only=true"

  # VictoriaLogs - High-performance log aggregation
  victorialogs:
    image: victoriametrics/victoria-logs:latest
    container_name: victorialogs
    restart: unless-stopped
    security_opt:
      - "apparmor:unconfined"
      # No setuid/setgid/fscaps escalation from anything inside this container (#95).
      - "no-new-privileges:true"
    ports:
      - "9428:9428" # HTTP API and Web UI (select/vmui)
    volumes:
      - /data/victorialogs:/victoria-logs-data
    command:
      - "--storageDataPath=/victoria-logs-data" # Path to store log data
      - "--httpListenAddr=:9428" # HTTP API and Web UI (select/vmui) port
      - "--retentionPeriod=90d" # Keep logs for 90 days (use time-based retention)
      - "--httpAuth.username=${VL_AUTH_USERNAME:?required - VL must never run unauthenticated, see #88}"
      - "--httpAuth.password=${VL_AUTH_PASSWORD:?required - VL must never run unauthenticated, see #88}"
    environment:
      TZ: ${TIMEZONE:-UTC}
    deploy:
      resources:
        limits:
          memory: ${VL_MEMORY_LIMIT:-1G} # Prevent OOM crashes
    # No healthcheck: the victoria-logs image is built from scratch — it has no shell
    # and no wget/curl, so any exec-based probe fails by construction and reports the
    # container permanently unhealthy. Liveness is observed externally (/health on
    # :9428) rather than faked here.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - observability
    labels:
      # Same class as victoriametrics: stateful on-disk log store, 90d retention,
      # forward-only format migrations. Scanned and reported, never auto-updated (#83).
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.monitor-only=true"

  # Vector - High-performance log collection and routing
  vector:
    image: timberio/vector:latest-distroless-static # Smallest, most secure (20-30MB)
    container_name: vector
    restart: unless-stopped
    security_opt:
      - "apparmor:unconfined"
      # No setuid/setgid/fscaps escalation from anything inside this container (#95).
      - "no-new-privileges:true"
    labels:
      # Proven breaking-change history: the unattended 0.57 update shipped two
      # independent breaking changes — a crash loop from template confinement, then a
      # silent 401 from disabled ${VAR} interpolation — and the log pipeline was dead
      # for ~30 days (see
      # docs/solutions/integration-issues/vector-057-silent-log-pipeline-failure.md).
      # Scanned and reported, never auto-updated (#83).
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.monitor-only=true"
    # No ports: vector.yaml enables no `api:` block, so 8686 published nothing
    # but an open port on 0.0.0.0 (#94).
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /data/vector/vector.yaml:/etc/vector/vector.yaml:ro # Vector configuration file
      - /var/log:/var/log:ro
      - /data/vector/data:/var/lib/vector # data_dir: disk buffer + file checkpoints must survive recreates (#82)
    command: --config /etc/vector/vector.yaml
    environment:
      TZ: ${TIMEZONE:-UTC}
      # The `:-` on these auth passthroughs (here, telegraf and grafana) is safe
      # ONLY because the `:?` on victoriametrics'/victorialogs' --httpAuth flag
      # lines aborts the whole-file parse first, so they can never actually
      # resolve empty (#88). Do not copy this `:-` onto a new auth-bearing line
      # that has no `:?` guard upstream of it.
      VL_AUTH_USERNAME: ${VL_AUTH_USERNAME:-}
      VL_AUTH_PASSWORD: ${VL_AUTH_PASSWORD:-}
      # VictoriaMetrics auth for the internal-metrics sink (#151) — same `:-`
      # rationale as the VL pair above, and safe for the same reason only:
      # victoriametrics' own `--httpAuth` `:?` lines abort the whole-file parse
      # first, so these can never actually resolve empty.
      VM_AUTH_USERNAME: ${VM_AUTH_USERNAME:-}
      VM_AUTH_PASSWORD: ${VM_AUTH_PASSWORD:-}
      # Vector 0.57 disabled ${VAR} interpolation inside config files by default.
      # vector.yaml is bind-mounted and read by Vector (not by compose), so without
      # this the sink's auth block is sent literally as "${VL_AUTH_USERNAME}" and
      # VictoriaLogs rejects every batch with 401 — silently, since Vector still
      # starts. This is upstream's documented flag for restoring the old behaviour.
      VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION: "true"
      # The hostname label on every log record (#143), read by vector.yaml as
      # ${VECTOR_HOSTNAME} via the interpolation flag above. Templated from
      # Ansible's inventory_hostname by templates/env.j2.
      # `:?` and not `:-`: a missing value must abort the compose parse loudly. An
      # empty default would silently relabel every record on the host with "", and
      # a label that is wrong-but-present is exactly the defect this replaces.
      VECTOR_HOSTNAME: ${VECTOR_HOSTNAME:?required - see roles/services/observability/templates/env.j2 (#143)}
    deploy:
      resources:
        limits:
          memory: ${VECTOR_MEMORY_LIMIT:-512M} # Prevent OOM crashes
    networks:
      - observability
    depends_on:
      victorialogs:
        # service_started, not service_healthy: victorialogs has no healthcheck (scratch
        # image). Vector's loki sink healthcheck is non-fatal and it has a disk buffer
        # with retries, so it tolerates victorialogs not yet accepting connections.
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # System and network metrics collection
  telegraf:
    image: telegraf:latest
    container_name: telegraf
    restart: unless-stopped
    security_opt:
      - "apparmor:unconfined"
      # DELIBERATELY NO `no-new-privileges:true` here — the other four services in
      # this stack all have it (#95); telegraf is the documented exception.
      #
      # [[inputs.ping]] in the default "exec" mode shells out to /usr/bin/ping,
      # which is non-root-usable only because the image ships it with the
      # cap_net_raw file capability. no_new_privs makes the kernel ignore file
      # capabilities on exec, so adding it here breaks the ping input: eight of
      # the nine ping_* fields stop reporting and ping_result_code pins at 2
      # ("fatal error") while the container stays up and every deploy stays green.
      # That is exactly what happened when it was added, and why it is off again.
      #
      # Neither escape works, both measured on eq12_docker rather than assumed:
      #   * cap_add: [NET_RAW] — the container runs as the non-root telegraf user,
      #     and a capability added by docker lands only in the BOUNDING set for a
      #     non-root process (measured: CapPrm/CapEff 0, CapBnd a80425fb). Docker
      #     sets no ambient capabilities, so nothing reaches the process.
      #   * method = "native" + net.ipv4.ping_group_range — telegraf 1.39's native
      #     pinger opens a PRIVILEGED raw socket (there is no privileged/
      #     unprivileged option on the plugin), so it fails with "enable CAP_NET_RAW
      #     capabilities" no matter what the ping group range is. The unprivileged
      #     ICMP-datagram path the sysctl unlocks is never taken.
      # A non-root telegraf therefore cannot ping without the setuid/fscaps binary,
      # and keeping the ping input is worth more than no_new_privs on this one
      # container: internet-reachability data is the whole point of the input, and
      # the container is already constrained by its non-root user and its resource
      # limit. Revisit if telegraf ever exposes an unprivileged native pinger.
    # :? not :-  — a default here is a guess at a per-host gid (996 vs 990) and
    # a wrong one silently costs telegraf its docker metrics (#94).
    user: telegraf:${DOCKER_GID:?}
    labels:
      # Two reasons, either sufficient. (1) Socket holder: it bind-mounts
      # /var/run/docker.sock, and `:ro` is cosmetic for a unix socket — the API is
      # bidirectional over it regardless — so the "socket holder ⇒ monitor-only" rule
      # applies here as much as to portainer and watchtower. (2) Vector-shaped risk:
      # floating `telegraf:latest` reading a bind-mounted telegraf.conf, where a plugin
      # deprecation across releases stops metrics without stopping the container.
      # Scanned and reported, never auto-updated (#83).
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.monitor-only=true"
    volumes:
      - /data/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      # Deliberately NO `- /etc:/host/etc:ro` — see the HOST_ETC note below (#95).
    environment:
      # HOST_PROC/HOST_SYS are load-bearing: gopsutil reads every cpu/mem/disk/net/
      # netstat/kernel/processes/swap/system metric out of them, so without the
      # redirect telegraf would report the container's namespace, not the host's.
      HOST_PROC: /host/proc
      HOST_SYS: /host/sys
      # There is deliberately no HOST_ETC (and no /etc mount) — removed in #95.
      # None of the 12 enabled inputs (cpu, disk, kernel, mem, processes, swap,
      # system, net, netstat, docker, ping, http_response) reads it: gopsutil
      # consults HOST_ETC only for platform/distro identification
      # (/etc/os-release, machine-id), which nothing here emits as a field or tag.
      # Proven empirically before removal — `telegraf --test` with
      # `-e HOST_ETC=/nonexistent` produced byte-identical metric sets (same
      # fields, same tags, no warnings) for every input group. HOST_MOUNT_PREFIX
      # is not set anywhere either, so nothing else re-derives an /etc path.
      # What it cost: the whole host /etc — directory listing plus every
      # world-readable file in it — exposed to a floating `telegraf:latest` that
      # Watchtower scans, for zero consumers. (The container runs as the non-root
      # telegraf user — see `user:` above — so /etc/shadow was never readable; the
      # rest of /etc was. Note this service is the documented no-new-privileges
      # carve-out, explained in security_opt above: the non-root uid is the ONLY
      # thing that was bounding this mount, which is the argument for removing it
      # rather than for keeping it.) If a future input genuinely needs platform tagging,
      # mount the single file it needs, not the tree:
      #   - /etc/os-release:/host/etc/os-release:ro
      TZ: ${TIMEZONE:-UTC}
      # VictoriaMetrics auth — always on since #88; see the `:-` note on vector.
      VM_AUTH_USERNAME: ${VM_AUTH_USERNAME:-}
      VM_AUTH_PASSWORD: ${VM_AUTH_PASSWORD:-}
    deploy:
      resources:
        limits:
          memory: ${TELEGRAF_MEMORY_LIMIT:-256M} # Prevent OOM crashes
    networks:
      - observability
    depends_on:
      victoriametrics:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Unified visualization for everything
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    security_opt:
      - "apparmor:unconfined"
      # No setuid/setgid/fscaps escalation from anything inside this container (#95).
      - "no-new-privileges:true"
    ports:
      - "3000:3000" # Grafana Web UI
    volumes:
      - /data/grafana/data:/var/lib/grafana # Persistent data (dashboards, users, etc.)
      - /data/grafana/config/grafana.ini:/etc/grafana/grafana.ini:ro # Custom Grafana configuration
      - /data/grafana/dashboards:/var/lib/grafana/dashboards:ro # Dashboard JSON files (auto-loaded)
      - /data/grafana/provisioning:/etc/grafana/provisioning:ro # Datasource/dashboard provisioning
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER} # Admin username from .env
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD} # Admin password from .env
      GF_USERS_ALLOW_SIGN_UP: false # Disable self-registration
      GF_PLUGINS_PREINSTALL: victoriametrics-logs-datasource,victoriametrics-metrics-datasource # Auto-install VictoriaMetrics plugins
      TZ: ${TIMEZONE:-UTC} # Timezone for log timestamps
      GF_LOG_LEVEL: info
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL}
      GF_SERVER_SERVE_FROM_SUB_PATH: false
      GF_SERVER_DOMAIN: ${GRAFANA_DOMAIN}
      GF_SECURITY_COOKIE_SECURE: true
      # Datasource credentials, always set since #88; see the `:-` note on vector.
      VM_AUTH_USERNAME: ${VM_AUTH_USERNAME:-}
      VM_AUTH_PASSWORD: ${VM_AUTH_PASSWORD:-}
      VL_AUTH_USERNAME: ${VL_AUTH_USERNAME:-}
      VL_AUTH_PASSWORD: ${VL_AUTH_PASSWORD:-}
      # SMTP for Grafana alerting (#139). An alert rule with a contact point that
      # cannot send is the same silent-failure defect as a rule with no contact
      # point at all, so every one of these is `:?` and not `:-` — alerting must
      # never be quietly unable to deliver. Values come from the host's shared
      # Gmail relay (also used by watchtower); see templates/env.j2.
      #
      # DOUBLE-QUOTED, and that is not decoration: an unquoted YAML scalar ends at
      # a ` #`, so `${VAR:?required - see #139}` parses as `${VAR:?required - see`
      # plus a comment and compose then rejects the whole file with "invalid
      # interpolation format". Measured, not theorised — it failed the first apply.
      # (`(#143)` on VECTOR_HOSTNAME above survives unquoted only because its `#`
      # follows `(` rather than a space. Quote the value; do not rely on that.)
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: "${GRAFANA_SMTP_HOST:?required - alerting must never be silently unable to send, see #139}"
      GF_SMTP_USER: "${GRAFANA_SMTP_USER:?required - see #139}"
      GF_SMTP_PASSWORD: "${GRAFANA_SMTP_PASSWORD:?required - see #139}"
      GF_SMTP_FROM_ADDRESS: "${GRAFANA_SMTP_FROM_ADDRESS:?required - see #139}"
      GF_SMTP_FROM_NAME: Grafana (homelab)
      # Mandatory, not Opportunistic. Under Opportunistic, a relay that stops
      # advertising STARTTLS — downgrade, MITM, a relay change — gets the shared
      # Gmail app password and the alert bodies in CLEARTEXT, and Grafana logs
      # nothing unusual. smtp.gmail.com:587 always offers STARTTLS, so this costs
      # nothing and removes a silent-downgrade path. Same argument as `:?` over
      # `:-` above: never be quietly unable to do the secure thing.
      GF_SMTP_STARTTLS_POLICY: MandatoryStartTLS
    deploy:
      resources:
        limits:
          memory: ${GRAFANA_MEMORY_LIMIT:-1G} # Prevent OOM crashes
    networks:
      - observability
    depends_on:
      victoriametrics:
        condition: service_healthy
      victorialogs:
        # see note on vector: victorialogs has no healthcheck to wait on
        condition: service_started
      telegraf:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      # Stateful: the grafana.db SQLite schema migrates forward on start and cannot be
      # rolled back by pinning the old tag again. Scanned and reported, never
      # auto-updated (#83).
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.monitor-only=true"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  observability:
    driver: bridge
    name: observability_network
    ipam:
      driver: default
      config:
        - subnet: ${OBSERVABILITY_NETWORK_SUBNET:-172.20.0.0/24}
