services:
  # VictoriaMetrics - Time-series database for metrics
  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: victoriametrics
    restart: unless-stopped
    security_opt:
      - "apparmor:unconfined"
    ports:
      - "8428:8428" # HTTP API and Web UI (vmui)
      - "8089:8089" # InfluxDB HTTP API (for Home Assistant)
      - "8089:8089/udp" # InfluxDB UDP API
    volumes:
      - /data/victoriametrics:/victoria-metrics-data
    command:
      - "--storageDataPath=/victoria-metrics-data" # Path to store time-series data
      - "--httpListenAddr=:8428" # HTTP API and Web UI (vmui) port
      - "--influxListenAddr=:8089" # Enable InfluxDB protocol for Home Assistant
      - "--retentionPeriod=5y" # Keep metrics for 5 years (Home Assistant historical data)
      - "--dedup.minScrapeInterval=15s" # Deduplicate metrics within 15s window (smooths HA transients)
      - "--maxLabelsPerTimeseries=50" # Maximum labels per metric (prevents cardinality explosion)
      - "--search.maxQueryDuration=30s" # Query timeout (prevents long-running queries)
      - "--search.maxConcurrentRequests=12" # Max parallel queries (prevents overload)
      - "--memory.allowedPercent=40" # Use 40% of available RAM (leaves room for OS page cache)
      - "--httpAuth.username=${VM_AUTH_USERNAME:?required - VM must never run unauthenticated, see #88}"
      - "--httpAuth.password=${VM_AUTH_PASSWORD:?required - VM must never run unauthenticated, see #88}"
    environment:
      TZ: ${TIMEZONE:-UTC}
    deploy:
      resources:
        limits:
          memory: ${VM_MEMORY_LIMIT:-2G} # Prevent OOM crashes
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:8428/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - observability
    labels:
      # Stateful TSDB with an on-disk format that migrates forward one way: an
      # unattended upgrade would rewrite 5y of metrics with no fresh backup. "enable"
      # keeps it in scan scope so new versions are reported; "monitor-only" stops
      # Watchtower applying them. Update via `task deploy:service -- --tags
      # observability` (#83).
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.monitor-only=true"

  # VictoriaLogs - High-performance log aggregation
  victorialogs:
    image: victoriametrics/victoria-logs:latest
    container_name: victorialogs
    restart: unless-stopped
    security_opt:
      - "apparmor:unconfined"
    ports:
      - "9428:9428" # HTTP API and Web UI (select/vmui)
    volumes:
      - /data/victorialogs:/victoria-logs-data
    command:
      - "--storageDataPath=/victoria-logs-data" # Path to store log data
      - "--httpListenAddr=:9428" # HTTP API and Web UI (select/vmui) port
      - "--retentionPeriod=90d" # Keep logs for 90 days (use time-based retention)
      - "--httpAuth.username=${VL_AUTH_USERNAME:?required - VL must never run unauthenticated, see #88}"
      - "--httpAuth.password=${VL_AUTH_PASSWORD:?required - VL must never run unauthenticated, see #88}"
    environment:
      TZ: ${TIMEZONE:-UTC}
    deploy:
      resources:
        limits:
          memory: ${VL_MEMORY_LIMIT:-1G} # Prevent OOM crashes
    # No healthcheck: the victoria-logs image is built from scratch — it has no shell
    # and no wget/curl, so any exec-based probe fails by construction and reports the
    # container permanently unhealthy. Liveness is observed externally (/health on
    # :9428) rather than faked here.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - observability
    labels:
      # Same class as victoriametrics: stateful on-disk log store, 90d retention,
      # forward-only format migrations. Scanned and reported, never auto-updated (#83).
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.monitor-only=true"

  # Vector - High-performance log collection and routing
  vector:
    image: timberio/vector:latest-distroless-static # Smallest, most secure (20-30MB)
    container_name: vector
    restart: unless-stopped
    security_opt:
      - "apparmor:unconfined"
    labels:
      # Proven breaking-change history: the unattended 0.57 update shipped two
      # independent breaking changes — a crash loop from template confinement, then a
      # silent 401 from disabled ${VAR} interpolation — and the log pipeline was dead
      # for ~30 days (see
      # docs/solutions/integration-issues/vector-057-silent-log-pipeline-failure.md).
      # Scanned and reported, never auto-updated (#83).
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.monitor-only=true"
    ports:
      - "8686:8686" # Vector GraphQL API for monitoring and debugging
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /data/vector/vector.yaml:/etc/vector/vector.yaml:ro # Vector configuration file
      - /var/log:/var/log:ro
      - /data/vector/data:/var/lib/vector # data_dir: disk buffer + file checkpoints must survive recreates (#82)
    command: --config /etc/vector/vector.yaml
    environment:
      TZ: ${TIMEZONE:-UTC}
      VL_AUTH_USERNAME: ${VL_AUTH_USERNAME:-}
      VL_AUTH_PASSWORD: ${VL_AUTH_PASSWORD:-}
      # Vector 0.57 disabled ${VAR} interpolation inside config files by default.
      # vector.yaml is bind-mounted and read by Vector (not by compose), so without
      # this the sink's auth block is sent literally as "${VL_AUTH_USERNAME}" and
      # VictoriaLogs rejects every batch with 401 — silently, since Vector still
      # starts. This is upstream's documented flag for restoring the old behaviour.
      VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION: "true"
    deploy:
      resources:
        limits:
          memory: ${VECTOR_MEMORY_LIMIT:-512M} # Prevent OOM crashes
    networks:
      - observability
    depends_on:
      victorialogs:
        # service_started, not service_healthy: victorialogs has no healthcheck (scratch
        # image). Vector's loki sink healthcheck is non-fatal and it has a disk buffer
        # with retries, so it tolerates victorialogs not yet accepting connections.
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # System and network metrics collection
  telegraf:
    image: telegraf:latest
    container_name: telegraf
    restart: unless-stopped
    security_opt:
      - "apparmor:unconfined"
    user: telegraf:${DOCKER_GID:-996}
    labels:
      # Two reasons, either sufficient. (1) Socket holder: it bind-mounts
      # /var/run/docker.sock, and `:ro` is cosmetic for a unix socket — the API is
      # bidirectional over it regardless — so the "socket holder ⇒ monitor-only" rule
      # applies here as much as to portainer and watchtower. (2) Vector-shaped risk:
      # floating `telegraf:latest` reading a bind-mounted telegraf.conf, where a plugin
      # deprecation across releases stops metrics without stopping the container.
      # Scanned and reported, never auto-updated (#83).
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.monitor-only=true"
    volumes:
      - /data/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc:/host/etc:ro
    environment:
      HOST_PROC: /host/proc
      HOST_SYS: /host/sys
      HOST_ETC: /host/etc
      TZ: ${TIMEZONE:-UTC}
      VM_AUTH_USERNAME: ${VM_AUTH_USERNAME:-} # VictoriaMetrics auth (if enabled)
      VM_AUTH_PASSWORD: ${VM_AUTH_PASSWORD:-}
    deploy:
      resources:
        limits:
          memory: ${TELEGRAF_MEMORY_LIMIT:-256M} # Prevent OOM crashes
    networks:
      - observability
    depends_on:
      victoriametrics:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Unified visualization for everything
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    security_opt:
      - "apparmor:unconfined"
    ports:
      - "3000:3000" # Grafana Web UI
    volumes:
      - /data/grafana/data:/var/lib/grafana # Persistent data (dashboards, users, etc.)
      - /data/grafana/config/grafana.ini:/etc/grafana/grafana.ini:ro # Custom Grafana configuration
      - /data/grafana/dashboards:/var/lib/grafana/dashboards:ro # Dashboard JSON files (auto-loaded)
      - /data/grafana/provisioning:/etc/grafana/provisioning:ro # Datasource/dashboard provisioning
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER} # Admin username from .env
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD} # Admin password from .env
      GF_USERS_ALLOW_SIGN_UP: false # Disable self-registration
      GF_PLUGINS_PREINSTALL: victoriametrics-logs-datasource,victoriametrics-metrics-datasource # Auto-install VictoriaMetrics plugins
      TZ: ${TIMEZONE:-UTC} # Timezone for log timestamps
      GF_LOG_LEVEL: info
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL}
      GF_SERVER_SERVE_FROM_SUB_PATH: false
      GF_SERVER_DOMAIN: ${GRAFANA_DOMAIN}
      GF_SECURITY_COOKIE_SECURE: true
      VM_AUTH_USERNAME: ${VM_AUTH_USERNAME:-} # VictoriaMetrics auth credentials for datasource
      VM_AUTH_PASSWORD: ${VM_AUTH_PASSWORD:-} # VictoriaMetrics auth credentials for datasource
      VL_AUTH_USERNAME: ${VL_AUTH_USERNAME:-} # VictoriaLogs auth credentials for datasource
      VL_AUTH_PASSWORD: ${VL_AUTH_PASSWORD:-} # VictoriaLogs auth credentials for datasource
    deploy:
      resources:
        limits:
          memory: ${GRAFANA_MEMORY_LIMIT:-1G} # Prevent OOM crashes
    networks:
      - observability
    depends_on:
      victoriametrics:
        condition: service_healthy
      victorialogs:
        # see note on vector: victorialogs has no healthcheck to wait on
        condition: service_started
      telegraf:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      # Stateful: the grafana.db SQLite schema migrates forward on start and cannot be
      # rolled back by pinning the old tag again. Scanned and reported, never
      # auto-updated (#83).
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.monitor-only=true"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  observability:
    driver: bridge
    name: observability_network
    ipam:
      driver: default
      config:
        - subnet: ${OBSERVABILITY_NETWORK_SUBNET:-172.20.0.0/24}
