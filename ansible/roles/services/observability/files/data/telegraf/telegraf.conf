# Grafana's own /metrics (#152). grafana_alerting_notifications_total and its
# _failed_ sibling are the ONLY delivery-path telemetry that exists anywhere in
# this stack, and nothing scraped them — so a notification failure was visible
# only in `docker logs grafana`, which nobody reads on a green run. The two
# delivery-health alert rules query exactly this family.
#
# Verified 2026-08-21 from inside observability_network: /metrics answers 200
# with no auth and no 301 (grafana.ini's enforce_domain exempts it, the same way
# it exempts /api/health — the http_response probe on http://grafana:3000 gets a
# 301 and this does not).
#
# metric_version = 2 so the ORIGINAL metric name round-trips: the prometheus
# serializer returns the field key alone when the measurement is "prometheus", so
# the rules can query grafana_alerting_notifications_* exactly as Grafana exports
# it. MEASURED on telegraf 1.39.3 against this endpoint, because the two versions
# are the reverse of what you would guess:
#   metric_version = 1 -> > grafana_alerting_notifications_total,integration=email counter=4
#   metric_version = 2 -> > prometheus,integration=email grafana_alerting_notifications_total=4
# and serialized (outputs.file, data_format="prometheus") v2 gives
#   grafana_alerting_notifications_total{integration="email",org="1"} 4
#
# fieldpass, NOT namepass, and that is the whole trap. Telegraf's *pass filters
# match the MEASUREMENT name, which under metric_version = 2 is the literal
# string "prometheus" for every single metric — so
# `namepass = ["grafana_alerting_notifications*"]` matches NOTHING and the input
# silently yields zero metrics. Measured: with namepass, `--test` printed no
# lines at all; with fieldpass it prints exactly one. That failure mode is
# invisible from container state (telegraf starts fine, stays healthy) and would
# have left both delivery-health rules permanently NoData — i.e. the
# delivery-failure alert silently OK forever, which is the defect #152 exists to
# remove, reintroduced by its own fix.
#
# Filtering is not optional either: Grafana exposes 505 distinct metric names /
# 3615 series (measured), and this file writes into a 5-YEAR retention TSDB.
# Pulling the whole dump in would be a real cardinality regression for the sake of
# two series. Verify after any change that
# `/api/v1/label/__name__/values | grep -c grafana_` stays in single digits.
# TWO patterns, and the second one is not padding. MEASURED on the live Grafana:
# grafana_alerting_notifications_total is exported only TRANSIENTLY, around the
# time notifications are actually sent — sampled every 30s for 4.5 min on a
# healthy idle instance it was absent from every single sample, and in
# VictoriaMetrics the series exists for six minutes after a notification and then
# vanishes for the rest of a perfectly healthy hour. So it cannot carry an
# absence rule: "no series" is its normal state.
# grafana_alerting_alertmanager_receivers IS exported continuously, for Grafana's
# whole process lifetime (2 series: state=active/inactive), so it is the sentinel
# obs-alert-delivery-telemetry-absent watches to prove this scrape path is alive.
# ITS PRESENCE HERE IS LOAD-BEARING: drop it from this list and that rule goes
# permanently NoData -> Alerting. Coupled by hand; change both together.
[[inputs.prometheus]]
  urls = ["http://grafana:3000/metrics"]
  metric_version = 2
  fieldpass = ["grafana_alerting_notifications*", "grafana_alerting_alertmanager_receivers"]

# TrueNAS Graphite ingest (#173). The appliance's netdata pushes here every 60s
# over plaintext TCP; nothing else may reach this port (nftables allowlist,
# source 192.168.30.20/32 only — see observability_firewall in
# inventory/host_vars/eq12_docker/vars.yml).
#
# WHY TELEGRAF AND NOT VICTORIAMETRICS' OWN :2003 LISTENER. VictoriaMetrics
# ships --graphiteListenAddr and PORT_REFERENCE.md documents it as not enabled.
# Pointing TrueNAS straight at it would drop a hop and recreate exactly what #133
# removed: an unauthenticated raw-socket write surface on this host — the :8089
# mistake, rebuilt. It also offers no per-source filtering (VM's -relabelConfig
# is global) and no way to turn a dotted graphite path into a labelled series.
#
# ── MEASUREMENT NAMES MUST STAY truenas_-PREFIXED. NOT COSMETIC. ──────────────
# This telegraf ALSO runs [[inputs.net]], [[inputs.system]], [[inputs.cpu]],
# [[inputs.disk]] and [[inputs.mem]] against eq12_docker itself. TrueNAS's
# netdata exports charts called `net.ens18` and `system.load`, so a template that
# mapped those onto measurements `net`/`system` would merge NAS data into
# eq12_docker's own series under identical metric names — silent corruption of
# both hosts' data, visible only as impossible values on a dashboard. Every
# template below therefore produces a measurement starting with `truenas_`, and
# namepass re-asserts it as gate #2.
#
# ── PATH SHAPES, MEASURED 2026-08-23 ─────────────────────────────────────────
# Captured from the live 26.0 stream, not taken from the 23.10-era community
# mapping (which is wrong for this box in at least the disk-temp path). netdata
# emits prefix.namespace.chart.dimension, and the graphite parser's DEFAULT
# template makes the whole dotted path the measurement with field "value" —
# which is what produced the `truenas_nas_*_value` names the capture run stored.
#
#   truenas.truenas.net.ens18.received
#   truenas.truenas.system.load.load1
#   truenas.truenas.truenas_disk_temp._serial_lunid_ZXA02DNC_5000c500ea1bdba8.temp
#   truenas.truenas.truenas_arcstats.avail.avail
#   truenas.truenas.truenas_pool_usage.used                      <- 4 segments, not 5
#
# Two families, deliberately templated differently:
#   * charts ALREADY namespaced (truenas_disk_temp, truenas_arcstats, ...) put
#     segment 1 into the `prefix` tag — folding it in would give truenas_truenas_*
#   * charts NOT namespaced (net, system) JOIN segment 1 into the measurement,
#     which is what prevents the collision described above
#
# Disk identity arrives as serial+lunid, NOT device name — which is why #174's
# API poller is the source of record for per-device temperature (disk.temperatures
# returns plain sdb/nvme0n1) and why the interim HDD alert scopes by serial.
[[inputs.socket_listener]]
  service_address = "tcp://:2003"
  data_format = "graphite"
  # 60s from the appliance; this only bounds how long a half-open connection is
  # held, and must comfortably exceed the push interval.
  read_timeout = "300s"

  # Most specific filter wins. The trailing catch-alls exist so a chart that is
  # renamed upstream still lands somewhere visible (prefixed, therefore passing
  # namepass) instead of being silently dropped — a rename should look wrong on a
  # dashboard, not vanish.
  templates = [
    "truenas.truenas.truenas_disk_temp.* prefix.host.measurement.disk.field",
    "truenas.truenas.truenas_disk_stats.* prefix.host.measurement.disk.field",
    "truenas.truenas.truenas_disk_stats_busy.* prefix.host.measurement.disk.field",
    "truenas.truenas.truenas_cpu_usage.* prefix.host.measurement.cpu.field",
    "truenas.truenas.truenas_arcstats.* prefix.host.measurement.measurement.field",
    "truenas.truenas.truenas_meminfo.* prefix.host.measurement.measurement.field",
    "truenas.truenas.net.* measurement.host.measurement.interface.field",
    "truenas.truenas.system.* measurement.host.measurement.measurement.field",
    "truenas.truenas.* prefix.host.measurement.field",
    "measurement*",
  ]

  # GATE #2. The appliance-side matching_charts (host_vars/truenas/vars.yml) is
  # gate #1 and drops charts before they cross the LAN; this one bounds what can
  # ever be stored if that pattern is widened by accident. Matching the
  # MEASUREMENT name is correct here and is the trap the grafana scrape block
  # below documents in the opposite direction — there the measurement is the
  # literal string "prometheus", so namepass would match nothing; here every
  # measurement is truenas_-prefixed by construction, so it matches exactly the
  # intended set.
  namepass = ["truenas_*"]

  [inputs.socket_listener.tags]
    source = "truenas"
