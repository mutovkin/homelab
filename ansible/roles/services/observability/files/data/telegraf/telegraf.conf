# Ping monitoring for important hosts
[[inputs.ping]]
  urls = [
    "8.8.8.8",                                         # Google DNS (internet connectivity)
    "1.1.1.1",                                         # Cloudflare DNS (alternative internet check)
    # "${ROUTER_IP}"                                   # Gateway - uncomment and set ROUTER_IP in .env
  ]
  # Left on the default method = "exec" on purpose (#95). Exec shells out to
  # /usr/bin/ping and works as the non-root telegraf user only because the image
  # ships that binary with the cap_net_raw file capability — so this input is the
  # reason telegraf is the one service in this stack WITHOUT
  # `no-new-privileges:true` (no_new_privs makes the kernel ignore file caps on
  # exec). Do not switch this to method = "native" expecting it to lift that
  # constraint: telegraf 1.39's native pinger opens a privileged raw socket and
  # fails with "enable CAP_NET_RAW capabilities" for a non-root process regardless
  # of net.ipv4.ping_group_range. Full reasoning: the security_opt block for
  # telegraf in files/compose.yaml.
  count = 3                                            # Send 3 ICMP packets per check
  ping_interval = 1.0                                  # 1 second between pings
  timeout = 3.0                                        # 3 second timeout
  interface = ""                                       # Use default interface

# HTTP response monitoring
[[inputs.http_response]]
  urls = [
    "http://grafana:3000",                             # Grafana UI
    "http://victoriametrics:8428/health",              # VictoriaMetrics health endpoint
    "http://victorialogs:9428/health",                 # VictoriaLogs health endpoint
    # searxng runs in its own compose project/network, so the container name
    # never resolved from here — the probe was permanently red. Reach it via the
    # observability bridge gateway + its published host port instead (#94).
    # 172.20.0.1 = gateway of docker_networks.observability, pinned in
    # ansible/inventory/host_vars/eq12_docker/vars.yml; 18080 = searxng's
    # published host port. Renumber that subnet and this URL must change too.
    "http://172.20.0.1:18080"                          # SearXNG search engine
  ]
  response_timeout = "5s"                              # HTTP request timeout
  method = "GET"                                       # Use GET requests
  follow_redirects = false                             # Don't follow redirects (test direct response)
  fieldexclude = ["result_type"]                       # Exclude string result_type (dns_error, etc)
  
  # Add service tags for better identification in metrics
  [inputs.http_response.tags]
    check_type = "http_health"

