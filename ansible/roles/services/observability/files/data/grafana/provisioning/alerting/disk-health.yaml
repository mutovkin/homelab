apiVersion: 1

# Grafana file-provisioned alerting — filesystem capacity (#315).
#
# WHY THIS EXISTS: CT 101's 24G rootfs climbed for six weeks with telegraf
# exporting every sample and no rule reading any of them —
# disk_used_percent{host="eq12_docker",path="/"}: 61% (09-22), 79% (10-16),
# 84% (10-22), 92% (10-28), 97% (11-03), 100% at 2026-11-05 12:30Z when a
# watchtower pull filled it. Host logging stopped, `docker exec` failed, and
# Ansible itself could no longer run on the guest (#314). An 80% rule would
# have warned ~2 weeks ahead.
#
# COVERAGE comes mostly from the Proxmox HOSTS' native telegraf agents, not the
# guests: inputs.disk on eq12/n5pro sees every guest subvol mounted under
# /rpool/data (CT 101 root + /data, CT 104, CT 102, CT 201 root + /data,
# CT 202), and ZFS reports each subvol against its refquota, so the percentage
# is the guest's own df. n5pro_docker exports no disk series at all and is
# covered only this way. eq12_docker's container telegraf reports its own `/`,
# which is the SAME disk as eq12's subvol-101-disk-0 — kept, not deduplicated,
# because it is the one view that survives the host agent dying; the cost is
# that CT 101's rootfs crossing 80% sends two notifications (one per host label).
# Not covered: VM disks (HA VM 100, TrueNAS VM 200's boot disk) — telegraf on
# the host cannot see inside a zvol. TrueNAS pools are out of scope here.
#
# EXCLUDED fstypes, each from the live series (enumerated 2026-11-06), not
# guessed: `efivarfs` is firmware NVRAM (51% on eq12 in perfect health, fixed
# size, meaningless as capacity), `fuse` is /etc/pve (pmxcfs, reports 0).
# tmpfs/devtmpfs/overlay/squashfs are already dropped by inputs.disk's
# ignore_fs in telegraf.conf; repeated here so a change there cannot quietly
# turn a RAM disk into a page.
#
# `by (host, path)`, never an unlabelled aggregate (#216): a max() without
# labels would page once for "some disk" and resolve while another disk was
# still full.
#
# noDataState: Alerting — deliberately the opposite of the counter rules (#151).
# disk_used_percent is a CONTINUOUS gauge from three agents; the whole query
# coming back empty means inputs.disk (or the fstype filter) broke everywhere,
# which is capacity blindness, not health. Per-agent loss is already owned at
# critical by obs-telegraf-metrics-absent[-<host>] in telegraf-health.yaml.
#
# for: 15m — disks fill over days; 15 minutes keeps a transient (a large pull
# that is then pruned, #316) from paging, and costs nothing at this timescale.
#
# severity: warning routes to the default receiver (homelab-email), per
# grafana-notification-policies.yaml.j2. The notification policy groups by
# host, so several full disks on one host arrive as one email.

groups:
  - orgId: 1
    name: disk-capacity
    folder: Observability
    interval: 1m
    rules:
      - uid: obs-disk-usage-high
        title: Disk usage above 80%
        condition: C
        for: 15m
        noDataState: Alerting
        execErrState: Alerting
        isPaused: false
        annotations:
          summary: "{{ $labels.host }} {{ $labels.path }} is {{ humanize $values.B.Value }}% full (threshold 80%)."
          description: |-
            Find what is growing before it reaches 100% — at 100% a guest can no longer write logs, run `docker exec`, or be managed by Ansible (#314).
            On a docker host the usual cause is superseded images: check `docker system df` and whether docker-image-prune.timer ran (`systemctl list-timers docker-image-prune.timer`, #316).
            For a guest subvol on a Proxmox host, the size is `root_disk_size` / the mount size in that host's host_vars; growing it is a one-way `pct resize` via proxmox_guests (`--tags lxc_resize`).
        labels:
          severity: warning
          component: disk-capacity
        data:
          - refId: A
            datasourceUid: P4169E866C3094E38
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              datasource:
                type: victoriametrics-metrics-datasource
                uid: P4169E866C3094E38
              expr: 'max by (host, path) (disk_used_percent{fstype!~"efivarfs|fuse|tmpfs|devtmpfs|overlay|squashfs"})'
              instant: true
              range: false
              intervalMs: 60000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: B
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 80
