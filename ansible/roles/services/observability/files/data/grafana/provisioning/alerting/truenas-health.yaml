apiVersion: 1

# Grafana file-provisioned alerting — TrueNAS disk thermals and stream liveness (#176)
#
# WHY THE LIVENESS RULES SHIP WITH THE TEMPERATURE RULES, NOT AFTER THEM.
# A temperature rule alone is a false sense of safety. If its feed stalls, the
# series simply stops arriving, a `> 47` rule sees nothing, and it sits GREEN
# over a cooking array. #173 measured exactly that failure mode: TrueNAS reports
# a reporting exporter as enabled and correct while netdata has not loaded it,
# and no method reachable with REPORTING_WRITE forces it. A green deploy is not
# evidence of delivery — so absence has to be somebody's alarm. Since #174 the
# thermal rules read the API poller, so THEIR alarm is truenas-poller-absent;
# truenas-metrics-absent owns the Graphite stream (see the NoData policy below).
#
# METRIC NAMES AND LABELS MEASURED off the live 26.0 stream on 2026-08-23 (#173),
# not copied from the community graphite mapping, which is 23.10-era and already
# wrong about the disk-temperature path on this box.
#
# ── TWO PROPERTIES OF truenas_disk_temp_temp THAT SHAPE EVERY RULE BELOW ──────
#
# 1. THE GRAPHITE SERIES IS SPARSE (it updates every few MINUTES, not every 60s).
#    The rules below no longer use it — #174's poller supplies a dense, 60s
#    per-device series instead — but the property is recorded because anything
#    querying truenas_disk_temp_temp directly still has to cope with it — a
#    5-minute window is legitimately empty on a perfectly healthy array. That
#    is why anything querying it directly must wrap the selector in
#    last_over_time(...[30m]) instead of reading the instant value: without it
#    the rules would flap between OK and NoData continuously in normal operation,
#    and a flapping thermal alarm is one you learn to ignore. 30m is ~6x the
#    observed update interval — wide enough to always contain a sample, narrow
#    enough that a genuinely stale reading cannot masquerade as current for long.
#
# 2. THE BOOT DISK LIES. _devicename_sda is the 64G virtual scsi0 disk; it has no
#    SMART and netdata reports its temperature as **0, not null**. A fabricated
#    zero would drag any min/avg panel down and, worse, would make an "average
#    array temperature" rule structurally incapable of firing. It is excluded by
#    the media="hdd" selector below rather than by an explicit != — the selector
#    is an allowlist, which fails closed.
#
# ── HDD SCOPING IS BY MEDIA TYPE (#174 resolved the interim by-serial list) ──
# 47C is a warning for a 7200rpm Exos and an ordinary Tuesday for an NVMe (those
# run to 60-70C by design), so the threshold has to be scoped to spinning disks.
#
# This originally hard-coded five drive serials, because the Graphite stream
# carries no media type — and that list went stale the moment a drive was
# replaced, failing OPEN. #174's poller removed it: truenas_disk_temperature_celsius
# is keyed by real DEVICE NAME and carries media="hdd"/"ssd"/"virtual".
#
# THE CLASSIFICATION IS BY ROTATION RATE, NOT BY `type`, and that distinction is
# load-bearing: the QEMU virtual boot disk (sda) reports type="HDD" from the API
# with rotationrate=None. Selecting on type would therefore include a disk with no
# SMART whose temperature reads as a fabricated 0 — the exact series this rule
# must never see. Measured 2026-08-23: sdb-sdf media=hdd (rotationrate 7200),
# nvme0n1/nvme1n1 media=ssd, sda media=virtual.
#
# The window is [10m], not the [30m] the Graphite series needed: the poller runs
# every 60s, so this series is DENSE. 10m still tolerates a few missed cycles
# without flapping.
#
# ── NoData POLICY, PER RULE ──────────────────────────────────────────────────
# Absence is owned exactly once PER DELIVERY PATH — the same convention
# vector-health.yaml follows: truenas-metrics-absent owns the Graphite stream,
# truenas-poller-absent owns the API poller (#174: two paths, two liveness
# rules). The thermal rules are noDataState: OK because absence is the
# liveness rules' job; making them Alerting would page on every ordinary gap
# between samples AND duplicate the liveness rules.
groups:
  - orgId: 1
    name: truenas-health
    folder: Observability
    # 1m — the fastest useful cadence given a 60s push interval. The operator
    # asked to be told immediately; this plus `for: 0s` puts notification within
    # roughly one to two minutes of the sensor reading. Nothing in this chain can
    # do better: netdata samples, then pushes on its own 60s schedule.
    interval: 1m
    rules:
      # ---------------------------------------------------------------------
      # warning = look when convenient; the deep link lands on the Disk temperature panel.
      # 47C on a 26TB Exos is still well inside the drive's rated operating range.
      - uid: truenas-hdd-temp-warning
        title: TrueNAS HDD temperature above 47C
        condition: C
        # for: 0s — report the first breach. The operator explicitly asked to be
        # told immediately rather than after a sustained period.
        for: 0s
        noDataState: OK
        execErrState: Alerting
        isPaused: false
        annotations:
          summary: >-
            TrueNAS disk {{ $labels.devname }} is at {{ $values.B }}C (warning above 47C).
          description: |-
            Normal band is 38-41C; the critical rule fires at 52C.
            Likely a scrub/resilver or ambient heat — several drives rising together points at chassis airflow, one drive alone at that disk or its slot.
          __dashboardUid__: nas-truenas
          __panelId__: "3"
        labels:
          severity: warning
          # Routed to BOTH channels by the nas-thermal route in
          # notification-policies. A warning that only reaches email would not
          # meet "tell me immediately", and relabelling it `critical` to get
          # Telegram would make severity meaningless.
          component: nas-thermal
        data:
          - refId: A
            datasourceUid: P4169E866C3094E38
            relativeTimeRange:
              from: 1800
              to: 0
            model:
              refId: A
              datasource:
                type: victoriametrics-metrics-datasource
                uid: P4169E866C3094E38
              # last_over_time, NOT an instant read — see property 1 in the header.
              # `by (devname)` keeps one alert instance per drive so a notification
              # names WHICH disk. The notification policy's group_by now carries
              # `devname` too (#188 — it said `disk`, a pre-#174 label this expr
              # has never produced, so two drives firing together collapsed into
              # one [FIRING:2] naming neither). The two files are a MATCHED PAIR:
              # if they ever diverge again, fix the POLICY, never this expr —
              # rewriting it to by (disk) would empty every $labels.devname
              # interpolation in the summaries. The deploy-time group_by assert
              # in the role's tasks/main.yml is what makes such a divergence
              # loud instead of silent.
              expr: >-
                max by (devname) (last_over_time(truenas_disk_temperature_celsius{host="truenas",
                media="hdd"}[10m]))
              instant: true
              range: false
              intervalMs: 60000
              maxDataPoints: 43200
          # dropNN, not replaceNN: a null must never become 0 and read as a cold
          # disk (#108's lesson). With no numeric value the rule falls through to
          # noDataState, which is OK here deliberately.
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 1800
              to: 0
            model:
              refId: B
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 1800
              to: 0
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 47
      # ---------------------------------------------------------------------
      # Sustained operation at this temperature shortens drive life. The 47C
      # warning rule will already have fired for this drive.
      - uid: truenas-hdd-temp-critical
        title: TrueNAS HDD temperature above 52C
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Alerting
        isPaused: false
        annotations:
          summary: >-
            TrueNAS disk {{ $labels.devname }} is at {{ $values.B }}C (critical above 52C).
          description: |-
            Act now: check chassis fans and airflow, and pause any running scrub or resilver until it cools toward the 38-41C band.
            Heat like this during a resilver is how a degraded pool becomes a lost one.
          __dashboardUid__: nas-truenas
          __panelId__: "3"
        labels:
          # critical routes to homelab-critical = both channels, unconditionally.
          severity: critical
          component: nas-thermal
        data:
          - refId: A
            datasourceUid: P4169E866C3094E38
            relativeTimeRange:
              from: 1800
              to: 0
            model:
              refId: A
              datasource:
                type: victoriametrics-metrics-datasource
                uid: P4169E866C3094E38
              expr: >-
                max by (devname) (last_over_time(truenas_disk_temperature_celsius{host="truenas",
                media="hdd"}[10m]))
              instant: true
              range: false
              intervalMs: 60000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 1800
              to: 0
            model:
              refId: B
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 1800
              to: 0
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 52
      # ---------------------------------------------------------------------
      # Since #174 the thermal+pool rules read the API poller — this stream feeds DASHBOARDS; its loss is a telemetry outage, not thermal blindness (that is truenas-poller-absent's job).
      #
      # KNOWN CAUSE, measured in #173: TrueNAS reports the reporting exporter as
      # enabled and correct while netdata has NOT loaded it, and nothing reachable
      # with REPORTING_WRITE forces a reload. Reading the config back therefore
      # proves nothing. What worked was toggling it through Ansible and waiting a
      # few minutes:
      #   ansible-playbook playbooks/truenas.yml -e truenas_exporter_enabled=false
      #   ansible-playbook playbooks/truenas.yml
      # Also check, in order: the exporter still exists (playbooks/truenas.yml is
      # green), telegraf is up on eq12_docker and listening on :2003, and the
      # nftables allowlist still grants 192.168.30.20/32 — that grant is a source
      # /32, so if the NAS ever moves address its metrics are dropped silently with
      # no application-level error.
      - uid: truenas-metrics-absent
        title: TrueNAS metrics stopped arriving
        condition: C
        # 10m: three missed 60s pushes would be 3m, but the exporter buffers on
        # failure (buffer_on_failures: 10) and a brief blip self-heals. 10m is
        # long enough not to page on one, short enough that a genuinely dead
        # stream is caught the same day, well before anyone reaches for a
        # dashboard that has silently gone dark. (It used to say "before the
        # thermal rules have been blind for an hour" — those rules stopped
        # reading this stream in #174.)
        for: 10m
        # THE ONE RULE THAT OWNS ABSENCE, and the only one here that may be
        # Alerting on NoData. Its sentinel is deliberately NOT the disk
        # temperature series: that one is sparse, so it cannot distinguish
        # "quiet" from "dead". truenas_arcstats_size_size is exported
        # CONTINUOUSLY for as long as the stream is alive (measured: every 60s),
        # which is exactly the property #151 established a liveness sentinel must
        # have — never a counter that only exists once it is non-zero.
        noDataState: Alerting
        execErrState: Alerting
        isPaused: false
        annotations:
          summary: TrueNAS has sent no Graphite metrics for 10 minutes.
          description: |-
            The NAS dashboard is going dark (ARC, CPU, memory, disk I/O). Disk-temperature and pool alerts are unaffected — they read the API poller, which has its own liveness rule.
            Known cause: the appliance accepts the exporter config but never loads it — cycle the exporter off and on (runbook).
          __dashboardUid__: nas-truenas
          # Grafana REJECTS __dashboardUid__ without __panelId__ ("both annotations
          # ... must be specified") and refuses to start — a dashboard-only deep
          # link is not representable. 13 = ARC size and memory, the first panel
          # this rule's own description names as going dark, and Graphite-fed
          # (truenas_arcstats_*) like the stream this rule watches.
          __panelId__: "13"
          runbook_url: https://github.com/mutovkin/homelab/blob/master/docs/solutions/integration-issues/truenas-26-api-exporter-configured-is-not-delivering.md
        labels:
          # warning, not critical, and NOT nas-thermal — decided in #193. Since
          # #174 this stream feeds DASHBOARDS only; thermal and pool blindness is
          # owned by truenas-poller-absent (critical). If the appliance itself is
          # down the poller dies too, so the page still happens — through the rule
          # that means it. nas-metrics matches no route on purpose: warning +
          # unmatched component = root policy = email only.
          severity: warning
          component: nas-metrics
        data:
          - refId: A
            datasourceUid: P4169E866C3094E38
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              datasource:
                type: victoriametrics-metrics-datasource
                uid: P4169E866C3094E38
              expr: 'count(last_over_time(truenas_arcstats_size_size{host="truenas"}[10m]))'
              instant: true
              range: false
              intervalMs: 60000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: B
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
          # lt 1 rather than eq 0: if the series vanishes entirely the query
          # returns NOTHING, not zero, and the rule reaches noDataState —
          # Alerting, above. This threshold catches the partial case where the
          # count collapses while something still reports.
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
      # ---------------------------------------------------------------------
      # THE LIVENESS RULE FOR THE TEMPERATURE ALERTS, separate from
      # truenas-metrics-absent on purpose. Since #174 the 47C and 52C rules query
      # truenas_disk_temperature_celsius, which the POLLER supplies — not the
      # Graphite stream. So the poller can die while the stream keeps flowing:
      # truenas-metrics-absent would stay green and the thermal rules would go
      # quiet with nothing to say so. Two delivery paths, two liveness rules.
      # The poller pushes NOTHING on a failed cycle, deliberately — a partial
      # scrape pushed as if complete would look like a healthy pool with missing
      # disks. So absence, not a zero, is the failure signal.
      # The privilege roles a failed cycle usually lacks: pool.query needs
      # POOL_READ, disk.query needs DISK_READ, and alert.list (#183's alert
      # export) needs ALERT_LIST_READ — all carried by the ansible-ctrl
      # privilege.
      - uid: truenas-poller-absent
        title: TrueNAS API poller has stopped
        condition: C
        for: 10m
        noDataState: Alerting
        execErrState: Alerting
        isPaused: false
        annotations:
          summary: The TrueNAS API poller has not reported for 10 minutes — disk-temperature and pool alerts are blind until it returns.
          description: |-
            The Graphite stream may still be flowing; this is the poller's own delivery path.
            Check `systemctl status truenas-poller.timer` and `journalctl -u truenas-poller -n 30` on eq12_docker — usual causes are a revoked API key or a missing privilege role.
          __dashboardUid__: nas-truenas
          # Same Grafana constraint as truenas-metrics-absent above. 3 = Disk
          # temperature, the poller-fed series (truenas_disk_temperature_celsius)
          # whose blindness this rule reports.
          __panelId__: "3"
        labels:
          severity: critical
          component: nas-thermal
        data:
          - refId: A
            datasourceUid: P4169E866C3094E38
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              datasource:
                type: victoriametrics-metrics-datasource
                uid: P4169E866C3094E38
              expr: 'count(last_over_time(truenas_poller_up{host="truenas"}[10m]))'
              instant: true
              range: false
              intervalMs: 60000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: B
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
      # ---------------------------------------------------------------------
      # min(truenas_pool_healthy) < 1 means ZFS considers the pool unhealthy —
      # DEGRADED, FAULTED, or carrying errors.
      # noDataState is OK because this series is POLLER-fed, so its absence is
      # owned by truenas-poller-absent specifically — not by the two liveness
      # rules jointly, and not by truenas-metrics-absent, which watches the
      # Graphite stream this rule does not read (and since #193 is a
      # warning routed to email only). Duplicating that ownership here would
      # add a second page for one outage.
      - uid: truenas-pool-degraded
        title: TrueNAS pool is not healthy
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Alerting
        isPaused: false
        annotations:
          summary: TrueNAS pool {{ $labels.pool }} is reporting unhealthy.
          description: |-
            Redundancy may already be lost — this outranks everything else on the NAS.
            Run `zpool status -v` on the appliance to see which vdev; avoid stressing the pool until it is healthy again.
          __dashboardUid__: nas-truenas
          __panelId__: "5"
        labels:
          severity: critical
          component: nas-thermal
        data:
          - refId: A
            datasourceUid: P4169E866C3094E38
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              datasource:
                type: victoriametrics-metrics-datasource
                uid: P4169E866C3094E38
              expr: 'min by (pool) (truenas_pool_healthy{host="truenas"})'
              instant: true
              range: false
              intervalMs: 60000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: B
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
      # ---------------------------------------------------------------------
      # A scrub is what detects silent corruption before it is read back.
      # 35 days, not 30: the default schedule is monthly, and a 30-day threshold
      # would fire every month on ordinary scheduling jitter — an alert that
      # cries wolf on its own cadence is one nobody reads. Measured at the time
      # of writing: last scrub finished 14.3 days ago, 0 errors.
      # for: 1h because this is a slow-moving condition; there is nothing to
      # gain from reacting inside the hour and something to lose from flapping
      # around the boundary.
      - uid: truenas-scrub-overdue
        title: TrueNAS pool scrub is overdue
        condition: C
        for: 1h
        noDataState: OK
        execErrState: Alerting
        isPaused: false
        annotations:
          summary: TrueNAS pool {{ $labels.pool }} has not completed a scrub in over 35 days.
          description: |-
            The monthly schedule has likely been disabled or is failing, rather than one run being missed.
            Check the scrub task under Data Protection on the appliance, or start one manually.
          __dashboardUid__: nas-truenas
          __panelId__: "7"
        labels:
          severity: warning
          # NOT nas-thermal: that component label is what routes a warning to
          # BOTH channels (see notification-policies). An overdue scrub is a
          # slow, non-urgent condition — paging Telegram for it would devalue
          # the thermal route that exists to be noticed immediately.
          component: nas-pool
        data:
          - refId: A
            datasourceUid: P4169E866C3094E38
            relativeTimeRange:
              from: 3600
              to: 0
            model:
              refId: A
              datasource:
                type: victoriametrics-metrics-datasource
                uid: P4169E866C3094E38
              expr: 'max by (pool) (truenas_pool_scrub_age_seconds{host="truenas"})'
              instant: true
              range: false
              intervalMs: 60000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 3600
              to: 0
            model:
              refId: B
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 3600
              to: 0
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 3024000
