apiVersion: 1

# Grafana file-provisioned alerting — PER-HOST log ingest recency (#134)
#
# The failure this exists for: #134 put a Vector shipper on all four hosts. Three
# of them are new (eq12, n5pro, n5pro_docker) and none of them has any coverage
# from the existing rules, because both of those aggregate across the whole fleet:
#
#   obs-log-ingest-stalled       `_time:5m | count()` — ALL sources, ALL hosts
#   obs-host-log-ingest-stalled  `_time:10m source:host | count()` — ALL hosts
#
# eq12_docker alone produces on the order of a thousand records per 15 minutes, so
# a hypervisor's shipper can die completely and both of those rules stay Normal
# forever. A single dead shipper hiding behind the others is exactly what #134's
# own text asked to prevent.
#
# THE NAIVE QUERY CANNOT WORK, and this is the same defect review caught in #139's
# `[1h]` lookbehind. Written the obvious way —
#
#     _time:15m source:host | stats by (hostname) count()
#
# — a host that stopped shipping produces NO ROW AT ALL inside the window, so its
# alert instance vanishes, Grafana marks it stale and RESOLVES the alert. The rule
# would fire for at most one evaluation and then declare the dead host healthy.
#
# The form below is the fix. The OUTER window is 24h, so a host that shipped at
# any point in the last day is still returned; the `if (_time:15m)` clause counts
# only what arrived recently. A dead shipper therefore returns a row with
# recent = 0, which a `< 1` threshold CAN fire on.
#
# EVIDENCE, measured 2026-08-19 against the live VictoriaLogs, running EXACTLY the
# expression deployed below and then the naive form as a control. The pair is the
# proof — neither line means much alone:
#
#   Q1, the deployed expression:
#     _time:24h source:host | stats by (hostname) count() if (_time:15m) as recent
#       {"hostname":"d7d7d4e8c59e","recent":"0"}      <- stopped, and STILL RETURNED
#       {"hostname":"eq12_docker","recent":"116"}     <- alive
#
#   Q3, the naive form this header says cannot work:
#     _time:15m source:host | stats by (hostname) count() as rows
#       {"hostname":"eq12_docker","rows":"116"}       <- the dead host is simply GONE
#
# Q1 emits the zero-count group; Q3 drops the series entirely. That difference is
# the entire reason the 24h outer window is load-bearing, and it is why this file
# must not be "simplified" to the shorter query.
#
# The plugin returns this as a MULTI-SERIES frame — one frame per hostname, with
# `hostname` carried as a field label — so Grafana produces one alert instance per
# host and the notification names which one. Confirmed empirically against the live
# Grafana via POST /api/ds/query before this file was written, not assumed from
# docs.
#
# THE 24h WINDOW CUTS BOTH WAYS, and both sides belong here rather than being
# discovered later.
#
# Side 1 — a RETIRED hostname keeps returning recent = 0 and keeps alerting for up
# to 24 hours after it legitimately stops shipping. Identical trade to
# obs-http-probe-absent's `[24h]`, accepted for the identical reason: a shipper
# dead for more than a day has already paged and been ignored, and `7d` would be
# alert fatigue after an intentional decommission.
#
# Side 2 — THE BLIND SPOT, and it is the more dangerous half. A host with NO rows
# in the 24h outer window produces no series, hence no alert instance, hence
# SILENCE. Three ways to land there:
#   * a host that has never shipped at all (freshly built, rebuilt guest, a deploy
#     that was reverted before the agent ever ran);
#   * a host dead for MORE than 24 hours — its series ages out of the outer window
#     and the alert goes quiet again;
#   * and worst, at the 24h boundary Grafana sends a RESOLVED notification for a
#     host that is still dead, because the instance disappeared rather than
#     recovered.
# This rule cannot see any of those: it can only report on hosts it has evidence
# of. roles/vector_agent's deploy-time ingest assert covers the never-shipped case
# AT DEPLOY TIME ONLY — it proves the host shipped once, not that it still is.
# Closing it properly needs a rule driven by an EXPECTED-HOSTS list rather than by
# observed series, which is a different mechanism (and gives up the
# "adding a host needs no rule edit" property below). Tracked as its own follow-up
# issue; do not paper over it by widening the window, which only moves the
# boundary.
#
# NO `hostname:` MATCHER, deliberately. Adding a host to the fleet must not require
# editing this file — the same property #139 established for the probe rules. That
# property is what the 24h tail buys.
groups:
  - orgId: 1
    name: per-host-ingest-health
    folder: Observability
    # 5m evaluation against a 15m recency clause: two consecutive stalled
    # evaluations (`for: 10m`) before it fires, so a Vector restart, a deploy, or a
    # single slow batch does not alert. Worst-case detection latency ~25 min.
    interval: 5m
    rules:
      - uid: obs-host-log-ingest-stalled-per-host
        title: A host stopped shipping logs to VictoriaLogs
        condition: C
        for: 10m
        # OK, NOT Alerting — and this is the one thing that must not be "fixed" by
        # copying the sibling rule. Absence is owned by exactly ONE rule, and TOTAL
        # absence is already owned by obs-log-ingest-stalled (noDataState:
        # Alerting). This rule owns PARTIAL absence: some hosts shipping, one not.
        # If it alerted on NoData as well, a single dead VictoriaLogs would fire
        # both rules for the same incident. Same reasoning the README spells out
        # for obs-http-probe-failing vs obs-http-probe-absent.
        noDataState: OK
        # A datasource that cannot be reached is not evidence of health (#108).
        execErrState: Alerting
        isPaused: false
        annotations:
          # $labels.hostname is the whole point of the multi-series frame: the
          # email has to name WHICH host, or it is no better than the fleet-wide
          # rule it exists to supplement.
          summary: >-
            {{ $labels.hostname }} has shipped no host log lines to VictoriaLogs in
            the last 15 minutes.
          description: >-
            `_time:24h source:host | stats by (hostname) count() if (_time:15m)` is
            0 for {{ $labels.hostname }} while other hosts are still reporting, so
            this is ONE dead shipper rather than a dead log store — the fleet-wide
            rules (obs-log-ingest-stalled, obs-host-log-ingest-stalled) cannot see
            this and will stay Normal.
            On eq12, n5pro or n5pro_docker the shipper is a native systemd unit:
            check `systemctl status vector` and `journalctl -u vector -n 100` on
            that host. A 401 in the journal means the VictoriaLogs credential or
            VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION is wrong — Vector will
            NOT exit, it will stay active and drop every batch.
            On eq12_docker the shipper is a container: `docker logs --tail 100
            vector`.
            On any of them, confirm /var/log/structured.log is GROWING and not
            merely present (`wc -l` it twice) — if it is not, rsyslog is the
            problem, not Vector. Re-running the host's deploy re-asserts the whole
            path end to end, marker included:
            `ansible-playbook playbooks/log-agents.yml --limit <host>` for the
            agents, `--tags observability --limit eq12_docker` for the container.
            If the disk buffer is wedged, the runbook is
            docs/solutions/integration-issues/vector-wedged-disk-buffer-reset.md.
            NOTE, both directions of the 24h window: a hostname that was
            DELIBERATELY retired keeps producing a recent=0 row, and therefore keeps
            alerting, for up to 24h — the documented cost, not a bug. And in the
            other direction, a host that has NEVER shipped, or has been dead for
            MORE than 24h, has no row at all and this rule is SILENT about it; at
            the 24h boundary it will even send a RESOLVED notice for a host that is
            still dead. If you are here because a host went quiet, check the whole
            expected fleet (eq12, eq12_docker, n5pro, n5pro_docker) against the
            query's output rather than trusting the instance list to be complete.
        labels:
          severity: critical
          component: log-pipeline
        data:
          # A: the measurement. Both time filters live inside the LogsQL, so the
          # result does not depend on the alert's time range being right; the
          # relativeTimeRange below only has to be >= the outer window.
          - refId: A
            datasourceUid: PD775F2863313E6C7
            relativeTimeRange:
              from: 86400
              to: 0
            model:
              refId: A
              datasource:
                type: victoriametrics-logs-datasource
                uid: PD775F2863313E6C7
              queryType: stats
              expr: "_time:24h source:host | stats by (hostname) count() if (_time:15m) as recent"
          # B: collapse each series to one number so the threshold has something to
          # compare, per hostname. dropNN, not replaceNN: a null must not silently
          # become a 0 and fire, nor become a number and mask a stall — with no
          # numeric value that instance falls through to noDataState above, which
          # is OK here on purpose (see the rule's noDataState comment).
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 86400
              to: 0
            model:
              refId: B
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
          # C: < 1 host record in 15 minutes from a host that logs continuously
          # (systemd, sshd, cron, and on the hypervisors pvestatd/pve-firewall every
          # few seconds) means that host's shipper has stopped, not that the host
          # went quiet.
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 86400
              to: 0
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
