apiVersion: 1

# Grafana Datasource Provisioning for Observability Stack
# Automatically configures VictoriaMetrics (metrics) and VictoriaLogs (logs)

datasources:
  # VictoriaMetrics - Time-series metrics database (MetricsQL-enabled)
  - name: VictoriaMetrics
    # Explicit uid, pinned to the value this datasource ALREADY has on eq12 (#108):
    # alert rules reference a datasource by uid, never by name, so the uid has to be
    # declared in version control to be referenceable from provisioning/alerting/.
    # Left implicit, Grafana derives it and it is only discoverable via the API.
    # Changing this string re-points every dashboard/alert that references the old
    # one — treat it as an identity, not a setting.
    uid: P4169E866C3094E38
    type: victoriametrics-metrics-datasource            # VictoriaMetrics native datasource plugin
    access: proxy                                       # Grafana backend proxies requests
    url: http://victoriametrics:8428                    # VictoriaMetrics service URL
    isDefault: true                                     # Set as default datasource
    editable: true                                      # Allow editing in UI
    # VERSION IS THE UPDATE GATE, NOT A LABEL — BUMP IT WHENEVER ANY FIELD BELOW
    # CHANGES, ESPECIALLY THE PASSWORD. Grafana's provisioner only re-applies a
    # datasource when this number is greater than the stored one; with it pinned,
    # an existing datasource is NEVER updated again, secureJsonData included. That
    # is not theoretical: rotating vault_vm_auth_password (#165) left Grafana
    # querying with the OLD secret while its container env, the .env file and an
    # in-container curl all showed the NEW one — every check passed and every
    # VM-backed alert rule 401'd. See the datasource-health assert in
    # tasks/main.yml, which now turns that silence into a failed deploy.
    version: 2
    jsonData:
      httpMethod: POST                                  # Use POST for queries (better for large queries)
      timeInterval: 30s                                 # Default scrape interval
    basicAuth: true
    basicAuthUser: ${VM_AUTH_USERNAME}
    secureJsonData:
      basicAuthPassword: ${VM_AUTH_PASSWORD}

  # VictoriaLogs - Log aggregation database
  - name: VictoriaLogs
    # Pinned to the live uid — see the note on VictoriaMetrics above. The
    # ingest-recency alert in provisioning/alerting/ingest-health.yaml queries this uid.
    uid: PD775F2863313E6C7
    type: victoriametrics-logs-datasource               # VictoriaLogs plugin type
    access: proxy                                       # Grafana backend proxies requests
    url: http://victorialogs:9428                       # VictoriaLogs base URL
    isDefault: false                                    # Not the default datasource
    editable: true                                      # Allow editing in UI
    # VERSION IS THE UPDATE GATE, NOT A LABEL — BUMP IT WHENEVER ANY FIELD BELOW
    # CHANGES, ESPECIALLY THE PASSWORD. Grafana's provisioner only re-applies a
    # datasource when this number is greater than the stored one; with it pinned,
    # an existing datasource is NEVER updated again, secureJsonData included. That
    # is not theoretical: rotating vault_vm_auth_password (#165) left Grafana
    # querying with the OLD secret while its container env, the .env file and an
    # in-container curl all showed the NEW one — every check passed and every
    # VM-backed alert rule 401'd. See the datasource-health assert in
    # tasks/main.yml, which now turns that silence into a failed deploy.
    version: 2
    jsonData:
      maxLines: 1000                                    # Max log lines per query (prevents browser overload)
      httpMethod: POST                                  # Use POST for queries
    basicAuth: true
    basicAuthUser: ${VL_AUTH_USERNAME}
    secureJsonData:
      basicAuthPassword: ${VL_AUTH_PASSWORD}
