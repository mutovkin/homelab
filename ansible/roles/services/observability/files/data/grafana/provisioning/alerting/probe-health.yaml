apiVersion: 1

# Grafana file-provisioned alerting — service-health probes (#139)
#
# The failure this exists for: telegraf's [[inputs.http_response]] probes were
# collected and stored, and nothing turned a failing one into a notification. A
# probe pointed at a container name on another compose project's network was
# therefore permanently red for the life of the deployment and nobody noticed —
# the only way to see it was to open a dashboard and look. Same family as #108:
# signal collected, green everywhere, nobody told.
#
# SELECTOR POLICY, and it is load-bearing: no label selector at all on
# http_response_*, aggregated `by (server, check_type)`. Adding a URL to
# [[inputs.http_response]] in files/data/telegraf/telegraf.conf produces a new
# `server` value, which becomes its own alert instance with NO edit to this file.
# Never write a `server=` matcher into these queries — that is the property.
#
# `result` and `status_code` are telegraf TAGS, so a probe changing outcome
# changes series identity. Everything below aggregates across that churn rather
# than matching on it.

# NO DEEP LINKS IN THIS FILE (#181), for a measured reason rather than a
# cautious one: nothing under files/data/grafana/dashboards/ plots
# http_response_result_code or http_response_http_response_code. The tree
# ships the two #214 host dashboards, the NAS dashboard and six Home Assistant
# ones, and none of them touches this file's series (verified across all nine
# dashboard JSONs, 2026-08-29). No panel goes blank when these rules fire, so
# there is nothing to point at honestly, and a "View panel" button onto an
# unrelated graph is worse than no button.
#
# IF A DASHBOARD FOR THIS IS EVER ADDED, a link is a MANDATORY PAIR of
# __dashboardUid__ and __panelId__ pointing at a panel whose id is PINNED in
# the dashboard JSON. Half a pair is boot-fatal for the WHOLE Grafana process
# and withdraws every provisioned rule in the org (measured 2026-08-24). The
# static guard "Verify every alert deep link is a paired, pinned reference" in
# roles/services/observability/tasks/main.yml enforces both halves before a
# deploy touches anything. See
# docs/solutions/integration-issues/grafana-alert-panelid-pairing-breaks-all-provisioned-rules.md

groups:
  - orgId: 1
    name: service-probes
    folder: Observability
    # telegraf collects every 60s, so evaluate at the same cadence. `for: 5m`
    # below = five consecutive bad evaluations, which rides out the seconds-long
    # red window every deploy of grafana/searxng produces. Detection latency for
    # the two threshold rules is therefore ~5 minutes (1m interval x `for: 5m`).
    interval: 1m
    rules:
      # ---------------------------------------------------------------------
      # WHERE TO LOOK: `docker logs telegraf` on eq12_docker, then the URL from
      # inside the telegraf container. A red `http://172.20.0.1:18080` (SearXNG)
      # is very often NOT SearXNG being down: 172.20.0.1 is the observability
      # network's gateway, pinned in
      # ansible/inventory/host_vars/eq12_docker/vars.yml, and a subnet renumber
      # (#126) silently invalidates the URL. The probe URLs themselves live in
      # the telegraf.conf named in the SELECTOR POLICY note above.
      - uid: obs-http-probe-failing
        title: HTTP probe failing
        condition: C
        for: 5m
        # OK, not Alerting, and this is deliberate: absence must be alerted on
        # EXACTLY ONCE. obs-http-probe-absent below owns absence. If this rule
        # also alerted on NoData, one dead telegraf would page three times.
        noDataState: OK
        # A datasource that cannot be reached is not evidence of health (#108).
        execErrState: Alerting
        isPaused: false
        annotations:
          summary: Probe to {{ $labels.server }} cannot connect — DNS failure, refused, or timeout for 5+ minutes.
          description: |-
            The service did not answer at all, as opposed to answering badly.
            Try the URL from inside the telegraf container; a dead 172.20.0.1 target usually means the docker subnet moved, not that SearXNG died.
        labels:
          severity: critical
          component: service-probe
        data:
          # A: instant query, aggregated across the result/status_code label
          # churn. `max`, not `avg`/`last`: while a probe flips outcome the
          # pre-flip series (result="success", code 0) is still inside the
          # lookbehind window, and max picks the failing value. Cost, accepted:
          # recovery is reported up to 5 minutes late.
          - refId: A
            datasourceUid: P4169E866C3094E38
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              datasource:
                type: victoriametrics-metrics-datasource
                uid: P4169E866C3094E38
              expr: "max by (server, check_type) (http_response_result_code)"
              instant: true
              range: false
              intervalMs: 60000
              maxDataPoints: 43200
          # B: collapse to one number per series. dropNN, not replaceNN — a null
          # must not silently become a 0 and read as "healthy" (#108).
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: B
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
          # C: result_code 0 == success in telegraf; anything else is a failure
          # (1 timeout, 2 DNS, 3 connection failed, 4 response string mismatch).
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0

      # ---------------------------------------------------------------------
      # Catches the reachable-but-unhealthy cases: 5xx, 401, 404.
      # NOTE: 301 is IN range on purpose. `http://grafana:3000` reports 301
      # because grafana.ini sets `enforce_domain = true`, so every request by
      # IP/service-name is redirected to grafana.moutovkin.com. That is
      # expected and must not be "fixed" by narrowing the range to 2xx.
      - uid: obs-http-probe-bad-status
        title: HTTP probe returning a bad status
        condition: C
        for: 5m
        # See obs-http-probe-failing: absence is obs-http-probe-absent's job.
        noDataState: OK
        execErrState: Alerting
        isPaused: false
        annotations:
          summary: "{{ $labels.server }} is answering {{ $values.B }} — reachable but unhealthy."
          description: |-
            Status outside 200-399 for 5+ minutes.
            Check the service's own logs first.
        labels:
          severity: warning
          component: service-probe
        data:
          # Deliberately NOT `status_code!~"2..|3.."`: a connection failure emits
          # no status_code tag at all, and an absent label matches a negative
          # regex in PromQL/MetricsQL — so that formulation would double-fire with
          # obs-http-probe-failing on every DNS failure. The numeric field has no
          # such trap.
          - refId: A
            datasourceUid: P4169E866C3094E38
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              datasource:
                type: victoriametrics-metrics-datasource
                uid: P4169E866C3094E38
              expr: "max by (server, check_type) (http_response_http_response_code)"
              instant: true
              range: false
              intervalMs: 60000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: B
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: outside_range
                    params:
                      - 200
                      - 399

      # ---------------------------------------------------------------------
      # This is the case a threshold rule cannot catch: a probe that cannot
      # resolve its target may stop producing the series altogether rather than
      # producing a bad value.
      #
      # Total detection latency ~15 minutes: 600s of lag (threshold C below)
      # plus `for: 5m`.
      - uid: obs-http-probe-absent
        title: HTTP probe stopped reporting
        condition: C
        for: 5m
        # THE one rule that alerts on absence, and the reason the other two do
        # not. Its query returns a row for every probe seen in the last hour, so
        # an empty result means not a single probe has reported in an hour —
        # telegraf is dead, or its write path to VictoriaMetrics is. That is a
        # real emergency, and NoData defaulting to OK is exactly how a dead
        # pipeline stays invisible.
        noDataState: Alerting
        execErrState: Alerting
        isPaused: false
        annotations:
          summary: Probe {{ $labels.server }} has produced no samples for over 10 minutes.
          description: |-
            If a server is named above, telegraf stopped probing that one target; if none is, telegraf itself is down or cannot write to VictoriaMetrics — `docker logs telegraf` on eq12_docker.
            A deliberately removed URL keeps alerting for up to 24h.
        labels:
          severity: critical
          component: service-probe
        data:
          # lag() is the "seconds since the previous sample" of each series.
          # `min` across a server's series = time since ANY series for that server
          # reported, which is the question being asked. `max` would fire forever
          # on every series retired by a result/status_code tag change.
          #
          # [24h], NOT [1h] — this was a real bug, caught in review. A series with
          # no sample inside the lookbehind is not returned AT ALL, so with [1h]
          # a dead probe was alertable only while 600s < absence < 3600s: past an
          # hour its instance vanished, Grafana marked it stale and RESOLVED the
          # alert, and the dead probe went invisible again. noDataState above
          # covers only TOTAL absence (every probe gone); one dead target among
          # four — the likely case — had no coverage past an hour. Proven against
          # the retired `http://searxng:8080` probe from #94, which lag[1h] cannot
          # see and lag[24h] can.
          #
          # The trade-off, deliberately: REMOVING a URL from telegraf.conf alerts
          # for up to 24h afterwards (two emails at repeat_interval 12h). [7d] was
          # rejected — a week of firing after an intentional removal is alert
          # fatigue, and a probe dead >24h has already paged and been ignored.
          # relativeTimeRange below must stay >= the lookbehind.
          - refId: A
            datasourceUid: P4169E866C3094E38
            relativeTimeRange:
              from: 86400
              to: 0
            model:
              refId: A
              datasource:
                type: victoriametrics-metrics-datasource
                uid: P4169E866C3094E38
              expr: "min by (server, check_type) (lag(http_response_result_code[24h]))"
              instant: true
              range: false
              intervalMs: 60000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 86400
              to: 0
            model:
              refId: B
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
          # 600s = ten missed 60s collections. Loose enough that a telegraf
          # restart or a single slow scrape cannot trip it.
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 86400
              to: 0
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 600
