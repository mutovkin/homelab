apiVersion: 1

# Grafana file-provisioned alerting — ingest recency (#108)
#
# The failure this exists for: Vector can wedge (a full/corrupt disk buffer, a 401
# against VictoriaLogs after an unattended upgrade) while every container stays "Up"
# and every deploy stays green. The log pipeline was dead for ~30 days once already
# — see docs/solutions/integration-issues/vector-057-silent-log-pipeline-failure.md.
# Nothing in the stack notices absence, so absence is what this rule measures: not
# "is Vector healthy" but "did ANY log line land in the last few minutes".
#
# ROUTING: this rule now delivers. #139 provisioned the `homelab-email` contact
# point (templates/grafana-contact-points.yaml.j2) and made it the ROOT
# notification policy receiver (notification-policies.yaml), so everything in this
# folder — including this rule — is emailed. Until then there was no contact point
# at all and this rule paged nobody, which was the follow-up #108 left open.
groups:
  - orgId: 1
    name: ingest-health
    folder: Observability
    # 5m evaluation against a 5m window: a stalled pipeline is detected within one
    # interval, and `for: 10m` below means two consecutive stalled evaluations before
    # it fires — a single slow batch or a Vector restart does not alert.
    interval: 5m
    rules:
      - uid: obs-log-ingest-stalled
        title: VictoriaLogs ingest stalled
        condition: C
        for: 10m
        # Alerting, not OK: "the query returned nothing" and "the query returned
        # zero rows" are the SAME failure here, and NoData defaulting to OK is
        # exactly how a dead pipeline stays invisible. Same for exec errors — a
        # datasource that cannot be reached is not evidence of health.
        noDataState: Alerting
        execErrState: Alerting
        isPaused: false
        annotations:
          summary: No log lines reached VictoriaLogs in the last 5 minutes.
          description: >-
            The `_time:5m | count()` row count in VictoriaLogs is 0, so nothing is
            being ingested — Vector is wedged, cannot authenticate, or is not
            running. Check `docker logs vector` on eq12_docker. If the disk buffer is
            the cause, the reset runbook is
            docs/solutions/integration-issues/vector-wedged-disk-buffer-reset.md.
        labels:
          severity: critical
          component: log-pipeline
        data:
          # A: the measurement. The `_time:5m` filter is inside the LogsQL query, so
          # the result does not depend on the dashboard/alert time range being right.
          - refId: A
            datasourceUid: PD775F2863313E6C7
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              datasource:
                type: victoriametrics-logs-datasource
                uid: PD775F2863313E6C7
              queryType: stats
              expr: "_time:5m | count() as rows"
          # B: collapse the frame to one number so the threshold has something to
          # compare. dropNN, not replaceNN: a null must not silently become a 0 and
          # fire, nor become a number and mask a stall — with no numeric value the
          # rule falls through to noDataState above, which is also Alerting.
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: B
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
          # C: the condition. < 1 row in 5 minutes on a host that logs continuously
          # (/var/log/structured.log — every syslog facility, see #143 — plus every
          # container's stdout) means ingestion has stopped, not that the host went
          # quiet.
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1

      # ---------------------------------------------------------------------
      # #143 opened a hole this rule closes. Before it, host logs reached Vector
      # from /var/log/syslog and /var/log/auth.log — files rsyslog writes for the
      # OPERATOR's benefit, so if they stopped a human would notice. They now come
      # from /var/log/structured.log, which exists for Vector alone and is written
      # by one extra rsyslog action that can fail independently of syslog.
      #
      # obs-log-ingest-stalled above cannot see that: it counts ALL sources, and
      # docker alone contributes on the order of a thousand records per 15 minutes
      # on this host, so host ingestion can go to exactly zero and that rule stays
      # Normal forever. This is the per-source twin, and it is also precisely the
      # per-host recency rule #134 needs — one host at a time.
      # ===================== UNPAUSED: THE HEARTBEAT REPAIRED IT ====================
      # This rule flapped for ~21 hours and was PAUSED as a stopgap (#134). The
      # heartbeat now landing in roles/rsyslog_structured is what makes it
      # meaningful again, so it is unpaused in the same change — the fleet never
      # sits in a state where the rule exists but means nothing.
      #
      # WHAT CHANGED: every host now emits a marker every 5 minutes, so a healthy
      # host has a guaranteed FLOOR of ~2 host records per 10m window. `count() < 1`
      # therefore means "not one line, not even the beat" — a real stall — instead
      # of "this host happened to be quiet", which was true two-thirds of the time.
      # The query is unchanged; the DATA underneath it changed. Do not re-pause or
      # widen this without also removing the heartbeat, or you will be tuning
      # against a problem that no longer exists.
      #
      # WHY IT FLAPS, measured 2026-08-20 rather than guessed:
      #   host          empty 10m windows      max gap
      #   eq12_docker   66.2% (VL: 68.1%)      3600.0s
      #   eq12          39.7%                  3600.0s
      #   n5pro          0.0%                   448s
      #   n5pro_docker   0.0%                   396s
      # `_time:10m source:host | count() < 1` is therefore TRUE about two-thirds of
      # the time on this very host, in perfect health. The rule is not detecting a
      # stall; it is detecting that host logs arrive in BURSTS with long silences
      # between them (one 10m bucket held 1288 records, another held 1).
      #
      # WHY NOT JUST WIDEN THE WINDOW. Because the max gap on both offending hosts
      # is EXACTLY 3600.0s — that is not headroom, it is a single incidental hourly
      # event holding the window open (on eq12_docker: recurring dockerd
      # "failed to validate image signature" ERRORS). A 60m window would be one
      # bugfix away from flapping again, and would cost ~70 min of detection
      # latency for the privilege.
      #
      # THE REAL FIX is a heartbeat: every host emits a marker every 5 minutes, so
      # absence becomes unambiguous instead of being indistinguishable from a quiet
      # host. That also REPAIRS this rule rather than retiring it — a guaranteed
      # floor of ~2 records per 10m per host makes `count() < 1` meaningful again,
      # which is exactly why it gets unpaused rather than deleted.
      #
      # Note the sibling rule above (obs-log-ingest-stalled, ALL sources) is NOT
      # affected and stays live: measured over the same 24h it had ZERO empty 5m
      # buckets with a MINIMUM of 88 records per bucket — an ~88x margin, not a 1x
      # one. Docker traffic is genuinely continuous. Do not pause it by analogy.
      - uid: obs-host-log-ingest-stalled
        title: Host log ingest stalled
        condition: C
        for: 10m
        # Same reasoning as the rule above: for a rule whose whole job is detecting
        # absence, "no data" IS the failure, not the healthy case.
        noDataState: Alerting
        execErrState: Alerting
        isPaused: false
        annotations:
          summary: No host syslog lines reached VictoriaLogs in the last 10 minutes.
          description: >-
            `_time:10m source:host | count()` is 0. Docker logs may still be
            flowing, which is why the all-sources rule does not catch this. The
            usual cause is rsyslog no longer routing to /var/log/structured.log —
            the file every Vector in the fleet tails for ALL host logs since #143.
            It is written by /etc/rsyslog.d/40-vector-structured.conf; the
            human-facing /var/log/syslog and /var/log/auth.log are written by
            separate rules and can keep growing while this one is dead, so their
            size proves nothing.
            SCOPE, since #134: this query spans ALL FOUR hosts (eq12, eq12_docker,
            n5pro, n5pro_docker), so for it to reach zero every shipper in the fleet
            must be silent — which points at VictoriaLogs itself or at something
            fleet-wide, not at one host's rsyslog. ONE dead host is
            obs-host-log-ingest-stalled-per-host's job and names the host in its
            summary; this rule firing while that one is quiet is the fleet-wide
            case.
            Check `systemctl status rsyslog` on the affected host(s), confirm the
            drop-in is present, and confirm no drop-in sorting before it ends the
            ruleset with `stop`. Re-running that host's deploy re-asserts the whole
            path — it writes a `logger` marker and waits for it to come back out of
            VictoriaLogs: `--tags observability --limit eq12_docker` for the
            container, `ansible-playbook playbooks/log-agents.yml --limit <host>`
            for the three native agents.
        labels:
          severity: critical
          component: log-pipeline
        data:
          - refId: A
            datasourceUid: PD775F2863313E6C7
            relativeTimeRange:
              from: 900
              to: 0
            model:
              refId: A
              datasource:
                type: victoriametrics-logs-datasource
                uid: PD775F2863313E6C7
              queryType: stats
              expr: "_time:10m source:host | count() as rows"
          # dropNN, not replaceNN — a null must not silently become a 0 and fire,
          # nor become a number and mask a stall. See the rule above.
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 900
              to: 0
            model:
              refId: B
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
          # < 1 host record in 10 minutes. This host writes syslog continuously
          # (systemd, sshd, cron, dockerd), so zero means the path is broken, not
          # that the host went quiet.
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 900
              to: 0
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1

      # ---------------------------------------------------------------------
      # The mirror #154 names. #139 gave us the ALL-sources rule and #143's
      # follow-up the source:host one, because host ingestion can go to zero while
      # docker volume keeps the all-sources rule Normal. The reverse gap stayed
      # open: docker collection can stop — a wedged docker_logs source, a socket
      # permission change, the group id under `user:` drifting — while host
      # records keep obs-host-log-ingest-stalled Normal and the all-sources rule
      # green on host traffic alone.
      #
      # PRE-GATED, because this repo has made the burstiness mistake twice (#134
      # paged every ~30 min for 21 h on exactly this query shape against
      # source:host, then shipped a deploy assert demanding traffic from three
      # silent containers). The decision statistics are EMPTY-WINDOW FRACTION and
      # MAX GAP, never gap percentiles. Measured on eq12_docker 2026-08-21, in
      # perfect health:
      #   10m buckets over 7d (1008):   0 empty, minimum 712 records
      #    1m buckets over 24h (1440):  0 empty, minimum  73 records
      #   168 hourly windows over 7d:   0 empty, minimum 4323 records
      # So `count() < 1` over 10 minutes has a ~712x margin, and the max gap
      # between consecutive docker records is under one minute. Docker traffic
      # here is genuinely continuous — this is the sibling of obs-log-ingest-
      # stalled (88x margin), NOT of the host rule that needed a heartbeat to
      # become meaningful. Re-measure before widening or narrowing anything.
      #
      # SCOPE CAVEAT, stated because a caveat in an error string is where a
      # missing conditional hides: `source:docker` is produced by BOTH
      # eq12_docker's container Vector and n5pro_docker's native agent. One of the
      # two dying while the other ships keeps this rule Normal. That partial case
      # is not covered here — it is the same known shape as the fleet-wide host
      # rule, and the per-host heartbeat rule covers HOSTS, not sources.
      #
      # `source:pkg` deliberately gets NO twin: those files are quiet by nature
      # and an absence rule on them would be noise. #154 says so explicitly.
      - uid: obs-docker-log-ingest-stalled
        title: Docker log ingest stalled
        condition: C
        for: 10m
        # Same reasoning as both rules above: for a rule whose whole job is
        # detecting absence, "no data" IS the failure, not the healthy case.
        noDataState: Alerting
        execErrState: Alerting
        isPaused: false
        annotations:
          summary: No docker container lines reached VictoriaLogs in the last 10 minutes.
          description: >-
            `_time:10m source:docker | count()` is 0. Host syslog may still be
            flowing, which is why neither the all-sources rule nor the source:host
            rule catches this. Measured floor in health is 712 records per 10m
            window, so zero means collection stopped, not that the containers went
            quiet. Usual causes: Vector's docker_logs source wedged, the docker
            socket bind-mount lost or its permissions changed, or Vector itself
            down. Check `docker logs vector` on eq12_docker (the container's own
            stderr is also in VictoriaLogs as container_name:vector, and that copy
            survives a recreate), and that /var/run/docker.sock is still mounted.
            SCOPE: source:docker comes from eq12_docker AND n5pro_docker, so this
            firing means BOTH stopped; one alone keeps it Normal.
        labels:
          severity: critical
          component: log-pipeline
        data:
          - refId: A
            datasourceUid: PD775F2863313E6C7
            relativeTimeRange:
              from: 900
              to: 0
            model:
              refId: A
              datasource:
                type: victoriametrics-logs-datasource
                uid: PD775F2863313E6C7
              queryType: stats
              expr: "_time:10m source:docker | count() as rows"
          # dropNN, not replaceNN — a null must not silently become a 0 and fire,
          # nor become a number and mask a stall. See the rules above.
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 900
              to: 0
            model:
              refId: B
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 900
              to: 0
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
