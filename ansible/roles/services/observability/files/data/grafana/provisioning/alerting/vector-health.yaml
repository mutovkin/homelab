apiVersion: 1

# Grafana file-provisioned alerting — Vector's own health counters (#151)
#
# The failure this exists for: everything else in this stack detects only TOTAL
# absence. obs-log-ingest-stalled and obs-host-log-ingest-stalled count rows; the
# role's deploy-time assert waits for one marker to come back out of
# VictoriaLogs. All three are satisfied by a pipeline that is dropping half its
# events. PARTIAL loss — a remap abort, a full buffer, a sink rejecting a subset —
# was invisible by construction, which is the blindness that let the ~30-day
# silent 401 (vector-057) run its course with every container Up and every deploy
# green.
#
# Vector now exports internal_metrics to VictoriaMetrics
# (files/data/vector/vector.yaml, sink vector_metrics_out). The `vector_` prefix
# below is Vector's default namespace for the prometheus_remote_write sink.
#
# ALL FOUR NAMES VERIFIED against the live 0.57.0 binary, not taken from the
# issue (#151 warns Vector has renamed internal metrics across releases, so a
# version bump means re-checking them):
#   vector_uptime_seconds, vector_buffer_size_bytes — present in VictoriaMetrics
#     immediately after the first apply. (This row read vector_buffer_byte_size
#     until #216; see the note on obs-vector-buffer-filling for why it changed and
#     why the warning above is not hypothetical.)
#   vector_component_errors_total, vector_component_discarded_events_total —
#     absent in health (see the NoData note below), so they were forced on a
#     throwaway container instead: a throttle at threshold 5 emitted
#     component_discarded_events_total{component_id, component_type="throttle",
#     intentional="true"} and a remap abort emitted
#     component_errors_total{error_type="conversion_failed", stage="processing"},
#     both under namespace "vector".
# That probe also produced a correction worth keeping: a remap ABORT does NOT
# increment the discarded-events counter on 0.57.0, only component_errors_total.
# The abort-drop hazard #143 left behind is therefore covered by
# obs-vector-component-errors, NOT by obs-vector-discarding-events.
#
# NoData policy, deliberate per rule rather than uniform: absence is owned EXACTLY
# ONCE, by obs-vector-metrics-absent. The three others are OK on NoData because
# two of them query counters that DO NOT EXIST until their first non-zero event
# (a Prometheus counter is only exported once something increments it), so "no
# series" is their healthy state, not a fault. Copying noDataState: Alerting onto
# them would page continuously in perfect health.

# NO DEEP LINKS IN THIS FILE (#181), for a measured reason rather than a
# cautious one: nothing under files/data/grafana/dashboards/ plots
# vector_component_discarded_events_total, vector_component_errors_total,
# vector_uptime_seconds or vector_buffer_size_bytes. The tree ships the two
# #214 host dashboards, the NAS dashboard and six Home Assistant ones, and
# none of them touches this file's series (verified across all nine dashboard
# JSONs, 2026-08-29). No panel goes blank when these rules fire, so there is
# nothing to point at honestly, and a "View panel" button onto an unrelated
# graph is worse than no button.
#
# IF A DASHBOARD FOR THIS IS EVER ADDED, a link is a MANDATORY PAIR of
# __dashboardUid__ and __panelId__ pointing at a panel whose id is PINNED in
# the dashboard JSON. Half a pair is boot-fatal for the WHOLE Grafana process
# and withdraws every provisioned rule in the org (measured 2026-08-24). The
# static guard "Verify every alert deep link is a paired, pinned reference" in
# roles/services/observability/tasks/main.yml enforces both halves before a
# deploy touches anything. See
# docs/solutions/integration-issues/grafana-alert-panelid-pairing-breaks-all-provisioned-rules.md

groups:
  - orgId: 1
    name: vector-health
    folder: Observability
    # 5m, matching ingest-health. The queries below use increase()[15m], so a
    # discard is seen within one interval and stays visible for three.
    interval: 5m
    rules:
      # ---------------------------------------------------------------------
      # NOT a full disk buffer: this config sets `when_full: block`, so a full
      # buffer applies BACK-PRESSURE and stalls the sources rather than
      # discarding — that surfaces as obs-vector-buffer-filling and then as an
      # ingest stall, never here. Only `when_full: drop_newest` discards, and
      # nothing in this stack uses it. Discards come from the #153 self-ingestion
      # throttle engaging on a flood, or a sink dropping a batch.
      # component_id=`throttle_vector_own` with intentional=true means Vector is
      # flooding its own stderr and the throttle is bounding the amplification
      # loop: the throttle firing IS the flood alarm, so the job is "find the
      # flood", never "raise the threshold". Anything else is real pipeline loss.
      # ONE MORE READING, and it is the likeliest false lead: a Vector CRASH LOOP
      # trips the same throttle with no stderr flood at all. Each start emits
      # ~15-25 lines and docker's restart backoff fits several attempts into a
      # minute, which clears 30/60s on its own. Disambiguate with the OTHER
      # rules, not this one — if obs-log-ingest-stalled or
      # obs-vector-metrics-absent is firing at the same time, the condition is a
      # crash loop and this alert is a symptom of it; if both are Normal, Vector
      # is up and genuinely flooding.
      - uid: obs-vector-discarding-events
        title: Vector is discarding events
        condition: C
        # for: 0s — any discard is data loss that already happened. There is
        # nothing to ride out; the episode self-resolves when the 15m window
        # slides past it, which is right for a "this happened" alert rather than
        # a "this is broken" one.
        for: 0s
        # OK, and this is the case the header comment is about: Vector exports
        # component_discarded_events_total only once something has been
        # discarded, so on a healthy pipeline this query returns NOTHING. Total
        # absence of the whole vector_ family is obs-vector-metrics-absent's job,
        # and it owns it alone.
        noDataState: OK
        execErrState: Alerting
        isPaused: false
        annotations:
          summary: Vector on {{ $labels.host }} discarded events in the last 15 minutes — log data was lost.
          description: |-
            {{ $labels.component_id }} on {{ $labels.host }}, intentional={{ $labels.intentional }}.
            true: the self-ingestion throttle is bounding a flood — find the flood, never raise the threshold. false: real pipeline loss — read Vector's log on that host: `docker logs vector` on eq12_docker, `journalctl -u vector` on eq12/n5pro/n5pro_docker.
            If an ingest-stalled or metrics-absent alert fires alongside, this is a crash loop, not a flood.
        labels:
          severity: critical
          component: log-pipeline
        data:
          - refId: A
            datasourceUid: P4169E866C3094E38
            relativeTimeRange:
              from: 900
              to: 0
            model:
              refId: A
              datasource:
                type: victoriametrics-metrics-datasource
                uid: P4169E866C3094E38
              # `host` and `intentional` are BOTH in the by-clause on purpose: the
              # annotation renders each of them, and a label aggregated away renders
              # EMPTY rather than failing — a notification that silently drops the
              # tag separating a throttle bound from real loss, or the machine to go
              # look at. `host` also stops the FOUR Vector instances collapsing into
              # one series per component_id (#217). Be precise about what that fixed:
              # `sum by (component_id)` still went over 0 whenever ANY host discarded,
              # so the fleet-level signal was never lost — what was lost was WHICH
              # instance, and two hosts discarding at once merged into a single
              # notification naming neither. component_id is `victorialogs` on every
              # instance and the remediation above is per-host (the log to read is not
              # even in the same place on all four). Both labels are notification
              # policy group_by keys, so two hosts discarding now produce TWO
              # notifications.
              # Same reason error_type is kept on the rule below.
              expr: "sum by (host, component_id, intentional) (increase(vector_component_discarded_events_total[15m]))"
              instant: true
              range: false
              intervalMs: 60000
              maxDataPoints: 43200
          # dropNN, not replaceNN — a null must not silently become a 0 and read
          # as "nothing discarded" (#108). With no numeric value the rule falls
          # through to noDataState, which is OK here on purpose (see above).
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 900
              to: 0
            model:
              refId: B
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 900
              to: 0
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0

      # ---------------------------------------------------------------------
      # The abort-vs-discard split the header records, in full: an aborted VRL
      # remap DROPS the event (drop_on_abort defaults true, nothing is rerouted,
      # there is no dead-letter), and measured on 0.57.0 that drop does NOT appear
      # in component_discarded_events_total. So a transform component_id here with
      # error_type=conversion_failed is silent data loss, and this rule is the only
      # thing that sees it — which is exactly the blindness #143 left behind when
      # it swapped the fallible `!` coercions for defaulted forms. This counter
      # also covers connection failures, encoding errors and source-side read
      # errors.
      # Cross-check that the destination actually has the data: `_time:10m |
      # count()` in VictoriaLogs, and vector_component_sent_events_total in
      # VictoriaMetrics.
      - uid: obs-vector-component-errors
        title: Vector component errors
        condition: C
        for: 0s
        # Same reasoning as the rule above: this counter does not exist until the
        # first error. Absence is obs-vector-metrics-absent's job.
        noDataState: OK
        execErrState: Alerting
        isPaused: false
        annotations:
          summary: Vector component {{ $labels.component_id }} on {{ $labels.host }} reported errors ({{ $labels.error_type }}).
          description: |-
            This counter catches sink auth failures — the shape of the 30-day silent 401 — and VRL remap aborts, both of which drop data silently.
            The error text is in Vector's log on {{ $labels.host }} — `docker logs vector` on eq12_docker, `journalctl -u vector` on eq12/n5pro/n5pro_docker; then confirm lines are still landing in VictoriaLogs.
          runbook_url: https://github.com/mutovkin/homelab/blob/master/docs/solutions/integration-issues/vector-057-silent-log-pipeline-failure.md
        labels:
          severity: critical
          component: log-pipeline
        data:
          - refId: A
            datasourceUid: P4169E866C3094E38
            relativeTimeRange:
              from: 900
              to: 0
            model:
              refId: A
              datasource:
                type: victoriametrics-metrics-datasource
                uid: P4169E866C3094E38
              # host and error_type MUST both be in the by-clause: the annotation
              # renders {{ $labels.host }} and {{ $labels.error_type }}, and a label
              # aggregated away renders EMPTY rather than failing — a notification
              # that silently drops the one field separating a sink auth failure
              # from a remap abort, or the machine it happened on. `host` also stops
              # the FOUR Vector instances collapsing into one series per component
              # (#217). Precisely: `sum by (component_id)` still exceeded 0 whenever
              # ANY host errored, so the signal itself was never suppressed — what it
              # hid was WHICH instance, sending the operator to the wrong box, and it
              # merged two hosts erroring at once into one notification naming
              # neither. Both labels are notification policy group_by keys, so two
              # hosts erroring now produce TWO notifications.
              expr: "sum by (host, component_id, error_type) (increase(vector_component_errors_total[15m]))"
              instant: true
              range: false
              intervalMs: 60000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 900
              to: 0
            model:
              refId: B
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 900
              to: 0
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0

      # ---------------------------------------------------------------------
      - uid: obs-vector-metrics-absent
        title: Vector metrics export stopped
        condition: C
        for: 5m
        # THE absence owner for Vector's metric export, and the reason the two
        # counter rules above are OK on NoData. If this query returns nothing,
        # Vector has never exported internal metrics or VictoriaMetrics lost the
        # series — either way the three other rules in this group are silently
        # unable to fire, and a rule that cannot fire is worse than no rule.
        #
        # `min BY (HOST)`, not a bare `min` (#160). That is not cosmetic labelling:
        # a bare min collapses every agent into ONE value, so the healthiest host
        # sets the result and a single quiet agent is MASKED by its peers. It was
        # correct while eq12_docker's container was the only exporter; #160 gives
        # eq12, n5pro and n5pro_docker the same internal_metrics sink, so from four
        # exporters onward the bare form would report Normal while one of them was
        # dead. Grouping evaluates each host on its own AND names it in the alert.
        # The [24h] window is what makes a stopped host visible at all: its series
        # stops receiving samples but remains in the lookback, so lag() keeps
        # climbing for it — a host absent for more than 24h leaves the result set
        # entirely, and only the whole-query NoData below still covers that. The
        # relativeTimeRange below must stay >= the lookbehind; this mirrors
        # obs-http-probe-absent's reasoning.
        #
        # On a whole-family NoData firing, $labels.host renders empty — that is the
        # "every exporter gone" case.
        #
        # There is no `docker exec` on a distroless image, so to check that
        # VM_AUTH_USERNAME/VM_AUTH_PASSWORD actually reached the vector container,
        # read /data/deploy/observability/.env instead.
        #
        # This is ALSO what fires when Vector is simply gone — total death and
        # metrics-only death both land here; the body leads with the partial
        # case because it is the one nothing else catches.
        noDataState: Alerting
        execErrState: Alerting
        isPaused: false
        annotations:
          summary: Vector on {{ $labels.host }} stopped exporting internal metrics for over 10 minutes.
          description: |-
            Logs may still be flowing — the metrics sink can fail alone (bad VM_AUTH credential, sink 401) and nothing else notices.
            Check the vector logs on that host for vector_metrics_out sink errors.
        labels:
          severity: critical
          component: log-pipeline
        data:
          - refId: A
            datasourceUid: P4169E866C3094E38
            relativeTimeRange:
              from: 86400
              to: 0
            model:
              refId: A
              datasource:
                type: victoriametrics-metrics-datasource
                uid: P4169E866C3094E38
              expr: "min by (host) (lag(vector_uptime_seconds[24h]))"
              instant: true
              range: false
              intervalMs: 60000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 86400
              to: 0
            model:
              refId: B
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
          # 600s = ten missed 60s scrapes. Loose enough that a Vector restart or
          # one slow remote-write cannot trip it.
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 86400
              to: 0
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 600

      # ---------------------------------------------------------------------
      # The 128MB in the annotation is half of the 256MB disk buffer configured in
      # files/data/vector/vector.yaml (max_size: 268435488). CHANGE BOTH TOGETHER
      # — this threshold is 50% of that number and nothing enforces the
      # relationship.
      #
      # THE METRIC IS vector_buffer_size_bytes, NOT vector_buffer_byte_size (#216).
      # Vector 0.58.0 removed the deprecated buffer_byte_size/buffer_events gauges.
      #
      # THE FAILURE THIS AVOIDS IS NOT NoData, AND THAT IS THE WHOLE POINT. The
      # obvious reading — "the metric vanishes, the rule goes NoData, and
      # noDataState: OK silently swallows it" — is WRONG, and was measured wrong
      # rather than reasoned wrong. At the time this expression aggregated
      # `by (component_id)` with NO host label (#217 has since added one — see
      # below), and only the eq12_docker CONTAINER moved to 0.58.0: the
      # three native vector_agent shippers are pinned at 0.57.0
      # (roles/vector_agent/defaults/main.yml) and keep exporting the old name. So
      # on the old name, post-upgrade and past VM's 5m staleness window (measured
      # 2026-08-29T21:52:24Z, 6.8 min after the 0.58.0 start):
      #   vector_buffer_byte_size{component_id="victorialogs"} -> hosts
      #     ['eq12', 'n5pro', 'n5pro_docker']   — eq12_docker simply GONE
      #   max by (component_id) (vector_buffer_byte_size) -> 2 series, both 0
      #     — i.e. NOT NoData. The rule evaluates normally, returns plausible
      #     healthy numbers, and never fires a single state change.
      # The guard would have kept looking perfectly alive while being blind to the
      # ONE instance that has the 256MB disk buffer this 128MiB threshold and the
      # wedged-buffer runbook are actually about. Silent partial blindness inside a
      # healthy-looking aggregate, not an absence anything owns. (Total death of an
      # instance IS still owned, per-host, by obs-vector-metrics-absent — it is this
      # metric-family-specific dropout that nothing covered.)
      # PER-HOST GROUPING LANDED IN #217 — and be precise about what it buys,
      # because the tempting reading is wrong. `by (host, component_id)` gives two
      # things: PER-HOST EVALUATION (each instance's buffer is judged against the
      # 128MiB threshold on its own, never averaged into or masked by its peers)
      # and ATTRIBUTION (the alert names the machine; `host` is a
      # notification-policy group_by key since #198, so two hosts filling produce
      # TWO notifications rather than one [FIRING:2] naming neither — component_id
      # is `victorialogs` on all four instances, so before #217 the summary told an
      # operator only that a buffer SOMEWHERE was filling, while the runbook it
      # links is a single-host procedure).
      # What it does NOT buy is detection of the dropout described above. This rule
      # is `noDataState: OK`, so a per-host series that stops arriving goes stale
      # and RESOLVES TO NORMAL — silently, exactly as before. Grouping changes the
      # loss from an invisible shift in an aggregate's composition into an
      # observable stopped series, which is worth having for anyone who goes
      # looking; it does not make anything go looking. If eq12_docker's buffer
      # gauge disappears again, this rule quietly stops covering eq12_docker.
      # The family-specific dropout itself remains UNOWNED — #222. Note that
      # obs-vector-metrics-absent does not close it either: that rule watches
      # vector_uptime_seconds, and #216's whole point is that an instance can keep
      # exporting uptime while one metric family it publishes dies.
      # The 128MiB threshold stays a PER-INSTANCE threshold and does not change:
      # all four configure the same max_size 268435488 (observability's
      # files/data/vector/vector.yaml and vector_agent's templates/vector.yaml.j2).
      #
      # The swap was verified as a drop-in on the live 0.57.0 fleet BEFORE the bump,
      # because "both read 0" would not have distinguished a shared gauge from two
      # unrelated ones (CLAUDE.md: an experiment that cannot discriminate is not
      # evidence). What discriminates:
      #   max_over_time(...[30d]) -> 328952 bytes for component_id=victorialogs on
      #     BOTH names — the same non-zero peak, not a shared idle zero.
      #   count(vector_buffer_byte_size != vector_buffer_size_bytes) -> empty, i.e.
      #     zero samples anywhere in retention where the two disagree.
      #   count by (host) -> 2 series on all FOUR instances, so the expression is
      #     correct on 0.57.0 and 0.58.0 at once. That is measured here, on this
      #     fleet; do NOT cite upstream's docs/specs/buffer.md for it, which
      #     documents the emit-both-for-back-compat rule for buffer_max_* but says
      #     no such thing about these two gauges.
      # When the agents are eventually bumped to 0.58, nothing here needs to change.
      - uid: obs-vector-buffer-filling
        title: Vector disk buffer filling
        condition: C
        # 15m, not 0s: a buffer transiently holding data during a VictoriaLogs
        # restart is normal. Sustained growth is not.
        for: 15m
        # OK on NoData: absence is obs-vector-metrics-absent's job (see above).
        noDataState: OK
        execErrState: Alerting
        isPaused: false
        annotations:
          summary: Vector buffer {{ $labels.component_id }} on {{ $labels.host }} is over half full (128MB of 256MB).
          description: |-
            The sink is rejecting or stalling; when the buffer fills, sources stop reading and events are lost at the source.
            Fix the sink before that — check VictoriaLogs is up and authenticating; Vector's log on {{ $labels.host }} names the error (`docker logs vector` on eq12_docker, `journalctl -u vector` on eq12/n5pro/n5pro_docker).
          runbook_url: https://github.com/mutovkin/homelab/blob/master/docs/solutions/integration-issues/vector-wedged-disk-buffer-reset.md
        labels:
          severity: warning
          component: log-pipeline
        data:
          - refId: A
            datasourceUid: P4169E866C3094E38
            relativeTimeRange:
              from: 900
              to: 0
            model:
              refId: A
              datasource:
                type: victoriametrics-metrics-datasource
                uid: P4169E866C3094E38
              expr: "max by (host, component_id) (vector_buffer_size_bytes)"
              instant: true
              range: false
              intervalMs: 60000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 900
              to: 0
            model:
              refId: B
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
          # 134217728 = 128MiB = 50% of the 256MB (268435488 byte) disk buffer.
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 900
              to: 0
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 134217728

      # ---------------------------------------------------------------------
      # TEMPORARY FIXTURE — #220, and it is removed by the very next commit on
      # this branch. It exists to demonstrate the retirement path end to end on
      # a live host: deploy this commit and Grafana serves one rule more than
      # master; deploy the next one — which deletes this block and writes
      # `{orgId: 1, uid: retire-demo-220}` into retired.yaml — and the rule is
      # actually GONE from Grafana, which is the thing that does not happen when
      # you merely delete the YAML (#212's served-set guard is what proves it).
      # If you are reading this on master, the removal commit was lost: delete
      # the block and add the tombstone.
      #
      # ZERO PAGE RISK, four independent ways, because a fixture that can page
      # the operator to prove a point about paging is not a fixture:
      #   isPaused: true    — Grafana SERVES it (so half A of #212's guard sees
      #                       it) and never evaluates it. #212's freshness half
      #                       excludes paused rules by construction
      #                       (`rejectattr('isPaused', 'equalto', true)`), so it
      #                       is not expected to evaluate either.
      #   threshold 1e12    — vector_uptime_seconds is a container uptime in
      #                       seconds; ~31,000 years is not reachable.
      #   noDataState: OK   — absence cannot fire it.
      #   execErrState: OK  — a query error cannot fire it.
      # No deep link: there is no dashboard panel for this and #181's gate wants
      # both annotations or neither — same posture as delivery-health.yaml.
      # It is also the ONE rule in this folder that is not
      # `execErrState: Alerting`, which the README counts. Deliberate, and it
      # survives exactly one commit: the README's count describes the retired
      # state of this branch, which is the state that merges.
      - uid: retire-demo-220
        title: Alert rule retirement demo (#220)
        condition: C
        for: 0s
        noDataState: OK
        execErrState: OK
        isPaused: true
        annotations:
          # SINGLE-QUOTED, and that is the point of leaving it in a worked
          # example: an unquoted YAML scalar ends at a ` #`, so unquoted this
          # summary reaches Grafana as the single word "Temporary" (measured
          # with pyyaml on the first draft of this commit). Same trap CLAUDE.md
          # documents for compose.yaml scalars and `.env` values. The `(#220)`
          # in the title survives because the # is not preceded by a space, and
          # the description below survives because `|-` is a block scalar —
          # do not rely on either; quote the value.
          summary: 'Temporary #220 fixture — paused, unfireable, retired by the next commit.'
          description: |-
            This rule exists only to demonstrate that removing a rule from a provisioning file does NOT remove it from Grafana, and that a `deleteRules:` tombstone in retired.yaml does.
            If it is still here after #220 merged, the retirement commit was lost — delete it and tombstone the uid.
        labels:
          severity: warning
          component: log-pipeline
        data:
          - refId: A
            datasourceUid: P4169E866C3094E38
            relativeTimeRange:
              from: 900
              to: 0
            model:
              refId: A
              datasource:
                type: victoriametrics-metrics-datasource
                uid: P4169E866C3094E38
              expr: "min by (host) (vector_uptime_seconds)"
              instant: true
              range: false
              intervalMs: 60000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 900
              to: 0
            model:
              refId: B
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
