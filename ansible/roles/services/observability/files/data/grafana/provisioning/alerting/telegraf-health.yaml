apiVersion: 1

# Grafana file-provisioned alerting — telegraf's own liveness and, specifically,
# the CONTINUITY OF ITS host LABEL (#178).
#
# TWO DETECTOR SHAPES, because the label reaches VictoriaMetrics by TWO
# INDEPENDENT PATHS and a detector on one is blind to the other — the same "two
# delivery paths need two liveness rules" lesson #174 learned the hard way:
#   obs-telegraf-metrics-absent[-<host>] — the AGENT path, one rule per agent
#       (see THE COST below). [agent] hostname stops resolving (empty, unset,
#       renamed) -> the expected series stops.
#   obs-docker-metrics-unlabelled — the PER-PLUGIN FILTER path. [[inputs.docker]]
#       `taginclude` is an allowlist over the FINAL tag set, so dropping "host"
#       from it strips the label off every docker_* series while system_uptime —
#       what the first rule watches — keeps flowing, perfectly labelled. Measured:
#       that exact state existed for the whole life of the deployment and nothing
#       could see it. A comment on the taginclude line is not a detector.
#
# The failure this exists for, and it is not "telegraf is down": #178 replaced a
# hardcoded `hostname = "homelab-telegraf"` with `hostname =
# "${TELEGRAF_HOSTNAME}"`, substituted from the container env. That fixed the
# label and, on its own, left NOTHING able to notice the label going wrong
# again. Every other telegraf-fed rule in this folder aggregates the host
# dimension AWAY — probe-health groups `by (server, check_type)`,
# delivery-health by `integration` — so telegraf can be alive, healthy, green in
# every deploy, and stamping a garbage host on every metric, and not one rule
# moves. That is bit-for-bit the state #178 exists to end.
#
# It is a reachable state, measured on the running image rather than argued
# (telegraf 1.39.3, `telegraf --test`, same table in ../../../../compose.yaml):
#   TELEGRAF_HOSTNAME empty                  -> host=<12-char container id>
#   TELEGRAF_HOSTNAME unset in container env -> host=${TELEGRAF_HOSTNAME}, LITERALLY,
#                                               exit 0, agent healthy
# Telegraf's 1.38+ "strict environment variable handling" does not cover the
# unset case. Deleting the passthrough line in compose.yaml is all it takes.
#
# SELECTOR: `host="eq12_docker"`, and the pinned name is the deliberate part.
# The obvious mirror of obs-vector-metrics-absent would be host-agnostic —
# `min by (host) (lag(system_uptime[24h]))` — and that is what this rule was
# first written as. Measured against live VictoriaMetrics before landing, that
# form arrives FIRING and stays that way for ~24h: lag() returns every series
# with at least one sample in the lookbehind, so the retired
# host="homelab-telegraf" series (last sample 2026-08-24T03:14:52Z, the #178
# apply) is still in the result set with a monotonically climbing lag — measured
# 1321s twenty-two minutes after the cutover, against a 600s threshold. The
# host-agnostic form pages for a full lookbehind after ANY deliberate rename.
# README.md records that tradeoff for the per-host log rule and for
# obs-http-probe-absent; the write-up for this rule's own scoping decision is
# docs/solutions/integration-issues/telegraf-host-label-fabricated-then-stripped-by-taginclude.md.
# The difference here is that #178 IS the rename, so the rule would have arrived
# firing at its own deploy.
# Scoping to the expected name instead is strictly BETTER at the job this rule
# exists for: a wrong-but-present label (container id, stale name, the literal
# ${TELEGRAF_HOSTNAME}) makes the eq12_docker series stop, which is exactly what
# this fires on — and it does not depend on the abandoned series still sitting
# in the window, which is the mechanism that produced the transient. Precedent
# for a pinned host in a static alert file: truenas-health.yaml, host="truenas".
# THE COST, stated plainly so the next reader does not have to rediscover it:
# each of these rules watches ONE name, so a host with no rule of its own is
# unmonitored — a silent gap, not a loud one. #186 is what made that concrete:
# the two PHYSICAL Proxmox hosts now run NATIVE systemd telegraf agents
# (roles/telegraf_agent, inventory group `telegraf_agents`), so the pinned set is
# THREE rules — eq12_docker (the container agent that ships with this stack),
# plus eq12 and n5pro (native). One absence owner per agent.
#
# That gap is no longer left to memory. The observability role now derives the
# EXPECTED set from inventory — group `telegraf_agents` plus the host this stack
# deploys to — and asserts it equals the set of pinned host selectors it parses
# out of the `expr` lines in THIS file. (Note the shape of this sentence: it does
# NOT quote one of those selectors verbatim, because the guard's anchor is a
# literal and a comment carrying it would count as a fourth rule and fail the
# deploy. That is deliberate on the guard's part — a first-match check would
# instead read the comment and pass while the live selector said something else —
# and it was measured here: the first draft of this paragraph tripped it.)
# The guard lives in ansible/roles/services/observability/tasks/main.yml,
# "Verify the telegraf alert rule's pinned host selector". Adding a host to
# `telegraf_agents` now
# FAILS the observability deploy until its rule exists here. Static check, so it
# fails under --check before anything touches state.
#
# FIRST-EVER FLEET BRING-UP, recorded so it is not mistaken for a defect: in
# site.yml, deploy-services.yml (which provisions THIS file) runs BEFORE
# metrics-agents.yml (which first starts the native agents) — deliberately, because
# the agents' own arrival asserts query the VictoriaMetrics that deploy-services
# creates. So on a from-scratch build both native-agent rules below sit
# NoData -> Alerting for the interim between the two playbooks, then self-resolve
# once the agents ship their first samples. Accepted posture, not something to
# design around.
#
# One more thing pinning buys, beyond the transient argued above: each host's
# TOTAL disappearance is NoData -> Alerting for THAT host's rule, whereas a
# shared regex selector (host=~"eq12|n5pro|…") would return only the surviving
# hosts' series and self-RESOLVE once the dead one's last sample rolled out of
# the lookbehind — the machine going away entirely is the case that must page
# loudest, and it is exactly the case a regex selector goes quiet on.
#
# Why system_uptime and not one of the richer families: [[inputs.system]] emits
# it every 60s unconditionally, it exists whenever the agent is running at all,
# and it carries no per-target labels that could churn series identity. Same
# role vector_uptime_seconds plays for obs-vector-metrics-absent.
groups:
  - orgId: 1
    name: telegraf-health
    folder: Observability
    # 5m, matching vector-health. For obs-telegraf-metrics-absent the condition
    # is 600s of lag, so a finer interval would only re-evaluate the same slow
    # signal more often. It is NOT free for obs-docker-metrics-unlabelled
    # though: that rule's signal appears instantly when the defect starts, so
    # this interval, not the signal, sets its onset latency — nothing is
    # evaluated between ticks, and `for: 5m` only advances at ticks. Measured
    # end to end in #178's break-and-observe: 6m06s from first unlabelled
    # sample to Alerting (injection 08:02:44Z, Pending 08:03:50Z, Alerting
    # 08:08:50Z). Shortening this interval would buy detection latency there at
    # the cost of re-evaluating the lag rule more often for no gain.
    interval: 5m
    rules:
      # ---------------------------------------------------------------------
      # READ THE TWO CAUSES IN THIS ORDER when this fires, because the second is
      # the one nothing else in this stack can see.
      #   (1) Telegraf is down or wedged — `docker ps` and `docker logs telegraf`
      #       on eq12_docker settle it in seconds, and obs-http-probe-absent will
      #       usually be firing alongside.
      #   (2) Telegraf is UP and its host label is wrong. This is the #178
      #       regression the file header opens with, and this rule is the only
      #       thing that sees it. Confirm with `count by (host) (system_uptime)`:
      #       a row labelled with a 12-char container id means TELEGRAF_HOSTNAME
      #       resolved EMPTY, and a row reading literally `${TELEGRAF_HOSTNAME}`
      #       means the variable is not in the container env at all (the measured
      #       1.39.3 table for both is in the header). Both are one missing line
      #       in ansible/roles/services/observability/files/compose.yaml, whose
      #       value is templated from inventory_hostname by templates/env.j2.
      #
      # The [24h] lookbehind mirrors obs-vector-metrics-absent and
      # obs-http-probe-absent: a series with no sample inside the lookbehind is
      # not returned AT ALL, so a shorter window would let a long-dead agent
      # vanish from the query, Grafana mark the instance stale and RESOLVE the
      # alert. relativeTimeRange below must stay >= the lookbehind.
      #
      # NOTE for whoever renames this host on purpose: the rule is scoped to the
      # name, so a deliberate rename makes it fire — update the selector in the
      # same change that does the rename.
      - uid: obs-telegraf-metrics-absent
        title: Telegraf metrics stopped arriving for eq12_docker
        condition: C
        for: 5m
        # THE absence owner for telegraf's metric export, mirroring
        # obs-vector-metrics-absent. This is why probe-health's two failure rules
        # are noDataState: OK — absence is alerted on exactly once, here, and one
        # dead telegraf must not page three times.
        #
        # Alerting, not OK, and the #151 test is what settles it: system_uptime
        # is exported continuously every 60s whether or not anything is wrong, so
        # absence is NEVER its healthy state (unlike a counter such as
        # vector_component_errors_total, which does not exist until it is
        # non-zero and therefore must be OK on NoData). NoData here means the
        # series is gone entirely — telegraf dead for longer than the lookbehind,
        # VictoriaMetrics unreachable, or the host label no longer equal to
        # "eq12_docker" for longer than 24h — each of which is the fault this
        # rule owns.
        noDataState: Alerting
        # A datasource that cannot be reached is not evidence of health (#108).
        execErrState: Alerting
        isPaused: false
        annotations:
          summary: No telegraf samples tagged host=eq12_docker for over 10 minutes.
          description: |-
            Telegraf is down, or running with a broken host tag. `docker logs telegraf` on eq12_docker settles the first.
            For the second, `count by (host) (system_uptime)`: a container-id or literal ${TELEGRAF_HOSTNAME} row means the env var went missing.
        labels:
          severity: critical
          component: metrics-pipeline
        data:
          - refId: A
            datasourceUid: P4169E866C3094E38
            relativeTimeRange:
              from: 86400
              to: 0
            model:
              refId: A
              datasource:
                type: victoriametrics-metrics-datasource
                uid: P4169E866C3094E38
              # `min by (host)` is kept around the pinned selector on purpose:
              # adding a second host to the selector then evaluates each one on
              # its own, rather than letting the healthiest mask a dead peer
              # (#160). It is NOT here to keep $labels.host renderable — no
              # annotation on this rule interpolates it, and none needs to,
              # because the selector names the host literally and so do they.
              expr: 'min by (host) (lag(system_uptime{host="eq12_docker"}[24h]))'
              instant: true
              range: false
              intervalMs: 60000
              maxDataPoints: 43200
          # dropNN, not replaceNN — a null must not silently become 0 and read as
          # "zero lag, all healthy" (#108). With no numeric value the rule falls
          # through to noDataState, which is Alerting here on purpose.
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 86400
              to: 0
            model:
              refId: B
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
          # 600s = ten missed 60s collections. Justified by measurement rather
          # than guessed: the live lag for host="eq12_docker" was 0.641s
          # immediately after the #178 apply, so the healthy signal sits three
          # orders of magnitude below the threshold and a telegraf restart (~3s)
          # cannot approach it. Detection latency is 15-20 min, and the group's
          # 5m `interval` is the third term that is easy to forget: the lag must
          # EXCEED 600s (10 min), that must then be OBSERVED at an evaluation
          # tick — nothing is evaluated between ticks, so up to 5m later — and
          # only then does `for: 5m` start, which also advances only at ticks.
          # Best case 15 min, worst case ~20. Same order as obs-http-probe-absent.
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 86400
              to: 0
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 600

      # ---------------------------------------------------------------------
      # THE NATIVE-AGENT ABSENCE OWNERS (#186), one per physical Proxmox host.
      #
      # eq12 and n5pro run telegraf as a SYSTEMD SERVICE (roles/telegraf_agent),
      # not as a container, and they are the machines every VM and LXC in the
      # fleet sits on top of — before #186 neither exported a single non-vector_*
      # series. These two rules are their absence owners, mirroring the container
      # rule above one-for-one so the three read the same way.
      #
      # NO DEEP LINKS ON THESE TWO, DELIBERATELY. The natural link for a rule
      # that says "a whole delivery path went dark" is the DASHBOARD, and a
      # dashboard-only deep link is NOT REPRESENTABLE in file provisioning:
      # Grafana validates __dashboardUid__ and __panelId__ as a mandatory PAIR
      # and rejects the document otherwise — and that rejection is boot-fatal for
      # ALL provisioned rules, not just the offending one (measured 2026-08-24:
      # one unpaired annotation crash-looped Grafana, ten "Starting Grafana"
      # lines, zero "HTTP Server Listen", all 22 rules withdrawn). Nothing
      # repo-side can catch it — the file is valid YAML, lint-clean, and --check
      # skips the Grafana restart entirely. So: add a link only as a real pair,
      # pointing at a panel with a PINNED id. See
      # docs/solutions/integration-issues/grafana-alert-panelid-pairing-breaks-all-provisioned-rules.md

      # ---------------------------------------------------------------------
      # WHEN THIS FIRES, on the host itself — this agent is native, so there is
      # no `docker logs` to reach for:
      #   ssh root@eq12 'systemctl status telegraf'
      #   ssh root@eq12 'journalctl -u telegraf -n 100'
      # The unit is Restart=always with StartLimitIntervalSec=0, so a wedged
      # agent looks like a restart loop in the journal rather than a `failed`
      # unit nobody polls — that is the intended shape, and it is why liveness
      # lives here in an absence rule instead of in a systemd state.
      #
      # THE CONTAINER RULE'S FAILURE MODE DOES NOT EXIST HERE. On eq12_docker the
      # host label comes from ${TELEGRAF_HOSTNAME} in the container env, which can
      # go missing and be stamped LITERALLY. The native agent has no such
      # indirection: `hostname = "eq12"` is templated from inventory_hostname
      # straight into /etc/telegraf/telegraf.conf by roles/telegraf_agent. A wrong
      # label here means that FILE changed — check it, and the role's template,
      # before hunting for an environment problem there isn't one of.
      #
      # The [24h] lookbehind mirrors the rule above: a series with no sample
      # inside the lookbehind is not returned AT ALL, so a shorter window would
      # let a long-dead agent vanish from the query, Grafana mark the instance
      # stale and RESOLVE the alert. relativeTimeRange below must stay >= it.
      #
      # NOTE for whoever renames this host on purpose: the rule is scoped to the
      # name, so a deliberate rename makes it fire — update the selector, the
      # `telegraf_agents` group and the title in the same change. The deploy-time
      # assert in the observability role will insist on it anyway.
      - uid: obs-telegraf-metrics-absent-eq12
        title: Telegraf metrics stopped arriving for eq12
        condition: C
        for: 5m
        # Alerting, not OK, and the #151 test is what settles it: [[inputs.system]]
        # exports system_uptime every 60s UNCONDITIONALLY whether or not anything
        # is wrong, so absence is NEVER its healthy state (unlike a counter such
        # as vector_component_errors_total, which does not exist until it is
        # non-zero and therefore must be OK on NoData). NoData here means the
        # series is gone entirely — the native agent dead or the host down for
        # longer than the lookbehind, VictoriaMetrics unreachable, or the host
        # label no longer equal to "eq12" for longer than 24h — each of which is
        # the fault this rule owns. A physical hypervisor disappearing completely
        # is precisely the case that must page loudest.
        noDataState: Alerting
        # A datasource that cannot be reached is not evidence of health (#108).
        execErrState: Alerting
        isPaused: false
        annotations:
          summary: No telegraf samples tagged host=eq12 for over 10 minutes.
          description: |-
            The native systemd agent on the Proxmox host eq12: `systemctl status telegraf` then `journalctl -u telegraf -n 100` over ssh root@eq12.
            Its host label is templated literally from inventory_hostname into /etc/telegraf/telegraf.conf, so a wrong label means that file changed — there is no env var to go missing here.
        labels:
          severity: critical
          component: metrics-pipeline
        data:
          - refId: A
            datasourceUid: P4169E866C3094E38
            relativeTimeRange:
              from: 86400
              to: 0
            model:
              refId: A
              datasource:
                type: victoriametrics-metrics-datasource
                uid: P4169E866C3094E38
              # `min by (host)` around a selector that already pins one host is
              # kept for symmetry with the rule above: it makes widening safe by
              # construction, evaluating each host on its own rather than letting
              # the healthiest mask a dead peer (#160).
              expr: 'min by (host) (lag(system_uptime{host="eq12"}[24h]))'
              instant: true
              range: false
              intervalMs: 60000
              maxDataPoints: 43200
          # dropNN, not replaceNN — a null must not silently become 0 and read as
          # "zero lag, all healthy" (#108). With no numeric value the rule falls
          # through to noDataState, which is Alerting here on purpose.
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 86400
              to: 0
            model:
              refId: B
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
          # 600s = ten missed 60s collections. Measured, not guessed: the live lag
          # for host="eq12" was 11.2s immediately after the #186 deploy on
          # 2026-08-25, so the healthy signal sits ~50x below the threshold and a
          # telegraf restart cannot approach it. Detection latency is the same
          # arithmetic as the rule above, and the group's 5m `interval` is the
          # third term that is easy to forget: the lag must EXCEED 600s (10 min),
          # that must then be OBSERVED at an evaluation tick — nothing is
          # evaluated between ticks, so up to 5m later — and only then does
          # `for: 5m` start, which also advances only at ticks. Best case 15 min,
          # worst case ~20.
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 86400
              to: 0
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 600

      # ---------------------------------------------------------------------
      # WHEN THIS FIRES, on the host itself — this agent is native, so there is
      # no `docker logs` to reach for:
      #   ssh root@n5pro 'systemctl status telegraf'
      #   ssh root@n5pro 'journalctl -u telegraf -n 100'
      # The unit is Restart=always with StartLimitIntervalSec=0, so a wedged
      # agent looks like a restart loop in the journal rather than a `failed`
      # unit nobody polls — that is the intended shape, and it is why liveness
      # lives here in an absence rule instead of in a systemd state.
      #
      # THE CONTAINER RULE'S FAILURE MODE DOES NOT EXIST HERE. On eq12_docker the
      # host label comes from ${TELEGRAF_HOSTNAME} in the container env, which can
      # go missing and be stamped LITERALLY. The native agent has no such
      # indirection: `hostname = "n5pro"` is templated from inventory_hostname
      # straight into /etc/telegraf/telegraf.conf by roles/telegraf_agent. A wrong
      # label here means that FILE changed — check it, and the role's template,
      # before hunting for an environment problem there isn't one of.
      #
      # The [24h] lookbehind mirrors the rule above: a series with no sample
      # inside the lookbehind is not returned AT ALL, so a shorter window would
      # let a long-dead agent vanish from the query, Grafana mark the instance
      # stale and RESOLVE the alert. relativeTimeRange below must stay >= it.
      #
      # NOTE for whoever renames this host on purpose: the rule is scoped to the
      # name, so a deliberate rename makes it fire — update the selector, the
      # `telegraf_agents` group and the title in the same change. The deploy-time
      # assert in the observability role will insist on it anyway.
      - uid: obs-telegraf-metrics-absent-n5pro
        title: Telegraf metrics stopped arriving for n5pro
        condition: C
        for: 5m
        # Alerting, not OK, and the #151 test is what settles it: [[inputs.system]]
        # exports system_uptime every 60s UNCONDITIONALLY whether or not anything
        # is wrong, so absence is NEVER its healthy state (unlike a counter such
        # as vector_component_errors_total, which does not exist until it is
        # non-zero and therefore must be OK on NoData). NoData here means the
        # series is gone entirely — the native agent dead or the host down for
        # longer than the lookbehind, VictoriaMetrics unreachable, or the host
        # label no longer equal to "n5pro" for longer than 24h — each of which is
        # the fault this rule owns. A physical hypervisor disappearing completely
        # is precisely the case that must page loudest.
        noDataState: Alerting
        # A datasource that cannot be reached is not evidence of health (#108).
        execErrState: Alerting
        isPaused: false
        annotations:
          summary: No telegraf samples tagged host=n5pro for over 10 minutes.
          description: |-
            The native systemd agent on the Proxmox host n5pro: `systemctl status telegraf` then `journalctl -u telegraf -n 100` over ssh root@n5pro.
            Its host label is templated literally from inventory_hostname into /etc/telegraf/telegraf.conf, so a wrong label means that file changed — there is no env var to go missing here.
        labels:
          severity: critical
          component: metrics-pipeline
        data:
          - refId: A
            datasourceUid: P4169E866C3094E38
            relativeTimeRange:
              from: 86400
              to: 0
            model:
              refId: A
              datasource:
                type: victoriametrics-metrics-datasource
                uid: P4169E866C3094E38
              # `min by (host)` around a selector that already pins one host is
              # kept for symmetry with the rule above: it makes widening safe by
              # construction, evaluating each host on its own rather than letting
              # the healthiest mask a dead peer (#160).
              expr: 'min by (host) (lag(system_uptime{host="n5pro"}[24h]))'
              instant: true
              range: false
              intervalMs: 60000
              maxDataPoints: 43200
          # dropNN, not replaceNN — a null must not silently become 0 and read as
          # "zero lag, all healthy" (#108). With no numeric value the rule falls
          # through to noDataState, which is Alerting here on purpose.
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 86400
              to: 0
            model:
              refId: B
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
          # 600s = ten missed 60s collections. Measured, not guessed: the live lag
          # for host="n5pro" was 11.2s immediately after the #186 deploy on
          # 2026-08-25, so the healthy signal sits ~50x below the threshold and a
          # telegraf restart cannot approach it. Detection latency is the same
          # arithmetic as the rule above, and the group's 5m `interval` is the
          # third term that is easy to forget: the lag must EXCEED 600s (10 min),
          # that must then be OBSERVED at an evaluation tick — nothing is
          # evaluated between ticks, so up to 5m later — and only then does
          # `for: 5m` start, which also advances only at ticks. Best case 15 min,
          # worst case ~20.
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 86400
              to: 0
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 600

      # ---------------------------------------------------------------------
      # THE RAPL POWER ABSENCE OWNERS (#194), one per physical Proxmox host.
      #
      # A SEPARATE PAIR OF RULES FROM THE TWO ABOVE, ON PURPOSE, and the reason
      # is #174's measured lesson: the agent-liveness rules watch the
      # [[inputs.system]] stream, and the exec input that produces this family
      # can die on its own while that stream keeps flowing perfectly. A failing
      # exec is logged once and telegraf carries on serving every other input —
      # exactly the shape that cost the container agent its ping metrics. Two
      # producers need two liveness rules; an agent-level rule is blind to this.
      #
      # SHAPE IS A DOMAIN COUNT, NOT PRESENCE, because partial loss is the
      # realistic failure here. files/rapl_power.sh emits NOTHING for a zone it
      # cannot read completely (gauges skip on unknown rather than publishing a
      # fabricated zero), so losing one domain thins the series silently while a
      # presence check stays green. `count by (host)` collapses each host to one
      # row carrying the number of domains delivered, and the threshold is that
      # host's measured domain count.
      #
      # WARNING, NOT CRITICAL, and that routes email-only under the root policy
      # (no sub-route matches component=metrics-pipeline at severity=warning).
      # Losing power visibility is not worth a page: the agent-dead case — the
      # one that IS a page — is already owned by the two rules above, at
      # severity critical. This deliberately keeps the #193 fatigue posture.
      #
      # NO DEEP LINKS ON THESE TWO EITHER, for the reason spelled out above the
      # native-agent rules: a dashboard-only __dashboardUid__ is not
      # representable and its rejection is boot-fatal for ALL provisioned rules.
      #
      # WHEN EITHER FIRES, on the host itself:
      #   ssh root@<host> 'systemctl status telegraf'
      #   ssh root@<host> 'journalctl -u telegraf -n 100 | grep -i exec'
      #   ssh root@<host> '/usr/local/lib/telegraf/rapl_power.sh'   # ~1s, prints
      #       one influx line per readable domain, nothing for an unreadable one
      #   ssh root@<host> 'grep . /sys/class/powercap/intel-rapl:*/name'
      # `energy_uj` is -r-------- root root and the unit reads it through the
      # drop-in's ambient CAP_DAC_OVERRIDE, so a drop-in regression takes this
      # family out while telegraf stays `active` and every other family flows.
      #
      # NOTE for whoever renames a host, or changes a board: these are scoped to
      # the name AND to the domain count, so both a rename and a hardware change
      # must be made here in the same change. This used to claim the telegraf
      # role's own deploy proof "will fail first" — it does NOT. site.yml imports
      # deploy-services.yml (this file) BEFORE metrics-agents.yml, so a stale
      # threshold goes live first and only then does the role's assert fail; and
      # that assert compares DELIVERED domains against host_vars, never reading
      # this file at all. The actual coupling is the static reconciler in
      # roles/services/observability/tasks/main.yml ("Assert each RAPL rule's
      # threshold equals that host's declared domain count"), which parses this
      # file against hostvars and runs under --check, before anything deploys.

      # eq12 (Intel N100) delivers THREE domains — package-0, core, uncore —
      # enumerated from the sysfs `name` files, 2026-08-25.
      - uid: obs-rapl-power-absent-eq12
        title: RAPL power domains stopped arriving for eq12
        condition: C
        for: 5m
        # Alerting, not OK, and the #151 test settles it the same way it does for
        # the rules above: this family is exported every 60s unconditionally, so
        # absence is NEVER its healthy state (unlike a counter that only exists
        # while non-zero). NoData here means every domain is gone — the exec
        # input dead, the capability lost, telegraf down, or the host away.
        noDataState: Alerting
        # A datasource that cannot be reached is not evidence of health (#108).
        execErrState: Alerting
        isPaused: false
        annotations:
          summary: RAPL power domains for host=eq12 are incomplete or absent (expected 3).
          description: |-
            The exec input can die while the agent stays healthy, so this is separate from the agent-liveness rule. On the host: `journalctl -u telegraf -n 100 | grep -i exec`, then run /usr/local/lib/telegraf/rapl_power.sh by hand — it prints one line per readable domain and nothing for one it cannot read.
            energy_uj is root-only and is reached through the unit's ambient CAP_DAC_OVERRIDE; a drop-in regression takes this family out while every other family keeps flowing.
        labels:
          severity: warning
          component: metrics-pipeline
        data:
          - refId: A
            datasourceUid: P4169E866C3094E38
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              datasource:
                type: victoriametrics-metrics-datasource
                uid: P4169E866C3094E38
              # [10m] against a 60s collection interval: ten samples of
              # headroom, so a restart cannot empty the window. relativeTimeRange
              # above must stay >= this lookbehind. `by (host)` around a pinned
              # selector for the same reason as the rules above — widening the
              # selector then evaluates each host on its own rather than letting
              # a healthy peer mask a dead one (#160).
              expr: 'count by (host) (last_over_time(rapl_power_watts{host="eq12"}[10m]))'
              instant: true
              range: false
              intervalMs: 60000
              maxDataPoints: 43200
          # dropNN, not replaceNN — a null must not become a real 0, which would
          # trip this `lt` threshold and read as a genuine partial loss while the
          # truth is that nothing came back at all. With no numeric value the
          # rule falls through to noDataState, which is Alerting on purpose.
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: B
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
          # < 3: this board's measured domain set is exactly {package-0, core,
          # uncore}. n5pro's rule below uses 1 because that machine has two
          # domains and deliberately excludes one — the counts are per-board
          # facts, not a shared constant. Detection latency has THREE terms, not
          # two: `last_over_time(...[10m])` keeps a dead domain counted for the
          # full 10 m window first, and only then do the group's 5 m `interval`
          # and `for: 5m` advance at evaluation ticks. Best case ~15 min, worst
          # case ~20 — the same arithmetic the gt-600 rule above states for
          # itself. The wide window is deliberate: it is what makes a PARTIAL
          # loss (one domain of three) legible instead of flapping.
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 3

      # n5pro (Ryzen AI 9 HX PRO 370) delivers ONE domain. The board has two —
      # package-0 and core — and `core` is EXCLUDED at the source because it
      # covers CPU0 ALONE, measured 2026-08-25 by LOAD PLACEMENT (the only test
      # that separates that from a real aggregate): under a busy-loop on
      # CPU2+14+20, package rose to 33.93 W while `core` stayed at 0.12 W; it
      # moves only when CPU0 itself is loaded. eq12's identically-named domain
      # passes the same test and IS exported, which is why this threshold is 1
      # and eq12's is 3 — the shapes are per-board and neither may be copied to
      # the other. There is no `uncore` domain on this machine at all.
      - uid: obs-rapl-power-absent-n5pro
        title: RAPL power domains stopped arriving for n5pro
        condition: C
        for: 5m
        # Alerting, not OK — same #151 reasoning as the eq12 rule above.
        noDataState: Alerting
        # A datasource that cannot be reached is not evidence of health (#108).
        execErrState: Alerting
        isPaused: false
        annotations:
          summary: RAPL power domains for host=n5pro are incomplete or absent (expected 1).
          description: |-
            The exec input can die while the agent stays healthy, so this is separate from the agent-liveness rule. On the host: `journalctl -u telegraf -n 100 | grep -i exec`, then run /usr/local/lib/telegraf/rapl_power.sh by hand — it prints one line per readable domain and nothing for one it cannot read.
            One domain is correct here: this board has package-0 and core, and core is excluded at the source because it was measured to be a single core rather than a package aggregate.
        labels:
          severity: warning
          component: metrics-pipeline
        data:
          - refId: A
            datasourceUid: P4169E866C3094E38
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              datasource:
                type: victoriametrics-metrics-datasource
                uid: P4169E866C3094E38
              # [10m] against a 60s collection interval, as above;
              # relativeTimeRange must stay >= the lookbehind.
              expr: 'count by (host) (last_over_time(rapl_power_watts{host="n5pro"}[10m]))'
              instant: true
              range: false
              intervalMs: 60000
              maxDataPoints: 43200
          # dropNN, not replaceNN — same reasoning as the eq12 rule above.
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: B
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
          # < 1, i.e. the single expected domain is gone. With one domain the
          # count can only be 1 or absent, so on this host the threshold and the
          # noDataState catch the same fault by two paths — kept in the count
          # shape anyway so the pair reads identically and so re-including a
          # domain here is a one-number edit.
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1

      # ---------------------------------------------------------------------
      # THE NATIVE AGENTS' REMAINING PER-INPUT ABSENCE OWNERS (#202): SMART,
      # sensors and ACPI fan state. Same reasoning as the RAPL pair above and the
      # container-agent pair below — the agent-liveness rules watch
      # [[inputs.system]], and each of these families is produced by a DIFFERENT
      # mechanism that can fail on its own while that stream keeps flowing.
      # roles/telegraf_agent proves all of them at DEPLOY time; between deploys
      # they had no owner at all, so a Debian upgrade that moved
      # /usr/sbin/smartctl, an hwmon module rename, or eq12's fan sysfs going
      # unreadable produced silent family loss behind a green liveness rule.
      #
      # ALL WARNING, and derived exactly as the RAPL pair's grading is: no rule in
      # this folder reads any of these families (enumerated across all seven files
      # 2026-08-25), so they are dashboards-only, and the case worth a page — the
      # agent or the machine gone — is already owned at severity critical. The
      # static guard "Assert no other rule consumes a family whose absence is only
      # a warning" in roles/services/observability/tasks/main.yml fails the deploy
      # if that ever stops being true, rather than leaving it to memory.
      #
      # NO DEEP LINKS on any of these, for the reason above the native-agent
      # rules: an unpaired __dashboardUid__ is boot-fatal for EVERY provisioned
      # rule, and "a delivery path went dark" has no one panel to point at.

      # THE ANCHOR IS smart_device_health_ok, NOT A smart_device_.+ REGEX, and
      # that is the whole design of these two rules. Measured on eq12,
      # 2026-08-25, by running `telegraf --test` under `setpriv --reuid=65534` —
      # i.e. the REAL failure mode, the unit losing its ambient capabilities so
      # smartctl opens the device and the NVMe admin ioctl is denied:
      #
      #   > smart_device,device=nvme0 exit_status=2i
      #
      # ONE field survives. The other thirteen — health_ok, temp_c,
      # percentage_used, media_errors, the lot — are gone, and so are the `model`
      # and `serial_no` tags. So a presence check over `smart_device_.+` still
      # matches (exit_status matches it) and reports healthy while the disk data
      # this exists to collect has stopped. That is not hypothetical: the deploy
      # assert in roles/telegraf_agent used exactly that regex until #207 fixed
      # it, which means it would have PASSED on the capability regression its own
      # fail_msg tells you to go and check.
      #
      # The two neighbouring failure modes are NOT silent and are deliberately not
      # this rule's job, measured in the same run: `smartctl` present but failing
      # at --scan emits NOTHING (an ordinary total absence, caught here by
      # NoData), and `smartctl` MISSING stops telegraf initialising at all, which
      # takes out system_uptime and pages via the agent rule.
      #
      # `lt 1` = "no device is reporting a real SMART read". Both hosts have
      # exactly one SMART device (the root NVMe), and there is no host_vars
      # declaration of disks to reconcile a larger count against — so unlike the
      # sensors and fan rules below this threshold is presence, not a count. THE
      # COST, stated rather than hidden: with a SECOND device installed, losing
      # one of the two would not fire this. The fix at that point is a
      # telegraf_agent_smart_expected_devices declaration in host_vars plus a
      # reconciler, added in the same change that installs the disk — not a
      # widening of this rule.
      - uid: obs-smart-metrics-absent-eq12
        title: SMART attributes stopped arriving for eq12
        condition: C
        for: 5m
        # Alerting, not OK, on the #151 test: [[inputs.smart]] runs every
        # collection interval and emits this field whenever it can read the
        # device at all, so absence is never its healthy state.
        noDataState: Alerting
        # A datasource that cannot be reached is not evidence of health (#108).
        execErrState: Alerting
        isPaused: false
        annotations:
          summary: No SMART health data for host=eq12 — the root NVMe is no longer being read.
          description: |-
            This is the family that depends on elevated privilege, and it fails QUIETLY: with the ambient capabilities gone, telegraf still emits smart_device_exit_status=2 and nothing else, so the agent stays healthy and only the real readings stop. Check, in order:
            (1) `systemctl show telegraf -p AmbientCapabilities -p NoNewPrivileges` — the pair must be cap_dac_override + cap_sys_admin;
            (2) `journalctl -u telegraf -n 100 | grep -i smart`;
            (3) `/usr/sbin/smartctl --scan` still finds the root NVMe.
            Do NOT "fix" this by moving the unit to User=root — relax the specific hardening directive that broke, with the measured failure recorded beside it (roles/telegraf_agent/README.md).
        labels:
          severity: warning
          component: metrics-pipeline
        data:
          - refId: A
            datasourceUid: P4169E866C3094E38
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              datasource:
                type: victoriametrics-metrics-datasource
                uid: P4169E866C3094E38
              # [10m] against a 60s collection interval: ten samples of headroom,
              # so a restart cannot empty the window. relativeTimeRange above must
              # stay >= this lookbehind. `by (host)` around a pinned selector so
              # widening the selector later evaluates each host on its own rather
              # than letting a healthy peer mask a dead one (#160).
              expr: 'count by (host) (last_over_time(smart_device_health_ok{host="eq12"}[10m]))'
              instant: true
              range: false
              intervalMs: 60000
              maxDataPoints: 43200
          # dropNN, not replaceNN — a null must not become a real 0, which would
          # trip this `lt` threshold and read as a genuine count while the truth is
          # that nothing came back. With no numeric value the rule falls through to
          # noDataState, Alerting on purpose.
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: B
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1

