      # eq12 ONLY — n5pro's EC publishes no cooling devices at all (measured
      # #186, docs/n5pro.md), so there is deliberately no n5pro counterpart and
      # the coverage guard keys on telegraf_agent_acpi_fan_state rather than on
      # group membership.
      #
      # THE COUNT IS THE ASSERTION, and this family is the clearest case for it in
      # the fleet: files/acpi_fan_state.sh emits NOTHING for a device it cannot
      # read rather than a fabricated zero — correct gauge semantics — so a
      # permission or sysfs change shows up as FOUR series, not as an obvious
      # absence. A presence check would stay green through 5 -> 4 -> 3 -> 1 and
      # only notice at zero. Device indices are not stable across boots, which is
      # why the count and not the device names is what is pinned.
      #
      # THIS IS BINARY STATE, NEVER RPM. No tachometer is collected on either host
      # under the default driver set (measured #186). Nothing here may be read,
      # graphed or alerted on as a fan speed, and this rule says nothing about
      # whether the fans are SPINNING — only about whether their state is being
      # collected.
      - uid: obs-fan-state-absent-eq12
        title: ACPI fan state stopped arriving for eq12
        condition: C
        for: 5m
        # Alerting, not OK, on the #151 test: the exec script runs every
        # collection interval and emits one line per readable cooling device
        # unconditionally, so absence is never its healthy state.
        noDataState: Alerting
        # A datasource that cannot be reached is not evidence of health (#108).
        execErrState: Alerting
        isPaused: false
        annotations:
          summary: Fewer than 5 ACPI fan objects reporting for host=eq12 (PNP0C0B:00-04).
          description: |-
            The script emits nothing for a device it cannot read rather than a fabricated zero, so a LOW count means devices went unreadable — this thins silently and a presence check would not see it. On the host: `grep . /sys/class/thermal/cooling_device*/type` and the matching cur_state files, then `journalctl -u telegraf -n 100 | grep -i exec`.
            This is BINARY state, not RPM — it says the fan state is being collected, nothing about whether the fans are spinning.
        labels:
          severity: warning
          component: metrics-pipeline
        data:
          - refId: A
            datasourceUid: P4169E866C3094E38
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              datasource:
                type: victoriametrics-metrics-datasource
                uid: P4169E866C3094E38
              # [10m] against a 60s interval; relativeTimeRange must stay >= it.
              expr: 'count by (host) (last_over_time(acpi_fan_state_state{host="eq12"}[10m]))'
              instant: true
              range: false
              intervalMs: 60000
              maxDataPoints: 43200
          # dropNN, not replaceNN — same reasoning as the rules above.
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: B
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
          # < 5: five ACPI fan objects on this board, PNP0C0B:00-04, measured
          # 2026-08-24 and again 2026-08-25 (cooling_device3..7). Declared in
          # host_vars as telegraf_agent_acpi_fan_expected_count, which the role's
          # own deploy assert and the static reconciler both read — this number
          # used to be hardcoded in the role and is now one fact in one place.
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 5

      # ---------------------------------------------------------------------
      # THE CONTAINER AGENT'S PER-INPUT ABSENCE OWNERS (#189).
      #
      # SEPARATE FROM obs-telegraf-metrics-absent ABOVE, for #174's measured
      # reason: that rule watches system_uptime, i.e. the AGENT stream. A single
      # input can die while the agent stays up and every other input keeps
      # flowing — telegraf logs the error once and carries on. That is not a
      # hypothetical here, it is this container's own history: no_new_privs
      # stripped the file capability off /usr/bin/ping and eight of the nine
      # ping_* fields went NO DATA while the container stayed healthy and every
      # deploy stayed green. Two producers need two liveness rules.
      #
      # WARNING, NOT CRITICAL, on both — and this is a DERIVED grading, not a
      # default. Neither family is read by any alert rule in this folder
      # (enumerated across all seven files, 2026-08-25): they feed dashboards
      # only. Nothing safety-relevant is blind while these fire, and the case
      # that IS worth a page — the agent or the host gone — is already owned at
      # severity critical by obs-telegraf-metrics-absent above. That keeps the
      # #193 fatigue posture, which demoted truenas-metrics-absent on exactly
      # this reasoning. IF A FUTURE RULE EVER READS docker_* OR ping_*, THIS
      # GRADING STOPS BEING TRUE and these rules must be re-graded; the static
      # guard "Assert no other rule reads a family whose absence owner is only a
      # warning" in roles/services/observability/tasks/main.yml is what fails the
      # deploy until that happens, rather than leaving it to memory.
      #
      # ACCEPTED COST, stated as arithmetic so nobody rediscovers it as a
      # surprise: when the whole agent dies, the agent rule AND every family rule
      # for that agent fire together. #189 asked whether to suppress the family
      # rules in that case. It cannot be done in this shape:
      # `count(family) and on() count(system_uptime{...})` returns an EMPTY
      # result when the agent is dead, which is NoData, which noDataState:
      # Alerting fires on anyway. Suppression would require noDataState: OK,
      # which destroys the family rule's own absence detection — the two are
      # mutually exclusive. So the co-fire is accepted and the SEVERITIES are
      # what keep it cheap: one page, plus emails.
      #
      # NO DEEP LINKS, for the reason spelled out above the native-agent rules: a
      # dashboard-only __dashboardUid__ is not representable and its rejection is
      # boot-fatal for ALL provisioned rules.

      # docker_n_containers is ENGINE-level (not per-container), emitted every
      # collection interval whenever [[inputs.docker]] runs at all, and it churns
      # no per-target labels — the same three properties that make system_uptime
      # and vector_uptime_seconds good absence signals. Exactly one series exists
      # (measured 2026-08-25: `count by (host) (docker_n_containers)` -> 1), so
      # the threshold is 1 and there is no partial-loss case to size for.
      #
      # This rule also happens to catch the taginclude defect that
      # obs-docker-metrics-unlabelled below owns, because a stripped host label
      # makes the host="eq12_docker" selector stop matching. That overlap is
      # harmless and deliberate — two detectors on one fault is the #174 posture,
      # and neither is a substitute for the other: the unlabelled rule sees a
      # label going wrong while the stream is healthy, this one sees the stream
      # stopping while the label is fine.
      - uid: obs-docker-metrics-absent
        title: Docker metrics stopped arriving for eq12_docker
        condition: C
        for: 5m
        # Alerting, not OK, and the #151 test settles it: [[inputs.docker]]
        # exports docker_n_containers every 60s unconditionally whenever it runs,
        # so absence is NEVER its healthy state. Contrast the rule directly below
        # — count({__name__=~"docker_.+", host=""}) — whose series only EXISTS
        # while something is broken and which is therefore correctly
        # noDataState: OK. Same file, same family, opposite answer, because the
        # question is about the SIGNAL and not about the family.
        noDataState: Alerting
        # A datasource that cannot be reached is not evidence of health (#108).
        execErrState: Alerting
        isPaused: false
        annotations:
          summary: No docker_* metrics from host=eq12_docker for over 10 minutes.
          description: |-
            The docker input can die while the agent stays healthy, so this is separate from obs-telegraf-metrics-absent. On eq12_docker: `docker logs telegraf | grep -i docker` for socket or permission errors.
            Most likely causes: the /var/run/docker.sock bind mount, or DOCKER_GID in the templated .env no longer matching the host's docker group after an image or OS bump.
        labels:
          severity: warning
          component: metrics-pipeline
        data:
          - refId: A
            datasourceUid: P4169E866C3094E38
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              datasource:
                type: victoriametrics-metrics-datasource
                uid: P4169E866C3094E38
              # [10m] against a 60s collection interval: ten samples of headroom,
              # so a telegraf restart cannot empty the window. relativeTimeRange
              # above must stay >= this lookbehind. `by (host)` around a pinned
              # selector for the same reason as every rule above — widening the
              # selector then evaluates each host on its own rather than letting
              # a healthy peer mask a dead one (#160).
              expr: 'count by (host) (last_over_time(docker_n_containers{host="eq12_docker"}[10m]))'
              instant: true
              range: false
              intervalMs: 60000
              maxDataPoints: 43200
          # dropNN, not replaceNN — a null must not become a real 0, which would
          # trip this `lt` threshold and read as a genuine count while the truth
          # is that nothing came back at all. With no numeric value the rule falls
          # through to noDataState, which is Alerting on purpose.
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: B
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
          # < 1, i.e. the single engine-level series is gone. With one series the
          # threshold and the noDataState catch the same fault by two paths; kept
          # in the count shape anyway so every family rule in this file reads
          # identically and so ONE static reconciler can check them all.
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1

      # THE ANCHOR FIELD IS THE WHOLE DESIGN OF THIS RULE, and the obvious choice
      # is wrong. [[inputs.ping]] emits NINE fields, and they do not disappear
      # together:
      #
      #   * PLUGIN CANNOT RUN (the measured #95 failure — no_new_privs makes the
      #     kernel ignore the cap_net_raw file capability on /usr/bin/ping):
      #     ping_result_code is still emitted, pinned at 2, and the other EIGHT
      #     fields stop. Recorded in files/compose.yaml beside the security_opt
      #     block, and independently visible in VictoriaMetrics: over 7 days on
      #     the retired host="homelab-telegraf" label, result_code has 7391
      #     samples against 7338 for percent_packet_loss and average_response_ms
      #     — a 53-sample window where only result_code flowed.
      #   * GENUINE 100% PACKET LOSS (the internet is down, plugin perfectly
      #     healthy): measured 2026-08-25 with a disposable `telegraf --test`
      #     against 192.0.2.1 (RFC5737 TEST-NET-1), with 8.8.8.8 in the same run
      #     as a positive control that produced all nine fields —
      #       > ping,url=192.0.2.1 packets_received=0i,packets_transmitted=10i,
      #                            percent_packet_loss=100,result_code=1i
      #     The five TIMING fields (average/minimum/maximum/standard_deviation,
      #     ttl) are gone; percent_packet_loss survives, carrying 100.
      #
      # So, per family member:
      #   ping_result_code        — survives BOTH failures. An absence rule on it
      #                             is a guard that can never fire. NOT USED.
      #   ping_average_response_ms — absent during a REAL outage. A rule on it
      #                             would page on every ISP blip and could not
      #                             distinguish that from a dead plugin. NOT USED.
      #   ping_percent_packet_loss — present during a real outage, absent only
      #                             when the plugin cannot execute. THIS ONE.
      # Do not "simplify" this selector to result_code or to a ping_.+ regex; the
      # regex has the same defect as result_code, because result_code matches it.
      #
      # THE COUNT IS THE ASSERTION, not mere presence: there are two targets
      # (8.8.8.8 and 1.1.1.1, the `urls` list under [[inputs.ping]] in
      # files/data/telegraf/telegraf.conf), and one target failing to resolve
      # while the other works thins the family 2 -> 1 rather than emptying it.
      # That threshold is reconciled against the actual urls list by a static
      # guard in roles/services/observability/tasks/main.yml, so adding a third
      # ping target FAILS the deploy until this number moves with it.
      - uid: obs-ping-metrics-absent
        title: Ping metrics stopped arriving for eq12_docker
        condition: C
        for: 5m
        # Alerting, not OK, and the #151 test settles it: the ping input runs
        # every 60s and emits percent_packet_loss whether the target answers or
        # not — including 100 during a total outage, measured above — so absence
        # is NEVER this signal's healthy state.
        noDataState: Alerting
        # A datasource that cannot be reached is not evidence of health (#108).
        execErrState: Alerting
        isPaused: false
        annotations:
          summary: Fewer than 2 ping targets reporting from host=eq12_docker (expected 8.8.8.8 and 1.1.1.1).
          description: |-
            This is the plugin failing to RUN, not the internet being down — a real outage still reports percent_packet_loss=100, which is why this rule is anchored on that field and not on ping_result_code (which survives both, pinned at 2).
            Check `docker logs telegraf | grep -i ping`. The usual cause is telegraf losing the cap_net_raw file capability on /usr/bin/ping: it is the one container in this stack deliberately WITHOUT no-new-privileges:true, because no_new_privs makes the kernel ignore file caps on exec (#95).
        labels:
          severity: warning
          component: metrics-pipeline
        data:
          - refId: A
            datasourceUid: P4169E866C3094E38
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              datasource:
                type: victoriametrics-metrics-datasource
                uid: P4169E866C3094E38
              # [10m] against a 60s interval, as above; relativeTimeRange must
              # stay >= this lookbehind. `by (host)` around a pinned selector for
              # the #160 reason. Note `count by (host)` and NOT `by (url)`: the
              # point is the NUMBER of reporting targets collapsed onto one row,
              # so that losing one of the two is a value of 1 rather than a
              # silently-missing instance.
              expr: 'count by (host) (last_over_time(ping_percent_packet_loss{host="eq12_docker"}[10m]))'
              instant: true
              range: false
              intervalMs: 60000
              maxDataPoints: 43200
          # dropNN, not replaceNN — same reasoning as the rule above.
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: B
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
          # < 2 = the two configured ping targets. LOW means one target stopped
          # reporting, which the count shape exists to make legible; empty means
          # the plugin is not running at all and falls through to noDataState.
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 2

      # ---------------------------------------------------------------------
      # WHERE TO LOOK, and it is almost certainly one word: `taginclude` under
      # [[inputs.docker]] in
      # ansible/roles/services/observability/files/data/telegraf/telegraf.conf.
      # Check that line first. The mechanism — an ALLOWLIST over the FINAL tag
      # set, applied AFTER the agent adds `host` and [global_tags] — is in this
      # file's header, and at length in telegraf.conf's own comment on that
      # line, together with the measured 448-series consequence and why losing
      # `host` matters (container_name is not unique across machines, so two
      # hosts' per-container series become label-identical and merge).
      #
      # Confirm from the query side with
      # `count by (host) ({__name__=~"docker_.+"})`: one row with an EMPTY label
      # set means the label is gone entirely — a label-less result is NOT the
      # same as one host, which is the trap that hid this defect for the life of
      # the deployment.
      - uid: obs-docker-metrics-unlabelled
        title: Docker metrics have lost their host label
        condition: C
        # 5m, not 0s: a telegraf restart produces no docker_* series at all for a
        # few seconds, which is NoData (healthy here), not a zero. The 5m is for
        # the case where a partially-collected first batch lands mid-restart.
        for: 5m
        # ######################################################################
        # noDataState: OK IS CORRECT AND MUST NOT BE "FIXED" TO Alerting.
        #
        # Read the query before changing this line. It selects docker_* series
        # that have NO host label. On a healthy system that set is EMPTY, so the
        # query returns NOTHING and the rule sits in NoData permanently. This
        # series only EXISTS while the system is broken — absence IS health, and
        # it is the #151 rule (a signal that does not exist until something goes
        # wrong cannot carry noDataState: Alerting; obs-vector-discarding-events
        # and obs-vector-component-errors are OK for exactly the same reason).
        #
        # Setting this to Alerting would page CONTINUOUSLY, forever, in perfect
        # health — and the reflex to "make the absence rule alert on absence" is
        # precisely why this comment is this long.
        #
        # WHAT THIS RULE DOES NOT COVER, STATED PLAINLY (#189). Absence of the
        # docker_* stream is a DIFFERENT fault, and it currently has NO owner.
        # obs-telegraf-metrics-absent above does not cover it: that rule watches
        # system_uptime, i.e. the AGENT stream only. If [[inputs.docker]] dies on
        # its own — socket unmounted, a permission change after an image bump,
        # the plugin erroring while the agent stays up — then every docker_*
        # series stops, system_uptime keeps flowing, the agent rule stays green,
        # THIS rule sees no unlabelled series and is therefore also green, and
        # nothing pages. Per-input death with a healthy agent is measured here,
        # not hypothetical: no_new_privs stripped setuid off /usr/bin/ping and
        # eight ping metrics went NO DATA while the container stayed healthy.
        # The fix is a SEPARATE rule (candidate: lag(docker_n_containers)), not
        # a change to this line — tracked in #189. Do not close that gap by
        # flipping this noDataState.
        # ######################################################################
        noDataState: OK
        # A datasource that cannot be reached is not evidence of health (#108).
        execErrState: Alerting
        isPaused: false
        annotations:
          summary: docker_* metrics are arriving with no host label.
          description: |-
            Telegraf's taginclude allowlist in the docker input is stripping the host tag — check that line first; without it two hosts' container series merge silently.
            Every other rule aggregates host away, so nothing else sees this.
        labels:
          severity: critical
          component: metrics-pipeline
        data:
          - refId: A
            datasourceUid: P4169E866C3094E38
            relativeTimeRange:
              from: 900
              to: 0
            model:
              refId: A
              datasource:
                type: victoriametrics-metrics-datasource
                uid: P4169E866C3094E38
              # host="" matches series where the label is ABSENT as well as
              # empty — that is the standard PromQL/MetricsQL semantics this
              # relies on, and it is what makes a stripped tag detectable at all.
              # __name__=~"docker_.+" is the non-empty matcher the selector needs
              # to be legal on its own.
              expr: 'count({__name__=~"docker_.+", host=""})'
              instant: true
              range: false
              intervalMs: 60000
              maxDataPoints: 43200
          # dropNN, not replaceNN — a null must not become 0. Here that matters
          # in the opposite direction from the rule above: replaceNN would turn
          # the healthy no-series case into a real 0 that never trips the
          # threshold, which looks identical to working. dropNN sends it to
          # noDataState instead, which is OK by design (see the block above).
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 900
              to: 0
            model:
              refId: B
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
          # > 0 — ANY unlabelled docker series is the fault. There is no
          # tolerable number of them, so there is no threshold to tune.
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 900
              to: 0
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
