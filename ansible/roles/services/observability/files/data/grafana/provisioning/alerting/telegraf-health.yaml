          description: |-
            A LOW count means chips went unreadable, not that the metric is missing — which is why this is a count and not a presence check. On the host: `sensors` to see what lm-sensors still enumerates, then `journalctl -u telegraf -n 100 | grep -i sensors`. A kernel upgrade that renamed or stopped loading an hwmon module is the usual cause.
            Extra chips never fire this rule: the comparison is one-sided on purpose, because a forced it87 binding on this board has added series before.
        labels:
          severity: warning
          component: metrics-pipeline
        data:
