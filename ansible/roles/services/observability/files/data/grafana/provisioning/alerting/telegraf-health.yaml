      # THE SENSOR RULES ARE A COUNT, AND THE THRESHOLD IS A PER-BOARD FACT that
      # lives in host_vars as telegraf_agent_expected_sensor_series. The static
      # reconciler in roles/services/observability/tasks/main.yml asserts the two
      # agree AND that the comparison is `lt`, so a chip change has to be made in
      # both places in one commit.
      #
      # WHY `lt` AND NOT AN EQUALITY, measured rather than assumed: the sensor set
      # can GROW with no change to this repo. `count_over_time(...[7d])` on eq12
      # 2026-08-25 returned the seven steady series at 1050 samples each PLUS two
      # more at 1 sample each — it8622-isa-0a30 temp1/temp2, the one-off forced
      # it87 binding recorded in docs/eq12.md. An instant count() hides that
      # entirely. An equality would have paged the operator for loading a module;
      # `lt` is one-sided, so extra chips are free and only LOSSES fire.
      #
      # The metric NAMES carry a digit — sensors_temp1_input .. sensors_temp5_input
      # — because remove_numbers=false in telegraf.conf.j2 keeps eq12's core_0..3
      # from merging into one series, and that also keeps the digit in the field
      # name. There is no `sensors_temp_input` in the store and there never was,
      # which is why this is a __name__ regex and not a literal.
      - uid: obs-sensors-metrics-absent-eq12
