            datasourceUid: P4169E866C3094E38
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              datasource:
                type: victoriametrics-metrics-datasource
                uid: P4169E866C3094E38
              # [10m] against a 60s interval; relativeTimeRange must stay >= it.
              expr: 'count by (host) (last_over_time({__name__=~"sensors_temp[0-9]+_input", host="eq12"}[10m]))'
              instant: true
              range: false
              intervalMs: 60000
              maxDataPoints: 43200
          # dropNN, not replaceNN — same reasoning as the rules above.
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: B
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
          # < 7: coretemp-isa-0000 package_id_0 + core_0..core_3 (five),
          # acpitz-acpi-0 temp1, nvme-pci-0300 composite. Measured 2026-08-25 and
          # declared in host_vars as telegraf_agent_expected_sensor_series.
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
