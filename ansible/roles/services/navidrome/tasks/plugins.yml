---
# Musixmatch lyrics plugin (#347), post-deploy half: what NAVIDROME loaded is the
# evidence, read from its own plugin table (in-container sqlite3, as claim.yml does).
# The install half (pinned get_url) runs before the deploy in main.yml, so a first start
# already finds the file. Enabling the plugin and approving its permissions is a one-time
# UI step (README "Plugins"); until then the plugin sits in the table disabled.
# Skipped under --check (main.yml): every read here needs the running container.

# Startup sync, or the autoreload watcher (2 s debounce) after a replaced file, writes
# the row; retry until it carries the pinned file's hash.
- name: Read the Musixmatch plugin as Navidrome loaded it
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - navidrome
      - sqlite3
      - -readonly
      - -json
      - "{{ navidrome_db_container_path }}"
      - >-
        select sha256, enabled, allow_write_access,
        json_extract(manifest, '$.permissions.http.requiredHosts') as hosts,
        (select group_concat(key, ',') from (select key from
        json_each(manifest, '$.permissions') order by key)) as permissions,
        {{ navidrome_musixmatch_setting_columns | join(', ') }}
        from plugin where id = '{{ navidrome_musixmatch_id }}'
  vars:
    # One column per checked setting, named after it; JSON type 'false'/'true', or
    # 'unset' when the setting was never saved (the plugin then uses its default).
    # config is '' (not NULL) until the settings are first saved, and json_type('') is an
    # error, hence nullif (measured on the first apply).
    navidrome_musixmatch_setting_columns: >-
      {{ (navidrome_musixmatch_analytics_settings + [navidrome_musixmatch_sidecar_setting])
         | map('regex_replace', '^(.*)$', "coalesce(json_type(nullif(config, ''), '$.\1'), 'unset') as \1")
         | list }}
  register: navidrome_musixmatch_probe
  changed_when: false
  # -json prints NOTHING for zero rows, hence the '[]' default.
  until: >-
    navidrome_musixmatch_probe.rc == 0
    and (navidrome_musixmatch_probe.stdout | default('[]', true) | from_json | length) == 1
    and (navidrome_musixmatch_probe.stdout | from_json | first).sha256 == navidrome_musixmatch_sha256
  retries: 12
  delay: 5

- name: Keep the Musixmatch plugin's row
  ansible.builtin.set_fact:
    navidrome_musixmatch_row: "{{ navidrome_musixmatch_probe.stdout | from_json | first }}"

# The allowlist is the plugin's whole HTTP reach and no admin setting narrows it, so a
# version bump that adds a host must fail here until defaults lists it deliberately. The
# EXACT host list also rules out a `*` or IP/CIDR entry, the only things that would let
# the netguard pass a loopback dial (so the extra_hosts fence depends on this clause).
# The permission KEYS are pinned too: websocket carries its own host list.
- name: Assert the loaded plugin is the pinned file with the reviewed permissions
  ansible.builtin.assert:
    that:
      - navidrome_musixmatch_row.sha256 == navidrome_musixmatch_sha256
      - (navidrome_musixmatch_row.hosts | from_json | sort) == (navidrome_musixmatch_required_hosts | sort)
      - navidrome_musixmatch_row.permissions == (navidrome_musixmatch_permissions | sort | join(','))
      # Strict: `| int` would turn a non-0/1 value into 0 (disabled) and skip the next assert.
      - navidrome_musixmatch_row.enabled in [0, 1]
      - navidrome_musixmatch_row.allow_write_access == 0
      - navidrome_musixmatch_row[navidrome_musixmatch_sidecar_setting] != 'true'
    fail_msg: >-
      Navidrome's {{ navidrome_musixmatch_id }} row does not match the reviewed pin:
      permissions {{ navidrome_musixmatch_row.permissions }} (expected
      {{ navidrome_musixmatch_permissions | sort | join(',') }}), http allowlist
      {{ navidrome_musixmatch_row.hosts }} (expected {{ navidrome_musixmatch_required_hosts | sort }}),
      enabled={{ navidrome_musixmatch_row.enabled }},
      allow_write_access={{ navidrome_musixmatch_row.allow_write_access }} (must be 0),
      {{ navidrome_musixmatch_sidecar_setting }}={{ navidrome_musixmatch_row[navidrome_musixmatch_sidecar_setting] }}
      (must not be true). Review a new permission or host (analytics endpoints get the
      loopback treatment, see defaults) before updating the pins; untick "Allow write
      access" in Settings > Plugins.
    quiet: true

# Affirmative: an ENABLED plugin passes only when every analytics setting is stored as a
# JSON false. Unset means the plugin default, which is ON, so it fails like true does.
- name: Assert the plugin's analytics are off once it is enabled
  ansible.builtin.assert:
    that:
      - >-
        navidrome_musixmatch_row.enabled == 0
        or (navidrome_musixmatch_analytics_settings
            | map('extract', navidrome_musixmatch_row)
            | reject('equalto', 'false') | list | length) == 0
    fail_msg: >-
      {{ navidrome_musixmatch_id }} is enabled with analytics not explicitly off
      ({% for s in navidrome_musixmatch_analytics_settings %}{{ s }}={{ navidrome_musixmatch_row[s] }}
      {% endfor %}). The loopback entry keeps them from leaving the container, but switch
      both off in Settings > Plugins > Musixmatch Plugin > Analytics and save.
    quiet: true

- name: Report a plugin still waiting for the one-time UI enable
  ansible.builtin.debug:
    msg: >-
      {{ navidrome_musixmatch_id }} {{ navidrome_musixmatch_version }} is installed but
      disabled. In Settings > Plugins: switch both Analytics settings off, save, approve the
      permissions for ONE library (never "Allow write access"), enable it, then redeploy
      so this check sees it enabled (README "Plugins").
  when: navidrome_musixmatch_row.enabled == 0

- name: Read the container's hosts file
  ansible.builtin.command:
    argv: [docker, exec, navidrome, cat, /etc/hosts]
  register: navidrome_container_hosts
  changed_when: false

# The resolver returns the addresses of EVERY line naming the host, and the dialer falls
# through to the next one when the netguard refuses loopback. So: the host must appear on
# exactly one (uncommented) line, and that line's address must be 127.0.0.1. Go's
# resolver matches names case-insensitively and ignores a trailing dot; so does this.
- name: Assert the analytics host resolves only to loopback inside the container
  ansible.builtin.assert:
    that:
      - navidrome_analytics_host_addrs == ['127.0.0.1']
    fail_msg: >-
      The navidrome container's /etc/hosts maps {{ navidrome_musixmatch_analytics_host }}
      to {{ navidrome_analytics_host_addrs }}; it must map it to 127.0.0.1 only (compose
      extra_hosts), or the plugin's analytics could leave the host.
    quiet: true
  vars:
    navidrome_analytics_host_addrs: >-
      {{ navidrome_container_hosts.stdout_lines
         | map('regex_replace', '#.*$', '')
         | select('search', '(?i)\s' ~ (navidrome_musixmatch_analytics_host | regex_escape) ~ '\.?(\s|$)')
         | map('split') | map('first') | list }}
