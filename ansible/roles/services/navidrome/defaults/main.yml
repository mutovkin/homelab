---
# Navidrome (#342). See README.md and
# docs/plans/2026-11-16-2035-feat-navidrome-music-streaming-plan.md.

# Published host port (the container listens on 4533 too).
navidrome_port: 4533

# Container user. 3000:3000 owns the library files on TrueNAS, and the CT 201 shares
# have no Mapall, so this is the UID TrueNAS checks reads against.
navidrome_uid: 3000
navidrome_gid: 3000

# CT-201-LOCAL state, deliberately OUTSIDE the deploy dir: _deploy rsyncs that dir with
# delete: true. Created by tasks/main.yml (never via svc_data_dirs, which would hand
# them back to root on every run).
navidrome_root_dir: "{{ data_mount }}/navidrome"
navidrome_data_dir: "{{ navidrome_root_dir }}/data"
navidrome_backup_dir: "{{ navidrome_root_dir }}/backup"
# Pre-deploy backups (taken by the role, not the schedule) live in their own subdir so
# the freshness check reads only what the 03:00 schedule wrote, and the schedule's own
# pruning never touches them.
navidrome_predeploy_dir: "{{ navidrome_backup_dir }}/predeploy"
navidrome_predeploy_retention: 5
# The same directory as seen INSIDE the container (it is under the /backup bind). The
# role's assert reads the host side, so a value that points the backup elsewhere fails
# the deploy — which is how the assert was falsified (#342 review).
navidrome_predeploy_container_path: /backup/predeploy

# TrueNAS exports (one share per library, Networks 10.99.99.3/32, read-only, no Mapall;
# README.md "TrueNAS shares"). Each value is the volume's device path AND the exact
# first field of its `showmount -e` line, which the preflight and the heal match.
navidrome_nfs_exports:
  lossless: /mnt/vault/media/music/lossless
  compressed: /mnt/vault/media/music/compressed
# Container mount point of each library, keyed like navidrome_nfs_exports.
navidrome_library_mounts:
  lossless: /music/lossless
  compressed: /music/compressed

# Built-in backup: 03:00 in `timezone`, ahead of watchtower's 04:30 run in
# `watchtower_timezone` (asserted equal). All three ND_BACKUP_* must be set or Navidrome
# silently clears the schedule.
navidrome_backup_schedule: "0 3 * * *"
navidrome_backup_count: 14
# Freshness: the newest scheduled backup must be younger than this on a claimed instance.
navidrome_backup_max_age_hours: 26

# Hourly quick scan (the file watcher is off: inotify is blind to NFS-server-side changes).
navidrome_scan_schedule: "@every 1h"
# Cap concurrent ffmpeg transcodes (the docs' ffmpeg DoS guidance; default 0 = unlimited).
navidrome_transcoding_max_concurrent: 4

# Scan exclusions, written as `.ndignore` at the root of EACH library (Navidrome has no
# config-level exclude: the file is the only mechanism, gitignore syntax, case-sensitive,
# inherited by every folder below). The Lyrion counterpart is lms_server_prefs.ignoreDirRE.
# Measured 2026-11-17 (counts only): `_attic` sits once at each library root and holds
# 5379 audio files with no stars or plays. Every folder carrying one of the EXACT names
# below holds 0 audio files in both libraries (cue sheets, logs, scans, artwork). Album
# folders are always `<year> - <title>`, so an exact bare name is never an album. Never
# use a substring/wildcard pattern (`*scan*`, `*cover*`): it would hide real albums whose
# titles contain those words (measured, counts only).
# NO trailing slash: the scanner tests each folder as `Artist/Album/scans` (no slash), so
# `scans/` never matches the folder itself, only the files inside it. The folder is still
# walked and stays listed (measured 2026-11-17: 1129 `scans` folders live after a full
# scan). `scans` matches the folder, so the scanner skips it entirely.
# The role ASSERTS the shape affirmatively: every entry must be a literal folder name,
# optionally `/`-anchored (root of the library only), no trailing slash, made of
# letters, digits, space, `_`, `.`, `-` (^/?[A-Za-z0-9_ .-]+$). That rejects wildcards (`*` or a bare `/` would hide the WHOLE
# library), blank or `#`/`!` lines (an .ndignore with no pattern also hides everything),
# and the regex metacharacters go-gitignore passes to a Go regexp unescaped.
navidrome_scan_ignore:
  - /_attic
  - _album_info
  - extras
  - Extra
  - scans
  - Scans
  - scan
  - Scan
  - Covers
  - covers
  - COVERS
  - Cover
  - cover
  - Cover Art
  - Artwork
  - Artworks
  - artwork
  - Art
  - art
  - INFO
  - Info
  - info
  - Technical
# The Proxmox host whose read-write NFS mount of the music dataset root writes those
# files (the CT 201 shares are read-only), and that mount's proxmox_nfs_mounts name.
navidrome_scan_ignore_writer: n5pro
navidrome_scan_ignore_mount: music

# Musixmatch lyrics plugin (#347): installed by tasks/main.yml (pinned get_url), verified
# after the deploy by tasks/plugins.yml. Navidrome derives a plugin's ID from its
# FILENAME (<id>.ndp), and ND_LYRICSPRIORITY names that ID, so the file is always written
# as `<navidrome_musixmatch_id>.ndp`. Watchtower never touches plugins: bump version +
# sha256 together, after `gh attestation verify` of the downloaded asset (README
# "Plugins"; the release's .sha256 sits beside the binary and proves no origin).
# A new file disables the plugin in Navidrome until it is re-enabled (README "Plugins").
navidrome_plugins_dir: "{{ navidrome_data_dir }}/plugins"
navidrome_musixmatch_id: navidrome-musixmatch-plugin
navidrome_musixmatch_version: 0.5.0
navidrome_musixmatch_sha256: bd1b636595a44bbeaae7d7862a5ea4b4bdec594210b80057d2bb2a2a710e9be6
navidrome_musixmatch_url: >-
  https://github.com/Myzel394/navidrome-musixmatch-plugin/releases/download/v{{
  navidrome_musixmatch_version }}/navidrome-musixmatch-plugin.ndp
# The manifest's http allowlist, exactly (Navidrome 0.64.2 has no admin override: the
# plugin may reach every host listed here). The role asserts the LOADED manifest lists
# exactly these, so a version bump that adds a host fails until it is reviewed here.
navidrome_musixmatch_required_hosts:
  - apic-appmobile.musixmatch.com
  - apic-desktop.musixmatch.com
  - bugs.myzel394.app
  - www.musixmatch.com
# The manifest's permission KEYS, exactly. The host check above covers http only; a
# version that adds websocket (its own host list), scheduler, storage or taskqueue must
# fail too, and Navidrome keeps the old grants when the file changes.
navidrome_musixmatch_permissions: [cache, http, library]
# The maintainer's analytics endpoint. Its two settings default to ON and failed lookups
# send artist, title, album, MusicBrainz ID and sanitized logs, so the container
# resolves it to loopback (compose extra_hosts): Navidrome 0.64.2's plugin netguard
# refuses a NAMED host that resolves to a loopback address (argued from source, not yet
# seen refusing live). The role also asserts both settings are off once it is enabled.
navidrome_musixmatch_analytics_host: bugs.myzel394.app
navidrome_musixmatch_analytics_settings:
  - analytics_share_errors
  - analytics_share_metrics
# Writes fetched lyrics next to the track. Default OFF in the plugin; it must never be
# stored as true (the libraries are read-only mounts as well).
navidrome_musixmatch_sidecar_setting: write_fetched_lyrics_as_sidecar_file
# Navidrome 0.64.2's default order with the plugin LAST: sidecar files and embedded
# lyrics always win; Musixmatch is asked only when the library has none.
navidrome_lyrics_priority: ".ttml,.yaml,.yml,.elrc,.lrc,.srt,.txt,embedded,{{ navidrome_musixmatch_id }}"

# Seconds the boot heal waits for both exports before giving up (lms uses the same).
navidrome_nfs_heal_max_wait: 600

# In-container database path the claim probe reads. Overridable ONLY to falsify the
# fail-closed path (plan U4): a nonexistent path must withhold the NPM grant.
navidrome_db_container_path: /data/navidrome.db
navidrome_claim_probe_db: "{{ navidrome_db_container_path }}"
# The post-deploy probe alone can be pointed elsewhere with
# -e navidrome_claim_probe_db_post=<path>, to prove the post-deploy render REVOKES (a
# deploy that starts claimed and ends on an empty database). Never set it in inventory.

# Firewall for the published port (shared role nft_scoped_fw). DELIBERATELY EMPTY: the
# allowlist is per-host in inventory/host_vars/<host>/vars.yml (the #140 rationale).
#   always: sources admitted in every state (the operator subnet — how the first admin
#           is created over the LAN)
#   staged: sources admitted ONLY once the user table has at least one row (NPM's
#           address). An empty instance therefore fails closed at NPM (plan KTD4).
navidrome_firewall:
  always: []
  staged: []
