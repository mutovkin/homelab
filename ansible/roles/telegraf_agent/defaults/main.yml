---
# Native telegraf metrics agent for the physical Proxmox hosts (#186).
# VERSION + CHECKSUM PINNED IN ONE PLACE, bumped deliberately — get_url hashes the
# on-disk file, skips on match, re-downloads on mismatch; NO stat-exists gate
# (CLAUDE.md). sha256 verified against the checksum table in the v1.39.3 GitHub
# release notes AND the downloaded artefact, 2026-08-24. 1.39.3 is also what the
# eq12_docker telegraf CONTAINER runs today — a coincidence of timing, not a
# mechanism (the container floats on :latest; this pin does not).
telegraf_agent_version: "1.39.3"
telegraf_agent_deb_sha256: "5e61a873cc488b216ac07d6c7c2a730ce8e78d44655a37ceb24ccd29bba796c7"
telegraf_agent_deb_url: "https://dl.influxdata.com/telegraf/releases/telegraf_{{ telegraf_agent_version }}-1_amd64.deb"

# Cached outside /tmp so a converged re-run is cheap (vector_agent precedent).
telegraf_agent_deb_cache_dir: /var/cache/telegraf
telegraf_agent_deb_filename: "telegraf_{{ telegraf_agent_version }}-1_amd64.deb"
telegraf_agent_deb_path: "{{ telegraf_agent_deb_cache_dir }}/{{ telegraf_agent_deb_filename }}"

# Controller-side cache: the controller fetches once and ships to each host —
# kept even though both hypervisors currently reach dl.influxdata.com (measured
# 2026-08-24), because n5pro's github refusal proved upstream policy can be
# selective and the two-leg shape costs nothing (vector_agent precedent).
telegraf_agent_controller_cache: "{{ lookup('env', 'HOME') }}/.cache/homelab/telegraf_agent"

# Export eq12's five binary ACPI fan objects (0/1 STATE, never RPM). Default off;
# true only in host_vars/eq12/vars.yml. `| bool` at every use site — a quoted
# "false" from host_vars is a truthy string (vector_agent precedent).
telegraf_agent_acpi_fan_state: false

# How many fan objects that host must deliver, asserted for EQUALITY against
# VictoriaMetrics. 0 here means "not declared": the role refuses to run with fan
# state enabled and a count of 0, because `count == 0` would be satisfied by an
# empty result — a guard that reads green while nothing arrives, which is the
# same trap telegraf_agent_rapl_expected_domains guards against below.
telegraf_agent_acpi_fan_expected_count: 0

# How many sensor temperature SERIES this host must deliver, asserted for
# EQUALITY against VictoriaMetrics and reconciled against the host's
# obs-sensors-metrics-absent-<host> threshold by a static guard in the
# observability role. Per-BOARD, never copied between hosts: eq12 has 7 across 3
# chips, n5pro 9 across 8. Must be non-zero on every host in this group, for the
# same reason as the fan count above — the role asserts that.
#
# The ALERT RULE compares `lt` while this deploy assert compares EQUALITY, and
# the asymmetry is deliberate. A sensor set can GROW without any change to this
# repo (a forced it87 binding added two series on eq12 for one collection
# interval, measured 2026-08-25), and paging for a module load would be wrong —
# but a deploy is exactly the moment to notice that the declared model no longer
# matches the machine, so the deploy is strict and the alert is one-sided.
telegraf_agent_expected_sensor_series: 0

# RAPL package power in WATTS via files/rapl_power.sh (#194) — both physical
# hosts expose /sys/class/powercap and load intel_rapl_msr + intel_rapl_common
# (yes, on the AMD box too), and the unit's ambient CAP_DAC_OVERRIDE was measured
# to read the root-only `energy_uj`. Default TRUE because that is true of every
# host in this group; `| bool` at every use site (a host_vars "false" is a truthy
# string). The exec script — not [[inputs.intel_powerstat]] — for two measured
# reasons recorded in the script header and in README.md.
telegraf_agent_rapl_power: true

# Domain NAMES to exclude at the source, passed to the script as arguments. Empty
# fleet-wide; n5pro passes `core`, whose powercap subdomain was measured — by
# LOAD PLACEMENT, the only test that discriminates — to cover CPU0 alone rather
# than the package's cores: it stays at 0.12 W while package climbs 28 W under a
# three-core load containing no CPU0. eq12's identically-named domain passes the
# same test and IS exported. Coverage is a property of the board, never of the
# name — measure it per host. Full tables in each host's host_vars, README.md
# and docs/{eq12,n5pro}.md.
#
# Values reach a TOML double-quoted string in telegraf.conf.j2, so the role
# asserts their shape before templating (a `"` would break the whole config
# parse, whitespace would silently split one exclusion into two).
telegraf_agent_rapl_exclude_domains: []

# The EXACT domain set this host must deliver, asserted for equality (not
# superset) against VictoriaMetrics at the end of the deploy — so an excluded
# domain reappearing FAILS just as loudly as one going missing. Must be non-empty
# on every host with telegraf_agent_rapl_power enabled: an empty list would make
# the equality trivially true against an empty result, i.e. a guard that reads
# green while nothing arrives. The role asserts that too.
telegraf_agent_rapl_expected_domains: []

# Features the sensors input must EXCLUDE AT THE SOURCE — readings the chip
# fabricates rather than measures (n5pro: amdgpu's vddgfx/vddnb, 0.000 V). This
# is deliberately INDEPENDENT of telegraf_agent_forbidden_test_output below,
# which is the PROOF list verified against `telegraf --test`'s own output: one
# shapes the config, the other verifies the result, and one variable meaning both
# made a host unable to prove an exclusion it did not also perform (or the
# reverse). The two will usually name the same features — keeping them in sync is
# a deliberate per-host act, not something the role infers (#186 review round).
telegraf_agent_sensors_tagdrop_features: []

# Per-host proof lists for the pre-flight `telegraf --test` (host_vars). The
# expected list MUST be non-empty for every host in the group — an empty list
# would turn the input-output proof into `assert: true`.
telegraf_agent_expected_test_output: []
telegraf_agent_forbidden_test_output: []

# Let a restarted telegraf run long enough to crash on a bad config before the
# liveness assert reads it (same reasoning/value as vector_agent).
telegraf_agent_settle_seconds: 15
