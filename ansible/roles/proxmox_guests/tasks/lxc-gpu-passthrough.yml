---
# Configure GPU device sharing for an LXC container
#
# Bind-mounts /dev/dri (VAAPI hw encoding/decoding) and /dev/kfd (ROCm compute)
# from the Proxmox host into the LXC container. This runs on the HOST and
# modifies /etc/pve/lxc/<vmid>.conf.
#
# Prerequisites (managed by proxmox_host role, gpu_sharing.enabled):
#   1. pve-firmware package installed
#   2. amdgpu kernel module loaded (inbox in kernel 6.17+)
#   3. udev rules deployed (/etc/udev/rules.d/70-amdgpu.rules)
#
# ROCm userspace is installed inside the LXC by the docker_host role
# (configure-guests.yml) — not on the Proxmox host.
#
# Reference: docs/n5pro.md § GPU Passthrough

- name: "Verify /dev/dri exists on host — CT {{ item.vmid }}"
  ansible.builtin.stat:
    path: /dev/dri
  register: dev_dri
  failed_when: not dev_dri.stat.exists

- name: "Check if /dev/kfd exists on host (ROCm) — CT {{ item.vmid }}"
  ansible.builtin.stat:
    path: /dev/kfd
  register: dev_kfd

- name: "Get /dev/kfd major:minor numbers in decimal — CT {{ item.vmid }}"
  ansible.builtin.shell: "read -r major minor < <(stat -c '%t %T' /dev/kfd) && printf '%d:%d' \"0x$major\" \"0x$minor\""
  args:
    executable: /bin/bash
  register: dev_kfd_major_minor
  changed_when: false
  # Read-only. Must run in --check: skipped, the lineinfile below renders
  # "lxc.cgroup2.devices.allow: c  rwm" with an empty device number and reports a
  # false pending diff on every dry run.
  check_mode: false
  when: dev_kfd.stat.exists

# A blank or malformed derivation would otherwise be written verbatim as
# "lxc.cgroup2.devices.allow: c  rwm" — an invalid cgroup rule in a live CT's
# config, appended fresh on every run because it never matches the regexp (#98).
- name: "Assert /dev/kfd major:minor is well-formed — CT {{ item.vmid }}"
  ansible.builtin.assert:
    that:
      - dev_kfd_major_minor.stdout | default('') is match('^\d+:\d+$')
    fail_msg: >-
      /dev/kfd major:minor derivation returned
      '{{ dev_kfd_major_minor.stdout | default('') }}' — refusing to write a malformed
      cgroup allow line to /etc/pve/lxc/{{ item.vmid }}.conf (#98).
  when: dev_kfd.stat.exists

# Each managed line is keyed by a regexp that matches THAT line and nothing
# else, so a changed value (the KFD major:minor is derived at runtime) rewrites
# in place instead of appending a duplicate. Without keying, every drifted value
# stacked a new line and tripped the `pct reboot` below (#98).
- name: "Add GPU DRI passthrough to LXC config — CT {{ item.vmid }}"
  ansible.builtin.lineinfile:
    path: "/etc/pve/lxc/{{ item.vmid }}.conf"
    line: "{{ dri_line.line }}"
    regexp: "{{ dri_line.regexp }}"
  loop:
    - line: "lxc.cgroup2.devices.allow: c 226:* rwm"
      regexp: '^lxc\.cgroup2\.devices\.allow: c 226:\* rwm$'
    - line: "lxc.mount.entry: /dev/dri dev/dri none bind,optional,create=dir"
      regexp: '^lxc\.mount\.entry: /dev/dri dev/dri '
  loop_control:
    loop_var: dri_line
  register: lxc_dri_update

# The allow regexp is deliberately numeric-only (\d+:\d+): the DRI allow line
# above is "c 226:* rwm", so it cannot be hijacked by this key.
- name: "Add GPU KFD passthrough to LXC config — CT {{ item.vmid }}"
  ansible.builtin.lineinfile:
    path: "/etc/pve/lxc/{{ item.vmid }}.conf"
    line: "{{ kfd_line.line }}"
    regexp: "{{ kfd_line.regexp }}"
  loop:
    - line: "lxc.cgroup2.devices.allow: c {{ dev_kfd_major_minor.stdout | default('') }} rwm"
      regexp: '^lxc\.cgroup2\.devices\.allow: c \d+:\d+ rwm$'
    - line: "lxc.mount.entry: /dev/kfd dev/kfd none bind,optional,create=file"
      regexp: '^lxc\.mount\.entry: /dev/kfd dev/kfd '
  loop_control:
    loop_var: kfd_line
  when: dev_kfd.stat.exists
  register: lxc_kfd_update

- name: "Restart LXC to apply GPU passthrough — CT {{ item.vmid }}"
  ansible.builtin.command: "pct reboot {{ item.vmid }}"
  changed_when: true
  when: (lxc_dri_update.changed or (lxc_kfd_update is defined and lxc_kfd_update.changed))
