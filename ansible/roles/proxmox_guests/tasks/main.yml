---
# Provision VMs and LXC containers on a Proxmox host.
#
# Uses community.proxmox.proxmox_kvm for VMs and community.proxmox.proxmox for
# LXCs, but both are pinned CREATE-ONLY via `update: false` — they are not
# idempotent updaters, and left to their defaults the LXC module rewrites an
# existing container's whole config on every run (see the comments on each
# module task). Everything that converges an EXISTING guest is an explicit
# reconcile task in this file: cores/memory, startup/onboot, NICs, LXC features,
# and the cluster PCI mappings. Anything not on that list is create-time only.

# --- Guest definition schema guard ---
#
# This repo's recurring failure class is the var that LOOKS like configuration
# and is consumed by nothing: `nfs=1` as an LXC feature key (#86),
# `monitor-only=true` without `watchtower.enable` (#83), `proxmox_bridge` itself
# before #87 wired it. Each was green for the deployment's whole life. A typo in
# a guest definition (`ballon: 2048`, `scsi_hw:`) lands in exactly the same
# place: no module ever reads it, nothing fails, and the operator believes the
# value applied.
#
# So the allowed key sets below are the role's read surface, derived from what
# the tasks in this file actually reference (`item.<key>` plus the
# selectattr/rejectattr filters on `started`, `os`, `net`, `name`, `nfs_enabled`
# and `gpu_sharing`). Adding a key to a guest definition means teaching the role
# to read it — and therefore adding it here in the same change.
- name: Assert VM definitions use only keys this role reads
  ansible.builtin.assert:
    that:
      - item.keys() | difference(proxmox_vm_allowed_keys) | length == 0
    fail_msg: >-
      VM {{ item.vmid | default('<no vmid>') }} declares
      {{ item.keys() | difference(proxmox_vm_allowed_keys) | join(', ') }},
      which is consumed by nothing in the proxmox_guests role — a typo, or a
      field the role was never taught to read. Either way it would silently do
      nothing. Fix the spelling, or add the key to both the role and this list.
  vars:
    proxmox_vm_allowed_keys:
      - vmid
      - name
      - cores
      - sockets
      - memory
      - bios
      - machine
      - scsihw
      - vga
      - scsi
      - agent
      - balloon
      - cpu
      - usb
      - localtime
      - tablet
      - net
      - net_bridge
      - hostpci
      - efidisk0
      - ide
      - onboot
      - started
      - startup
      - tags
      - description
  loop: "{{ proxmox_vms }}"
  loop_control:
    label: "VM {{ item.vmid | default('?') }} — schema"

- name: Assert LXC definitions use only keys this role reads
  ansible.builtin.assert:
    that:
      - item.keys() | difference(proxmox_lxc_allowed_keys) | length == 0
    fail_msg: >-
      CT {{ item.vmid | default('<no vmid>') }} declares
      {{ item.keys() | difference(proxmox_lxc_allowed_keys) | join(', ') }},
      which is consumed by nothing in the proxmox_guests role — a typo, or a
      field the role was never taught to read. Either way it would silently do
      nothing. Fix the spelling, or add the key to both the role and this list.
  vars:
    proxmox_lxc_allowed_keys:
      - vmid
      - hostname
      - os
      - ostemplate
      - cores
      - memory
      - swap
      - storage
      - root_disk_size
      - mounts
      - bind_mounts
      - hookscript
      - netif
      - net_bridge
      - nesting
      - nfs_enabled
      - unprivileged
      - gpu_sharing
      - onboot
      - started
      - startup
      - tags
      - description
  loop: "{{ proxmox_lxcs }}"
  loop_control:
    label: "CT {{ item.vmid | default('?') }} — schema"

# --- LXC template auto-resolution ---
# LXC definitions can use `os: ubuntu-24.04` instead of a hardcoded ostemplate.
# This pre-task resolves the latest available template for each OS, downloads
# it if missing, and builds a lookup dict (resolved_templates) for provisioning.
#
# WHY AUTO-RESOLVE AT ALL, when the TrueNAS ISO right below is a hard version +
# sha256 pin (#157)? Because the two downloads are not the same kind of object.
# The ISO is a one-shot ~2 GB fetch over plain HTTPS from a vendor CDN with no
# index and no signature, consumed once at install; nothing but the pinned hash
# stands between a corrupt or swapped file and a VM you then trust. LXC
# templates come from `pveam`, whose index and payloads Proxmox itself fetches
# and verifies against its signed appliance list, are re-resolved from that
# index on every run, and are consumed only at CREATE time — an unpinned
# template can therefore only ever affect a guest being built from scratch,
# where "latest security-patched point release of the declared OS" is the
# behaviour we actually want. Pinning them would add a second fleet-wide bump
# chore whose staleness is invisible until a rebuild. So: keep auto-latest,
# but stop letting SORT ORDER pick the artefact.
- name: Refresh Proxmox appliance list
  ansible.builtin.command: pveam update
  changed_when: false
  check_mode: false  # read-only; must run in --check so template resolution works

- name: Collect unique OS names from LXC definitions
  ansible.builtin.set_fact:
    lxc_os_names: "{{ proxmox_lxcs | selectattr('os', 'defined') | map(attribute='os') | unique | list }}"

# The host's architecture must be a KEY in the map, not a `| default('amd64')`
# fallback. A silent default is how this repo keeps shipping inert config: on an
# unmapped host it would quietly hand every guest amd64 templates and the
# failure would surface as an unbootable container, not as a bad variable. Fail
# here, by name, with the fix in the message.
- name: Assert this host's architecture maps to a Proxmox template architecture
  ansible.builtin.assert:
    that:
      - ansible_facts['architecture'] in proxmox_template_arch_map
    fail_msg: >-
      ansible_facts.architecture is '{{ ansible_facts['architecture'] }}',
      which has no entry in
      proxmox_template_arch_map ({{ proxmox_template_arch_map | dictsort
      | map('join', ' -> ') | join(', ') }}). LXC template selection matches the
      arch column of `pveam available` exactly, so it cannot proceed without
      knowing what this host's arch is CALLED there. Add the mapping to
      proxmox_guests/defaults/main.yml.
  when: lxc_os_names | length > 0

# Selection matches the ARCH COLUMN, it does not hope for a sort order (#157).
#
# `pveam available --section system` prints three whitespace-separated columns:
# section, template name, arch. Upstream published an arm64 debian-13 alongside
# the amd64 one, and the old pipeline was `grep <pattern> | tail -1` — so on this
# amd64 fleet `tail -1` picked `debian-13-standard_13.6-1_arm64.tar.zst` purely
# because "arm64" sorts after "amd64". PVE creates the container happily with
# `arch: arm64`; it then fails to boot with `Exec format error - Failed to exec
# "/sbin/init"`, and only on a from-scratch build — the same rebuild-path
# landmine class as #127/#148. Measured on n5pro 2026-08-21.
#
# One awk, no grep, deliberately: with `set -o pipefail` a grep that matches
# nothing would abort the task with a bare rc=1 instead of letting the explicit
# `Fail if OS template resolution failed` task below report WHICH os could not be
# resolved. awk exits 0 on no match, so "no template of the right arch exists"
# now reaches that named failure too. `index()` not `~` so the pattern is a
# literal substring rather than a regex.
#
# `tail -1` still means "last line of the index for this os+arch" — pveam prints
# its index sorted by name, so that is the latest point release in practice, but
# it is lexical: a future `13.10` would sort BEFORE `13.6`. Stated rather than
# hidden; it is the pre-existing auto-latest behaviour, now at least confined to
# the correct architecture. Revisit if upstream's numbering ever reaches x.10.
- name: Resolve latest template for each OS
  ansible.builtin.shell: |
    set -o pipefail
    pveam available --section system \
      | awk -v pat='{{ proxmox_templates[item] }}' \
            -v arch='{{ proxmox_template_arch_map[ansible_facts['architecture']] }}' \
            '$3 == arch && index($2, pat) { print $2 }' \
      | tail -1
  args:
    executable: /bin/bash
  register: template_resolution
  changed_when: false
  check_mode: false  # read-only pveam query; must run in --check to populate resolved_templates
  loop: "{{ lxc_os_names }}"
  when: lxc_os_names | length > 0

- name: Build resolved templates lookup
  ansible.builtin.set_fact:
    resolved_templates: "{{ resolved_templates | default({}) | combine({item.item: 'local:vztmpl/' + item.stdout}) }}"
  loop: "{{ template_resolution.results | default([]) }}"
  when:
    - template_resolution.results is defined
    - item.stdout | default('') | length > 0

- name: Check which templates are already downloaded
  ansible.builtin.stat:
    path: "/var/lib/vz/template/cache/{{ item.stdout }}"
  register: template_cache_check
  loop: "{{ template_resolution.results | default([]) }}"
  when:
    - template_resolution.results is defined
    - item.stdout | default('') | length > 0

- name: Download missing LXC templates
  ansible.builtin.command: "pveam download local {{ item.item.stdout }}"
  changed_when: true
  loop: "{{ template_cache_check.results | default([]) }}"
  when:
    - template_cache_check.results is defined
    - not (item.stat.exists | default(true))
  loop_control:
    label: "{{ item.item.stdout | default('unknown') }}"

# --- TrueNAS ISO & PCI Mapping ---

# Refuse to fetch the ISO unverified: a blank/short checksum would make get_url
# silently skip verification, defeating the whole point.
- name: Assert TrueNAS ISO checksum is configured
  ansible.builtin.assert:
    that:
      - truenas_iso_sha256 is defined
      - truenas_iso_sha256 | length == 64
    fail_msg: >-
      truenas_iso_sha256 is missing or not a 64-char sha256. Refusing to fetch
      the TrueNAS ISO unverified — update it alongside truenas_iso_version in
      proxmox_guests/defaults/main.yml.
  when: >
    proxmox_vms | selectattr('name', 'equalto', 'truenas') | list | length > 0

# No stat existence-gate: get_url with a checksum is already idempotent — it
# skips the network fetch when the on-disk file matches, re-downloads when it
# does not, and fails loudly if the result still mismatches. Gating on mere
# existence would skip verification of an existing-but-corrupt file (the exact
# "trusted forever" bug this guards against).
- name: Ensure TrueNAS ISO is present and matches published checksum
  ansible.builtin.get_url:
    url: "{{ truenas_iso_base_url }}/{{ truenas_iso_version }}/{{ truenas_iso_filename }}"
    dest: "/var/lib/vz/template/iso/{{ truenas_iso_filename }}"
    checksum: "sha256:{{ truenas_iso_sha256 }}"
    mode: "0644"
  when: >
    proxmox_vms | selectattr('name', 'equalto', 'truenas') | list | length > 0

# --- Cluster PCI resource mappings ---
#
# The mappings are DATA (`proxmox_pci_mappings` in host_vars), not hardcoded
# pvesh invocations, and they are RECONCILED rather than created-once. Values
# are pinned to observed hardware — if a card is re-seated and its path or
# IOMMU group changes, update host_vars and re-run; the role converges the
# cluster mapping. A guest's hostpci line references the mapping by id
# (`mapping=truenas_sata`), so the hardware pointer only ever lives here.
#
# Safe on a running guest: mappings are resolved by QEMU at VM *start*, so
# `pvesh set` edits cluster config only and never touches a running VM.
#
# The read task is `check_mode: false` on purpose. Skipping it in --check would
# leave `.rc` undefined for the create/update `when:` expressions (the old
# create-only tasks had exactly that latent landmine), and it is what makes
# `--check` a real drift report instead of a wall of "skipping".
#
# `failed_when` is DISCRIMINATING, not blanket-false. A genuinely missing
# mapping exits 255 with "mapping '<id>' not found" on stderr and is the normal
# first-run state; anything else (pmxcfs wedged, API down, permission denied)
# must fail loudly rather than be silently treated as "absent" — which would
# quietly recreate a mapping we simply failed to read.
- name: Read current cluster PCI mappings
  ansible.builtin.command: "pvesh get /cluster/mapping/pci/{{ item.id }} --output-format json"
  register: pci_mapping_current
  failed_when:
    - pci_mapping_current.rc != 0
    - "'not found' not in pci_mapping_current.stderr"
  changed_when: false
  check_mode: false
  loop: "{{ proxmox_pci_mappings }}"
  loop_control:
    label: "PCI mapping {{ item.id }}"

# Desired map string, built once, in pvesh's own (alphabetical) field order so a
# converged mapping compares byte-equal against the live JSON.
- name: Build desired PCI mapping state
  ansible.builtin.set_fact:
    pci_mapping_desired: >-
      {{ pci_mapping_desired | default({}) | combine({item.id: {
        'map': 'id=' ~ item.device_id
               ~ ',iommugroup=' ~ item.iommugroup
               ~ ',node=' ~ proxmox_node
               ~ ',path=' ~ item.path
               ~ ',subsystem-id=' ~ item.subsystem_id,
        'description': item.description | default(''),
      }}) }}
  loop: "{{ proxmox_pci_mappings }}"
  loop_control:
    label: "PCI mapping {{ item.id }}"

# A cluster PCI mapping can carry one entry PER NODE — `map` is a list. This
# role models a single-node mapping (one `path`/`iommugroup` per id), so its
# compare assumes a one-element list and `pvesh set -map <single>` would REPLACE
# the whole list, deleting other nodes' entries. Refuse rather than clobber.
# Every task below is additionally gated on length == 1 so nothing is reachable
# for a multi-node mapping even if this fail is ever removed.
- name: Refuse to converge multi-node PCI mappings
  ansible.builtin.fail:
    msg: >-
      Multi-node PCI mappings are not supported by this role; refusing to
      converge '{{ item.item.id }}'. It has
      {{ (item.stdout | from_json).map | length }} node entries
      ({{ (item.stdout | from_json).map | join(' | ') }}) and `pvesh set -map`
      replaces the entire list, which would delete the other nodes' entries.
      Manage this mapping outside the role, or reduce it to a single node.
  loop: "{{ pci_mapping_current.results | default([]) }}"
  loop_control:
    label: "PCI mapping {{ item.item.id }}"
  when:
    - item.rc == 0
    - (item.stdout | from_json).map | default([]) | length > 1

# Drift report. Runs in check mode (debug always does), so `--check` surfaces
# exactly what a real run would create or rewrite.
- name: Report absent PCI mappings
  ansible.builtin.debug:
    msg: "PCI mapping {{ item.item.id }}: absent — will create map={{ pci_mapping_desired[item.item.id].map }}"
  loop: "{{ pci_mapping_current.results | default([]) }}"
  loop_control:
    label: "PCI mapping {{ item.item.id }}"
  when: item.rc != 0

- name: Report PCI mapping drift
  ansible.builtin.debug:
    msg: >-
      PCI mapping {{ item.item.id }} drift:
      current={{ (item.stdout | from_json).map | default([]) | join(',') }}
      | {{ (item.stdout | from_json).description | default('') }}
      desired={{ pci_mapping_desired[item.item.id].map }}
      | {{ pci_mapping_desired[item.item.id].description }}
  loop: "{{ pci_mapping_current.results | default([]) }}"
  loop_control:
    label: "PCI mapping {{ item.item.id }}"
  when:
    - item.rc == 0
    - (item.stdout | from_json).map | default([]) | length == 1
    - >-
      (item.stdout | from_json).map | default([]) != [pci_mapping_desired[item.item.id].map]
      or (item.stdout | from_json).description | default('') != pci_mapping_desired[item.item.id].description

# argv form: the description contains spaces and must not go through a shell.
- name: Create missing cluster PCI mappings
  ansible.builtin.command:
    argv:
      - pvesh
      - create
      - /cluster/mapping/pci
      - "-id"
      - "{{ item.item.id }}"
      - "-map"
      - "{{ pci_mapping_desired[item.item.id].map }}"
      - "-description"
      - "{{ pci_mapping_desired[item.item.id].description }}"
  changed_when: true
  loop: "{{ pci_mapping_current.results | default([]) }}"
  loop_control:
    label: "PCI mapping {{ item.item.id }} — create"
  when: item.rc != 0

- name: Converge drifted cluster PCI mappings
  ansible.builtin.command:
    argv:
      - pvesh
      - set
      - "/cluster/mapping/pci/{{ item.item.id }}"
      - "-map"
      - "{{ pci_mapping_desired[item.item.id].map }}"
      - "-description"
      - "{{ pci_mapping_desired[item.item.id].description }}"
  changed_when: true
  loop: "{{ pci_mapping_current.results | default([]) }}"
  loop_control:
    label: "PCI mapping {{ item.item.id }} — update"
  when:
    - item.rc == 0
    - (item.stdout | from_json).map | default([]) | length == 1
    - >-
      (item.stdout | from_json).map | default([]) != [pci_mapping_desired[item.item.id].map]
      or (item.stdout | from_json).description | default('') != pci_mapping_desired[item.item.id].description

# --- VM provisioning ---

- name: Provision virtual machines
  become: false
  no_log: true  # hides vault_proxmox_api_token_secret from -v/logs. NOTE: also
  # censors failure output — re-run with ANSIBLE_NO_LOG=False to debug (re-exposes the token).
  community.proxmox.proxmox_kvm:
    api_host: "{{ ansible_host }}"
    # Explicit, not inherited (#137): community.proxmox's `validate_certs` argspec
    # carries NO default — unset is `None`, and the collection then supplies `false`
    # from a deprecation shim (module_utils/proxmox.py::_connect) whose own message
    # says the default becomes `true` in community.proxmox 2.0.0
    # (plugins/doc_fragments/proxmox.py). Our PVE nodes serve the self-signed PVE
    # cluster CA, so an inherited flip would fail every task in this role at once,
    # on both hypervisors, with no repo change to blame. requirements.yml bounds the
    # collection <2.0.0 for the same reason — belt AND braces (#86 precedent).
    #
    # Trusting the PVE cluster CA on the operator machines and setting this `true`
    # is the better end state; it must land on the Mac AND the Arch box together
    # (Critical Rule 2), so it is filed as follow-up work, not done here.
    validate_certs: false
    api_user: "{{ vault_proxmox_api_user }}"
    api_token_id: "{{ vault_proxmox_api_token_id }}"
    api_token_secret: "{{ vault_proxmox_api_token_secret }}"
    node: "{{ proxmox_node }}"
    vmid: "{{ item.vmid }}"
    name: "{{ item.name }}"
    cores: "{{ item.cores | default(proxmox_vm_defaults.cores) }}"
    sockets: "{{ item.sockets | default(proxmox_vm_defaults.sockets) }}"
    memory: "{{ item.memory | default(proxmox_vm_defaults.memory) }}"
    bios: "{{ item.bios | default(proxmox_vm_defaults.bios) }}"
    # null default → omitted → PVE's own default machine type (i440fx), which is
    # what VM 100 actually runs; a guest that needs q35 says so in host_vars.
    machine: "{{ item.machine | default(proxmox_vm_defaults.machine) | default(omit, true) }}"
    onboot: "{{ item.onboot | default(proxmox_vm_defaults.onboot) }}"
    scsihw: "{{ item.scsihw | default('virtio-scsi-single') }}"
    vga: "{{ item.vga | default(omit) }}"
    scsi: "{{ item.scsi | default({}) }}"
    # Rebuild fidelity (#87) — modelled from the live guests so a from-scratch
    # create matches them. Omitted when a guest does not declare them.
    agent: "{{ item.agent | default(omit) }}"
    balloon: "{{ item.balloon | default(omit) }}"
    cpu: "{{ item.cpu | default(omit) }}"
    usb: "{{ item.usb | default(omit) }}"
    localtime: "{{ item.localtime | default(omit) }}"
    tablet: "{{ item.tablet | default(omit) }}"
    net: "{{ item.net | default({'net0': 'virtio,bridge=' + (item.net_bridge | default(proxmox_vm_defaults.net_bridge))}) }}"
    hostpci: "{{ item.hostpci | default({}) }}"
    efidisk0: "{{ item.efidisk0 | default(omit) }}"
    ide: "{{ item.ide | default(omit) }}"
    tags: "{{ item.tags | default([]) }}"
    description: "{{ item.description | default('') }}"
    startup: "{{ item.startup | default(omit) }}"
    state: present
    # CREATION ONLY. proxmox_kvm's `update` still defaults to false, but pin it
    # explicitly so a future collection bump cannot silently flip this task into
    # the same blind config PUT that bit the LXC task below. Every update in this
    # role is an explicit reconcile task, never a module side effect.
    update: false
  delegate_to: localhost
  loop: "{{ proxmox_vms }}"
  loop_control:
    label: "VM {{ item.vmid }} ({{ item.name }})"

# --- Existing-VM reconcile: the one live read (#86, #119) ---
#
# proxmox_kvm state=present only CREATES; it never updates an existing VM. So
# every convergence of a live VM in this role is an explicit task below, and they
# all share ONE shape: read live state here → compute drift in Jinja → report it
# with `debug` → apply it with a guarded `command`.
#
# Why the shape matters (#119): the NIC and startup/onboot reconciles used to be
# `shell` tasks that read `qm config` inside the script. `shell` is skipped
# wholesale under `--check`, so NIC and boot-order drift were invisible in the
# documented dry run — and the reads themselves were unguarded, saved only by
# provisioning order.
#
# The reads are `check_mode: false` on purpose. Skipping them in --check would
# leave `.rc` undefined for every `when:` below, and it is what makes `--check` a
# real drift report instead of a wall of "skipping".
#
# `failed_when` is DISCRIMINATING, not blanket-false. A guest listed in host_vars
# but not yet created has no config to read. That is the normal state during a dry
# run of a NEW guest — provisioning is skipped in --check, so `qm config
# <new-vmid>` exits 2 with "Configuration file '...' does not exist" on stderr —
# and the documented dry-run-first workflow must not blow up on it. But the
# tolerance is DISCRIMINATING: any other failure (pmxcfs unavailable, permission
# denied) fails loudly, because silently treating it as "absent" would drop a live
# guest out of reconcile entirely.
#
# ONE read feeds all three computes (NIC, startup/onboot, cores/memory) and is NOT
# re-read between their applies. That is safe by construction, not by luck: the
# three touch disjoint field sets — `net*`, `startup`/`onboot`, `cores`/`memory` —
# so no apply can invalidate a later compute. Adding a fourth reconcile means
# checking that property again.
- name: Read current VM configuration
  become: true
  ansible.builtin.command: "qm config {{ item.vmid }}"
  register: vm_config_raw
  changed_when: false
  failed_when:
    - vm_config_raw.rc != 0
    - "'does not exist' not in vm_config_raw.stderr"
  check_mode: false  # read-only; must run in --check so drift is reported, not skipped
  loop: "{{ proxmox_vms }}"
  loop_control:
    label: "VM {{ item.vmid }} ({{ item.name }})"

- name: Read current VM run state
  become: true
  ansible.builtin.command: "qm status {{ item.vmid }}"
  register: vm_status_raw
  changed_when: false
  failed_when:
    - vm_status_raw.rc != 0
    - "'does not exist' not in vm_status_raw.stderr"
  check_mode: false  # read-only; gates whether drift may be applied at all
  loop: "{{ proxmox_vms }}"
  loop_control:
    label: "VM {{ item.vmid }} ({{ item.name }})"

- name: Report VMs that do not exist yet
  ansible.builtin.debug:
    msg: "VM {{ item.item.vmid }} ({{ item.item.name }}): not created yet — provisioning owns creation"
  loop: "{{ vm_config_raw.results | default([]) }}"
  loop_control:
    label: "VM {{ item.item.vmid }} ({{ item.item.name }})"
  when: item.rc != 0

# Facts persist across role inclusions within a play, so seed the accumulators
# explicitly rather than relying on `| default([])` to paper over a stale value.
- name: Seed VM drift accumulators
  ansible.builtin.set_fact:
    vm_nic_drift: []
    vm_startup_drift: []
    vm_resource_drift: []

# --- VM NIC reconcile (#36, #119) ---
#
# MAC PRESERVATION IS THE WHOLE POINT OF THIS TASK. `qm set -netN` REPLACES the
# interface: pushing a desired string without a MAC at a NIC that has one makes
# Proxmox generate a fresh MAC, and the guest OS loses its network config (and its
# DHCP reservation). VM 100 is the LIVE Home Assistant VM and IS reconciled here,
# so a bug in this compute hot-rewrites its NIC.
#
# The three branches below are a field-for-field port of the bash this replaced —
# same order, same predicates:
#   1. NIC absent from `qm config`  -> add the desired string as-is.
#   2. live has a MAC, desired does not -> strip `=<mac>` from live (first
#      occurrence, exactly like the old `sed -E "s/=$mac//i"`; the MAC is
#      extracted FROM the live string, so it is a literal substring and needs no
#      case folding) and compare the remainder. Only if that differs do we write,
#      re-injecting the live MAC as `<model>=<mac>,<rest>`. `<rest>` is everything
#      after the first comma, or the whole string when there is no comma — the old
#      `cut -d',' -f2-` behaviour.
#   3. otherwise (neither has a MAC, or desired pins one) -> plain string compare.
# Fleet state this must stay a no-op for: VM 100 pins its MAC in host_vars
# (branch 3, equal), VM 200's net0/net1 declare no MAC (branch 2, remainder
# equal). Both were simulated against captured live configs before this landed.
- name: Compute VM NIC drift
  ansible.builtin.set_fact:
    vm_nic_drift: "{{ vm_nic_drift + [drift_entry] }}"
  vars:
    nic_plan_json: >-
      {%- set out = [] -%}
      {%- for nic_name, nic_val in item.item.net.items() -%}
      {%- set matches = item.stdout_lines | default([]) | select('match', nic_name ~ ':') | list -%}
      {%- set current = matches[0].split(' ', 1)[1] if matches else '' -%}
      {%- set mac = current | regex_search('[0-9A-Fa-f]{2}(?::[0-9A-Fa-f]{2}){5}') -%}
      {%- set desired_has_mac = nic_val is search('([0-9a-fA-F]{2}:){5}[0-9a-fA-F]{2}') -%}
      {%- if current == '' -%}
      {%- set _ = out.append({'arg': '-' ~ nic_name ~ ' ' ~ nic_val, 'human': nic_name ~ ' absent live — will add ' ~ nic_val}) -%}
      {%- elif mac and not desired_has_mac -%}
      {%- set current_no_mac = current.replace('=' ~ mac, '', 1) -%}
      {%- if current_no_mac != nic_val -%}
      {%- set model = nic_val.split(',')[0] -%}
      {%- set rest = nic_val.split(',', 1)[1] if ',' in nic_val else nic_val -%}
      {%- set _ = out.append({'arg': '-' ~ nic_name ~ ' ' ~ model ~ '=' ~ mac ~ ',' ~ rest,
      'human': nic_name ~ ' live=' ~ current ~ ' desired=' ~ nic_val
      ~ ' (re-injecting live MAC ' ~ mac ~ ')'}) -%}
      {%- endif -%}
      {%- elif current != nic_val -%}
      {%- set _ = out.append({'arg': '-' ~ nic_name ~ ' ' ~ nic_val, 'human': nic_name ~ ' live=' ~ current ~ ' desired=' ~ nic_val}) -%}
      {%- endif -%}
      {%- endfor -%}
      {{- out | to_json -}}
    nic_plan: "{{ nic_plan_json | from_json }}"
    drift_entry:
      vmid: "{{ item.item.vmid }}"
      name: "{{ item.item.name }}"
      args: "{{ nic_plan | map(attribute='arg') | join(' ') }}"
      human: "{{ nic_plan | map(attribute='human') | join('; ') }}"
  loop: "{{ vm_config_raw.results | default([]) }}"
  loop_control:
    label: "VM {{ item.item.vmid }} ({{ item.item.name }})"
  when:
    # rc first: a non-existent guest has no config to parse, and nic_plan must
    # never be evaluated against a stderr blob. `net` second: a VM that declares
    # no `net` is not enrolled in NIC reconcile at all (the old task's
    # selectattr('net', 'defined') loop).
    - item.rc == 0
    - item.item.net is defined
    - nic_plan | length > 0

- name: Report VM NIC drift
  ansible.builtin.debug:
    msg: "VM {{ item.vmid }} ({{ item.name }}): {{ item.human }} — will apply via qm set"
  loop: "{{ vm_nic_drift | default([]) }}"
  loop_control:
    label: "VM {{ item.vmid }} ({{ item.name }})"

# Hot on a running VM (Proxmox re-plugs the NIC); deliberate — see #36. Guarded by
# construction: the loop is empty unless the compute above found real drift.
- name: Apply NIC changes to existing VMs
  become: true
  ansible.builtin.command: "qm set {{ item.vmid }} {{ item.args }}"
  changed_when: true
  loop: "{{ vm_nic_drift | default([]) }}"
  loop_control:
    label: "VM {{ item.vmid }} ({{ item.name }}) — net"

# --- VM startup/onboot reconcile (#36, #119) ---
#
# Same create-only limitation as networking above: startup/onboot set in vars
# never reach a VM that already existed when the value was added — so boot order
# silently drifts (TrueNAS lost its order=1, booting AFTER its NFS consumer; #36).
# This is a config change only — qm set does not restart the guest.
#
# `startup` is compared ONLY when the guest declares one: an absent declaration
# means "not managed", not "clear it" (the old `[ -n "$desired_startup" ]` guard).
# `onboot` has no such opt-out — it has a role default — and a VM with no `onboot:`
# line in `qm config` sits on Proxmox's own default of 0.
- name: Compute VM startup/onboot drift
  ansible.builtin.set_fact:
    vm_startup_drift: "{{ vm_startup_drift + [drift_entry] }}"
  vars:
    live_startup: "{{ item.stdout | regex_search('(?m)^startup: (.*)$', '\\1') | default([], true) | join }}"
    live_onboot: "{{ item.stdout | regex_search('(?m)^onboot: (\\d+)', '\\1') | default([], true) | join | default('0', true) }}"
    want_startup: "{{ item.item.startup | default('') }}"
    want_onboot: "{{ (item.item.onboot | default(proxmox_vm_defaults.onboot)) | ternary(1, 0) }}"
    drift_fields: >-
      {{ ([] if (want_startup | length == 0 or live_startup == want_startup) else ['startup'])
         + ([] if live_onboot | int == want_onboot | int else ['onboot']) }}
    drift_entry:
      vmid: "{{ item.item.vmid }}"
      name: "{{ item.item.name }}"
      args: >-
        {{ ((['-startup ' ~ want_startup] if 'startup' in drift_fields else [])
            + (['-onboot ' ~ want_onboot] if 'onboot' in drift_fields else [])) | join(' ') }}
      human: >-
        {{ ((['startup live=' ~ (live_startup | default('<unset>', true)) ~ ' desired=' ~ want_startup] if 'startup' in drift_fields else [])
            + (['onboot live=' ~ live_onboot ~ ' desired=' ~ want_onboot] if 'onboot' in drift_fields else [])) | join(', ') }}
  loop: "{{ vm_config_raw.results | default([]) }}"
  loop_control:
    label: "VM {{ item.item.vmid }} ({{ item.item.name }})"
  when:
    # rc first: a non-existent guest has no config to parse, and drift_fields
    # must never be evaluated against a stderr blob.
    - item.rc == 0
    - drift_fields | length > 0

- name: Report VM startup/onboot drift
  ansible.builtin.debug:
    msg: "VM {{ item.vmid }} ({{ item.name }}): {{ item.human }} — will apply via qm set"
  loop: "{{ vm_startup_drift | default([]) }}"
  loop_control:
    label: "VM {{ item.vmid }} ({{ item.name }})"

- name: Apply startup/onboot to existing VMs
  become: true
  ansible.builtin.command: "qm set {{ item.vmid }} {{ item.args }}"
  changed_when: true
  loop: "{{ vm_startup_drift | default([]) }}"
  loop_control:
    label: "VM {{ item.vmid }} ({{ item.name }}) — startup/onboot"

# --- VM cores/memory reconcile (#86) ---
#
# proxmox_kvm state=present creates but never updates, so cores/memory edited in
# host_vars silently never reached an existing VM. These tasks close that gap.
#
# RECONCILED HERE: cores, memory. Nothing else.
# RECONCILED BY THEIR OWN TASKS ABOVE: net (MAC-preserving NIC task),
# startup/onboot.
# CREATE-TIME ONLY (deliberate — changing them on a live guest is destructive,
# guest-visible, or both): sockets, bios, machine, vga, scsi, scsihw, efidisk0,
# ide, hostpci, agent, balloon, cpu, usb, localtime, tablet, tags, description,
# name — all passed at create and never reconciled afterwards. Those fields were
# modelled from the live guests in #87 so a from-scratch rebuild matches them;
# `ide2` in particular must NOT be reconciled — the TrueNAS installer ISO is
# deliberately ejected post-install, so live reads `none,media=cdrom` while
# host_vars still names the ISO. That mismatch is the documented DR flow; see
# the comment on ide2 in n5pro host_vars.
#
# Neither VM has memory/cpu hotplug enabled, so applying cores/memory to a
# RUNNING VM cannot take effect without a guest stop. We therefore fail loudly
# instead of warning: a warning inside a green play is exactly how this drift
# went unnoticed in the first place. `qm set` on a running VM would also create
# pending changes that make `qm config` disagree with the running guest and
# poison this very comparison.
#
# Reads and the drift accumulator live in the shared block above (#119).
#
# A missing `cores:`/`memory:` line means the VM sits on Proxmox's own default
# (1 core / 512 MB) — qm config omits keys that were never set.
- name: Compute VM cores/memory drift
  ansible.builtin.set_fact:
    vm_resource_drift: "{{ vm_resource_drift | default([]) + [drift_entry] }}"
  vars:
    live_cores: "{{ item.stdout | regex_search('(?m)^cores: (\\d+)', '\\1') | default([], true) | join | default('1', true) }}"
    live_memory: "{{ item.stdout | regex_search('(?m)^memory: (\\d+)', '\\1') | default([], true) | join | default('512', true) }}"
    want_cores: "{{ item.item.cores | default(proxmox_vm_defaults.cores) }}"
    want_memory: "{{ item.item.memory | default(proxmox_vm_defaults.memory) }}"
    drift_fields: >-
      {{ ([] if live_cores | int == want_cores | int else ['cores'])
         + ([] if live_memory | int == want_memory | int else ['memory']) }}
    status_result: "{{ vm_status_raw.results | selectattr('item.vmid', 'equalto', item.item.vmid) | list }}"
    status_rc: "{{ status_result | map(attribute='rc') | join }}"
    status_out: "{{ status_result | map(attribute='stdout') | join }}"
    drift_entry:
      vmid: "{{ item.item.vmid }}"
      name: "{{ item.item.name }}"
      # 'yes'/'no' rather than a bool: set_fact round-trips values through
      # templating, and a plain string compares unambiguously downstream.
      #
      # Fails CLOSED: 'no' (safe to mutate) requires positive proof — the status
      # read succeeded AND printed exactly `status: stopped`. A failed read or
      # any unexpected output is 'yes' and gets refused.
      #
      # To be accurate about what this does and does not catch: plain `qm status`
      # only ever prints running or stopped (the richer paused/prelaunch/io-error
      # values are qmpstatus and never appear here), so the closed polarity is
      # mainly insurance against a failed or empty read rather than against exotic
      # states. The one real case it does NOT catch alone is a hibernated
      # (suspend-to-disk) VM, which honestly reports stopped and will reach
      # `qm set` — there Proxmox's own `suspended` lock rejects the command
      # loudly. Gate plus lock keep that safe; the gate by itself would not.
      running: "{{ 'no' if (status_rc == '0' and status_out is search('(?m)^status: stopped')) else 'yes' }}"
      args: >-
        {{ ((['-cores ' ~ want_cores] if 'cores' in drift_fields else [])
            + (['-memory ' ~ want_memory] if 'memory' in drift_fields else [])) | join(' ') }}
      human: >-
        {{ ((['cores live=' ~ live_cores ~ ' desired=' ~ want_cores] if 'cores' in drift_fields else [])
            + (['memory live=' ~ live_memory ~ ' desired=' ~ want_memory] if 'memory' in drift_fields else [])) | join(', ') }}
  loop: "{{ vm_config_raw.results | default([]) }}"
  loop_control:
    label: "VM {{ item.item.vmid }} ({{ item.item.name }})"
  when:
    # rc first: a non-existent guest has no config to parse, and drift_fields
    # must never be evaluated against a stderr blob.
    - item.rc == 0
    - drift_fields | length > 0

- name: Report VM cores/memory drift
  ansible.builtin.debug:
    msg: "VM {{ item.vmid }} ({{ item.name }}): {{ item.human }} — will apply via qm set (VM is stopped)"
  loop: "{{ vm_resource_drift | default([]) | selectattr('running', 'equalto', 'no') | list }}"
  loop_control:
    label: "VM {{ item.vmid }} ({{ item.name }})"

# Runs in check mode too, so `task infra:hosts:check` reports the conflict
# instead of a silently green play.
- name: Refuse to change cores/memory on a VM that is not confirmed stopped
  ansible.builtin.fail:
    msg: >-
      Refusing to change a VM that is not confirmed stopped.
      {% for e in vm_resource_drift | default([]) | selectattr('running', 'equalto', 'yes') | list %}
      VM {{ e.vmid }} ({{ e.name }}): {{ e.human }}.
      {% endfor %}
      Memory/CPU hotplug is not enabled on these VMs; converging would require a
      guest stop. Either pin host_vars back to the live values, or stop the VM in
      a maintenance window and re-run.
      Note that once the VM is stopped, a single re-run both applies the change
      AND boots the guest again — the 'Start virtual machines' task below starts
      anything with `started: true`, so no second run is needed.
      Scope the maintenance run with `--limit <host>` (e.g.
      `task infra:hosts -- --limit {{ inventory_hostname }}`).
  when: vm_resource_drift | default([]) | selectattr('running', 'equalto', 'yes') | list | length > 0

# Stopped VMs only — enforced by the loop, not just by the fail task above.
- name: Apply cores/memory to stopped VMs
  become: true
  ansible.builtin.command: "qm set {{ item.vmid }} {{ item.args }}"
  changed_when: true
  loop: "{{ vm_resource_drift | default([]) | selectattr('running', 'equalto', 'no') | list }}"
  loop_control:
    label: "VM {{ item.vmid }} ({{ item.name }}) — cores/memory"

- name: Start virtual machines
  become: false
  no_log: true  # hides vault_proxmox_api_token_secret from -v/logs. NOTE: also
  # censors failure output — re-run with ANSIBLE_NO_LOG=False to debug (re-exposes the token).
  community.proxmox.proxmox_kvm:
    api_host: "{{ ansible_host }}"
    # Explicit — see the first proxmox call site in this file (#137).
    validate_certs: false
    api_user: "{{ vault_proxmox_api_user }}"
    api_token_id: "{{ vault_proxmox_api_token_id }}"
    api_token_secret: "{{ vault_proxmox_api_token_secret }}"
    node: "{{ proxmox_node }}"
    vmid: "{{ item.vmid }}"
    state: started
  delegate_to: localhost
  loop: >-
    {{ proxmox_vms | selectattr('started', 'defined')
    | selectattr('started', 'equalto', true) | list
    + proxmox_vms | rejectattr('started', 'defined') | list }}
  loop_control:
    label: "VM {{ item.vmid }} ({{ item.name }})"

- name: Fail if OS template resolution failed
  ansible.builtin.fail:
    msg: >-
      OS '{{ item.os }}' was requested but no template was resolved for
      architecture '{{ proxmox_template_arch_map[ansible_facts['architecture']] }}'.
      Check `pveam available --section system` for a
      '{{ proxmox_templates[item.os] | default(item.os) }}' entry whose third
      column is that arch.
  loop: "{{ proxmox_lxcs | selectattr('os', 'defined') | list }}"
  when: resolved_templates[item.os] | default('') | length == 0
  loop_control:
    label: "CT {{ item.vmid }} ({{ item.hostname }})"

# --- Fresh-allocation restore gate: write-ahead intent (#127, #148) ---
#
# The marker tasks at the bottom of this file used to key off `.changed` of the
# provisioning result — the one signal that evaporates if the run dies between
# CT creation and the marker task (Ctrl-C, a dropped VPN, a vault prompt timing
# out, an unrelated failure in the ~15 tasks that sit in between). Every later
# run then reads changed=false on an already-existing container and the restore
# gate stays silently unarmed for exactly the rebuild it exists to stop — the
# rebuild whose /data is empty (#148). Measured: kill the play right after
# provisioning, re-run to a fully GREEN recap, and the container ends up running
# with an empty freshly-allocated /data, no `.fresh-allocation` breadcrumb and no
# manifest.
#
# So the signal is made DURABLE BEFORE the risky operation. For every declared
# mount-bearing CT that does not exist yet, persist one intent file on this
# Proxmox host. The marker tasks arm from those files and delete each one only
# after both marker artefacts are on the container, so a death anywhere in
# between leaves the intent behind and the NEXT run arms the gate. Live,
# long-existing containers never get an intent file and are never touched.
#
# Why not probe the volume instead (the issue's own suggestion)? "empty /data +
# no manifest" cannot tell an UN-ARMED fresh allocation apart from an
# operator-ACKNOWLEDGED greenfield build: after the documented
# `rm {{ fresh_allocation_manifest }}` acknowledgement, /data is still empty
# until services deploy. Probing would re-arm the gate the operator just cleared,
# in a loop, inside a single site.yml run. The intent record makes "a fresh
# allocation happened and was never marked" a first-class observable without
# touching the operator acknowledgement protocol.
#
# Under --check the reads still run (they are read-only) but the writes are
# skipped, which matches the provisioning module being skipped wholesale. A
# LEFTOVER intent from a died run does surface in --check as pending marker
# writes — drift made visible, which is the point.
# `bind_mounts` (host-path binds, #254) is deliberately NOT in scope here or in
# any task of this gate: a bind source is someone else's data (an NFS share the
# host mounted), and the marker below would `touch .fresh-allocation` INSIDE it.
# Nothing is allocated for a bind mount, so there is nothing to restore.
- name: Assert every declared LXC mount carries exactly one mp= path
  ansible.builtin.assert:
    that:
      - (item.value.split(',') | select('match', 'mp=') | list | length) == 1
    fail_msg: >-
      CT {{ item.vmid }} ({{ item.hostname }}): mount {{ item.key }} =
      "{{ item.value }}" declares no mp= path (or more than one). Both the
      breadcrumb loop and the manifest derive their paths from mp=, so such a
      mount would be armed by nothing while its intent record was either cleared
      as though it had been — a gate that reports itself armed and is not — or
      left behind as a permanent phantom that the orphaned-intent check below
      then stops every run on.
  vars:
    lxc_mounts_json: >-
      {%- set out = [] -%}
      {%- for ct in proxmox_lxcs | selectattr('mounts', 'defined') -%}
      {%- for mp_key, mp_val in ct.mounts.items() -%}
      {%- set _ = out.append({'vmid': ct.vmid, 'hostname': ct.hostname,
      'key': mp_key, 'value': mp_val}) -%}
      {%- endfor -%}
      {%- endfor -%}
      {{- out | to_json -}}
  loop: "{{ lxc_mounts_json | from_json }}"
  loop_control:
    label: "CT {{ item.vmid }} ({{ item.hostname }}) — {{ item.key }}"

# Same discriminating shape as `Read current LXC configuration` below: rc != 0 is
# a failure UNLESS pct said the config file does not exist, which is the whole
# signal we are here to collect. `failed_when: false` would be worse than
# useless — it ASSIGNS failed=False, so any real read error (a broken pct, a
# permissions problem) would be silently read as "absent" and arm the gate on a
# live container.
#
# One edge this cannot discriminate: if pmxcfs is degraded, a LIVE container's
# config can transiently read as "does not exist" and an intent record would be
# written for it. The polarity is still the safe one — the consequence is a
# blocked deploy plus a manual `rm` of the intent file, never data loss — but an
# operator who meets the blocked-deploy message should confirm with
# `pct config <vmid>` that the volume really is fresh before acknowledging.
- name: Read LXC existence before provisioning
  become: true
  ansible.builtin.command: "pct status {{ item.vmid }}"
  register: lxc_pre_status
  changed_when: false
  failed_when:
    - lxc_pre_status.rc != 0
    - "'does not exist' not in lxc_pre_status.stderr"
  check_mode: false  # read-only; this read is what the intent record is made of
  loop: "{{ proxmox_lxcs | selectattr('mounts', 'defined') | list }}"
  loop_control:
    label: "CT {{ item.vmid }} ({{ item.hostname }})"

# UNCONDITIONAL, deliberately. Creating it only when a container is missing kept
# converged hosts marginally tidier and cost a permanent warning: `find` below
# has no ignore-missing option, so an absent directory makes it print "Skipped
# ... path due to this access issue" on EVERY run of an entirely healthy fleet.
# A standing warning nobody can act on is how operators learn to skim warnings.
# One empty directory per Proxmox host is the cheaper trade, and it makes the
# gate's state a fixed, greppable location rather than a thing that blinks in
# and out of existence.
- name: Ensure the fresh-allocation intent directory exists
  become: true
  ansible.builtin.file:
    path: "{{ fresh_allocation_intent_dir }}"
    state: directory
    mode: "0755"

# `selectattr('rc', 'defined')` is defence in depth, not a load-bearing guard:
# the read above has no per-item `when`, so every result it produces carries an
# rc, and a host declaring no mount-bearing container at all registers
# `results: []` (verified) rather than results without rc. Keeping the filter
# costs nothing and means a future `when` on that read cannot turn this loop
# into a templating error.
#
# Content is deliberately STABLE (no timestamp): a run re-attempted while the
# container is still absent must rewrite the identical bytes and report ok, not
# churn. The content is informational for an operator reading the host — arming
# keys off the FILENAME (the vmid) and recomputes mount paths from host_vars at
# arming time, so a hand-edited body cannot mis-arm anything.
- name: Record fresh-allocation intent for absent mount-bearing containers
  become: true
  ansible.builtin.copy:
    dest: "{{ fresh_allocation_intent_dir }}/{{ item.item.vmid }}"
    content: |
      {{ item.item.hostname }}
      {% for mp_val in item.item.mounts.values() %}
      {{ (mp_val.split(',') | select('match', 'mp=') | list | first) | replace('mp=', '', 1) }}
      {% endfor %}
    mode: "0644"
  loop: >-
    {{ lxc_pre_status.results | default([]) | selectattr('rc', 'defined')
    | rejectattr('rc', 'equalto', 0) | list }}
  loop_control:
    label: "CT {{ item.item.vmid }} ({{ item.item.hostname }}) — intent recorded"

- name: Provision LXC containers
  become: false
  no_log: true  # hides vault_proxmox_api_token_secret from -v/logs. NOTE: also
  # censors failure output — re-run with ANSIBLE_NO_LOG=False to debug (re-exposes the token).
  community.proxmox.proxmox:
    api_host: "{{ ansible_host }}"
    # Explicit — see the first proxmox call site in this file (#137).
    validate_certs: false
    api_user: "{{ vault_proxmox_api_user }}"
    api_token_id: "{{ vault_proxmox_api_token_id }}"
    api_token_secret: "{{ vault_proxmox_api_token_secret }}"
    node: "{{ proxmox_node }}"
    vmid: "{{ item.vmid }}"
    hostname: "{{ item.hostname }}"
    # `if item.os is defined` and NOT `resolved_templates[item.os] | default(...)`:
    # `default()` only catches an Undefined, and on a host where SOME container
    # declares `os:` the lookup dict is a real dict, so `item.os` on a container
    # that pins `ostemplate` instead raises a hard "dict has no attribute 'os'"
    # and fails the whole play — for every container, on every run, not just at
    # create. It survived only because no host mixed the two forms yet (eq12 is
    # all-ostemplate, so resolved_templates never gets defined there and the
    # Undefined chain does fall through). Measured on n5pro 2026-08-21 (#157).
    ostemplate: >-
      {{ resolved_templates[item.os] if item.os is defined
      else item.ostemplate | default(proxmox_lxc_defaults.ostemplate) }}
    cores: "{{ item.cores | default(proxmox_lxc_defaults.cores) }}"
    memory: "{{ item.memory | default(proxmox_lxc_defaults.memory) }}"
    swap: "{{ item.swap | default(proxmox_lxc_defaults.swap) }}"
    storage: "{{ item.storage | default(proxmox_lxc_defaults.storage) }}"
    disk: "{{ item.storage | default(proxmox_lxc_defaults.storage) }}:{{ item.root_disk_size | default(proxmox_lxc_defaults.root_disk_size) }}"
    mounts: "{{ item.mounts | default({}) }}"
    netif: "{{ item.netif | default({'net0': 'name=eth0,bridge=' + (item.net_bridge | default(proxmox_lxc_defaults.net_bridge)) + ',ip=dhcp,type=veth'}) }}"
    onboot: "{{ item.onboot | default(proxmox_lxc_defaults.onboot) }}"
    unprivileged: "{{ item.unprivileged | default(proxmox_lxc_defaults.unprivileged) }}"
    # One key per LINE. The previous form joined with a Jinja '\n' inside a YAML
    # folded scalar, which rendered as a LITERAL backslash-n: a fresh CT got a
    # single authorized_keys line — the first file's key with the rest of the
    # files glued into its comment — so it was reachable from exactly ONE operator
    # platform (Critical Rule 2) until `common` repaired it, and `common` can only
    # run from a platform that can log in. Measured on CT 202, 2026-09-02 (#254).
    # The separator is a YAML double-quoted "\n" (a real newline) passed as a var;
    # the glob is sorted so the file order is deterministic.
    # (`q('file', <list>)` is not an option: ansible-core 2.19's lookup refuses a
    # lazy list as a term.) Whitespace-trimmed tags, or the folded scalar's own
    # indentation leaks into the first key line.
    pubkey: >-
      {%- set ns = namespace(keys=[]) -%}
      {%- for keyfile in q('fileglob', inventory_dir + '/../files/ssh_keys/*.pub') | sort -%}
      {%-   set ns.keys = ns.keys + [lookup('file', keyfile)] -%}
      {%- endfor -%}
      {{ ns.keys | join(proxmox_pubkey_separator) }}
    features: >-
      {{ ['nesting=' ~ (item.nesting | default(proxmox_lxc_defaults.nesting)
      | ternary('1', '0'))] if (item.unprivileged
      | default(proxmox_lxc_defaults.unprivileged)) else omit }}
    tags: "{{ item.tags | default([]) }}"
    description: "{{ item.description | default('') }}"
    startup: "{{ item.startup | default(omit) }}"
    state: present
    # CREATION ONLY — do not remove.
    #
    # community.proxmox 1.0.0 flipped this module's `update` default from false
    # to true (1.6.0 argspec: update=dict(type="bool", default=True)). With it
    # true, `state: present` on an EXISTING container runs update_lxc_instance()
    # every single run, and that path:
    #   (a) never converges — it diffs task params against the stored config,
    #       and several can never match. `tags` is compared as a Python list
    #       ("['docker']") against the API's string ("docker"); `description`
    #       comes back URL-encoded with a trailing %0A; `disk` becomes a
    #       synthesized rootfs that cannot equal the real `subvol-…` volume.
    #   (b) on ANY non-empty diff PUTs the FULL kwargs set, not the diff
    #       (config.put(vmid=…, **kwargs)), then reports changed=True
    #       unconditionally.
    # So it rewrote netif/rootfs/mp on every run — the exact unguarded-mutation
    # class #86 exists to prevent. On n5pro it would PUT CT 201's mp0 in
    # allocation syntax ("local-zfs:200,mp=/data") over a live named subvol.
    #
    # This role uses the module for CREATION ONLY; every update is an explicit
    # reconcile task. `state: started` below is unaffected — that dispatch
    # branch never reads `update`.
    update: false
  # Deliberately NOT registered any more (#148). This result's per-item `changed`
  # used to be what armed the fresh-allocation restore gate, and it is the one
  # signal that does not survive a run dying between here and the marker tasks.
  # The gate now arms from the write-ahead intent records written above, so
  # nothing downstream reads this task's result — do not re-add a register
  # without a consumer (this role's own schema guards exist because of vars that
  # look like configuration and feed nothing).
  delegate_to: localhost
  vars:
    # A real newline (YAML double-quoted escape) — see the pubkey comment above.
    proxmox_pubkey_separator: "\n"
  loop: "{{ proxmox_lxcs }}"
  loop_control:
    label: "CT {{ item.vmid }} ({{ item.hostname }})"

# --- Existing-CT reconcile: the one live read (#86, #119) ---
#
# Mirror of the VM block above, and for the same reasons. community.proxmox.proxmox
# is pinned create-only, so every convergence of a live container is an explicit
# read → compute → report → apply below.
#
# `check_mode: false` because it is read-only and `--check` must still produce a
# drift report; `failed_when` discriminating so a CT added to host_vars but not yet
# created ("Configuration file '...' does not exist") is reported as pending while
# any OTHER read failure fails the play instead of silently dropping the container
# from reconcile.
#
# `pct config` (the rendered live view) and never the raw /etc/pve/lxc/<id>.conf:
# that file carries [pve:pending] and per-snapshot sections, each with its own copy
# of the keys we match, and a line-anchored read cannot tell them apart (#86).
#
# ONE read feeds all five computes below (features, startup/onboot, cores/memory,
# bind_mounts, hookscript) and is NOT re-read between their applies. That is safe
# by construction, not by luck: they touch disjoint field sets — `features`,
# `startup`/`onboot`, `cores`/`memory`, `mpN` host-path binds, `hookscript` — so no
# apply can invalidate a later compute (#254 re-checked this). Adding a sixth
# reconcile means checking that property again.
- name: Read current LXC configuration
  become: true
  ansible.builtin.command: "pct config {{ item.vmid }}"
  register: lxc_config_raw
  changed_when: false
  failed_when:
    - lxc_config_raw.rc != 0
    - "'does not exist' not in lxc_config_raw.stderr"
  check_mode: false  # read-only; must run in --check so drift is reported, not skipped
  loop: "{{ proxmox_lxcs }}"
  loop_control:
    label: "CT {{ item.vmid }} ({{ item.hostname }})"

- name: Report LXC containers that do not exist yet
  ansible.builtin.debug:
    msg: "CT {{ item.item.vmid }} ({{ item.item.hostname }}): not created yet — provisioning owns creation"
  loop: "{{ lxc_config_raw.results | default([]) }}"
  loop_control:
    label: "CT {{ item.item.vmid }} ({{ item.item.hostname }})"
  when: item.rc != 0

# Facts persist across role inclusions within a play, so seed the accumulators
# explicitly rather than relying on `| default([])` to paper over a stale value.
- name: Seed LXC drift accumulators
  ansible.builtin.set_fact:
    lxc_features_drift: []
    lxc_startup_drift: []
    lxc_resource_drift: []
    lxc_bind_mount_drift: []
    lxc_hookscript_drift: []

# This task reported `changed` on every run for CT 201 while converging nothing,
# for the whole life of the deployment (#86). Two independent bugs stacked:
#
#   1. `nfs` is not a valid LXC feature key. PVE's schema ($features_desc in
#      /usr/share/perl5/PVE/LXC/Config.pm) defines exactly mount, nesting,
#      keyctl, fuse, mknod, force_rw_sys — so `pct set -features nesting=1,nfs=1`
#      failed schema validation every single run. "This CT may mount NFS" is
#      spelled `mount=nfs` (format 'fstype;fstype;...').
#   2. The script set `-o pipefail` but not `-e`, so that failure was swallowed
#      and `echo "changed"` ran anyway — a green report over a no-op. The
#      startup/onboot reconcile shells this task copied already carried `-euo`
#      for exactly this reason (they have since become read/compute/report/apply
#      task chains under #119).
#
# The old existence check also grepped the raw /etc/pve/lxc/<id>.conf, which
# contains SNAPSHOT sections that carry their own `features:` line — so it could
# match a snapshot's value and skip a genuinely drifted live config. Compare
# against `pct config` (the rendered live view) instead.
#
# #135 finished the job: this was the role's LAST mutate-then-echo shell, and so
# the last reconcile whose drift was invisible under `--check` (Ansible skips
# `shell` wholesale in check mode) — the same defect class #119 fixed for the NIC
# and startup/onboot reconciles and deliberately left out of its scope. It also
# read `pct config` a SECOND time, unguarded, inside its own mutating script: a CT
# declared in host_vars but not yet created failed the play with a raw shell error
# instead of taking the shared read's discriminating skip-and-report path. It is
# now read -> compute -> report -> apply over the shared `lxc_config_raw`.
#
# COMPARISON BASIS — plain `pct config`, deliberately, and NOT `--current`:
#
#   `features` is a pending-capable option. PVE cannot change a running
#   container's feature set in place, so a successful `pct set -features` on a
#   running CT lands in `[pve:pending]` and takes effect at its next stop/start.
#   The apply mechanism here IS `pct set`, so the question the reconcile has to
#   answer is "would re-issuing `pct set` change anything?" — and plain
#   `pct config` (the pending-merged view) is exactly the view that answers it.
#   Comparing against `pct config <vmid> --current` would see standing drift for a
#   value already queued, re-issue `pct set` every run to rewrite the identical
#   pending value, and reinstate the permanent `changed=1` floor that #86 removed.
#
#   The cost, stated honestly: config convergence is not EFFECTIVE convergence.
#   This chain can report converged while a feature is merely queued. `pct config
#   <vmid> --current` and `pct pending <vmid>` are the operator's check for "is it
#   actually in force"; the role deliberately does not bounce the CT that hosts
#   the docker fleet to close that gap.

# The features task only runs for PRIVILEGED containers, so `nfs_enabled` on an
# unprivileged one would be silently inert — a var that looks like configuration
# and does nothing, which is the failure mode this whole issue is about.
- name: Assert nfs_enabled is only set on privileged containers
  ansible.builtin.assert:
    that:
      - not (item.unprivileged | default(proxmox_lxc_defaults.unprivileged))
    fail_msg: >-
      CT {{ item.vmid }} ({{ item.hostname }}) sets nfs_enabled but is
      unprivileged. `mount=nfs` is only implemented for privileged CTs (an
      unprivileged CT cannot mount NFS — give it a host bind mount via
      `bind_mounts` instead, #254); either make the CT privileged or drop
      nfs_enabled.
  loop: "{{ proxmox_lxcs | selectattr('nfs_enabled', 'defined') | selectattr('nfs_enabled') | list }}"
  loop_control:
    label: "CT {{ item.vmid }} ({{ item.hostname }}) — nfs_enabled"

- name: Compute LXC features drift
  ansible.builtin.set_fact:
    lxc_features_drift: "{{ lxc_features_drift + [drift_entry] }}"
  vars:
    live_features: >-
      {{ item.stdout | regex_search('(?m)^features: (.*)$', '\1')
         | default([], true) | join }}
    # Alphabetical (mount before nesting) to match PVE's canonical print order, so
    # the common case compares equal on the nose; the sort below makes the compare
    # correct even if PVE ever writes them back in another order.
    desired_features: >-
      {{ ((['mount=nfs'] if item.item.nfs_enabled | default(false) else [])
          + ['nesting=' ~ (item.item.nesting | default(proxmox_lxc_defaults.nesting) | ternary('1', '0'))])
         | join(',') }}
    # reject('equalto','') so an absent or empty `features:` line normalises to []
    # rather than [''], which would never compare equal to a desired [].
    live_norm: "{{ live_features | split(',') | reject('equalto', '') | sort | list }}"
    desired_norm: "{{ desired_features | split(',') | reject('equalto', '') | sort | list }}"
    drift_entry:
      vmid: "{{ item.item.vmid }}"
      hostname: "{{ item.item.hostname }}"
      features: "{{ desired_features }}"
      human: "features live={{ live_features | default('<unset>', true) }} desired={{ desired_features }}"
  loop: "{{ lxc_config_raw.results | default([]) }}"
  loop_control:
    label: "CT {{ item.item.vmid }} ({{ item.item.hostname }})"
  when:
    # rc first: a non-existent CT has no config to parse, and the compare must
    # never run against a stderr blob. (Same ordering rule as the computes below.)
    - item.rc == 0
    # Reconciled for privileged AND unprivileged CTs since #254. Unprivileged
    # CTs also get `nesting` at CREATE time from the provisioning module, but a
    # later flip in host_vars was silently inert — and nesting is not optional
    # for them any more: an Ubuntu 26.04 guest (systemd 259) without it fails
    # every early unit with status=243/CREDENTIALS, networkd included, so the CT
    # boots with eth0 DOWN. The `nfs_enabled` assert above keeps `mount=nfs`
    # privileged-only; for an unprivileged CT desired_features is `nesting=N`.
    - live_norm != desired_norm

- name: Report LXC features drift
  ansible.builtin.debug:
    msg: "CT {{ item.vmid }} ({{ item.hostname }}): {{ item.human }} — will apply via pct set"
  loop: "{{ lxc_features_drift | default([]) }}"
  loop_control:
    label: "CT {{ item.vmid }} ({{ item.hostname }})"

# `command`, not `shell`: the value is a comma-joined key=value string built in
# Jinja and needs no shell metacharacters — which also retires the missing-`set -e`
# trap that let the old task echo "changed" over a failed `pct set` (#86).
# `changed_when: true` matches the sibling applies below: the task only runs when
# drift was computed, so running it IS the change. Like those siblings it is still
# skipped under `--check`; the drift REPORT above is what became visible (#135).
- name: Apply features to existing LXC containers
  become: true
  ansible.builtin.command: "pct set {{ item.vmid }} -features {{ item.features }}"
  changed_when: true
  loop: "{{ lxc_features_drift | default([]) }}"
  loop_control:
    label: "CT {{ item.vmid }} ({{ item.hostname }}) — features"

# --- CT startup/onboot reconcile (#36, #119) ---
#
# Same reason as the VM task above: keep the docker LXC at order=2 (after TrueNAS)
# instead of drifted state. Config-only — `pct set` does not restart the container.
#
# `startup` is compared ONLY when the guest declares one: an absent declaration
# means "not managed", not "clear it" (the old `[ -n "$desired_startup" ]` guard).
# A CT with no `onboot:` line sits on Proxmox's own default of 0.
- name: Compute LXC startup/onboot drift
  ansible.builtin.set_fact:
    lxc_startup_drift: "{{ lxc_startup_drift + [drift_entry] }}"
  vars:
    live_startup: "{{ item.stdout | regex_search('(?m)^startup: (.*)$', '\\1') | default([], true) | join }}"
    live_onboot: "{{ item.stdout | regex_search('(?m)^onboot: (\\d+)', '\\1') | default([], true) | join | default('0', true) }}"
    want_startup: "{{ item.item.startup | default('') }}"
    want_onboot: "{{ (item.item.onboot | default(proxmox_lxc_defaults.onboot)) | ternary(1, 0) }}"
    drift_fields: >-
      {{ ([] if (want_startup | length == 0 or live_startup == want_startup) else ['startup'])
         + ([] if live_onboot | int == want_onboot | int else ['onboot']) }}
    drift_entry:
      vmid: "{{ item.item.vmid }}"
      hostname: "{{ item.item.hostname }}"
      args: >-
        {{ ((['-startup ' ~ want_startup] if 'startup' in drift_fields else [])
            + (['-onboot ' ~ want_onboot] if 'onboot' in drift_fields else [])) | join(' ') }}
      human: >-
        {{ ((['startup live=' ~ (live_startup | default('<unset>', true)) ~ ' desired=' ~ want_startup] if 'startup' in drift_fields else [])
            + (['onboot live=' ~ live_onboot ~ ' desired=' ~ want_onboot] if 'onboot' in drift_fields else [])) | join(', ') }}
  loop: "{{ lxc_config_raw.results | default([]) }}"
  loop_control:
    label: "CT {{ item.item.vmid }} ({{ item.item.hostname }})"
  when:
    # rc first: a non-existent CT has no config to parse, and drift_fields must
    # never be evaluated against a stderr blob.
    - item.rc == 0
    - drift_fields | length > 0

- name: Report LXC startup/onboot drift
  ansible.builtin.debug:
    msg: "CT {{ item.vmid }} ({{ item.hostname }}): {{ item.human }} — will apply via pct set"
  loop: "{{ lxc_startup_drift | default([]) }}"
  loop_control:
    label: "CT {{ item.vmid }} ({{ item.hostname }})"

- name: Apply startup/onboot to existing LXC containers
  become: true
  ansible.builtin.command: "pct set {{ item.vmid }} {{ item.args }}"
  changed_when: true
  loop: "{{ lxc_startup_drift | default([]) }}"
  loop_control:
    label: "CT {{ item.vmid }} ({{ item.hostname }}) — startup/onboot"

# --- CT cores/memory reconcile (#86) ---
#
# Same create-only gap as the VM tasks above: community.proxmox.proxmox
# state=present never updates an existing container.
#
# RECONCILED: cores, memory (here); features, startup/onboot (above);
# bind_mounts, hookscript (below, #254 — bind_mounts converges ADDED/CHANGED keys
# only, a key removed from host_vars stays live until removed by hand; an absent
# `hookscript` means "none" and is deleted, unlike `startup` where absent means
# "not managed"). CREATE-TIME ONLY: swap, netif, mounts, rootfs,
# storage, unprivileged, ostemplate — changing those on a live container either
# bounces its networking, moves its data mounts, or requires a recreate.
#
# Unlike VMs, cgroup limits apply HOT: `pct set` retunes a running container
# with no restart. Note the sharp edge — lowering memory below what the
# container is currently using takes effect immediately and can OOM its
# workload. That is a deliberate operator action; the role does not guard it.
#
# Reads and the drift accumulators live in the shared block above (#119).
- name: Compute LXC cores/memory drift
  ansible.builtin.set_fact:
    lxc_resource_drift: "{{ lxc_resource_drift | default([]) + [drift_entry] }}"
  vars:
    # The 'unset' sentinel covers a key `pct config` omits entirely, which means
    # different things per key: no `cores:` means unlimited (all host cores),
    # no `memory:` means Proxmox's 512 MB default. Rather than encode both, treat
    # either omission as drift against any explicit desired value and let the
    # `pct set` write make it explicit.
    live_cores: "{{ item.stdout | regex_search('(?m)^cores: (\\d+)', '\\1') | default([], true) | join | default('unset', true) }}"
    live_memory: "{{ item.stdout | regex_search('(?m)^memory: (\\d+)', '\\1') | default([], true) | join | default('unset', true) }}"
    want_cores: "{{ item.item.cores | default(proxmox_lxc_defaults.cores) }}"
    want_memory: "{{ item.item.memory | default(proxmox_lxc_defaults.memory) }}"
    drift_fields: >-
      {{ ([] if live_cores == want_cores | string else ['cores'])
         + ([] if live_memory == want_memory | string else ['memory']) }}
    drift_entry:
      vmid: "{{ item.item.vmid }}"
      hostname: "{{ item.item.hostname }}"
      args: >-
        {{ ((['-cores ' ~ want_cores] if 'cores' in drift_fields else [])
            + (['-memory ' ~ want_memory] if 'memory' in drift_fields else [])) | join(' ') }}
      human: >-
        {{ ((['cores live=' ~ live_cores ~ ' desired=' ~ want_cores] if 'cores' in drift_fields else [])
            + (['memory live=' ~ live_memory ~ ' desired=' ~ want_memory] if 'memory' in drift_fields else [])) | join(', ') }}
  loop: "{{ lxc_config_raw.results | default([]) }}"
  loop_control:
    label: "CT {{ item.item.vmid }} ({{ item.item.hostname }})"
  when:
    # rc first: a non-existent CT has no config to parse, and drift_fields must
    # never be evaluated against a stderr blob.
    - item.rc == 0
    - drift_fields | length > 0

- name: Report LXC cores/memory drift
  ansible.builtin.debug:
    msg: "CT {{ item.vmid }} ({{ item.hostname }}): {{ item.human }} — will hot-apply via pct set"
  loop: "{{ lxc_resource_drift | default([]) }}"
  loop_control:
    label: "CT {{ item.vmid }} ({{ item.hostname }})"

- name: Apply cores/memory to LXC containers
  become: true
  ansible.builtin.command: "pct set {{ item.vmid }} {{ item.args }}"
  changed_when: true
  loop: "{{ lxc_resource_drift | default([]) }}"
  loop_control:
    label: "CT {{ item.vmid }} ({{ item.hostname }}) — cores/memory"

# Privileged LXC containers (`unprivileged: false`) running Docker require their AppArmor
# profile to be unconfined. Otherwise, Proxmox applies a default profile that blocks
# Docker's `apparmor_parser` when it attempts to load the `docker-default` profile.
#
# Region-scoped shell reconcile, NOT `lineinfile` (#98): a regexp against
# /etc/pve/lxc/<id>.conf matches the LAST occurrence, which on CT 201 is a copy
# inside [preissue77]/[pve:pending] — so lineinfile reported ok while the live
# section stayed confined, and with no match at all it appended into a snapshot
# section. Those files are disqualified for lineinfile outright; see
# docs/solutions/integration-issues/lineinfile-last-match-edits-lxc-snapshot-not-live-config.md
# --- CT bind mounts + hookscript reconcile (#254) ---
#
# Both are `root@pam`-only in Proxmox: the API refuses a host-path bind mount and
# a hookscript from a token (403), the same wall the privileged-CT `features`
# task hit. So neither is passed to the provisioning module; they are applied by
# `pct set` over SSH, after creation and BEFORE the first start below — a fresh
# CT therefore boots with its binds and its pre-start gate already in place.
#
# `bind_mounts` is a separate key from `mounts` on purpose: `mounts` is
# allocation-form, create-time-only and armed by the fresh-allocation restore
# gate; a bind allocates nothing, is reconcilable, and must never be marked (the
# marker would land inside the bound share — see the gate's assert above).
#
# Comparison basis: plain `pct config` (pending-merged), for the reason the
# features task spells out — the question is "would re-issuing pct set change
# anything". On a RUNNING CT a changed mountpoint takes effect at its next start;
# the report says so rather than bouncing anything.
- name: Assert bind_mounts entries are host-path binds with exactly one mp=
  ansible.builtin.assert:
    that:
      - item.key is match('^mp[0-9]+$')
      - item.value is match('^/')
      - (item.value.split(',') | select('match', 'mp=') | list | length) == 1
      - item.key not in item.mounts
      # The hookscript word-splits and prefix-matches these strings verbatim, and
      # `..` would defeat its /mnt/nfs/ prefix check.
      - item.value is not search('[ \t*?\[]')
      - item.value is not search('(^|/)\.\.(/|,|$)')
      # A source under /mnt/nfs/ WITHOUT the gate is exactly the empty-bind trap
      # the gate exists for; a copied block that drops the line must fail here.
      - not (item.value is match('^/mnt/nfs/')) or item.hookscript == 'local:snippets/nfs-bind-prestart.sh'
    fail_msg: >-
      CT {{ item.vmid }} ({{ item.hostname }}): bind_mounts.{{ item.key }} =
      "{{ item.value }}" must be an mpN key, start with an absolute host path,
      carry exactly one mp=, contain no spaces, glob characters or `..`, and not
      reuse a key declared under `mounts`; a source under /mnt/nfs/ also requires
      `hookscript: local:snippets/nfs-bind-prestart.sh` on the CT (declared:
      {{ item.hookscript | default('<none>', true) }}).
  vars:
    lxc_bind_mounts_json: >-
      {%- set out = [] -%}
      {%- for ct in proxmox_lxcs | selectattr('bind_mounts', 'defined') -%}
      {%- for k, v in ct.bind_mounts.items() -%}
      {%- set _ = out.append({'vmid': ct.vmid, 'hostname': ct.hostname,
      'key': k, 'value': v, 'mounts': (ct.mounts | default({})).keys() | list,
      'hookscript': ct.hookscript | default('')}) -%}
      {%- endfor -%}
      {%- endfor -%}
      {{- out | to_json -}}
  loop: "{{ lxc_bind_mounts_json | from_json }}"
  loop_control:
    label: "CT {{ item.vmid }} ({{ item.hostname }}) — {{ item.key }}"

# One target per (existing CT, bind_mounts key), carrying that CT's `pct config`
# output so the compute below can read the live line without a second read.
- name: Enumerate bind-mount reconcile targets
  ansible.builtin.set_fact:
    lxc_bind_targets: >-
      {%- set out = [] -%}
      {%- for r in lxc_config_raw.results | default([]) if r.rc == 0 and r.item.bind_mounts is defined -%}
      {%- for k, v in r.item.bind_mounts.items() -%}
      {%- set _ = out.append({'vmid': r.item.vmid, 'hostname': r.item.hostname,
      'key': k, 'value': v, 'stdout': r.stdout}) -%}
      {%- endfor -%}
      {%- endfor -%}
      {{- out | to_json -}}

- name: Compute LXC bind-mount drift
  ansible.builtin.set_fact:
    lxc_bind_mount_drift: "{{ lxc_bind_mount_drift + [drift_entry] }}"
  vars:
    live_value: >-
      {{ item.stdout | regex_search('(?m)^' ~ item.key ~ ': (.*)$', '\1')
         | default([], true) | join }}
    # PVE may print the option list in its own order; compare as sorted sets.
    live_norm: "{{ live_value | split(',') | reject('equalto', '') | sort | list }}"
    desired_norm: "{{ item.value | split(',') | reject('equalto', '') | sort | list }}"
    drift_entry:
      vmid: "{{ item.vmid }}"
      hostname: "{{ item.hostname }}"
      key: "{{ item.key }}"
      value: "{{ item.value }}"
      human: "{{ item.key }} live={{ live_value | default('<unset>', true) }} desired={{ item.value }}"
  loop: "{{ lxc_bind_targets | from_json }}"
  loop_control:
    label: "CT {{ item.vmid }} ({{ item.hostname }}) — {{ item.key }}"
  when: live_norm != desired_norm

- name: Report LXC bind-mount drift
  ansible.builtin.debug:
    msg: >-
      CT {{ item.vmid }} ({{ item.hostname }}): {{ item.human }} — will apply via
      pct set (a running CT picks it up at its next start)
  loop: "{{ lxc_bind_mount_drift | default([]) }}"
  loop_control:
    label: "CT {{ item.vmid }} ({{ item.hostname }}) — {{ item.key }}"

- name: Apply bind mounts to existing LXC containers
  become: true
  ansible.builtin.command:
    argv:
      - pct
      - set
      - "{{ item.vmid }}"
      - "-{{ item.key }}"
      - "{{ item.value }}"
  changed_when: true
  loop: "{{ lxc_bind_mount_drift | default([]) }}"
  loop_control:
    label: "CT {{ item.vmid }} ({{ item.hostname }}) — {{ item.key }}"

- name: Compute LXC hookscript drift
  ansible.builtin.set_fact:
    lxc_hookscript_drift: "{{ lxc_hookscript_drift + [drift_entry] }}"
  vars:
    live_hook: "{{ item.stdout | regex_search('(?m)^hookscript: (.*)$', '\\1') | default([], true) | join }}"
    want_hook: "{{ item.item.hookscript | default('') }}"
    drift_entry:
      vmid: "{{ item.item.vmid }}"
      hostname: "{{ item.item.hostname }}"
      args: "{{ ['-delete', 'hookscript'] if want_hook | length == 0 else ['-hookscript', want_hook] }}"
      human: "hookscript live={{ live_hook | default('<unset>', true) }} desired={{ want_hook | default('<unset>', true) }}"
  loop: "{{ lxc_config_raw.results | default([]) }}"
  loop_control:
    label: "CT {{ item.item.vmid }} ({{ item.item.hostname }})"
  when:
    - item.rc == 0
    - live_hook != want_hook

- name: Report LXC hookscript drift
  ansible.builtin.debug:
    msg: "CT {{ item.vmid }} ({{ item.hostname }}): {{ item.human }} — will apply via pct set"
  loop: "{{ lxc_hookscript_drift | default([]) }}"
  loop_control:
    label: "CT {{ item.vmid }} ({{ item.hostname }})"

- name: Apply hookscript to existing LXC containers
  become: true
  ansible.builtin.command:
    argv: "{{ ['pct', 'set', item.vmid | string] + item.args }}"
  changed_when: true
  loop: "{{ lxc_hookscript_drift | default([]) }}"
  loop_control:
    label: "CT {{ item.vmid }} ({{ item.hostname }}) — hookscript"

- name: Force AppArmor unconfined on privileged LXC containers (required for Docker)
  ansible.builtin.include_tasks: lxc-apparmor-unconfined.yml
  loop: "{{ proxmox_lxcs }}"
  when: not (item.unprivileged | default(proxmox_lxc_defaults.unprivileged))
  loop_control:
    label: "CT {{ item.vmid }} ({{ item.hostname }}) — apparmor"

# The start task below runs under `no_log`, which would censor the one
# diagnostic a hookscript refusal produces. Run the gate FIRST, visibly, for every
# CT that declares one and is about to be started: same script, same answer, but
# its stderr reaches the operator. The mount it may raise is the gate's own side
# effect — identical to what the start would trigger a moment later — so it is
# not reported as a change.
- name: Pre-flight the hookscript so a refusal is readable (no_log hides it below)
  become: true
  ansible.builtin.command:
    argv:
      - /var/lib/vz/snippets/{{ item.item.hookscript | regex_replace('^local:snippets/', '') }}
      - "{{ item.item.vmid }}"
      - pre-start
  changed_when: false
  loop: "{{ lxc_config_raw.results | default([]) }}"
  loop_control:
    label: "CT {{ item.item.vmid }} ({{ item.item.hostname }})"
  when:
    - item.rc == 0
    - item.item.hookscript is defined
    - item.item.hookscript is match('^local:snippets/')
    - item.item.started | default(true)

- name: Start LXC containers
  become: false
  no_log: true  # hides vault_proxmox_api_token_secret from -v/logs. NOTE: also
  # censors failure output — re-run with ANSIBLE_NO_LOG=False to debug (re-exposes the token).
  community.proxmox.proxmox:
    api_host: "{{ ansible_host }}"
    # Explicit — see the first proxmox call site in this file (#137).
    validate_certs: false
    api_user: "{{ vault_proxmox_api_user }}"
    api_token_id: "{{ vault_proxmox_api_token_id }}"
    api_token_secret: "{{ vault_proxmox_api_token_secret }}"
    node: "{{ proxmox_node }}"
    vmid: "{{ item.vmid }}"
    hostname: "{{ item.hostname }}"
    state: started
  delegate_to: localhost
  loop: >-
    {{ proxmox_lxcs | selectattr('started', 'defined')
    | selectattr('started', 'equalto', true) | list
    + proxmox_lxcs | rejectattr('started', 'defined') | list }}
  loop_control:
    label: "CT {{ item.vmid }} ({{ item.hostname }})"

# --- Fresh-allocation restore gate: the marker (#127) ---
#
# `mounts` is create-time-only (provisioning is pinned update:false, #86) and is
# written in ALLOCATION form (`local-zfs:110,mp=/data`) so a from-scratch rebuild
# succeeds (#87). Succeeding is the problem: the old named-subvol form failed the
# create loudly, which was an accidental tripwire. Now a rebuild runs green,
# hands the CT a FRESH EMPTY /data, and `deploy-services` initialises brand-new
# databases and app state on top of it — the vzdump restore that was supposed to
# happen in between lived only in a host_vars comment.
#
# So the create path drops a `.fresh-allocation` breadcrumb on every mount it just
# allocated AND one canonical manifest listing them all at
# `{{ fresh_allocation_manifest }}` on the container's rootfs;
# playbooks/deploy-services.yml refuses to run while that manifest exists. Two
# artefacts, one gate — deliberately: the reader must stat a SINGLE
# mount-independent path or it drifts out of step with this loop the moment a
# guest declares a second mount, which is exactly how the first version of this
# gate was defeatable.
#
# ARMING (#148). The targets come from the write-ahead INTENT RECORDS written on
# this Proxmox host before provisioning ran, not from `.changed` on the
# provisioning result. `.changed` was the only "this run created it" signal
# available, and it was also a one-shot one: a run that created the container and
# then died before reaching here consumed it, every later run saw changed=false,
# and the gate stayed unarmed for exactly the rebuild it exists to stop. An
# intent file is written before the create and deleted only after both artefacts
# are on the container, so the arming survives an arbitrary death in between.
#
# Fail-closed edges, stated rather than discovered later:
#   * markers written, operator acknowledged with `rm`, and only THEN the intent
#     cleanup died -> the next run re-writes the manifest and the operator has to
#     acknowledge a second time. Annoying, safe, and the correct polarity.
#   * a pre-#148 half-died state (container created, gate never armed, no intent
#     record because the code did not write them yet) is NOT healed
#     retroactively. It is indistinguishable from a healthy long-lived container,
#     and inventing a heuristic for it would re-arm the gate on live production
#     data. None exists on this fleet; a rebuild from here on is covered.
# Under --check the writes below are skipped, so the gate cannot FIRE in a dry
# run — but a leftover intent record does show up as pending marker work, which
# is drift being made visible rather than hidden.
- name: Enumerate fresh-allocation intent records
  become: true
  ansible.builtin.find:
    paths: "{{ fresh_allocation_intent_dir }}"
    file_type: file
  register: fresh_allocation_intents
  check_mode: false  # read-only; an absent directory yields zero files, not a failure

# `find` cannot fail: an unreadable or missing directory comes back as
# matched=0 plus a WARNING, which reads exactly like "no pending intents" — a
# disarmed gate reported as a healthy one. So make the skip an error. In a REAL
# run the unconditional directory create above guarantees the path exists, so a
# skipped path is a genuine access problem. In `--check` on a host that has
# never had a real run the create is skipped, so this would false-fire — hence
# the guard; check mode still surfaces find's own warning where an operator can
# see it.
- name: Assert the fresh-allocation intent directory was actually readable
  ansible.builtin.assert:
    that:
      - fresh_allocation_intents.skipped_paths | default({}) | length == 0
    fail_msg: >-
      Could not read {{ fresh_allocation_intent_dir }}:
      {{ fresh_allocation_intents.skipped_paths | default({}) | dictsort
      | map('join', ': ') | join('; ') }}. That directory is where the
      fresh-allocation restore gate keeps its arming state, and an unreadable
      one is indistinguishable from an empty one — refusing to continue rather
      than report a rebuild's gate as clear on the strength of a failed read.
  when: not ansible_check_mode

- name: Compute fresh-allocation marker targets
  ansible.builtin.set_fact:
    lxc_fresh_markers: "{{ markers_json | from_json }}"
    lxc_started_vmids: >-
      {{ (proxmox_lxcs | selectattr('started', 'defined')
      | selectattr('started', 'equalto', true) | list
      + proxmox_lxcs | rejectattr('started', 'defined') | list)
      | map(attribute='vmid') | list }}
  vars:
    # Basenames are strings and `vmid` is an int — compare via `| string` or the
    # intersection is silently always empty and the gate never arms at all.
    fresh_allocation_intent_vmids: >-
      {{ fresh_allocation_intents.files | default([])
      | map(attribute='path') | map('basename') | list }}
    # Paths are recomputed from host_vars `mounts`, exactly as before; the intent
    # record contributes only WHICH containers are in scope.
    markers_json: >-
      {%- set out = [] -%}
      {%- for ct in proxmox_lxcs -%}
      {%- if (ct.vmid | string) in fresh_allocation_intent_vmids -%}
      {%- for mp_key, mp_val in (ct.mounts | default({})).items() -%}
      {%- set mp_path = (mp_val.split(',') | select('match', 'mp=') | list
      | first | default('')) | replace('mp=', '', 1) -%}
      {%- if mp_path | length > 0 -%}
      {%- set _ = out.append({'vmid': ct.vmid, 'hostname': ct.hostname,
      'key': mp_key, 'path': mp_path}) -%}
      {%- endif -%}
      {%- endfor -%}
      {%- endif -%}
      {%- endfor -%}
      {{- out | to_json -}}

# The gap between "has an intent record" and "produced marker targets": a vmid
# that is still declared but whose `mounts` were removed from host_vars after the
# intent was written yields ZERO marker entries. Nothing else in this file sees
# it — it is not armed (no mounts to mark), not cleared (clearing keys off the
# markers), and not stale-removed (that only fires for vmids no longer declared
# at all). It would sit there silently, and the day `mounts` came back it would
# arm the gate over whatever data the container had accumulated in the meantime.
#
# Deliberately a loud FAIL and not an auto-delete: `mounts` is create-time-only,
# so the live container may still be carrying the un-restored volume the record
# is about, and quietly discarding the record is the fail-OPEN half of exactly
# the bug #148 fixed. Removing the file by hand is the acknowledgement, the same
# shape as the manifest `rm`.
- name: Refuse to continue with an intent record whose container declares no mounts
  ansible.builtin.fail:
    msg: >-
      {{ fresh_allocation_intent_dir }}/{{ item }} records that CT {{ item }} had
      its mounts freshly allocated and never restored, but CT {{ item }}'s
      declaration in host_vars no longer carries any `mounts`. The gate cannot
      arm — there is no mount path left to mark — and this record would
      otherwise sit here unnoticed until `mounts` was declared again, at which
      point it would arm the gate over data the container had accumulated
      meanwhile. `mounts` is create-time-only, so the live container may well
      still hold the un-restored volume: check `pct config {{ item }}`. Then
      either restore the `mounts` declaration (the gate arms on the next run) or
      delete {{ fresh_allocation_intent_dir }}/{{ item }} by hand — that
      deletion is the explicit acknowledgement, the same as the
      {{ fresh_allocation_manifest }} rm.
  loop: >-
    {{ fresh_allocation_intents.files | default([]) | map(attribute='path')
    | map('basename')
    | intersect(proxmox_lxcs | map(attribute='vmid') | map('string') | list)
    | difference(lxc_fresh_markers | default([]) | map(attribute='vmid')
    | map('string') | list) | list }}
  loop_control:
    label: "CT {{ item }} — intent record with no declared mounts"

# The marker is written with `pct exec`, which needs the container RUNNING. A
# freshly created mount-bearing CT declared `started: false` would therefore be
# skipped — and a silent skip is worse than no gate at all, because the operator
# would believe the tripwire is armed. Refuse instead. Membership is computed from
# the same expression the `Start LXC containers` loop uses, so the two cannot
# drift apart.
- name: Refuse to leave a freshly allocated mount unmarked
  ansible.builtin.fail:
    msg: >-
      CT {{ item.vmid }} ({{ item.hostname }}) carries a fresh-allocation intent
      record — this run or an earlier one allocated its mount at {{ item.path }}
      ({{ item.key }}) from scratch and the gate is still unarmed — but it is
      declared `started: false` so it is not running and the
      {{ item.path }}/.fresh-allocation breadcrumb and the
      {{ fresh_allocation_manifest }} manifest cannot be written. That manifest is
      what stops playbooks/deploy-services.yml from initialising services on an
      empty, un-restored volume (#127). Set `started: true` so the markers can be
      written. Dropping the `mounts` declaration is NOT the easy way out: it is
      only safe if the container was never actually created, and it must be
      paired with removing {{ fresh_allocation_intent_dir }}/{{ item.vmid }},
      or the next run stops on the orphaned-intent check instead.
  loop: "{{ lxc_fresh_markers | default([]) }}"
  loop_control:
    label: "CT {{ item.vmid }} ({{ item.hostname }}) — {{ item.path }}"
  when: item.vmid not in (lxc_started_vmids | default([]))

- name: Mark freshly allocated LXC mounts as un-restored
  become: true
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ item.vmid }}"
      - "--"
      - touch
      - "{{ item.path }}/.fresh-allocation"
  changed_when: true
  loop: "{{ lxc_fresh_markers | default([]) }}"
  loop_control:
    label: "CT {{ item.vmid }} ({{ item.hostname }}) — {{ item.path }}/.fresh-allocation"

# The per-mount markers above are evidence ON the volume; this manifest is the
# GATE. deploy-services.yml stats exactly one path, and it used to be a
# hard-coded `/data/.fresh-allocation` while this loop marks EVERY mount the
# build allocated — so a CT that gained a second mount would have had a fresh
# `/media/.fresh-allocation` the reader never looked at, and the play would run
# green onto an empty volume. Writing one canonical file on the container's
# ROOTFS, whose CONTENT is the same `mounts`-derived path list, makes the reader
# complete by construction for any number of mounts.
#
# `sh -c` (not `printf` via argv) because the redirect has to happen INSIDE the
# container; pct exec has no shell of its own. The paths come from the guest
# definition's `mounts` keys and are repo-controlled, not user input.
- name: Record the fresh-allocation manifest on freshly built LXC containers
  become: true
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ item.0 }}"
      - "--"
      - sh
      - -c
      - >-
        printf '%s\n' {{ item.1 | map(attribute='path') | map('quote') | join(' ') }}
        > {{ fresh_allocation_manifest | quote }}
  changed_when: true
  loop: "{{ lxc_fresh_markers | default([]) | groupby('vmid') }}"
  loop_control:
    label: "CT {{ item.0 }} — {{ fresh_allocation_manifest }}"

# Ordering is the whole design (#148): the intent record is written BEFORE the
# create and cleared only HERE, after both marker artefacts are on the container.
# Die before this task and the next run simply re-writes the same two idempotent
# artefacts and clears the intent then. Moving this task any earlier reopens the
# window the write-ahead record exists to close.
- name: Clear fresh-allocation intent records once markers are written
  become: true
  ansible.builtin.file:
    path: "{{ fresh_allocation_intent_dir }}/{{ item }}"
    state: absent
  # `map | unique` rather than the `groupby('vmid')` the manifest task above
  # uses: that task needs the grouped mount list, this one needs each vmid once,
  # and groupby hands Ansible a GroupTuple it warns about converting.
  loop: "{{ lxc_fresh_markers | default([]) | map(attribute='vmid') | unique | list }}"
  loop_control:
    label: "CT {{ item }} — intent cleared"

# An intent record whose vmid is no longer declared in host_vars would otherwise
# sit here forever, unreadable and unclearable, and every future --check would
# report phantom pending marker work. Removing it is safe: this directory only
# ever holds vmids this host declared, and a container deleted from inventory has
# no gate left to arm. `difference` on stringified vmids — the basenames are
# strings.
- name: Remove intent records for containers no longer declared
  become: true
  ansible.builtin.file:
    path: "{{ fresh_allocation_intent_dir }}/{{ item }}"
    state: absent
  loop: >-
    {{ fresh_allocation_intents.files | default([]) | map(attribute='path')
    | map('basename') | difference(proxmox_lxcs | map(attribute='vmid')
    | map('string') | list) | list }}
  loop_control:
    label: "stale intent record {{ item }} — removed"

- name: Ensure LXC root disk is resized
  become: true
  ansible.builtin.command: "pct resize {{ item.vmid }} rootfs {{ item.root_disk_size | default(proxmox_lxc_defaults.root_disk_size) }}G"
  register: pct_resize
  failed_when:
    - pct_resize.rc != 0
    - "'disk is already at specified size' not in pct_resize.stderr"
  changed_when: pct_resize.rc == 0
  loop: >-
    {{ proxmox_lxcs | selectattr('started', 'defined')
    | selectattr('started', 'equalto', true) | list
    + proxmox_lxcs | rejectattr('started', 'defined') | list }}
  loop_control:
    label: "CT {{ item.vmid }} ({{ item.hostname }})"

- name: Configure GPU device sharing for LXC containers
  ansible.builtin.include_tasks: lxc-gpu-passthrough.yml
  loop: "{{ proxmox_lxcs | selectattr('gpu_sharing', 'defined') | selectattr('gpu_sharing', 'equalto', true) | list }}"
  loop_control:
    label: "CT {{ item.vmid }} ({{ item.hostname }}) — GPU sharing"
