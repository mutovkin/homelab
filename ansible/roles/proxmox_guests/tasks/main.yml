---
# Provision VMs and LXC containers on a Proxmox host.
#
# Uses community.proxmox.proxmox_kvm for VMs and community.proxmox.proxmox for
# LXCs, but both are pinned CREATE-ONLY via `update: false` — they are not
# idempotent updaters, and left to their defaults the LXC module rewrites an
# existing container's whole config on every run (see the comments on each
# module task). Everything that converges an EXISTING guest is an explicit
# reconcile task in this file: cores/memory, startup/onboot, NICs, LXC features,
# and the cluster PCI mappings. Anything not on that list is create-time only.

# --- Guest definition schema guard ---
#
# This repo's recurring failure class is the var that LOOKS like configuration
# and is consumed by nothing: `nfs=1` as an LXC feature key (#86),
# `monitor-only=true` without `watchtower.enable` (#83), `proxmox_bridge` itself
# before #87 wired it. Each was green for the deployment's whole life. A typo in
# a guest definition (`ballon: 2048`, `scsi_hw:`) lands in exactly the same
# place: no module ever reads it, nothing fails, and the operator believes the
# value applied.
#
# So the allowed key sets below are the role's read surface, derived from what
# the tasks in this file actually reference (`item.<key>` plus the
# selectattr/rejectattr filters on `started`, `os`, `net`, `name`, `nfs_enabled`
# and `gpu_sharing`). Adding a key to a guest definition means teaching the role
# to read it — and therefore adding it here in the same change.
- name: Assert VM definitions use only keys this role reads
  ansible.builtin.assert:
    that:
      - item.keys() | difference(proxmox_vm_allowed_keys) | length == 0
    fail_msg: >-
      VM {{ item.vmid | default('<no vmid>') }} declares
      {{ item.keys() | difference(proxmox_vm_allowed_keys) | join(', ') }},
      which is consumed by nothing in the proxmox_guests role — a typo, or a
      field the role was never taught to read. Either way it would silently do
      nothing. Fix the spelling, or add the key to both the role and this list.
  vars:
    proxmox_vm_allowed_keys:
      - vmid
      - name
      - cores
      - sockets
      - memory
      - bios
      - machine
      - scsihw
      - vga
      - scsi
      - agent
      - balloon
      - cpu
      - usb
      - localtime
      - tablet
      - net
      - net_bridge
      - hostpci
      - efidisk0
      - ide
      - onboot
      - started
      - startup
      - tags
      - description
  loop: "{{ proxmox_vms }}"
  loop_control:
    label: "VM {{ item.vmid | default('?') }} — schema"

- name: Assert LXC definitions use only keys this role reads
  ansible.builtin.assert:
    that:
      - item.keys() | difference(proxmox_lxc_allowed_keys) | length == 0
    fail_msg: >-
      CT {{ item.vmid | default('<no vmid>') }} declares
      {{ item.keys() | difference(proxmox_lxc_allowed_keys) | join(', ') }},
      which is consumed by nothing in the proxmox_guests role — a typo, or a
      field the role was never taught to read. Either way it would silently do
      nothing. Fix the spelling, or add the key to both the role and this list.
  vars:
    proxmox_lxc_allowed_keys:
      - vmid
      - hostname
      - os
      - ostemplate
      - cores
      - memory
      - swap
      - storage
      - root_disk_size
      - mounts
      - netif
      - net_bridge
      - nesting
      - nfs_enabled
      - unprivileged
      - gpu_sharing
      - onboot
      - started
      - startup
      - tags
      - description
  loop: "{{ proxmox_lxcs }}"
  loop_control:
    label: "CT {{ item.vmid | default('?') }} — schema"

# --- LXC template auto-resolution ---
# LXC definitions can use `os: ubuntu-24.04` instead of a hardcoded ostemplate.
# This pre-task resolves the latest available template for each OS, downloads
# it if missing, and builds a lookup dict (resolved_templates) for provisioning.

- name: Refresh Proxmox appliance list
  ansible.builtin.command: pveam update
  changed_when: false
  check_mode: false  # read-only; must run in --check so template resolution works

- name: Collect unique OS names from LXC definitions
  ansible.builtin.set_fact:
    lxc_os_names: "{{ proxmox_lxcs | selectattr('os', 'defined') | map(attribute='os') | unique | list }}"

- name: Resolve latest template for each OS
  ansible.builtin.shell: |
    set -o pipefail
    pveam available --section system | grep '{{ proxmox_templates[item] }}' | tail -1 | awk '{print $2}'
  args:
    executable: /bin/bash
  register: template_resolution
  changed_when: false
  check_mode: false  # read-only pveam query; must run in --check to populate resolved_templates
  loop: "{{ lxc_os_names }}"
  when: lxc_os_names | length > 0

- name: Build resolved templates lookup
  ansible.builtin.set_fact:
    resolved_templates: "{{ resolved_templates | default({}) | combine({item.item: 'local:vztmpl/' + item.stdout}) }}"
  loop: "{{ template_resolution.results | default([]) }}"
  when:
    - template_resolution.results is defined
    - item.stdout | default('') | length > 0

- name: Check which templates are already downloaded
  ansible.builtin.stat:
    path: "/var/lib/vz/template/cache/{{ item.stdout }}"
  register: template_cache_check
  loop: "{{ template_resolution.results | default([]) }}"
  when:
    - template_resolution.results is defined
    - item.stdout | default('') | length > 0

- name: Download missing LXC templates
  ansible.builtin.command: "pveam download local {{ item.item.stdout }}"
  changed_when: true
  loop: "{{ template_cache_check.results | default([]) }}"
  when:
    - template_cache_check.results is defined
    - not (item.stat.exists | default(true))
  loop_control:
    label: "{{ item.item.stdout | default('unknown') }}"

# --- TrueNAS ISO & PCI Mapping ---

# Refuse to fetch the ISO unverified: a blank/short checksum would make get_url
# silently skip verification, defeating the whole point.
- name: Assert TrueNAS ISO checksum is configured
  ansible.builtin.assert:
    that:
      - truenas_iso_sha256 is defined
      - truenas_iso_sha256 | length == 64
    fail_msg: >-
      truenas_iso_sha256 is missing or not a 64-char sha256. Refusing to fetch
      the TrueNAS ISO unverified — update it alongside truenas_iso_version in
      proxmox_guests/defaults/main.yml.
  when: >
    proxmox_vms | selectattr('name', 'equalto', 'truenas') | list | length > 0

# No stat existence-gate: get_url with a checksum is already idempotent — it
# skips the network fetch when the on-disk file matches, re-downloads when it
# does not, and fails loudly if the result still mismatches. Gating on mere
# existence would skip verification of an existing-but-corrupt file (the exact
# "trusted forever" bug this guards against).
- name: Ensure TrueNAS ISO is present and matches published checksum
  ansible.builtin.get_url:
    url: "{{ truenas_iso_base_url }}/{{ truenas_iso_version }}/{{ truenas_iso_filename }}"
    dest: "/var/lib/vz/template/iso/{{ truenas_iso_filename }}"
    checksum: "sha256:{{ truenas_iso_sha256 }}"
    mode: "0644"
  when: >
    proxmox_vms | selectattr('name', 'equalto', 'truenas') | list | length > 0

# --- Cluster PCI resource mappings ---
#
# The mappings are DATA (`proxmox_pci_mappings` in host_vars), not hardcoded
# pvesh invocations, and they are RECONCILED rather than created-once. Values
# are pinned to observed hardware — if a card is re-seated and its path or
# IOMMU group changes, update host_vars and re-run; the role converges the
# cluster mapping. A guest's hostpci line references the mapping by id
# (`mapping=truenas_sata`), so the hardware pointer only ever lives here.
#
# Safe on a running guest: mappings are resolved by QEMU at VM *start*, so
# `pvesh set` edits cluster config only and never touches a running VM.
#
# The read task is `check_mode: false` on purpose. Skipping it in --check would
# leave `.rc` undefined for the create/update `when:` expressions (the old
# create-only tasks had exactly that latent landmine), and it is what makes
# `--check` a real drift report instead of a wall of "skipping".
#
# `failed_when` is DISCRIMINATING, not blanket-false. A genuinely missing
# mapping exits 255 with "mapping '<id>' not found" on stderr and is the normal
# first-run state; anything else (pmxcfs wedged, API down, permission denied)
# must fail loudly rather than be silently treated as "absent" — which would
# quietly recreate a mapping we simply failed to read.
- name: Read current cluster PCI mappings
  ansible.builtin.command: "pvesh get /cluster/mapping/pci/{{ item.id }} --output-format json"
  register: pci_mapping_current
  failed_when:
    - pci_mapping_current.rc != 0
    - "'not found' not in pci_mapping_current.stderr"
  changed_when: false
  check_mode: false
  loop: "{{ proxmox_pci_mappings }}"
  loop_control:
    label: "PCI mapping {{ item.id }}"

# Desired map string, built once, in pvesh's own (alphabetical) field order so a
# converged mapping compares byte-equal against the live JSON.
- name: Build desired PCI mapping state
  ansible.builtin.set_fact:
    pci_mapping_desired: >-
      {{ pci_mapping_desired | default({}) | combine({item.id: {
        'map': 'id=' ~ item.device_id
               ~ ',iommugroup=' ~ item.iommugroup
               ~ ',node=' ~ proxmox_node
               ~ ',path=' ~ item.path
               ~ ',subsystem-id=' ~ item.subsystem_id,
        'description': item.description | default(''),
      }}) }}
  loop: "{{ proxmox_pci_mappings }}"
  loop_control:
    label: "PCI mapping {{ item.id }}"

# A cluster PCI mapping can carry one entry PER NODE — `map` is a list. This
# role models a single-node mapping (one `path`/`iommugroup` per id), so its
# compare assumes a one-element list and `pvesh set -map <single>` would REPLACE
# the whole list, deleting other nodes' entries. Refuse rather than clobber.
# Every task below is additionally gated on length == 1 so nothing is reachable
# for a multi-node mapping even if this fail is ever removed.
- name: Refuse to converge multi-node PCI mappings
  ansible.builtin.fail:
    msg: >-
      Multi-node PCI mappings are not supported by this role; refusing to
      converge '{{ item.item.id }}'. It has
      {{ (item.stdout | from_json).map | length }} node entries
      ({{ (item.stdout | from_json).map | join(' | ') }}) and `pvesh set -map`
      replaces the entire list, which would delete the other nodes' entries.
      Manage this mapping outside the role, or reduce it to a single node.
  loop: "{{ pci_mapping_current.results | default([]) }}"
  loop_control:
    label: "PCI mapping {{ item.item.id }}"
  when:
    - item.rc == 0
    - (item.stdout | from_json).map | default([]) | length > 1

# Drift report. Runs in check mode (debug always does), so `--check` surfaces
# exactly what a real run would create or rewrite.
- name: Report absent PCI mappings
  ansible.builtin.debug:
    msg: "PCI mapping {{ item.item.id }}: absent — will create map={{ pci_mapping_desired[item.item.id].map }}"
  loop: "{{ pci_mapping_current.results | default([]) }}"
  loop_control:
    label: "PCI mapping {{ item.item.id }}"
  when: item.rc != 0

- name: Report PCI mapping drift
  ansible.builtin.debug:
    msg: >-
      PCI mapping {{ item.item.id }} drift:
      current={{ (item.stdout | from_json).map | default([]) | join(',') }}
      | {{ (item.stdout | from_json).description | default('') }}
      desired={{ pci_mapping_desired[item.item.id].map }}
      | {{ pci_mapping_desired[item.item.id].description }}
  loop: "{{ pci_mapping_current.results | default([]) }}"
  loop_control:
    label: "PCI mapping {{ item.item.id }}"
  when:
    - item.rc == 0
    - (item.stdout | from_json).map | default([]) | length == 1
    - >-
      (item.stdout | from_json).map | default([]) != [pci_mapping_desired[item.item.id].map]
      or (item.stdout | from_json).description | default('') != pci_mapping_desired[item.item.id].description

# argv form: the description contains spaces and must not go through a shell.
- name: Create missing cluster PCI mappings
  ansible.builtin.command:
    argv:
      - pvesh
      - create
      - /cluster/mapping/pci
      - "-id"
      - "{{ item.item.id }}"
      - "-map"
      - "{{ pci_mapping_desired[item.item.id].map }}"
      - "-description"
      - "{{ pci_mapping_desired[item.item.id].description }}"
  changed_when: true
  loop: "{{ pci_mapping_current.results | default([]) }}"
  loop_control:
    label: "PCI mapping {{ item.item.id }} — create"
  when: item.rc != 0

- name: Converge drifted cluster PCI mappings
  ansible.builtin.command:
    argv:
      - pvesh
      - set
      - "/cluster/mapping/pci/{{ item.item.id }}"
      - "-map"
      - "{{ pci_mapping_desired[item.item.id].map }}"
      - "-description"
      - "{{ pci_mapping_desired[item.item.id].description }}"
  changed_when: true
  loop: "{{ pci_mapping_current.results | default([]) }}"
  loop_control:
    label: "PCI mapping {{ item.item.id }} — update"
  when:
    - item.rc == 0
    - (item.stdout | from_json).map | default([]) | length == 1
    - >-
      (item.stdout | from_json).map | default([]) != [pci_mapping_desired[item.item.id].map]
      or (item.stdout | from_json).description | default('') != pci_mapping_desired[item.item.id].description

# --- VM provisioning ---

- name: Provision virtual machines
  become: false
  no_log: true  # hides vault_proxmox_api_token_secret from -v/logs. NOTE: also
  # censors failure output — re-run with ANSIBLE_NO_LOG=False to debug (re-exposes the token).
  community.proxmox.proxmox_kvm:
    api_host: "{{ ansible_host }}"
    api_user: "{{ vault_proxmox_api_user }}"
    api_token_id: "{{ vault_proxmox_api_token_id }}"
    api_token_secret: "{{ vault_proxmox_api_token_secret }}"
    node: "{{ proxmox_node }}"
    vmid: "{{ item.vmid }}"
    name: "{{ item.name }}"
    cores: "{{ item.cores | default(proxmox_vm_defaults.cores) }}"
    sockets: "{{ item.sockets | default(proxmox_vm_defaults.sockets) }}"
    memory: "{{ item.memory | default(proxmox_vm_defaults.memory) }}"
    bios: "{{ item.bios | default(proxmox_vm_defaults.bios) }}"
    # null default → omitted → PVE's own default machine type (i440fx), which is
    # what VM 100 actually runs; a guest that needs q35 says so in host_vars.
    machine: "{{ item.machine | default(proxmox_vm_defaults.machine) | default(omit, true) }}"
    onboot: "{{ item.onboot | default(proxmox_vm_defaults.onboot) }}"
    scsihw: "{{ item.scsihw | default('virtio-scsi-single') }}"
    vga: "{{ item.vga | default(omit) }}"
    scsi: "{{ item.scsi | default({}) }}"
    # Rebuild fidelity (#87) — modelled from the live guests so a from-scratch
    # create matches them. Omitted when a guest does not declare them.
    agent: "{{ item.agent | default(omit) }}"
    balloon: "{{ item.balloon | default(omit) }}"
    cpu: "{{ item.cpu | default(omit) }}"
    usb: "{{ item.usb | default(omit) }}"
    localtime: "{{ item.localtime | default(omit) }}"
    tablet: "{{ item.tablet | default(omit) }}"
    net: "{{ item.net | default({'net0': 'virtio,bridge=' + (item.net_bridge | default(proxmox_vm_defaults.net_bridge))}) }}"
    hostpci: "{{ item.hostpci | default({}) }}"
    efidisk0: "{{ item.efidisk0 | default(omit) }}"
    ide: "{{ item.ide | default(omit) }}"
    tags: "{{ item.tags | default([]) }}"
    description: "{{ item.description | default('') }}"
    startup: "{{ item.startup | default(omit) }}"
    state: present
    # CREATION ONLY. proxmox_kvm's `update` still defaults to false, but pin it
    # explicitly so a future collection bump cannot silently flip this task into
    # the same blind config PUT that bit the LXC task below. Every update in this
    # role is an explicit reconcile task, never a module side effect.
    update: false
  delegate_to: localhost
  loop: "{{ proxmox_vms }}"
  loop_control:
    label: "VM {{ item.vmid }} ({{ item.name }})"

# --- Existing-VM reconcile: the one live read (#86, #119) ---
#
# proxmox_kvm state=present only CREATES; it never updates an existing VM. So
# every convergence of a live VM in this role is an explicit task below, and they
# all share ONE shape: read live state here → compute drift in Jinja → report it
# with `debug` → apply it with a guarded `command`.
#
# Why the shape matters (#119): the NIC and startup/onboot reconciles used to be
# `shell` tasks that read `qm config` inside the script. `shell` is skipped
# wholesale under `--check`, so NIC and boot-order drift were invisible in the
# documented dry run — and the reads themselves were unguarded, saved only by
# provisioning order.
#
# The reads are `check_mode: false` on purpose. Skipping them in --check would
# leave `.rc` undefined for every `when:` below, and it is what makes `--check` a
# real drift report instead of a wall of "skipping".
#
# `failed_when` is DISCRIMINATING, not blanket-false. A guest listed in host_vars
# but not yet created has no config to read. That is the normal state during a dry
# run of a NEW guest — provisioning is skipped in --check, so `qm config
# <new-vmid>` exits 2 with "Configuration file '...' does not exist" on stderr —
# and the documented dry-run-first workflow must not blow up on it. But the
# tolerance is DISCRIMINATING: any other failure (pmxcfs unavailable, permission
# denied) fails loudly, because silently treating it as "absent" would drop a live
# guest out of reconcile entirely.
#
# ONE read feeds all three computes (NIC, startup/onboot, cores/memory) and is NOT
# re-read between their applies. That is safe by construction, not by luck: the
# three touch disjoint field sets — `net*`, `startup`/`onboot`, `cores`/`memory` —
# so no apply can invalidate a later compute. Adding a fourth reconcile means
# checking that property again.
- name: Read current VM configuration
  become: true
  ansible.builtin.command: "qm config {{ item.vmid }}"
  register: vm_config_raw
  changed_when: false
  failed_when:
    - vm_config_raw.rc != 0
    - "'does not exist' not in vm_config_raw.stderr"
  check_mode: false  # read-only; must run in --check so drift is reported, not skipped
  loop: "{{ proxmox_vms }}"
  loop_control:
    label: "VM {{ item.vmid }} ({{ item.name }})"

- name: Read current VM run state
  become: true
  ansible.builtin.command: "qm status {{ item.vmid }}"
  register: vm_status_raw
  changed_when: false
  failed_when:
    - vm_status_raw.rc != 0
    - "'does not exist' not in vm_status_raw.stderr"
  check_mode: false  # read-only; gates whether drift may be applied at all
  loop: "{{ proxmox_vms }}"
  loop_control:
    label: "VM {{ item.vmid }} ({{ item.name }})"

- name: Report VMs that do not exist yet
  ansible.builtin.debug:
    msg: "VM {{ item.item.vmid }} ({{ item.item.name }}): not created yet — provisioning owns creation"
  loop: "{{ vm_config_raw.results | default([]) }}"
  loop_control:
    label: "VM {{ item.item.vmid }} ({{ item.item.name }})"
  when: item.rc != 0

# Facts persist across role inclusions within a play, so seed the accumulators
# explicitly rather than relying on `| default([])` to paper over a stale value.
- name: Seed VM drift accumulators
  ansible.builtin.set_fact:
    vm_nic_drift: []
    vm_startup_drift: []
    vm_resource_drift: []

# --- VM NIC reconcile (#36, #119) ---
#
# MAC PRESERVATION IS THE WHOLE POINT OF THIS TASK. `qm set -netN` REPLACES the
# interface: pushing a desired string without a MAC at a NIC that has one makes
# Proxmox generate a fresh MAC, and the guest OS loses its network config (and its
# DHCP reservation). VM 100 is the LIVE Home Assistant VM and IS reconciled here,
# so a bug in this compute hot-rewrites its NIC.
#
# The three branches below are a field-for-field port of the bash this replaced —
# same order, same predicates:
#   1. NIC absent from `qm config`  -> add the desired string as-is.
#   2. live has a MAC, desired does not -> strip `=<mac>` from live (first
#      occurrence, exactly like the old `sed -E "s/=$mac//i"`; the MAC is
#      extracted FROM the live string, so it is a literal substring and needs no
#      case folding) and compare the remainder. Only if that differs do we write,
#      re-injecting the live MAC as `<model>=<mac>,<rest>`. `<rest>` is everything
#      after the first comma, or the whole string when there is no comma — the old
#      `cut -d',' -f2-` behaviour.
#   3. otherwise (neither has a MAC, or desired pins one) -> plain string compare.
# Fleet state this must stay a no-op for: VM 100 pins its MAC in host_vars
# (branch 3, equal), VM 200's net0/net1 declare no MAC (branch 2, remainder
# equal). Both were simulated against captured live configs before this landed.
- name: Compute VM NIC drift
  ansible.builtin.set_fact:
    vm_nic_drift: "{{ vm_nic_drift + [drift_entry] }}"
  vars:
    nic_plan_json: >-
      {%- set out = [] -%}
      {%- for nic_name, nic_val in item.item.net.items() -%}
      {%- set matches = item.stdout_lines | default([]) | select('match', nic_name ~ ':') | list -%}
      {%- set current = matches[0].split(' ', 1)[1] if matches else '' -%}
      {%- set mac = current | regex_search('[0-9A-Fa-f]{2}(?::[0-9A-Fa-f]{2}){5}') -%}
      {%- set desired_has_mac = nic_val is search('([0-9a-fA-F]{2}:){5}[0-9a-fA-F]{2}') -%}
      {%- if current == '' -%}
      {%- set _ = out.append({'arg': '-' ~ nic_name ~ ' ' ~ nic_val, 'human': nic_name ~ ' absent live — will add ' ~ nic_val}) -%}
      {%- elif mac and not desired_has_mac -%}
      {%- set current_no_mac = current.replace('=' ~ mac, '', 1) -%}
      {%- if current_no_mac != nic_val -%}
      {%- set model = nic_val.split(',')[0] -%}
      {%- set rest = nic_val.split(',', 1)[1] if ',' in nic_val else nic_val -%}
      {%- set _ = out.append({'arg': '-' ~ nic_name ~ ' ' ~ model ~ '=' ~ mac ~ ',' ~ rest,
      'human': nic_name ~ ' live=' ~ current ~ ' desired=' ~ nic_val
      ~ ' (re-injecting live MAC ' ~ mac ~ ')'}) -%}
      {%- endif -%}
      {%- elif current != nic_val -%}
      {%- set _ = out.append({'arg': '-' ~ nic_name ~ ' ' ~ nic_val, 'human': nic_name ~ ' live=' ~ current ~ ' desired=' ~ nic_val}) -%}
      {%- endif -%}
      {%- endfor -%}
      {{- out | to_json -}}
    nic_plan: "{{ nic_plan_json | from_json }}"
    drift_entry:
      vmid: "{{ item.item.vmid }}"
      name: "{{ item.item.name }}"
      args: "{{ nic_plan | map(attribute='arg') | join(' ') }}"
      human: "{{ nic_plan | map(attribute='human') | join('; ') }}"
  loop: "{{ vm_config_raw.results | default([]) }}"
  loop_control:
    label: "VM {{ item.item.vmid }} ({{ item.item.name }})"
  when:
    # rc first: a non-existent guest has no config to parse, and nic_plan must
    # never be evaluated against a stderr blob. `net` second: a VM that declares
    # no `net` is not enrolled in NIC reconcile at all (the old task's
    # selectattr('net', 'defined') loop).
    - item.rc == 0
    - item.item.net is defined
    - nic_plan | length > 0

- name: Report VM NIC drift
  ansible.builtin.debug:
    msg: "VM {{ item.vmid }} ({{ item.name }}): {{ item.human }} — will apply via qm set"
  loop: "{{ vm_nic_drift | default([]) }}"
  loop_control:
    label: "VM {{ item.vmid }} ({{ item.name }})"

# Hot on a running VM (Proxmox re-plugs the NIC); deliberate — see #36. Guarded by
# construction: the loop is empty unless the compute above found real drift.
- name: Apply NIC changes to existing VMs
  become: true
  ansible.builtin.command: "qm set {{ item.vmid }} {{ item.args }}"
  changed_when: true
  loop: "{{ vm_nic_drift | default([]) }}"
  loop_control:
    label: "VM {{ item.vmid }} ({{ item.name }}) — net"

# --- VM startup/onboot reconcile (#36, #119) ---
#
# Same create-only limitation as networking above: startup/onboot set in vars
# never reach a VM that already existed when the value was added — so boot order
# silently drifts (TrueNAS lost its order=1, booting AFTER its NFS consumer; #36).
# This is a config change only — qm set does not restart the guest.
#
# `startup` is compared ONLY when the guest declares one: an absent declaration
# means "not managed", not "clear it" (the old `[ -n "$desired_startup" ]` guard).
# `onboot` has no such opt-out — it has a role default — and a VM with no `onboot:`
# line in `qm config` sits on Proxmox's own default of 0.
- name: Compute VM startup/onboot drift
  ansible.builtin.set_fact:
    vm_startup_drift: "{{ vm_startup_drift + [drift_entry] }}"
  vars:
    live_startup: "{{ item.stdout | regex_search('(?m)^startup: (.*)$', '\\1') | default([], true) | join }}"
    live_onboot: "{{ item.stdout | regex_search('(?m)^onboot: (\\d+)', '\\1') | default([], true) | join | default('0', true) }}"
    want_startup: "{{ item.item.startup | default('') }}"
    want_onboot: "{{ (item.item.onboot | default(proxmox_vm_defaults.onboot)) | ternary(1, 0) }}"
    drift_fields: >-
      {{ ([] if (want_startup | length == 0 or live_startup == want_startup) else ['startup'])
         + ([] if live_onboot | int == want_onboot | int else ['onboot']) }}
    drift_entry:
      vmid: "{{ item.item.vmid }}"
      name: "{{ item.item.name }}"
      args: >-
        {{ ((['-startup ' ~ want_startup] if 'startup' in drift_fields else [])
            + (['-onboot ' ~ want_onboot] if 'onboot' in drift_fields else [])) | join(' ') }}
      human: >-
        {{ ((['startup live=' ~ (live_startup | default('<unset>', true)) ~ ' desired=' ~ want_startup] if 'startup' in drift_fields else [])
            + (['onboot live=' ~ live_onboot ~ ' desired=' ~ want_onboot] if 'onboot' in drift_fields else [])) | join(', ') }}
  loop: "{{ vm_config_raw.results | default([]) }}"
  loop_control:
    label: "VM {{ item.item.vmid }} ({{ item.item.name }})"
  when:
    # rc first: a non-existent guest has no config to parse, and drift_fields
    # must never be evaluated against a stderr blob.
    - item.rc == 0
    - drift_fields | length > 0

- name: Report VM startup/onboot drift
  ansible.builtin.debug:
    msg: "VM {{ item.vmid }} ({{ item.name }}): {{ item.human }} — will apply via qm set"
  loop: "{{ vm_startup_drift | default([]) }}"
  loop_control:
    label: "VM {{ item.vmid }} ({{ item.name }})"

- name: Apply startup/onboot to existing VMs
  become: true
  ansible.builtin.command: "qm set {{ item.vmid }} {{ item.args }}"
  changed_when: true
  loop: "{{ vm_startup_drift | default([]) }}"
  loop_control:
    label: "VM {{ item.vmid }} ({{ item.name }}) — startup/onboot"

# --- VM cores/memory reconcile (#86) ---
#
# proxmox_kvm state=present creates but never updates, so cores/memory edited in
# host_vars silently never reached an existing VM. These tasks close that gap.
#
# RECONCILED HERE: cores, memory. Nothing else.
# RECONCILED BY THEIR OWN TASKS ABOVE: net (MAC-preserving NIC task),
# startup/onboot.
# CREATE-TIME ONLY (deliberate — changing them on a live guest is destructive,
# guest-visible, or both): sockets, bios, machine, vga, scsi, scsihw, efidisk0,
# ide, hostpci, agent, balloon, cpu, usb, localtime, tablet, tags, description,
# name — all passed at create and never reconciled afterwards. Those fields were
# modelled from the live guests in #87 so a from-scratch rebuild matches them;
# `ide2` in particular must NOT be reconciled — the TrueNAS installer ISO is
# deliberately ejected post-install, so live reads `none,media=cdrom` while
# host_vars still names the ISO. That mismatch is the documented DR flow; see
# the comment on ide2 in n5pro host_vars.
#
# Neither VM has memory/cpu hotplug enabled, so applying cores/memory to a
# RUNNING VM cannot take effect without a guest stop. We therefore fail loudly
# instead of warning: a warning inside a green play is exactly how this drift
# went unnoticed in the first place. `qm set` on a running VM would also create
# pending changes that make `qm config` disagree with the running guest and
# poison this very comparison.
#
# Reads and the drift accumulator live in the shared block above (#119).
#
# A missing `cores:`/`memory:` line means the VM sits on Proxmox's own default
# (1 core / 512 MB) — qm config omits keys that were never set.
- name: Compute VM cores/memory drift
  ansible.builtin.set_fact:
    vm_resource_drift: "{{ vm_resource_drift | default([]) + [drift_entry] }}"
  vars:
    live_cores: "{{ item.stdout | regex_search('(?m)^cores: (\\d+)', '\\1') | default([], true) | join | default('1', true) }}"
    live_memory: "{{ item.stdout | regex_search('(?m)^memory: (\\d+)', '\\1') | default([], true) | join | default('512', true) }}"
    want_cores: "{{ item.item.cores | default(proxmox_vm_defaults.cores) }}"
    want_memory: "{{ item.item.memory | default(proxmox_vm_defaults.memory) }}"
    drift_fields: >-
      {{ ([] if live_cores | int == want_cores | int else ['cores'])
         + ([] if live_memory | int == want_memory | int else ['memory']) }}
    status_result: "{{ vm_status_raw.results | selectattr('item.vmid', 'equalto', item.item.vmid) | list }}"
    status_rc: "{{ status_result | map(attribute='rc') | join }}"
    status_out: "{{ status_result | map(attribute='stdout') | join }}"
    drift_entry:
      vmid: "{{ item.item.vmid }}"
      name: "{{ item.item.name }}"
      # 'yes'/'no' rather than a bool: set_fact round-trips values through
      # templating, and a plain string compares unambiguously downstream.
      #
      # Fails CLOSED: 'no' (safe to mutate) requires positive proof — the status
      # read succeeded AND printed exactly `status: stopped`. A failed read or
      # any unexpected output is 'yes' and gets refused.
      #
      # To be accurate about what this does and does not catch: plain `qm status`
      # only ever prints running or stopped (the richer paused/prelaunch/io-error
      # values are qmpstatus and never appear here), so the closed polarity is
      # mainly insurance against a failed or empty read rather than against exotic
      # states. The one real case it does NOT catch alone is a hibernated
      # (suspend-to-disk) VM, which honestly reports stopped and will reach
      # `qm set` — there Proxmox's own `suspended` lock rejects the command
      # loudly. Gate plus lock keep that safe; the gate by itself would not.
      running: "{{ 'no' if (status_rc == '0' and status_out is search('(?m)^status: stopped')) else 'yes' }}"
      args: >-
        {{ ((['-cores ' ~ want_cores] if 'cores' in drift_fields else [])
            + (['-memory ' ~ want_memory] if 'memory' in drift_fields else [])) | join(' ') }}
      human: >-
        {{ ((['cores live=' ~ live_cores ~ ' desired=' ~ want_cores] if 'cores' in drift_fields else [])
            + (['memory live=' ~ live_memory ~ ' desired=' ~ want_memory] if 'memory' in drift_fields else [])) | join(', ') }}
  loop: "{{ vm_config_raw.results | default([]) }}"
  loop_control:
    label: "VM {{ item.item.vmid }} ({{ item.item.name }})"
  when:
    # rc first: a non-existent guest has no config to parse, and drift_fields
    # must never be evaluated against a stderr blob.
    - item.rc == 0
    - drift_fields | length > 0

- name: Report VM cores/memory drift
  ansible.builtin.debug:
    msg: "VM {{ item.vmid }} ({{ item.name }}): {{ item.human }} — will apply via qm set (VM is stopped)"
  loop: "{{ vm_resource_drift | default([]) | selectattr('running', 'equalto', 'no') | list }}"
  loop_control:
    label: "VM {{ item.vmid }} ({{ item.name }})"

# Runs in check mode too, so `task infra:hosts:check` reports the conflict
# instead of a silently green play.
- name: Refuse to change cores/memory on a VM that is not confirmed stopped
  ansible.builtin.fail:
    msg: >-
      Refusing to change a VM that is not confirmed stopped.
      {% for e in vm_resource_drift | default([]) | selectattr('running', 'equalto', 'yes') | list %}
      VM {{ e.vmid }} ({{ e.name }}): {{ e.human }}.
      {% endfor %}
      Memory/CPU hotplug is not enabled on these VMs; converging would require a
      guest stop. Either pin host_vars back to the live values, or stop the VM in
      a maintenance window and re-run.
      Note that once the VM is stopped, a single re-run both applies the change
      AND boots the guest again — the 'Start virtual machines' task below starts
      anything with `started: true`, so no second run is needed.
      Scope the maintenance run with `--limit <host>` (e.g.
      `task infra:hosts -- --limit {{ inventory_hostname }}`).
  when: vm_resource_drift | default([]) | selectattr('running', 'equalto', 'yes') | list | length > 0

# Stopped VMs only — enforced by the loop, not just by the fail task above.
- name: Apply cores/memory to stopped VMs
  become: true
  ansible.builtin.command: "qm set {{ item.vmid }} {{ item.args }}"
  changed_when: true
  loop: "{{ vm_resource_drift | default([]) | selectattr('running', 'equalto', 'no') | list }}"
  loop_control:
    label: "VM {{ item.vmid }} ({{ item.name }}) — cores/memory"

- name: Start virtual machines
  become: false
  no_log: true  # hides vault_proxmox_api_token_secret from -v/logs. NOTE: also
  # censors failure output — re-run with ANSIBLE_NO_LOG=False to debug (re-exposes the token).
  community.proxmox.proxmox_kvm:
    api_host: "{{ ansible_host }}"
    api_user: "{{ vault_proxmox_api_user }}"
    api_token_id: "{{ vault_proxmox_api_token_id }}"
    api_token_secret: "{{ vault_proxmox_api_token_secret }}"
    node: "{{ proxmox_node }}"
    vmid: "{{ item.vmid }}"
    state: started
  delegate_to: localhost
  loop: >-
    {{ proxmox_vms | selectattr('started', 'defined')
    | selectattr('started', 'equalto', true) | list
    + proxmox_vms | rejectattr('started', 'defined') | list }}
  loop_control:
    label: "VM {{ item.vmid }} ({{ item.name }})"

- name: Fail if OS template resolution failed
  ansible.builtin.fail:
    msg: "OS '{{ item.os }}' was requested but no template was resolved. Check pveam available output."
  loop: "{{ proxmox_lxcs | selectattr('os', 'defined') | list }}"
  when: resolved_templates[item.os] | default('') | length == 0
  loop_control:
    label: "CT {{ item.vmid }} ({{ item.hostname }})"

- name: Provision LXC containers
  become: false
  no_log: true  # hides vault_proxmox_api_token_secret from -v/logs. NOTE: also
  # censors failure output — re-run with ANSIBLE_NO_LOG=False to debug (re-exposes the token).
  community.proxmox.proxmox:
    api_host: "{{ ansible_host }}"
    api_user: "{{ vault_proxmox_api_user }}"
    api_token_id: "{{ vault_proxmox_api_token_id }}"
    api_token_secret: "{{ vault_proxmox_api_token_secret }}"
    node: "{{ proxmox_node }}"
    vmid: "{{ item.vmid }}"
    hostname: "{{ item.hostname }}"
    ostemplate: "{{ resolved_templates[item.os] | default(item.ostemplate | default(proxmox_lxc_defaults.ostemplate)) }}"
    cores: "{{ item.cores | default(proxmox_lxc_defaults.cores) }}"
    memory: "{{ item.memory | default(proxmox_lxc_defaults.memory) }}"
    swap: "{{ item.swap | default(proxmox_lxc_defaults.swap) }}"
    storage: "{{ item.storage | default(proxmox_lxc_defaults.storage) }}"
    disk: "{{ item.storage | default(proxmox_lxc_defaults.storage) }}:{{ item.root_disk_size | default(proxmox_lxc_defaults.root_disk_size) }}"
    mounts: "{{ item.mounts | default({}) }}"
    netif: "{{ item.netif | default({'net0': 'name=eth0,bridge=' + (item.net_bridge | default(proxmox_lxc_defaults.net_bridge)) + ',ip=dhcp,type=veth'}) }}"
    onboot: "{{ item.onboot | default(proxmox_lxc_defaults.onboot) }}"
    unprivileged: "{{ item.unprivileged | default(proxmox_lxc_defaults.unprivileged) }}"
    pubkey: >-
      {% set keys = [] %}
      {% for keyfile in q('fileglob', inventory_dir + '/../files/ssh_keys/*.pub') %}
      {%   set _ = keys.append(lookup('file', keyfile)) %}
      {% endfor %}
      {{ keys | join('\n') }}
    features: >-
      {{ ['nesting=' ~ (item.nesting | default(proxmox_lxc_defaults.nesting)
      | ternary('1', '0'))] if (item.unprivileged
      | default(proxmox_lxc_defaults.unprivileged)) else omit }}
    tags: "{{ item.tags | default([]) }}"
    description: "{{ item.description | default('') }}"
    startup: "{{ item.startup | default(omit) }}"
    state: present
    # CREATION ONLY — do not remove.
    #
    # community.proxmox 1.0.0 flipped this module's `update` default from false
    # to true (1.6.0 argspec: update=dict(type="bool", default=True)). With it
    # true, `state: present` on an EXISTING container runs update_lxc_instance()
    # every single run, and that path:
    #   (a) never converges — it diffs task params against the stored config,
    #       and several can never match. `tags` is compared as a Python list
    #       ("['docker']") against the API's string ("docker"); `description`
    #       comes back URL-encoded with a trailing %0A; `disk` becomes a
    #       synthesized rootfs that cannot equal the real `subvol-…` volume.
    #   (b) on ANY non-empty diff PUTs the FULL kwargs set, not the diff
    #       (config.put(vmid=…, **kwargs)), then reports changed=True
    #       unconditionally.
    # So it rewrote netif/rootfs/mp on every run — the exact unguarded-mutation
    # class #86 exists to prevent. On n5pro it would PUT CT 201's mp0 in
    # allocation syntax ("local-zfs:200,mp=/data") over a live named subvol.
    #
    # This role uses the module for CREATION ONLY; every update is an explicit
    # reconcile task. `state: started` below is unaffected — that dispatch
    # branch never reads `update`.
    update: false
  delegate_to: localhost
  loop: "{{ proxmox_lxcs }}"
  loop_control:
    label: "CT {{ item.vmid }} ({{ item.hostname }})"

# --- Existing-CT reconcile: the one live read (#86, #119) ---
#
# Mirror of the VM block above, and for the same reasons. community.proxmox.proxmox
# is pinned create-only, so every convergence of a live container is an explicit
# read → compute → report → apply below.
#
# `check_mode: false` because it is read-only and `--check` must still produce a
# drift report; `failed_when` discriminating so a CT added to host_vars but not yet
# created ("Configuration file '...' does not exist") is reported as pending while
# any OTHER read failure fails the play instead of silently dropping the container
# from reconcile.
#
# `pct config` (the rendered live view) and never the raw /etc/pve/lxc/<id>.conf:
# that file carries [pve:pending] and per-snapshot sections, each with its own copy
# of the keys we match, and a line-anchored read cannot tell them apart (#86).
#
# ONE read feeds both computes below (startup/onboot, cores/memory), and the
# `features` task between them writes a third, disjoint field — so nothing here can
# invalidate a later compute.
- name: Read current LXC configuration
  become: true
  ansible.builtin.command: "pct config {{ item.vmid }}"
  register: lxc_config_raw
  changed_when: false
  failed_when:
    - lxc_config_raw.rc != 0
    - "'does not exist' not in lxc_config_raw.stderr"
  check_mode: false  # read-only; must run in --check so drift is reported, not skipped
  loop: "{{ proxmox_lxcs }}"
  loop_control:
    label: "CT {{ item.vmid }} ({{ item.hostname }})"

- name: Report LXC containers that do not exist yet
  ansible.builtin.debug:
    msg: "CT {{ item.item.vmid }} ({{ item.item.hostname }}): not created yet — provisioning owns creation"
  loop: "{{ lxc_config_raw.results | default([]) }}"
  loop_control:
    label: "CT {{ item.item.vmid }} ({{ item.item.hostname }})"
  when: item.rc != 0

# Facts persist across role inclusions within a play, so seed the accumulators
# explicitly rather than relying on `| default([])` to paper over a stale value.
- name: Seed LXC drift accumulators
  ansible.builtin.set_fact:
    lxc_startup_drift: []
    lxc_resource_drift: []

# This task reported `changed` on every run for CT 201 while converging nothing,
# for the whole life of the deployment (#86). Two independent bugs stacked:
#
#   1. `nfs` is not a valid LXC feature key. PVE's schema ($features_desc in
#      /usr/share/perl5/PVE/LXC/Config.pm) defines exactly mount, nesting,
#      keyctl, fuse, mknod, force_rw_sys — so `pct set -features nesting=1,nfs=1`
#      failed schema validation every single run. "This CT may mount NFS" is
#      spelled `mount=nfs` (format 'fstype;fstype;...').
#   2. The script set `-o pipefail` but not `-e`, so that failure was swallowed
#      and `echo "changed"` ran anyway — a green report over a no-op. The
#      startup/onboot reconcile shells this task copied already carried `-euo`
#      for exactly this reason (they have since become read/compute/report/apply
#      task chains under #119). This is now the LAST mutate-then-echo shell in
#      the role, so it is also the last task whose drift is invisible under
#      --check — same defect class as #119, deliberately left out of its scope;
#      worth a follow-up issue rather than a drive-by change.
#
# The old existence check also grepped the raw /etc/pve/lxc/<id>.conf, which
# contains SNAPSHOT sections ([preissue77] on CT 201) that carry their own
# `features:` line — so it could match a snapshot's value and skip a genuinely
# drifted live config. Compare against `pct config` (live view only) instead.

# The features task only runs for PRIVILEGED containers, so `nfs_enabled` on an
# unprivileged one would be silently inert — a var that looks like configuration
# and does nothing, which is the failure mode this whole issue is about.
- name: Assert nfs_enabled is only set on privileged containers
  ansible.builtin.assert:
    that:
      - not (item.unprivileged | default(proxmox_lxc_defaults.unprivileged))
    fail_msg: >-
      CT {{ item.vmid }} ({{ item.hostname }}) sets nfs_enabled but is
      unprivileged. nfs_enabled is only implemented for privileged CTs (the
      features task is gated on privileged); either make the CT privileged or
      drop nfs_enabled.
  loop: "{{ proxmox_lxcs | selectattr('nfs_enabled', 'defined') | selectattr('nfs_enabled') | list }}"
  loop_control:
    label: "CT {{ item.vmid }} ({{ item.hostname }}) — nfs_enabled"

- name: Set features for privileged LXC containers
  become: true
  vars:
    # Alphabetical (mount before nesting) to match PVE's canonical print order.
    desired_features: >-
      {{ ((['mount=nfs'] if item.nfs_enabled | default(false) else [])
          + ['nesting=' ~ (item.nesting | default(proxmox_lxc_defaults.nesting) | ternary('1', '0'))]) | join(',') }}
  ansible.builtin.shell: |
    set -euo pipefail   # -e so a failed pct set aborts instead of falsely echoing "changed"
    desired="{{ desired_features }}"
    current=$(pct config {{ item.vmid }} | sed -n 's/^features: //p')

    # Order-insensitive compare: stay idempotent even if PVE ever writes the
    # keys back in a different order than we emit them.
    norm() { tr ',' '\n' | sort | paste -sd ',' -; }

    if [ "$(printf '%s' "$current" | norm)" != "$(printf '%s' "$desired" | norm)" ]; then
      pct set {{ item.vmid }} -features "$desired"
      echo "changed"
    fi
  args:
    executable: /bin/bash
  register: pct_features
  # Last line, not whole stdout: pct/pvesh can emit progress chatter ahead of it.
  changed_when: pct_features.stdout_lines | default([]) | last | default('') == 'changed'
  loop: "{{ proxmox_lxcs }}"
  when: not (item.unprivileged | default(proxmox_lxc_defaults.unprivileged))
  loop_control:
    label: "CT {{ item.vmid }} ({{ item.hostname }}) — features"

# --- CT startup/onboot reconcile (#36, #119) ---
#
# Same reason as the VM task above: keep the docker LXC at order=2 (after TrueNAS)
# instead of drifted state. Config-only — `pct set` does not restart the container.
#
# `startup` is compared ONLY when the guest declares one: an absent declaration
# means "not managed", not "clear it" (the old `[ -n "$desired_startup" ]` guard).
# A CT with no `onboot:` line sits on Proxmox's own default of 0.
- name: Compute LXC startup/onboot drift
  ansible.builtin.set_fact:
    lxc_startup_drift: "{{ lxc_startup_drift + [drift_entry] }}"
  vars:
    live_startup: "{{ item.stdout | regex_search('(?m)^startup: (.*)$', '\\1') | default([], true) | join }}"
    live_onboot: "{{ item.stdout | regex_search('(?m)^onboot: (\\d+)', '\\1') | default([], true) | join | default('0', true) }}"
    want_startup: "{{ item.item.startup | default('') }}"
    want_onboot: "{{ (item.item.onboot | default(proxmox_lxc_defaults.onboot)) | ternary(1, 0) }}"
    drift_fields: >-
      {{ ([] if (want_startup | length == 0 or live_startup == want_startup) else ['startup'])
         + ([] if live_onboot | int == want_onboot | int else ['onboot']) }}
    drift_entry:
      vmid: "{{ item.item.vmid }}"
      hostname: "{{ item.item.hostname }}"
      args: >-
        {{ ((['-startup ' ~ want_startup] if 'startup' in drift_fields else [])
            + (['-onboot ' ~ want_onboot] if 'onboot' in drift_fields else [])) | join(' ') }}
      human: >-
        {{ ((['startup live=' ~ (live_startup | default('<unset>', true)) ~ ' desired=' ~ want_startup] if 'startup' in drift_fields else [])
            + (['onboot live=' ~ live_onboot ~ ' desired=' ~ want_onboot] if 'onboot' in drift_fields else [])) | join(', ') }}
  loop: "{{ lxc_config_raw.results | default([]) }}"
  loop_control:
    label: "CT {{ item.item.vmid }} ({{ item.item.hostname }})"
  when:
    # rc first: a non-existent CT has no config to parse, and drift_fields must
    # never be evaluated against a stderr blob.
    - item.rc == 0
    - drift_fields | length > 0

- name: Report LXC startup/onboot drift
  ansible.builtin.debug:
    msg: "CT {{ item.vmid }} ({{ item.hostname }}): {{ item.human }} — will apply via pct set"
  loop: "{{ lxc_startup_drift | default([]) }}"
  loop_control:
    label: "CT {{ item.vmid }} ({{ item.hostname }})"

- name: Apply startup/onboot to existing LXC containers
  become: true
  ansible.builtin.command: "pct set {{ item.vmid }} {{ item.args }}"
  changed_when: true
  loop: "{{ lxc_startup_drift | default([]) }}"
  loop_control:
    label: "CT {{ item.vmid }} ({{ item.hostname }}) — startup/onboot"

# --- CT cores/memory reconcile (#86) ---
#
# Same create-only gap as the VM tasks above: community.proxmox.proxmox
# state=present never updates an existing container.
#
# RECONCILED: cores, memory. CREATE-TIME ONLY: swap, netif, mounts, rootfs,
# storage, unprivileged, ostemplate — changing those on a live container either
# bounces its networking, moves its data mounts, or requires a recreate.
#
# Unlike VMs, cgroup limits apply HOT: `pct set` retunes a running container
# with no restart. Note the sharp edge — lowering memory below what the
# container is currently using takes effect immediately and can OOM its
# workload. That is a deliberate operator action; the role does not guard it.
#
# Reads and the drift accumulators live in the shared block above (#119).
- name: Compute LXC cores/memory drift
  ansible.builtin.set_fact:
    lxc_resource_drift: "{{ lxc_resource_drift | default([]) + [drift_entry] }}"
  vars:
    # The 'unset' sentinel covers a key `pct config` omits entirely, which means
    # different things per key: no `cores:` means unlimited (all host cores),
    # no `memory:` means Proxmox's 512 MB default. Rather than encode both, treat
    # either omission as drift against any explicit desired value and let the
    # `pct set` write make it explicit.
    live_cores: "{{ item.stdout | regex_search('(?m)^cores: (\\d+)', '\\1') | default([], true) | join | default('unset', true) }}"
    live_memory: "{{ item.stdout | regex_search('(?m)^memory: (\\d+)', '\\1') | default([], true) | join | default('unset', true) }}"
    want_cores: "{{ item.item.cores | default(proxmox_lxc_defaults.cores) }}"
    want_memory: "{{ item.item.memory | default(proxmox_lxc_defaults.memory) }}"
    drift_fields: >-
      {{ ([] if live_cores == want_cores | string else ['cores'])
         + ([] if live_memory == want_memory | string else ['memory']) }}
    drift_entry:
      vmid: "{{ item.item.vmid }}"
      hostname: "{{ item.item.hostname }}"
      args: >-
        {{ ((['-cores ' ~ want_cores] if 'cores' in drift_fields else [])
            + (['-memory ' ~ want_memory] if 'memory' in drift_fields else [])) | join(' ') }}
      human: >-
        {{ ((['cores live=' ~ live_cores ~ ' desired=' ~ want_cores] if 'cores' in drift_fields else [])
            + (['memory live=' ~ live_memory ~ ' desired=' ~ want_memory] if 'memory' in drift_fields else [])) | join(', ') }}
  loop: "{{ lxc_config_raw.results | default([]) }}"
  loop_control:
    label: "CT {{ item.item.vmid }} ({{ item.item.hostname }})"
  when:
    # rc first: a non-existent CT has no config to parse, and drift_fields must
    # never be evaluated against a stderr blob.
    - item.rc == 0
    - drift_fields | length > 0

- name: Report LXC cores/memory drift
  ansible.builtin.debug:
    msg: "CT {{ item.vmid }} ({{ item.hostname }}): {{ item.human }} — will hot-apply via pct set"
  loop: "{{ lxc_resource_drift | default([]) }}"
  loop_control:
    label: "CT {{ item.vmid }} ({{ item.hostname }})"

- name: Apply cores/memory to LXC containers
  become: true
  ansible.builtin.command: "pct set {{ item.vmid }} {{ item.args }}"
  changed_when: true
  loop: "{{ lxc_resource_drift | default([]) }}"
  loop_control:
    label: "CT {{ item.vmid }} ({{ item.hostname }}) — cores/memory"

# Privileged LXC containers (`unprivileged: false`) running Docker require their AppArmor
# profile to be unconfined. Otherwise, Proxmox applies a default profile that blocks
# Docker's `apparmor_parser` when it attempts to load the `docker-default` profile.
- name: Disable AppArmor for privileged LXC containers (required for Docker)
  become: true
  ansible.builtin.lineinfile:
    path: "/etc/pve/lxc/{{ item.vmid }}.conf"
    line: "lxc.apparmor.profile: unconfined"
    regexp: "^lxc\\.apparmor\\.profile:"
    state: present
  loop: "{{ proxmox_lxcs }}"
  when: not (item.unprivileged | default(proxmox_lxc_defaults.unprivileged))
  loop_control:
    label: "CT {{ item.vmid }} ({{ item.hostname }}) — apparmor"

- name: Start LXC containers
  become: false
  no_log: true  # hides vault_proxmox_api_token_secret from -v/logs. NOTE: also
  # censors failure output — re-run with ANSIBLE_NO_LOG=False to debug (re-exposes the token).
  community.proxmox.proxmox:
    api_host: "{{ ansible_host }}"
    api_user: "{{ vault_proxmox_api_user }}"
    api_token_id: "{{ vault_proxmox_api_token_id }}"
    api_token_secret: "{{ vault_proxmox_api_token_secret }}"
    node: "{{ proxmox_node }}"
    vmid: "{{ item.vmid }}"
    hostname: "{{ item.hostname }}"
    state: started
  delegate_to: localhost
  loop: >-
    {{ proxmox_lxcs | selectattr('started', 'defined')
    | selectattr('started', 'equalto', true) | list
    + proxmox_lxcs | rejectattr('started', 'defined') | list }}
  loop_control:
    label: "CT {{ item.vmid }} ({{ item.hostname }})"

- name: Ensure LXC root disk is resized
  become: true
  ansible.builtin.command: "pct resize {{ item.vmid }} rootfs {{ item.root_disk_size | default(proxmox_lxc_defaults.root_disk_size) }}G"
  register: pct_resize
  failed_when:
    - pct_resize.rc != 0
    - "'disk is already at specified size' not in pct_resize.stderr"
  changed_when: pct_resize.rc == 0
  loop: >-
    {{ proxmox_lxcs | selectattr('started', 'defined')
    | selectattr('started', 'equalto', true) | list
    + proxmox_lxcs | rejectattr('started', 'defined') | list }}
  loop_control:
    label: "CT {{ item.vmid }} ({{ item.hostname }})"

- name: Configure GPU device sharing for LXC containers
  ansible.builtin.include_tasks: lxc-gpu-passthrough.yml
  loop: "{{ proxmox_lxcs | selectattr('gpu_sharing', 'defined') | selectattr('gpu_sharing', 'equalto', true) | list }}"
  loop_control:
    label: "CT {{ item.vmid }} ({{ item.hostname }}) — GPU sharing"
