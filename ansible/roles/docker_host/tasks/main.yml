---
- name: Install Docker prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present

- name: Add Docker GPG key
  ansible.builtin.get_url:
    # Keep the key path in step with the distribution-derived repo line below.
    # Both distros serve the byte-identical key today — this is not a live bug —
    # but that is Docker's choice to change, not an assumption to hardcode (#94).
    url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ ansible_facts['architecture'] | replace('x86_64', 'amd64') }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}
      {{ ansible_facts['distribution_release'] }} stable
    state: present
    filename: docker

# --- AppArmor workaround for Docker-in-LXC ---
# Privileged LXC containers have lxc.apparmor.profile=unconfined, but Docker
# still detects AppArmor in the kernel and tries to load its docker-default
# profile — which fails because the container lacks policy admin privileges.
# Stopping and masking AppArmor inside the container prevents this.
# This MUST run BEFORE the docker-ce package is installed: the package's
# postinst auto-starts dockerd immediately, so AppArmor has to be masked
# first or that first daemon start races AppArmor on a fresh host.
- name: Stop and disable AppArmor (Docker-in-LXC workaround)
  when: docker_lxc | default(false)
  block:
    - name: Stop AppArmor service
      ansible.builtin.systemd:
        name: apparmor
        state: stopped
        enabled: false
      failed_when: false

    - name: Mask AppArmor to prevent re-activation
      ansible.builtin.systemd:
        name: apparmor
        masked: true
      failed_when: false

- name: Install Docker Engine and Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Configure Docker daemon
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    mode: "0644"
  notify: restart-docker

- name: Ensure Docker is started and enabled
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

# --- Delivered-config gate for the address pools (#129) ------------------------
# Writing daemon.json is not the same as dockerd RUNNING that config: the file
# change only notifies a handler, and handlers fire at the END of the play — so
# every task after this point (and the whole services deploy that follows) used to
# run against a daemon still using the OLD pools, with the run reporting green.
# Flush first, then ask the DAEMON what it is actually using, the way CLAUDE.md's
# "verify with the app's own introspection" rule requires. A dockerd that silently
# ignored or partially parsed the file fails here instead of surfacing months later
# as an ordering-dependent "Pool overlaps with other one on this address space".
- name: Restart Docker now if its configuration changed
  ansible.builtin.meta: flush_handlers

- name: Read the address pools Docker is actually running with
  ansible.builtin.command:
    argv:
      - docker
      - info
      - --format
      # Go template braces, not Jinja: {% raw %} stops Ansible templating them.
      - "{% raw %}{{json .DefaultAddressPools}}{% endraw %}"
  register: docker_delivered_pools
  changed_when: false
  check_mode: false
  # In --check nothing was written or restarted, so the daemon legitimately still
  # reports the old pools (and on a first-ever run docker may not exist at all).
  when: not ansible_check_mode

- name: Assert Docker delivered the declared default address pools
  ansible.builtin.assert:
    that:
      # `docker info` prints the literal `null` when no pool is configured, so the
      # default([], true) is load-bearing: without it a daemon that ignored the file
      # would compare None against the declared list and raise a Jinja error instead
      # of this message.
      - >-
        (docker_delivered_pools.stdout | from_json | default([], true))
        | map(attribute='Base') | list
        == docker_default_address_pools | map(attribute='base') | list
      - >-
        (docker_delivered_pools.stdout | from_json | default([], true))
        | map(attribute='Size') | map('int') | list
        == docker_default_address_pools | map(attribute='size') | map('int') | list
    fail_msg: >-
      dockerd is running with default address pools
      {{ docker_delivered_pools.stdout | default('(unread)') }}, not the declared
      {{ docker_default_address_pools }}. /etc/docker/daemon.json was written but the
      daemon did not adopt it — check `journalctl -u docker` for a parse error and
      whether something outside Ansible is managing daemon.json.
    success_msg: "dockerd is running the declared default address pools."
    quiet: true
  when: not ansible_check_mode

# community.docker's API modules (docker_network, docker_container,
# docker_container_info, docker_image_pull, docker_container_exec) talk to the
# Docker socket over HTTP and import Python `requests` ON THE TARGET. The
# _deploy pipeline's docker_compose_v2 shells out to the `docker` CLI instead
# and never needed it — which is how the gap stayed hidden: eq12 happens to
# have python3-requests via dpkg (nothing in this repo installs it), while
# n5pro-docker (Ubuntu 24.04) does not, so its first API-module task (#84's
# lms_network cleanup) failed with "Failed to import the required Python
# library (requests)". Installed here so every docker host can run those
# modules — also unblocks re-enabling postgresql/immich/nextcloud on n5pro
# (#91). Deliberately a dedicated task, not an inventory-overridable list:
# inventory group_vars REPLACE role defaults, so a package that role tasks
# depend on must not be overridable away.
- name: Install Python requests (required by community.docker API modules)
  ansible.builtin.apt:
    name: python3-requests
    state: present

# --- ROCm userspace (AMD stable-repo channel, #240) ---
# The Proxmox host provides the kernel driver (amdgpu/kfd) and bind-mounts
# /dev/dri + /dev/kfd into the privileged CT; this installs ONLY userspace.
#
# History: 7.2.2 came from the legacy amdgpu-install channel on
# repo.radeon.com, which ended at 7.2.4 and can never deliver ROCm >= 10. The
# migration block below removes that stack once and then never fires again.
# The old gate (`which rocminfo`) made ANY change a silent no-op once ROCm
# existed — even a rewrite of the pins. What the new shape reconciles is the
# package NAME: editing rocm_release renames the package and apt installs it.
# Point releases within a release line still need common's opt-in
# `-e apt_apply_pending_upgrades=true` — see defaults/main.yml.
#
# Only the genuinely destructive steps are inside the one-shot probe gate; the
# "make this file/link absent" reconciles live outside it, keyed on their own
# durable state. A run that dies mid-migration would otherwise consume the gate
# (the purge clears the probe's own signal) and leave the leftovers forever.

# rc 0 = installed, rc 1 = "no packages found matching". Anything else is a real
# dpkg-query error and must NOT read as "no legacy present" — that would skip the
# migration while the cleanups below still delete /opt/rocm-7.2.2 out from under
# packages that still own it. So this is a bounded failed_when, not a blanket
# `failed_when: false`.
- name: Probe for the legacy amdgpu-install stack
  ansible.builtin.command: dpkg-query -W -f='${Version}' amdgpu-install
  register: legacy_amdgpu_install
  changed_when: false
  failed_when: legacy_amdgpu_install.rc not in [0, 1]
  check_mode: false  # keep --check honest about whether the migration is queued
  when: gpu_sharing.enabled | default(false)

- name: Probe for the legacy amdgpu-uninstall helper
  ansible.builtin.stat:
    path: /usr/bin/amdgpu-uninstall
  register: legacy_amdgpu_uninstall_bin
  when: gpu_sharing.enabled | default(false)

- name: "Migrate off the legacy amdgpu-install ROCm stack (one-way, #240)"
  when:
    - gpu_sharing.enabled | default(false)
    - legacy_amdgpu_install.rc | default(1) == 0
  block:
    # amdgpu-uninstall has no -y flag of its own; unrecognised arguments are
    # forwarded verbatim to the `apt-get purge` it runs (verified by reading
    # /usr/bin/amdgpu-uninstall on CT 201), which is how this stays
    # non-interactive. It purges rocm-core + amdgpu-core, so every dependent
    # rocm-*/hip-* package goes with them. It also DELETES ITSELF on the way
    # out — hence the stat gate, so a re-run after a mid-migration failure
    # still reaches the purge below instead of dying on a missing binary.
    - name: Remove the legacy ROCm userspace
      ansible.builtin.command: amdgpu-uninstall -y
      register: legacy_uninstall
      changed_when: true
      when: legacy_amdgpu_uninstall_bin.stat.exists

    # ORDER IS LOAD-BEARING: the purge of amdgpu-install is what clears this
    # block's own probe signal, so it must be the LAST step. With autoremove
    # first, a run that dies on a dpkg lock or a full disk leaves amdgpu-install
    # installed, the gate still armed, and the re-run finishes the job. The
    # reverse order would consume the gate and orphan the 7.2.2 rocm-*/hip-*
    # packages forever, silently — nothing downstream looks for them.
    - name: Autoremove orphaned legacy dependencies
      ansible.builtin.apt:
        autoremove: true
      register: legacy_autoremove

    - name: Purge the legacy installer package
      ansible.builtin.apt:
        name: amdgpu-install
        state: absent
        purge: true

    # This is a one-way, irreversible removal on a live host. Without this the
    # only record of what it took is a `changed` line.
    - name: Record what the legacy migration removed
      ansible.builtin.debug:
        msg:
          amdgpu_uninstall: "{{ legacy_uninstall.stdout_lines | default(['(skipped — helper already gone)']) }}"
          autoremove: "{{ legacy_autoremove.stdout_lines | default([]) }}"

# amdgpu-uninstall only cleans up its own amdgpu-local.* files, so these lists
# and the legacy channel's keyring survive it. amdgpu-proprietary.list is fully
# commented out but is still legacy-channel residue; rocm.gpg was the signing
# key for the two lists above it and has no other consumer. Idempotent and
# outside the probe gate on purpose.
- name: Remove legacy AMD repo lists and keyring
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/rocm.list
    - /etc/apt/sources.list.d/amdgpu.list
    - /etc/apt/sources.list.d/amdgpu-proprietary.list
    - /etc/apt/keyrings/rocm.gpg
  when: gpu_sharing.enabled | default(false)

# /opt/rocm was an update-alternatives link to /opt/rocm-7.2.2. ROCm 10 ships
# /opt/rocm/core-10.0/... as real directories, and dpkg cannot unpack a
# directory over an existing symlink — so the link must go first. Both tasks
# are conditional on the legacy state actually being present: an unconditional
# `state: absent` on /opt/rocm would delete the new install on the next run.
- name: Probe for the legacy rocm update-alternatives entry
  ansible.builtin.command: update-alternatives --query rocm
  register: legacy_rocm_alternative
  changed_when: false
  # Measured on CT 201: rc 0 = link group exists, rc 2 = "no alternatives for
  # rocm". Anything else is a real error and should fail rather than read as
  # "nothing to clean up" — same bounded shape as the amdgpu-install probe.
  failed_when: legacy_rocm_alternative.rc not in [0, 2]
  check_mode: false
  when: gpu_sharing.enabled | default(false)

- name: Drop the legacy rocm update-alternatives entry
  ansible.builtin.command: update-alternatives --remove-all rocm
  changed_when: true
  when:
    - gpu_sharing.enabled | default(false)
    - legacy_rocm_alternative.rc | default(1) == 0
    # Only a LEGACY value: 7.x registered "Value: /opt/rocm-<ver>". Matching any
    # `rocm` alternative would fight a future ROCm that registers one at
    # /opt/rocm/core-<rel> and make this task changed on every run forever.
    - "'Value: /opt/rocm-' in legacy_rocm_alternative.stdout | default('')"

- name: Probe /opt/rocm for a leftover legacy symlink
  ansible.builtin.stat:
    path: /opt/rocm
    follow: false
  register: legacy_rocm_path
  when: gpu_sharing.enabled | default(false)

- name: Remove the leftover /opt/rocm symlink so ROCm can own the directory
  ansible.builtin.file:
    path: /opt/rocm
    state: absent
  when:
    - gpu_sharing.enabled | default(false)
    - legacy_rocm_path.stat.exists | default(false)
    - legacy_rocm_path.stat.islnk | default(false)
    # …and only a LEGACY target: /etc/alternatives/rocm (7.x's alternatives
    # link) or /opt/rocm-<ver>. Deleting any symlink named /opt/rocm would
    # delete a future ROCm's own compatibility link on every run.
    - >-
      legacy_rocm_path.stat.lnk_target | default('') is search('^/etc/alternatives/rocm$|^/opt/rocm-[0-9]')

# Versioned legacy trees (/opt/rocm-7.2.2). Scoped to the legacy series — the
# repo.radeon.com channel topped out at 7.2.4, so nothing this role installs can
# ever land at /opt/rocm-[0-7].*. Deliberately NOT `rocm-[0-9]*`: that would also
# match a hypothetical future /opt/rocm-11.0 and gut it on every run, before an
# already-satisfied `state: present` could notice. The current layout,
# /opt/rocm/core-10.0, is unmatchable either way (fnmatch is on the basename).
- name: Find leftover legacy ROCm install trees
  ansible.builtin.find:
    paths: /opt
    patterns: "{{ rocm_legacy_tree_glob }}"
    file_type: directory
    recurse: false
  register: legacy_rocm_trees
  when: gpu_sharing.enabled | default(false)

- name: Remove leftover legacy ROCm install trees
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ legacy_rocm_trees.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  when:
    - gpu_sharing.enabled | default(false)
    # Belt-and-braces with the glob: this is a recursive delete under /opt, so
    # never let it name the live install root OR ANY ANCESTOR OF IT, no matter
    # how the glob is edited. `item.path != rocm_home` would be vacuous here —
    # find is non-recursive over /opt, so item.path is always a direct child and
    # can never equal /opt/rocm/core-10.0. The real hazard is /opt/rocm itself,
    # which a widened glob (`rocm*`) WOULD return and which that comparison
    # would happily pass. Prefix test, on paths normalised with a trailing /:
    #   /opt/rocm      -> '/opt/rocm/core-10.0/'.startswith('/opt/rocm/')      -> skip
    #   /opt/rocm-7.2.2 -> '/opt/rocm/core-10.0/'.startswith('/opt/rocm-7.2.2/') -> delete
    - not (rocm_home ~ '/').startswith(item.path ~ '/')

- name: Ensure apt keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  when: gpu_sharing.enabled | default(false)

# AMD serves this as binary/octet-stream and names it .gpg, but the bytes are
# an ASCII-armored "-----BEGIN PGP PUBLIC KEY BLOCK-----" (verified 2026-08-31),
# and `Signed-By:` accepts an armored key directly — the Docker repo above does
# exactly this with docker.asc. So there is no dearmor step, which is the point:
# a `gpg --dearmor … creates:` would skip forever once the keyring existed, and
# the day AMD rotates the key get_url would fetch a new .asc while apt kept
# verifying against the stale .gpg — an unhealable NO_PUBKEY that only a manual
# `rm` fixes. With no derived file, the file get_url rewrites IS the file apt
# reads, and rotation reconciles itself.
- name: Download AMD ROCm stable repo signing key (armored)
  ansible.builtin.get_url:
    url: "{{ rocm_apt_key_url }}"
    dest: /etc/apt/keyrings/amdrocm.asc
    mode: "0644"
  register: rocm_apt_key
  when: gpu_sharing.enabled | default(false)

# Residue from the dearmored-keyring shape this role briefly deployed in #240.
- name: Remove the superseded dearmored ROCm keyring
  ansible.builtin.file:
    path: /etc/apt/keyrings/amdrocm.gpg
    state: absent
  when: gpu_sharing.enabled | default(false)

- name: Configure AMD ROCm stable repository (deb822)
  ansible.builtin.copy:
    content: |
      X-Repo-Id: amdrocm-stable
      Types: deb
      URIs: {{ rocm_apt_repo_url }}
      Suites: stable
      Components: main
      Architectures: amd64
      Signed-By: /etc/apt/keyrings/amdrocm.asc
      Enabled: yes
    dest: /etc/apt/sources.list.d/amdrocm-stable.sources
    mode: "0644"
  register: rocm_repo_file
  when: gpu_sharing.enabled | default(false)

# What apt reconciles here is the package NAME, not the version: an edit to
# rocm_release renames the package and this task installs the new one. For an
# already-installed amdrocm10.0-gfx1150, `state: present` is a no-op — point
# releases within 10.0.x land only under common's opt-in
# `-e apt_apply_pending_upgrades=true`, and the assert below cannot detect that
# staleness either. That is the deliberate posture (see defaults/main.yml);
# do NOT "fix" it with state: latest. libatomic1/libquadmath0 are
# AMD-documented prerequisites that the ROCm packages do not declare in Depends.
#
# The check-mode carve-out is not a cheat: under --check neither the key nor the
# .sources file above is written, so on a host that does not yet have the repo
# apt genuinely cannot resolve (or verify) the package and the task dies with
# "No package matching ...". Skipping exactly that case keeps `--check --diff`
# usable as the documented pre-apply dry run. On any host where BOTH the key and
# the repo file are already correct, the task runs under --check as normal, so
# this never hides real drift — note the .sources content depends only on
# rocm_apt_repo_url, so a rocm_release bump leaves rocm_repo_file unchanged and
# the new package still shows up in the dry run. The key half is weaker and
# knowingly so: if AMD ever re-serves the key with a fresh Last-Modified,
# get_url reports changed under --check and this task skips, so a dry run can
# under-report a pending bump for exactly one run. It degrades to a skip, never
# to a false green on an install that would have failed — and the following real
# apply installs and asserts.
- name: Install ROCm userspace package {{ rocm_package }}
  ansible.builtin.apt:
    name:
      - libatomic1
      - libquadmath0
      - "{{ rocm_package }}"
    state: present
    update_cache: true
  when:
    - gpu_sharing.enabled | default(false)
    - not (ansible_check_mode and (rocm_repo_file.changed or rocm_apt_key.changed))

# --- Release/arch reconcile (#247) -------------------------------------------
# The stable channel is designed for side-by-side releases and nothing upstream
# retires an old one, so a rocm_release (or rocm_gfx_arch) edit would otherwise
# leave the previous package set installed and its /opt/rocm/core-<old> tree on
# disk, with every assert below still green because they follow the new pins.
# Keyed on DURABLE state — what dpkg has installed and what is on disk versus
# what is pinned — never on a one-shot `changed` (the #127/#240 lesson).
#
# Package naming, measured on the AMD repo (2026-09-01): the top-level
# metapackage is amdrocm<rel>-<arch>; its closure is amdrocm-<component><rel>
# (arch-independent) and amdrocm-<component><rel>-<arch>. A name belongs iff its
# release token is rocm_release and its arch token, when present, is
# rocm_gfx_arch. Everything else that dpkg still knows about (installed OR
# config-files-only `rc`) is stale and gets purged. The component class allows
# DIGITS (amdrocm-comgr210.0 — the ordinary soname-suffix convention) but never a
# dot, which is what keeps the release token unambiguous: today's 27 names are
# all-alphabetic, so an alphabetic-only class would have silently classified the
# first digit-bearing component AMD ships as stale.
#
# Note an arch swap is not package-COUNT-idempotent: an arch metapackage can pull
# in arch-independent packages of the same release that the other arch does not
# need (measured: gfx1200 brought amdrocm-rccl-host10.0). Those belong to the
# pinned release, so the reconcile deliberately keeps them.
#
# No autoremove: every ROCm name is covered by the regex below, and a host-wide
# autoremove could take unrelated orphans on every run. Non-amdrocm libraries
# orphaned by a purge are left to common's opt-in maintenance path.
- name: List every amdrocm package dpkg knows about
  ansible.builtin.command: dpkg-query -W -f='${db:Status-Abbrev}|${Package}\n' 'amdrocm*'
  register: rocm_installed
  changed_when: false
  # rc 1 = "no packages found matching" (a fresh host before the first install
  # can never reach here, but the bounded shape matches the other probes).
  failed_when: rocm_installed.rc not in [0, 1]
  check_mode: false
  when: gpu_sharing.enabled | default(false)

- name: Work out which amdrocm packages belong to another release or GPU architecture
  ansible.builtin.set_fact:
    rocm_stale_packages: >-
      {{ rocm_installed.stdout_lines | default([])
         | reject('match', '^.n')
         | map('regex_replace', '^[^|]*\|', '')
         | reject('match', '^amdrocm(-[a-z0-9-]+)?' ~ (rocm_release | regex_escape)
                            ~ '(-' ~ (rocm_gfx_arch | regex_escape) ~ ')?$')
         | list }}
  when: gpu_sharing.enabled | default(false)

# apt-get remove takes DEPENDENTS with it, silently — and not only the pinned
# metapackage's own closure: ANY installed package that depends on a stale one
# goes too. Two guards, both of which have been driven red on the live host:
#
#   1. the pinned package must not itself be in the stale set (pins disagreeing
#      with each other is the likely operator error, and it is cheap to name);
#   2. apt's own simulation of the purge must remove EXACTLY the stale set. This
#      one cannot fail open: an empty or truncated simulation makes the set
#      comparison fail, not pass. Measured 2026-09-01 on CT 201: asking to purge
#      two arch packages simulates removing six, including amdrocm10.0-gfx1150 —
#      exactly the collateral this refuses.
- name: Assert the pinned ROCm package is not itself in the stale set
  ansible.builtin.assert:
    that:
      - rocm_package not in rocm_stale_packages
    fail_msg: >-
      {{ rocm_package }} is in the stale set, so the purge would remove the very
      package this role just installed. rocm_release ({{ rocm_release }}) /
      rocm_gfx_arch ({{ rocm_gfx_arch }}) and rocm_package ({{ rocm_package }})
      disagree — fix the pins, do not widen the purge.
    quiet: true
  when:
    - gpu_sharing.enabled | default(false)
    - rocm_stale_packages | length > 0

- name: Ask apt what purging the stale ROCm packages would actually remove
  ansible.builtin.command:
    argv: "{{ ['apt-get', '-s', '-y', 'purge'] + rocm_stale_packages }}"
  register: rocm_purge_sim
  changed_when: false
  check_mode: false
  when:
    - gpu_sharing.enabled | default(false)
    - rocm_stale_packages | length > 0

# Parse in a set_fact, NOT in the assert's `that`: a \2 backreference does not
# survive Ansible's CONDITIONAL evaluation (measured 2026-09-01 — the same
# expression renders correctly in a debug/fail_msg but the conditional loses the
# group reference, so every regex_replace returned the same literal and the guard
# went red on a purge that was in fact exactly right). Templating it once also
# means the assert and its message read the same value.
- name: Work out what apt says it would actually remove
  ansible.builtin.set_fact:
    rocm_purge_sim_removals: >-
      {{ rocm_purge_sim.stdout_lines | default([]) | select('match', '^(Remv|Purg) ')
         | map('regex_replace', '^(Remv|Purg) ([^ ]+).*$', '\2') | list }}
  when:
    - gpu_sharing.enabled | default(false)
    - rocm_stale_packages | length > 0

- name: Assert purging the stale ROCm packages takes nothing else with it
  ansible.builtin.assert:
    that:
      - rocm_purge_sim_removals | symmetric_difference(rocm_stale_packages) | length == 0
    fail_msg: >-
      apt would not remove exactly the stale set. Collateral (would go but was not
      asked for): {{ rocm_purge_sim_removals | difference(rocm_stale_packages) }}.
      Asked for but not removed:
      {{ rocm_stale_packages | difference(rocm_purge_sim_removals) }}.
      Something installed depends on a package this would purge — fix the pins,
      do not widen the purge.
    quiet: true
  when:
    - gpu_sharing.enabled | default(false)
    - rocm_stale_packages | length > 0

- name: Purge ROCm packages from another release or GPU architecture
  ansible.builtin.apt:
    name: "{{ rocm_stale_packages }}"
    state: absent
    purge: true
  register: rocm_purge
  when:
    - gpu_sharing.enabled | default(false)
    - rocm_stale_packages | length > 0

# dpkg removes the files it owns; anything generated in place (caches, alternatives
# residue) can keep /opt/rocm/core-<old> alive. Only DIRECTORIES: the compat
# entries /opt/rocm/core and /opt/rocm/core-10 are alternatives SYMLINKS and
# `find` classifies with lstat, so they are never returned — and `not item.islnk`
# says so explicitly rather than relying on that.
- name: Find /opt/rocm/core-* trees other than {{ rocm_home }}
  ansible.builtin.find:
    paths: /opt/rocm
    patterns: "core-*"
    file_type: directory
    recurse: false
  register: rocm_core_trees
  when: gpu_sharing.enabled | default(false)

# The ownership probe reads state that only a REAL purge produces, so under
# --check on a release bump (`rocm_release: 10.0 -> 10.1`) the old tree is still
# fully owned and the assert below would go red telling the operator to "fix the
# pins" that are in fact correct — breaking the documented dry run on the exact
# change this block exists for. The install task 100 lines above carves out the
# same class of check-mode-only failure. Gate on the purge having been SIMULATED
# rather than on ansible_check_mode alone, so a converged host still dry-runs the
# probe and the assert for real.
#
# Probe the tree, not just its root inode: `dpkg-query -S <dir>` asks only whether
# that one directory entry is in a package's file list, while the delete below is
# recursive. rc semantics measured on CT 201 2026-09-01: a single pattern returns
# 1 for "no path found", but MULTIPLE patterns return 1 when ANY of them misses —
# which would read as "unowned" and fail open — so the two probes are ORed as
# separate invocations instead of passed as two patterns.
- name: Probe whether any stray /opt/rocm/core-* tree is still owned by a package
  ansible.builtin.shell:
    cmd: dpkg-query -S {{ item.path | quote }} || dpkg-query -S {{ (item.path ~ '/*') | quote }}
  register: rocm_stray_tree_owner
  changed_when: false
  # rc 1 = neither the directory nor anything under it is owned (measured on
  # CT 201 for core-9.9); rc 0 = at least one of the two matched.
  failed_when: rocm_stray_tree_owner.rc not in [0, 1]
  check_mode: false
  loop: "{{ rocm_core_trees.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  when:
    - gpu_sharing.enabled | default(false)
    - not item.islnk
    - not (ansible_check_mode and rocm_purge is changed)
    # Prefix test on paths normalised with a trailing /, per the legacy-tree
    # delete above: excludes rocm_home AND any ancestor of it, so a widened
    # `paths:`/`patterns:` can never feed the delete below /opt/rocm itself.
    - not (rocm_home ~ '/').startswith(item.path ~ '/')

- name: Assert no stray /opt/rocm/core-* tree is still owned by an installed package
  ansible.builtin.assert:
    that:
      - rocm_stray_tree_owner.results | default([]) | selectattr('rc', 'defined') | selectattr('rc', 'equalto', 0) | list | length == 0
    fail_msg: >-
      Refusing to delete {{ rocm_stray_tree_owner.results | default([]) | selectattr('rc', 'defined')
        | selectattr('rc', 'equalto', 0) | map(attribute='item.path') | list }}:
      still owned by {{ rocm_stray_tree_owner.results | default([]) | selectattr('rc', 'defined')
        | selectattr('rc', 'equalto', 0) | map(attribute='stdout') | list }}. A tree that is
      not rocm_home ({{ rocm_home }}) but is owned by packages means the pins disagree with
      what is installed — fix the pins; never delete a tree out from under dpkg.
    quiet: true
  when:
    - gpu_sharing.enabled | default(false)
    - not (ansible_check_mode and rocm_purge is changed)

- name: Remove stray /opt/rocm/core-* trees nothing owns
  ansible.builtin.file:
    path: "{{ item.item.path }}"
    state: absent
  loop: "{{ rocm_stray_tree_owner.results | default([]) | selectattr('rc', 'defined') | list }}"
  loop_control:
    label: "{{ item.item.path }}"
  when:
    - gpu_sharing.enabled | default(false)
    - item.rc == 1
    # rocm_home needs no clause here: only items the probe actually RAN on carry
    # rc, and the probe's own `when` already excludes rocm_home and its ancestors
    # — restating it would be the dead guard #240 round 2 caught. This shape test
    # is deliberately a DIFFERENT predicate: it fails if a future edit widens the
    # find above beyond the core-* namespace, which the probe's when would not.
    - item.item.path.startswith('/opt/rocm/core-')

- name: Ensure root is in render and video groups
  ansible.builtin.user:
    name: root
    groups:
      - render
      - video
    append: true
  when: gpu_sharing.enabled | default(false)

# No HSA_OVERRIDE_GFX_VERSION: gfx1150 has been natively supported since
# ROCm 7.2, so the override was vestigial and masked what the runtime actually
# detects. ROCm 10 ships nothing under /opt/rocm/bin, so PATH must point at the
# versioned root.
- name: Deploy ROCm environment profile
  ansible.builtin.copy:
    content: |
      # Managed by Ansible — ROCm environment (stable-repo channel, #240)
      export ROCM_PATH="{{ rocm_home }}"
      export HIP_PATH="$ROCM_PATH"
      export PATH="$ROCM_PATH/bin:${PATH}"
      export LD_LIBRARY_PATH="$ROCM_PATH/lib:${LD_LIBRARY_PATH}"
    dest: /etc/profile.d/rocm.sh
    mode: "0644"
  when: gpu_sharing.enabled | default(false)

# The old check was `failed_when: false` + a debug message — a guard that had
# never been seen to fail, and never could. This one gates the run. It is
# skipped under --check because its inputs (the installed binary) only exist
# after a real apply; its first execution is therefore its first test, which is
# why #240 drove its clauses red before trusting it: the rocminfo-failed, the
# gfx-mismatch and the wrong-release clauses live (each hitting exactly that
# clause, changed=0), and the dpkg-state clause offline against measured
# ii/rc/iU/iF/empty strings — it cannot be reached live because rocm_package
# feeds both the apt install and this query. The `rocm_delivered is not failed`
# clause shares its mechanism with the observed `rocm_verify is not failed` one.
#
# `ignore_errors`, NOT `failed_when: false`: the latter ASSIGNS failed=False and
# would make the `is not failed` clauses below vacuous (CLAUDE.md, measured).
# Letting these two fail the play directly would also make the curated fail_msg
# unreachable — a missing /dev/kfd or a missing binary would surface as a bare
# module error instead of the diagnostic written for exactly those cases.
- name: Verify ROCm delivers the GPU
  ansible.builtin.command: "{{ rocm_home }}/bin/rocminfo"
  register: rocm_verify
  changed_when: false
  ignore_errors: true  # noqa: ignore-errors — the assert below is the gate
  when:
    - gpu_sharing.enabled | default(false)
    - not ansible_check_mode

# `${db:Status-Abbrev}`, not just `${Version}`: dpkg-query exits 0 and prints a
# populated version for a package in ANY state — including `iU` (unpacked, never
# configured) and `rc` (removed, config files remain). Measured on CT 201:
# `dpkg-query -W -f='${Version}' fontconfig` -> `2.15.0-1.1ubuntu2`, rc=0, for a
# package dpkg lists as `rc`. A half-installed ROCm would have satisfied a
# version-only clause while its files sat unconfigured on disk.
- name: Read the delivered ROCm package status and version
  ansible.builtin.command: dpkg-query -W -f='${db:Status-Abbrev}|${Version}' {{ rocm_package }}
  register: rocm_delivered
  changed_when: false
  ignore_errors: true  # noqa: ignore-errors — the assert below is the gate
  when:
    - gpu_sharing.enabled | default(false)
    - not ansible_check_mode

- name: Assert ROCm is delivered and reports {{ rocm_gfx_arch }}
  ansible.builtin.assert:
    that:
      - rocm_verify is not failed
      - rocm_delivered is not failed
      - rocm_gfx_arch in (rocm_verify.stdout | default(''))
      - (rocm_delivered.stdout | default('')).startswith('ii ')
      # default(…, true) also covers an EMPTY stdout: ''.split('|') is [''] and
      # [1] would raise IndexError, swapping the curated message for a Jinja
      # traceback. (Ordering already protects this — `is not failed` above is
      # evaluated first and assert short-circuits — but a one-token belt.)
      - (rocm_delivered.stdout | default('|', true)).split('|')[1].startswith(rocm_release ~ '.')
    fail_msg: >-
      ROCm on this container is not delivering. rocminfo
      ({{ rocm_home }}/bin/rocminfo) {{ 'FAILED to run' if rocm_verify is failed
      else 'ran but did not report ' ~ rocm_gfx_arch }}; dpkg says
      '{{ rocm_delivered.stdout | default('(query failed)') }}' for
      {{ rocm_package }} (want state 'ii ' and version {{ rocm_release }}.x).
      If /dev/kfd is missing inside the CT, the host-side passthrough
      (proxmox_guests lxc-gpu-passthrough) has not run or the host needs a
      reboot; if rocminfo itself is absent, check the installed layout under
      {{ rocm_home }} — the binary path here was pinned from the live layout
      probe in #240. A non-'ii' dpkg state means the package unpacked but never
      configured: run `dpkg --configure -a` and re-apply.
    quiet: true
  when:
    - gpu_sharing.enabled | default(false)
    - not ansible_check_mode

# --- NFS client support ---
# Required for Docker NFS volume driver to mount remote shares.

- name: Install nfs-common for NFS volume support
  ansible.builtin.apt:
    name: nfs-common
    state: present
  when: nfs_enabled | default(false)
