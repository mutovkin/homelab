---
- name: Install Docker prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present

- name: Add Docker GPG key
  ansible.builtin.get_url:
    # Keep the key path in step with the distribution-derived repo line below.
    # Both distros serve the byte-identical key today — this is not a live bug —
    # but that is Docker's choice to change, not an assumption to hardcode (#94).
    url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ ansible_facts['architecture'] | replace('x86_64', 'amd64') }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}
      {{ ansible_facts['distribution_release'] }} stable
    state: present
    filename: docker

# --- AppArmor workaround for Docker-in-LXC ---
# Privileged LXC containers have lxc.apparmor.profile=unconfined, but Docker
# still detects AppArmor in the kernel and tries to load its docker-default
# profile — which fails because the container lacks policy admin privileges.
# Stopping and masking AppArmor inside the container prevents this.
# This MUST run BEFORE the docker-ce package is installed: the package's
# postinst auto-starts dockerd immediately, so AppArmor has to be masked
# first or that first daemon start races AppArmor on a fresh host.
- name: Stop and disable AppArmor (Docker-in-LXC workaround)
  when: docker_lxc | default(false)
  block:
    - name: Stop AppArmor service
      ansible.builtin.systemd:
        name: apparmor
        state: stopped
        enabled: false
      failed_when: false

    - name: Mask AppArmor to prevent re-activation
      ansible.builtin.systemd:
        name: apparmor
        masked: true
      failed_when: false

- name: Install Docker Engine and Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Configure Docker daemon
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    mode: "0644"
  notify: restart-docker

- name: Ensure Docker is started and enabled
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

# --- Delivered-config gate for the address pools (#129) ------------------------
# Writing daemon.json is not the same as dockerd RUNNING that config: the file
# change only notifies a handler, and handlers fire at the END of the play — so
# every task after this point (and the whole services deploy that follows) used to
# run against a daemon still using the OLD pools, with the run reporting green.
# Flush first, then ask the DAEMON what it is actually using, the way CLAUDE.md's
# "verify with the app's own introspection" rule requires. A dockerd that silently
# ignored or partially parsed the file fails here instead of surfacing months later
# as an ordering-dependent "Pool overlaps with other one on this address space".
- name: Restart Docker now if its configuration changed
  ansible.builtin.meta: flush_handlers

- name: Read the address pools Docker is actually running with
  ansible.builtin.command:
    argv:
      - docker
      - info
      - --format
      # Go template braces, not Jinja: {% raw %} stops Ansible templating them.
      - "{% raw %}{{json .DefaultAddressPools}}{% endraw %}"
  register: docker_delivered_pools
  changed_when: false
  check_mode: false
  # In --check nothing was written or restarted, so the daemon legitimately still
  # reports the old pools (and on a first-ever run docker may not exist at all).
  when: not ansible_check_mode

- name: Assert Docker delivered the declared default address pools
  ansible.builtin.assert:
    that:
      # `docker info` prints the literal `null` when no pool is configured, so the
      # default([], true) is load-bearing: without it a daemon that ignored the file
      # would compare None against the declared list and raise a Jinja error instead
      # of this message.
      - >-
        (docker_delivered_pools.stdout | from_json | default([], true))
        | map(attribute='Base') | list
        == docker_default_address_pools | map(attribute='base') | list
      - >-
        (docker_delivered_pools.stdout | from_json | default([], true))
        | map(attribute='Size') | map('int') | list
        == docker_default_address_pools | map(attribute='size') | map('int') | list
    fail_msg: >-
      dockerd is running with default address pools
      {{ docker_delivered_pools.stdout | default('(unread)') }}, not the declared
      {{ docker_default_address_pools }}. /etc/docker/daemon.json was written but the
      daemon did not adopt it — check `journalctl -u docker` for a parse error and
      whether something outside Ansible is managing daemon.json.
    success_msg: "dockerd is running the declared default address pools."
    quiet: true
  when: not ansible_check_mode

# community.docker's API modules (docker_network, docker_container,
# docker_container_info, docker_image_pull, docker_container_exec) talk to the
# Docker socket over HTTP and import Python `requests` ON THE TARGET. The
# _deploy pipeline's docker_compose_v2 shells out to the `docker` CLI instead
# and never needed it — which is how the gap stayed hidden: eq12 happens to
# have python3-requests via dpkg (nothing in this repo installs it), while
# n5pro-docker (Ubuntu 24.04) does not, so its first API-module task (#84's
# lms_network cleanup) failed with "Failed to import the required Python
# library (requests)". Installed here so every docker host can run those
# modules — also unblocks re-enabling postgresql/immich/nextcloud on n5pro
# (#91). Deliberately a dedicated task, not an inventory-overridable list:
# inventory group_vars REPLACE role defaults, so a package that role tasks
# depend on must not be overridable away.
- name: Install Python requests (required by community.docker API modules)
  ansible.builtin.apt:
    name: python3-requests
    state: present

# --- ROCm userspace (AMD stable-repo channel, #240) ---
# The Proxmox host provides the kernel driver (amdgpu/kfd) and bind-mounts
# /dev/dri + /dev/kfd into the privileged CT; this installs ONLY userspace.
#
# History: 7.2.2 came from the legacy amdgpu-install channel on
# repo.radeon.com, which ended at 7.2.4 and can never deliver ROCm >= 10. The
# migration block below removes that stack once and then never fires again.
# The old gate (`which rocminfo`) could install but never UPGRADE — any
# version bump was a silent no-op. The new reconcile is apt's own version
# handling of the pinned package.
#
# Only the genuinely destructive steps are inside the one-shot probe gate; the
# "make this file/link absent" reconciles live outside it, keyed on their own
# durable state. A run that dies mid-migration would otherwise consume the gate
# (the purge clears the probe's own signal) and leave the leftovers forever.

- name: Probe for the legacy amdgpu-install stack
  ansible.builtin.command: dpkg-query -W -f='${Version}' amdgpu-install
  register: legacy_amdgpu_install
  changed_when: false
  failed_when: false
  check_mode: false  # keep --check honest about whether the migration is queued
  when: gpu_sharing.enabled | default(false)

- name: Probe for the legacy amdgpu-uninstall helper
  ansible.builtin.stat:
    path: /usr/bin/amdgpu-uninstall
  register: legacy_amdgpu_uninstall_bin
  when: gpu_sharing.enabled | default(false)

- name: "Migrate off the legacy amdgpu-install ROCm stack (one-way, #240)"
  when:
    - gpu_sharing.enabled | default(false)
    - legacy_amdgpu_install.rc | default(1) == 0
  block:
    # amdgpu-uninstall has no -y flag of its own; unrecognised arguments are
    # forwarded verbatim to the `apt-get purge` it runs (verified by reading
    # /usr/bin/amdgpu-uninstall on CT 201), which is how this stays
    # non-interactive. It purges rocm-core + amdgpu-core, so every dependent
    # rocm-*/hip-* package goes with them. It also DELETES ITSELF on the way
    # out — hence the stat gate, so a re-run after a mid-migration failure
    # still reaches the purge below instead of dying on a missing binary.
    - name: Remove the legacy ROCm userspace
      ansible.builtin.command: amdgpu-uninstall -y
      register: legacy_uninstall
      changed_when: true
      when: legacy_amdgpu_uninstall_bin.stat.exists

    - name: Purge the legacy installer package
      ansible.builtin.apt:
        name: amdgpu-install
        state: absent
        purge: true

    - name: Autoremove orphaned legacy dependencies
      ansible.builtin.apt:
        autoremove: true

# amdgpu-uninstall only cleans up its own amdgpu-local.* files, so these three
# lists survive it. amdgpu-proprietary.list is fully commented out but is still
# legacy-channel residue. Idempotent and outside the probe gate on purpose.
- name: Remove legacy AMD repo lists
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/{{ item }}"
    state: absent
  loop:
    - rocm.list
    - amdgpu.list
    - amdgpu-proprietary.list
  when: gpu_sharing.enabled | default(false)

# /opt/rocm was an update-alternatives link to /opt/rocm-7.2.2. ROCm 10 ships
# /opt/rocm/core-10.0/... as real directories, and dpkg cannot unpack a
# directory over an existing symlink — so the link must go first. Both tasks
# are conditional on the legacy state actually being present: an unconditional
# `state: absent` on /opt/rocm would delete the new install on the next run.
- name: Probe for the legacy rocm update-alternatives entry
  ansible.builtin.command: update-alternatives --query rocm
  register: legacy_rocm_alternative
  changed_when: false
  failed_when: false
  check_mode: false
  when: gpu_sharing.enabled | default(false)

- name: Drop the legacy rocm update-alternatives entry
  ansible.builtin.command: update-alternatives --remove-all rocm
  changed_when: true
  when:
    - gpu_sharing.enabled | default(false)
    - legacy_rocm_alternative.rc | default(1) == 0

- name: Probe /opt/rocm for a leftover legacy symlink
  ansible.builtin.stat:
    path: /opt/rocm
    follow: false
  register: legacy_rocm_path
  when: gpu_sharing.enabled | default(false)

- name: Remove the leftover /opt/rocm symlink so ROCm can own the directory
  ansible.builtin.file:
    path: /opt/rocm
    state: absent
  when:
    - gpu_sharing.enabled | default(false)
    - legacy_rocm_path.stat.exists | default(false)
    - legacy_rocm_path.stat.islnk | default(false)

# Versioned legacy trees (/opt/rocm-7.2.2). The new layout is /opt/rocm/core-*,
# which this pattern cannot match.
- name: Find leftover legacy ROCm install trees
  ansible.builtin.find:
    paths: /opt
    patterns: "rocm-[0-9]*"
    file_type: directory
    recurse: false
  register: legacy_rocm_trees
  when: gpu_sharing.enabled | default(false)

- name: Remove leftover legacy ROCm install trees
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ legacy_rocm_trees.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  when: gpu_sharing.enabled | default(false)


- name: Ensure apt keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  when: gpu_sharing.enabled | default(false)

# AMD serves this as binary/octet-stream and names it .gpg, but the bytes are
# an ASCII-armored "-----BEGIN PGP PUBLIC KEY BLOCK-----" (verified 2026-08-31).
# apt's Signed-By wants a dearmored keyring, so the dearmor step is required.
- name: Download AMD ROCm stable repo signing key (armored)
  ansible.builtin.get_url:
    url: "{{ rocm_apt_key_url }}"
    dest: /etc/apt/keyrings/amdrocm.asc
    mode: "0644"
  register: rocm_apt_key
  when: gpu_sharing.enabled | default(false)

- name: Dearmor AMD ROCm signing key
  ansible.builtin.command:
    cmd: gpg --dearmor --yes -o /etc/apt/keyrings/amdrocm.gpg /etc/apt/keyrings/amdrocm.asc
    creates: /etc/apt/keyrings/amdrocm.gpg
  when: gpu_sharing.enabled | default(false)

- name: Configure AMD ROCm stable repository (deb822)
  ansible.builtin.copy:
    content: |
      X-Repo-Id: amdrocm-stable
      Types: deb
      URIs: {{ rocm_apt_repo_url }}
      Suites: stable
      Components: main
      Architectures: amd64
      Signed-By: /etc/apt/keyrings/amdrocm.gpg
      Enabled: yes
    dest: /etc/apt/sources.list.d/amdrocm-stable.sources
    mode: "0644"
  register: rocm_repo_file
  when: gpu_sharing.enabled | default(false)

# apt IS the version-aware reconcile: `state: present` on a versionless name
# installs the newest 10.0.x the repo offers, and later point releases arrive
# through common's deliberate `apt upgrade`. libatomic1/libquadmath0 are
# AMD-documented prerequisites that the ROCm packages do not declare in Depends.
#
# The check-mode carve-out is not a cheat: under --check the .sources file above
# is not written, so on a host that does not yet have the repo apt genuinely
# cannot resolve the package and the task dies with "No package matching ...".
# Skipping exactly that case keeps `--check --diff` usable as the documented
# pre-apply dry run. On any host where the repo file is already correct
# (rocm_repo_file unchanged) the task runs under --check as normal, so this
# never hides real drift.
- name: Install ROCm userspace package {{ rocm_package }}
  ansible.builtin.apt:
    name:
      - libatomic1
      - libquadmath0
      - "{{ rocm_package }}"
    state: present
    update_cache: true
  when:
    - gpu_sharing.enabled | default(false)
    - not (ansible_check_mode and rocm_repo_file.changed)

- name: Ensure root is in render and video groups
  ansible.builtin.user:
    name: root
    groups:
      - render
      - video
    append: true
  when: gpu_sharing.enabled | default(false)

# No HSA_OVERRIDE_GFX_VERSION: gfx1150 has been natively supported since
# ROCm 7.2, so the override was vestigial and masked what the runtime actually
# detects. ROCm 10 ships nothing under /opt/rocm/bin, so PATH must point at the
# versioned root.
- name: Deploy ROCm environment profile
  ansible.builtin.copy:
    content: |
      # Managed by Ansible — ROCm environment (stable-repo channel, #240)
      export ROCM_PATH="{{ rocm_home }}"
      export HIP_PATH="$ROCM_PATH"
      export PATH="$ROCM_PATH/bin:${PATH}"
      export LD_LIBRARY_PATH="$ROCM_PATH/lib:${LD_LIBRARY_PATH}"
    dest: /etc/profile.d/rocm.sh
    mode: "0644"
  when: gpu_sharing.enabled | default(false)

# The old check was `failed_when: false` + a debug message — a guard that had
# never been seen to fail, and never could. This one gates the run. It is
# skipped under --check because its inputs (the installed binary) only exist
# after a real apply; its first execution is therefore its first test, which is
# why #240 exercised it red against a bogus rocm_gfx_arch before trusting it.
- name: Verify ROCm delivers the GPU
  ansible.builtin.command: "{{ rocm_home }}/bin/rocminfo"
  register: rocm_verify
  changed_when: false
  when:
    - gpu_sharing.enabled | default(false)
    - not ansible_check_mode

- name: Read the delivered ROCm package version
  ansible.builtin.command: dpkg-query -W -f='${Version}' {{ rocm_package }}
  register: rocm_delivered
  changed_when: false
  when:
    - gpu_sharing.enabled | default(false)
    - not ansible_check_mode

- name: Assert ROCm is delivered and reports {{ rocm_gfx_arch }}
  ansible.builtin.assert:
    that:
      - rocm_gfx_arch in rocm_verify.stdout
      - rocm_delivered.stdout.startswith(rocm_release ~ '.')
    fail_msg: >-
      ROCm on this container is not delivering: rocminfo did not report
      {{ rocm_gfx_arch }}, or {{ rocm_package }} is not at {{ rocm_release }}.x
      (dpkg says '{{ rocm_delivered.stdout | default('') }}'). If /dev/kfd is
      missing inside the CT, the host-side passthrough
      (proxmox_guests lxc-gpu-passthrough) has not run or the host needs a
      reboot; if rocminfo itself is absent, check the installed layout under
      {{ rocm_home }} — the binary path here was pinned from the live layout
      probe in #240.
    quiet: true
  when:
    - gpu_sharing.enabled | default(false)
    - not ansible_check_mode

# --- NFS client support ---
# Required for Docker NFS volume driver to mount remote shares.

- name: Install nfs-common for NFS volume support
  ansible.builtin.apt:
    name: nfs-common
    state: present
  when: nfs_enabled | default(false)
