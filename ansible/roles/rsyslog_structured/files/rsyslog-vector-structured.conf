# Managed by Ansible — roles/rsyslog_structured (#143, moved here by #134).
# Do not edit on the host.
#
# WHY THIS FILE EXISTS
# /var/log/syslog and /var/log/auth.log are written in RSYSLOG_FileFormat, which
# carries NO priority field:
#   2026-08-19T20:10:30.404106-07:00 deb-docker systemd[410669]: Startup finished
# There is no <PRI>, so facility and severity are unrecoverable from those files —
# which is why Vector had to hardcode `.level = "info"` on every host record and an
# emerg was stored identically to a routine "session opened". Severity cannot be
# parsed out of that format; it has to be made to exist first.
#
# This drop-in emits the SAME messages a second time in RFC5424
# (RSYSLOG_SyslogProtocol23Format — `<PRI>1 TS HOST APP PROCID MSGID SD MSG`),
# whose <PRI> is facility*8+severity. Vector tails this file and recovers
# severity/facility/appname/procid/hostname/timestamp with parse_syslog().
#
# `*.*` HERE EQUALS BOTH DEBIAN FILES. /etc/rsyslog.conf routes
# `*.*;auth,authpriv.none` to /var/log/syslog and `auth,authpriv.*` to
# /var/log/auth.log, so their union is exactly `*.*`. This ONE file therefore
# replaces both as Vector's input — and Vector must NOT tail syslog/auth.log as
# well, or every host event is ingested twice. See the comment on the `host_syslog`
# source in roles/services/observability/files/data/vector/vector.yaml (the
# container) and roles/vector_agent/templates/vector.yaml.j2 (the native agents).
#
# Rules here are non-terminating (no `stop`), and $IncludeConfig runs before the
# RULES section of /etc/rsyslog.conf, so the human-facing /var/log/syslog and
# /var/log/auth.log keep being written, unchanged, in their existing format. That
# is deliberate: those are what an operator reads over SSH during an incident, and
# reformatting them to RFC5424 would be a user-visible regression for a
# machine-readability win.
#
# Growth is bounded by /etc/logrotate.d/vector-structured, deployed alongside.
#
# FLEET NOTE (#134) — DONE. This drop-in predicted its own move and #134 made it:
# Vector is now fleet-wide, so the file left roles/services/observability/files/ for
# the shared roles/rsyslog_structured. It is host-log plumbing, not an
# observability-stack service config. Two consumers include that role today:
#   * roles/services/observability  — eq12_docker, where Vector is a container
#   * roles/vector_agent            — eq12, n5pro, n5pro_docker, native systemd
# Both include it BEFORE pointing Vector at /var/log/structured.log, because the
# role's `logger` freshness probe is the gate that says the stream is really live.
# Changing this file changes host logging on all four hosts at once.
# NO fileOwner= HERE, DELIBERATELY, and this is not an omission (#134).
#
# It used to say fileOwner="root", and on Ubuntu that silently broke the whole
# action's ownership. rsyslog is packaged differently across the fleet:
#
#   host          OS               rsyslog runs as        $FileOwner
#   eq12          Debian trixie    root (no privdrop)     root
#   n5pro         Debian trixie    root (no privdrop)     root
#   eq12_docker   Debian bookworm  root (no privdrop)     root
#   n5pro_docker  Ubuntu noble     syslog ($PrivDropTo*)  syslog
#
# A process running as `syslog` CANNOT chown a file to root — changing the uid
# needs privilege it just dropped. So the chown fails, and it fails ATOMICALLY:
# the requested GROUP is lost with it, and the file lands `syslog:syslog` 0640
# instead of `syslog:adm`. Vector runs as User=vector, which is in `adm` but not
# in `syslog`, so the one file the agent exists to tail became the one file it
# could not open — while rsyslog wrote it perfectly happily. Measured: vector
# logging `Permission denied (os error 13)` on /var/log/structured.log every 2s.
#
# Omitting fileOwner makes the file inherit each host's OWN `$FileOwner` global —
# root on Debian, syslog on Ubuntu — which is exactly what that host's stock
# syslog action already does and is therefore satisfiable everywhere. fileGroup
# stays: root can set any group, and the `syslog` user is a member of `adm`, so
# `adm` is reachable on both packagings. Verified against /var/log/syslog on all
# four hosts, which is root:adm on Debian and syslog:adm on Ubuntu.
#
# DO NOT "fix" this by adding vector to the `syslog` group (inverts the
# convention and widens vector's reach to every syslog-owned file) or by
# widening the mode to 0644 (these are auth logs).
*.*  action(type="omfile"
            file="/var/log/structured.log"
            template="RSYSLOG_SyslogProtocol23Format"
            fileCreateMode="0640"
            fileGroup="adm")
